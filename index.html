/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        TTSQ.bulk = true;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){

    const el = $('#lesDl' + n); if (!el) return;

  });
}

const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* 原文（希伯來文／希臘文）中文語音念不出來。
   後面若跟著括號裡的拼音，就只念那個拼音；沒有拼音就整段略過——只念一遍，不重複。 */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*[（(]\\s*([A-Za-z][A-Za-z'\u2019\u0101\u0113\u012b\u014d\u016b\\- ]*)\\s*[）)]", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* 讀音修正：只改送去語音的字，畫面上的字完全不動。
   「地」在天地、地球、地是……應讀 ㄉㄧˋ，語音引擎常誤讀成輕聲的 ㄉㄜ˙；
   換成同音的「帝」就讀得對（聽起來一模一樣）。要再加字就往這張表加。 */
const TTS_SAY = [
  [/天地/g, '天帝'],
  [/地球/g, '帝球'],
  [/地是/g, '帝是'],
];

/* 朗讀前的文字整理 */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
/* -rf1105（互動聖經 v2.60 朗讀升級）：雲端逾時、20 秒斷路器、失敗改用裝置語音、看門狗、睡前定時。
   TTSQ 由 plFetch／預先下載在呼叫前設定，ttsFetch 一開頭就讀走（PRON321 的包裝只轉第一個參數）。 */
let TTS_DOWN = 0;                       // 雲端暫停到什麼時候（失敗後 20 秒內，沒有快取的段落不再等待）
const TTSQ = { quick:false, bulk:false };
let NATIVE_STOP = null;                 // 目前這一句若正在用裝置語音，可以用它收掉
let WD2 = null;                         // 看門狗：音檔放完卻沒觸發 ended 時，依實際長度推進
const SLEEP = { mode:0, mins:[0, 15, 30, 60], t:0, iv:0 };
async function ttsFetch(piece){
  const quick = TTSQ.quick, bulk = TTSQ.bulk; TTSQ.quick = TTSQ.bulk = false;
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  /* 剛失敗過的 20 秒內，沒有快取的段落不再等待，立刻讓呼叫端改用裝置語音（整課預先下載不受影響） */
  if (!bulk && Date.now() < TTS_DOWN) throw new Error('cloud paused');
  let ctrl = null, timer = null;
  try { if (window.AbortController) ctrl = new AbortController(); } catch(e){}
  if (ctrl) timer = setTimeout(() => { try { ctrl.abort(); } catch(e){} }, (quick && !bulk) ? 6000 : 15000);
  try {
    const res = await fetch(SVC.tts, { signal: ctrl ? ctrl.signal : undefined, method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (timer) clearTimeout(timer);
    ttsPut(key, blob);
    return blob;
  } catch (err) {
    if (timer) clearTimeout(timer);
    if (!bulk) TTS_DOWN = Date.now() + 20000;
    throw err;
  }
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){

}
function appIcon(){

    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '朗讀中',

/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  TTS_DOWN = 0;                       // 按 ▶ 開新一輪：歸零，重新試雲端
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  TTSQ.quick = (k === (PL.need != null ? PL.need : PL.i)) || PL.fail > 0;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3){
      if (Date.now() < TTS_DOWN && k !== (PL.need != null ? PL.need : PL.i)) continue;   /* 雲端暫停中：只替現在要唸的那一句試 */
      plFetch(k);
    }
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (!PL.blobs[0] && (PL.try[0] || 0) >= 3 && window.speechSynthesis) return plPlay(0);   /* 第一句雲端就連不上：逐句改用裝置語音，仍有逐句標示 */
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (NATIVE_STOP){ const ns0 = NATIVE_STOP; NATIVE_STOP = null; ns0(); }
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if (Date.now() < TTS_DOWN && PL.pend[k]) PL.try[k] = 3;   /* 雲端剛判定失敗：還在等的這一句也不再等 */
    if ((PL.try[k] || 0) >= 3){              // 這一段雲端抓不到：改用裝置語音唸這一句，唸完再回雲端
      return nativeUnit(k);
    }
    PL.need = k;
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  PL.need = null; clearWd2();
  a.src = URL.createObjectURL(b);
  /* 看門狗：音檔放完卻沒有 ended（某些系統暫停了頁面）時，依實際長度（含語速）＋5 秒推進到下一句 */
  const armWd = () => {
    clearWd2();
    const d = a.duration;
    if (!(d > 0 && isFinite(d))) return;
    const left = Math.max(0, d - (a.currentTime || 0)) / (a.playbackRate || 1);
    WD2 = setTimeout(() => {
      WD2 = null;
      if (!PL || PL.tok !== SPK.tok || PL.i !== k || SPK.pause) return;
      if (!a.ended){ try { URL.revokeObjectURL(a.src); } catch(e){} PL.cur = 1 - PL.cur; plPlay(k + 1); }

  a.onpause = clearWd2;
  a.onended = () => {
    clearWd2();
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}
    PL.cur = 1 - PL.cur;
    plPlay(k + 1);
  };
  a.onerror = () => { clearWd2(); if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];
  if (nb){ const nx = els[1 - PL.cur];
    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  playSegs(chunks.map(t => ({ t })), title);
}
function utter(t){
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  return u;
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  speechSynthesis.speak(utter(t));
}
function clearWd2(){ if (WD2){ try { clearTimeout(WD2); } catch(e){} WD2 = null; } }
/* 雲端這一句抓不到：只這一句改用裝置語音（仍逐句標示），唸完 plPlay(k+1) 回到雲端；提示每輪只彈一次 */
function nativeUnit(k){
  if (!PL) return;
  if (!window.speechSynthesis){ PL.i = k; SPK.i = k; return plPlay(k + 1); }
  const my = SPK.tok; let done = false, tm = null;
  PL.i = k; SPK.i = k; PL.need = null; SPK.buffering = false; SPK.native = true;
  if (!SPK.toasted){ SPK.toasted = true; toast('真人語音連不上，這一句先用裝置語音'); }
  spkMark(PL.segs[k]);
  drawBar();
  const txt = PL.segs[k].t;
  const fin = (cancelOnly) => {
    if (done) return; done = true;
    if (tm){ clearTimeout(tm); tm = null; }
    NATIVE_STOP = null; SPK.native = false;
    if (cancelOnly) return;
    if (!PL || PL.tok !== my || !SPK.on) return;
    plPlay(k + 1);
  };
  NATIVE_STOP = () => { if (done) return; fin(true); try { speechSynthesis.cancel(); } catch(e){} };
  const guard = () => {
    tm = setTimeout(() => { if (done) return; if (SPK.pause) return guard(); fin(); }, Math.max(15000, txt.length * 480 / (S.set.rate * 0.05 + 0.94)) + 10000);
  };
  try {
    const u = utter(txt);
    u.onend = () => fin(); u.onerror = () => fin();
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    if (SPK.pause) speechSynthesis.pause();
    guard();
  } catch(e){ fin(); }
}
/* 睡前定時：關 → 15 → 30 → 60 分鐘 → 關。時間到淡出 5 秒再停 */
function sleepMsg(m){ return m ? ('睡前定時：' + m + ' 分鐘後停止') : '睡前定時：關'; }
function sleepClear(){
  if (SLEEP.t){ clearTimeout(SLEEP.t); SLEEP.t = 0; }
  if (SLEEP.iv){ clearInterval(SLEEP.iv); SLEEP.iv = 0; try { audioPair().forEach(a => { a.volume = 1; }); } catch(e){} }
  SLEEP.mode = 0;
}
function sleepCycle(){
  if (!SPK.on) return;
  const m = (SLEEP.mode + 1) % SLEEP.mins.length;
  if (SLEEP.t){ clearTimeout(SLEEP.t); SLEEP.t = 0; }
  SLEEP.mode = m;
  if (m) SLEEP.t = setTimeout(sleepFire, SLEEP.mins[m] * 60000);
  toast(sleepMsg(SLEEP.mins[m]));
  drawBar();
}
function sleepFire(){
  SLEEP.t = 0; SLEEP.mode = 0;
  if (!SPK.on) return;
  const els = audioPair(); let n = 0;
  SLEEP.iv = setInterval(() => {
    n++;
    try { els.forEach(a => { a.volume = Math.max(0, 1 - n * 0.2); }); } catch(e){}
    if (n >= 5){ clearInterval(SLEEP.iv); SLEEP.iv = 0; stopSpeak(); try { els.forEach(a => { a.volume = 1; }); } catch(e){} }
  }, 1000);
}
function stopSpeak(){
  if (NATIVE_STOP){ const ns1 = NATIVE_STOP; NATIVE_STOP = null; ns1(); }

  SPK.tok++; SPK.on = false; SPK.pause = false; SPK.buffering = false; SPK.native = false;
  PL = null;
  try { audioPair().forEach(a => { a.pause(); a.onended = null; a.onerror = null; }); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}

  drawBar();
}
function plCurEl(){ const els = audioPair(); return els[PL ? PL.cur : 0]; }
function togglePause(){

/* 往前／往後跳一句 */
function spkStep(d){

function drawBar(){

/* ── 標示正在讀的那一句，並且捲到它 ── */
let SPK_LAST = [];
function spkClear(){
  document.querySelectorAll('.spk-now').forEach(e => e.classList.remove('spk-now'));
  SPK_LAST = [];
}
function spkMark(seg){
  if (!seg || !PL || !PL.lesson) return;
  if (R.tab !== 'course' || R.ch !== PL.lesson || R.sub !== 'lesson') return;  // 不在這一頁就不動畫面
  spkClear();

  const els = [];

    seg.js.forEach(j => {
      const e = document.querySelector(`.les .mks[data-k="l|${n}|${seg.i}|${seg.part}|${j}"]`);
      if (e) els.push(e);

function mkText(k){

/* 依句號切句；HTML 標籤不會被切斷，句末的引號跟著前一句走 */
const EN_SENT = false;
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // 標籤內不切
    let brk = '。！？'.includes(ch);
    if (!brk && EN_SENT && '.!?'.includes(ch)){      // 英文：句點後須接空白
      const nx = html[i + 1];
      brk = (nx === undefined || nx === ' ' || nx === '\n') && !/\b[A-Z]$/.test(cur.slice(-2, -1));
    }
    if (!brk) continue;
    while (i + 1 < html.length && '」』）”"\''.includes(html[i + 1])){ i++; cur += html[i]; }
    while (i + 1 < html.length && html[i + 1] === ' '){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}

}

  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch(e){} }, 40000) : null;
  try {
    const res = await fetch(SVC.xz, { method:'POST', headers:{ 'Content-Type':'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model:SVC.model, max_tokens:1000, system:xzSystem(),
        messages: XZ.msgs.slice(-12).map(m => ({ role:m.role, content:m.text })) }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let t = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    if (!t) t = '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？';
    XZ.msgs.push({ role:'assistant', text:t });
  } catch(e){
    XZ.msgs.push({ role:'assistant', text:(e && e.name === 'AbortError' ? '小智等候得有點久，先暫停一下。' : '小智暫時連不上線，請稍後再試。')
      + '\n別忘了——最好的同伴是聖靈與神的話，你隨時可以直接向主傾心吐意。' });

  XZ.busy = false; drawXz();
}

function xzSavedIdx(i){
  const a = XZ.msgs[i]; if (!a) return -1;
  return S.xz.findIndex(x => x.a === a.text);

function xzSave(i){

  const k = xzSavedIdx(i);
  if (k >= 0){ S.xz.splice(k, 1); save(); drawXz(); return toast('已取消收藏'); }
  let q = '';
  for (let p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user'){ q = XZ.msgs[p].text; break; }
  S.xz.unshift({ q, a:a.text, ch:(R.ch || S.last || 0), at:Date.now() });
  save(); drawXz(); toast('已加入收藏');
}
function xzDel(i){

/* ===== 全螢幕模式：講台提詞機 ＋ 小組帶領 ===== */
let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // 教學講義逐字稿
    const s = (D.lesson || {})[n];
    // 「想更深」是備而不用的問答，不上提詞機
    F.pages = s ? telePages(s.blocks.filter(b => b[0] !== 'd')) : outlinePages(n);
    F.total = (s ? s.min : 40) * 60;
    F.left = F.total;
    // 標題列只放主標題，副標題太長會擠成兩行
    $('#ftitle').textContent = '《' + (s ? s.title.split('——')[0] : meta(n).t) + '》';
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = '《' + meta(n).t + '》';
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = '第' + n + '章 · 小組';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}
function fClose(){
  F = null; clearInterval(FT); FT = null;
  document.documentElement.setAttribute('data-tele', '0');
  $('#full').classList.remove('on'); keepAwake(false);
}
async function keepAwake(on){
  try {
    if (on && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen');
    else if (WAKE) { WAKE.release(); WAKE = null; }
  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // 稿中的停頓 ＝ 換頁
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', '經文　' + p[1]], ['p', p[2]]] }));
  ps.push({ blocks:[['h','結論'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'① 破冰　10 分鐘', q:m.grp[0], tip:'讓每個人都說一句。組長先說自己的。' });
  ps.push({ sec:900, ttl:'② 經文共讀　15 分鐘', q:'「' + m.mv.t + '」　' + m.mv.r,
            tip:'逐人讀本章核心經文。讀完，先安靜三十秒，不急著解釋。' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'③ 討論　第 ' + (i + 2) + ' 題', q,
    tip: i === 1 ? '這是最深的一題。組長先說自己的。不要追問細節；若有人哭，停下來為他禱告，不要接著問下一題。'
       : i === 3 ? '請小組成員在第七天問他一次。' : '' }));
  ps.push({ sec:900, ttl:'④ 操練與代禱　15 分鐘', q:m.prac.main,
            tip:'一人只選一項。彼此指定第七天要問的同伴，然後為彼此禱告。' });
  return ps;
}
function fDraw(){
  if (!F) return;
  const p = F.pages[F.i], b = $('#fbody');
  if (F.tele){
    b.className = 'fbody tele';
    b.innerHTML = p.blocks.map(x =>
      x[0] === 'h' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 's' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 't' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'm' ? `<p class="pause">${esc(x[1])}</p>` :
      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">停　<b>${x[1]}</b>　秒</p>` :
      `<p>${esc(x[1])}</p>`).join('');
  } else {
    b.className = 'fbody live';
    b.innerHTML = `<h5>${esc(p.ttl)}</h5><p class="qq">${esc(p.q)}</p>` +
      (p.tip ? `<div class="tipbox"><b>💡 帶領提醒</b><br>${esc(p.tip)}</div>` : '');
    F.left = p.sec;
  }
  b.scrollTop = 0;
  $('#frail').style.width = ((F.i + 1) / F.pages.length * 100) + '%';
  $('#fplay').textContent = F.run ? '暫停' : '繼續';
  fClock();
}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('已經是最後一段'); return; }
  F.i = i; fDraw();
}

function vSearch(){
  setTitle('搜尋', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">搜尋</p>
    <input class="sbox" id="sq" placeholder="經節、原文、關鍵字…（例：3:9、聽、שָׁמַע）" value="${esc(q)}">

  if (q.length >= 1){
    const hit = (t) => t && (t.indexOf(q) >= 0 || (S.set.sc && toSC(t).indexOf(q) >= 0));   // 簡體模式也能用簡體字搜尋
    const mk = (t) => esc(S.set.sc ? toSC(t) : t).split(esc(q)).join('<mark>' + esc(q) + '</mark>');
    let r = '';
    // 經節
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">經文　${vs.length}</h3>`;

      if (vs.length > 15) r += `<p class="xs muted">（只顯示前 15 筆）</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">我的畫線　${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 40))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 30))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">解經　${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 38))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 章
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(hit) || c.grp.some(hit) || c.safe.some(hit) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">講義　${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">

    // 教學講義逐字稿
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // 想更深是一問一答

    });
    if (ls.length){ r += `<h3 class="sec">教學講義　${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">

      if (ls.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 軌跡
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">原文軌跡　${tk.length}</h3>`;

    // 爭議
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">爭議　${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">${esc(issRef(i.r))}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">找不到「${esc(q)}」。試試經節（3:9）、原文（שָׁמַע）或關鍵字（聽、殿、心）。</p>`;
  }
  return h;
}

/* ═══════════════════════════════════════════════════════════════════
   畫線範圍（照《321互動聖經》）：往前加一句、往後加一句／少一句、整節、整段
   一條畫線仍只記在第一句的 key 上，S.mk[k].sp = 這條畫線共幾句。
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  /* 較早一代的範本（羅馬書、馬可、啟示錄）沒有顏色與定位工具，這裡補上 */
  if (typeof window.mkColor !== 'function') window.mkColor = k => (S.mk[k] && S.mk[k].c) || '';
  if (typeof window.mkKeep !== 'function') window.mkKeep = (k, fn) => {
    const sel = '[data-k="' + k + '"]', b = document.querySelector(sel), top = b ? b.getBoundingClientRect().top : null;
    fn(); if (top === null) return;
    const a = document.querySelector(sel); if (a) { const d = a.getBoundingClientRect().top - top; if (Math.abs(d) > 1) window.scrollBy(0, d); }
  };
  const TT = (zh, en) => (window.GX && GX.T) ? GX.T(zh, en) : zh;
  const MKS_TEXT = window.mkText, MKS_SHEET = window.mkSheet, MKS_TAP = window.mkTap;
  const sp = k => Math.max(1, +((S.mk[k] || {}).sp) || 1);
  /* 經文：由資料攤平整章的句子（不靠畫面，哪裡打開都算得對） */
  function seqV(c) {
    const out = [];
    (D.txt[c] || []).forEach((t, i) => {
      const ss = splitHTML(esc(t)), n = ss.length, ref = c + ':' + (i + 1);
      /* 空的節（和合本把兩節合成一節時，後一節是空的）不算一句 */
      for (let s = 0; s < n; s++) if (String(ss[s]).replace(/<[^>]+>/g, '').trim())
        out.push({ k: 'v|' + ref + (n > 1 ? '|' + s : ''), v: i + 1 });
    });
    return out;
  }
  /* 其他（講義、解經、三句話）：照畫面上的順序 */
  const grp = p => p[0] === 'l' ? 'l|' + p[1] + '|' : p.slice(0, -1).join('|') + '|';
  function seqDom(k) {
    backfill();
    const g = grp(k.split('|')), seen = {}, out = [];
    document.querySelectorAll('.mks[data-k],.mkp[data-k]').forEach(e => {
      const x = e.dataset.k;
      if (x.indexOf(g) === 0 && !seen[x]) { seen[x] = 1; out.push({ k: x }); }
    });
    if (!seen[k]) out.unshift({ k });
    return out;
  }
  function seq(k) {
    const p = k.split('|');
    return p[0] === 'v' ? seqV(p[1].split(':')[0]) : seqDom(k);
  }
  function keysOf(k) {
    const L = seq(k), i = L.findIndex(x => x.k === k);
    if (i < 0) return [k];
    return L.slice(i, i + sp(k)).map(x => x.k);
  }
  /* 整節／整段要畫幾句 */
  function spanTo(k, mode) {
    const L = seq(k), i = L.findIndex(x => x.k === k), p = k.split('|');
    if (i < 0) return 1;
    let n = 1;
    if (p[0] === 'v') {
      const c = p[1].split(':')[0], v = L[i].v;
      let z = v;
      if (mode === 'p') { const b = VMAP[c + ':' + v]; z = b && b.z ? b.z : v; }
      while (i + n < L.length && L[i + n].v <= z) n++;
    } else {
      const pre = p[0] === 'l' ? p.slice(0, 4).join('|') + '|' : grp(p);
      while (i + n < L.length && L[i + n].k.indexOf(pre) === 0) n++;
    }
    return n;
  }
  /* 出處：經文算出「出埃及記 1:6-7」；其他交給美圖自己去查 */
  function refOf(k) {
    const p = k.split('|');
    if (p[0] !== 'v') return GX.chLabel(+String(p[1] || '').split(':')[0] || R.ch || S.last || 1);
    const ks = keysOf(k), a = ks[0].split('|')[1].split(':'), z = ks[ks.length - 1].split('|')[1].split(':');
    return (GX.BK ? TT(GX.BK.zh, GX.BK.en) : (GX.BOOK || '')) + ' ' + a[0] + ':' + a[1] + (z[1] !== a[1] ? '-' + z[1] : '');
  }
  window.mkRefOf = refOf;
  window.mkText = function (k) {
    if (!S.mk[k] || sp(k) < 2) return MKS_TEXT(k);
    /* 中文直接接；英文（前後都是英數標點）中間補一個空格 */
    return keysOf(k).map(x => String(MKS_TEXT(x) || '').trim()).filter(Boolean).reduce((s, x) =>
      !s ? x : (/[\x21-\x7E”’]$/.test(s) && /^[\x21-\x7E“‘]/.test(x)) || k[0] !== 'v' ? s + ' ' + x : s + x, '');
  };
  /* 把多句畫線延伸到後面幾句（只改畫面，不另外存） */
  /* 較早的範本句子沒有 data-k，只把 key 寫在 onclick 裡：補上 */
  function backfill() {
    document.querySelectorAll('.mks:not([data-k]),.mkp:not([data-k])').forEach(e => {
      const mm = /mkTap\('([^']+)'/.exec(e.getAttribute('onclick') || '');
      if (mm) e.setAttribute('data-k', mm[1]);
    });
  }
  function paint() {
    backfill();
    document.querySelectorAll('[data-own]').forEach(e => {
      if (!mkHas(e.dataset.own) && !mkHas(e.dataset.k)) { e.classList.remove('hl'); e.removeAttribute('data-c'); }
      e.removeAttribute('data-own');
    });
    Object.keys(S.mk).forEach(k => {
      if (sp(k) < 2) return;
      const c = mkColor(k);
      keysOf(k).slice(1).forEach(x => document.querySelectorAll('[data-k="' + x + '"]').forEach(e => {
        if (mkHas(x)) return;
        e.classList.add('hl'); e.dataset.own = k;
        if (c) e.setAttribute('data-c', c); else e.removeAttribute('data-c');
      }));
    });
  }
  window.mkPaintSpans = paint;
  const R0 = window.render;
  window.render = function () { const r = R0.apply(this, arguments); try { paint(); } catch (e) {} return r; };
  /* 點到被別條畫線蓋住的句子，就打開那一條 */
  window.mkTap = function (k, el) {
    const own = el && el.dataset && el.dataset.own;
    if (own && mkHas(own) && !mkHas(k)) return window.mkSheet(own);
    if (mkHas(k)) return window.mkSheet(k);
    return MKS_TAP(k, el);
  };
  const SC0 = window.mkSetColor;
  if (typeof SC0 === 'function') window.mkSetColor = function (k, c) { SC0(k, c); try { paint(); } catch (e) {} };
  /* 儲存領受時保留範圍 */
  window.mkSave = function (k) {
    const v = ($('#mkin') || {}).value || '';
    const o = S.mk[k] || {};
    S.mk[k] = { n: v.trim(), at: Date.now(), c: mkColor(k) };
    if (o.sp > 1) S.mk[k].sp = o.sp;
    save();
    $('#sheet').classList.remove('on'); mkKeep(k, render); toast(TT('領受已存', 'Saved'));
  };
  if (window.GXS) {
    window.mkSpanCard = function (k) {
      const n = ($('#mkin') || {}).value || mkNote(k), sh = $('#sheet');
      if (sh) sh.classList.remove('on');
      GXS.open({ text: window.mkText(k), note: n, ref: refOf(k) });
    };
    if (typeof window.mkCard !== 'function') window.mkCard = window.mkSpanCard;
  } else if (typeof window.mkRef === 'function') {
    /* 自帶美圖的範本（路加福音）：沿用它自己的「做一張圖」，只把出處改成範圍 */
    const REF0 = window.mkRef;
    window.mkRef = function (k) {
      const r = REF0(k);
      if (k[0] !== 'v' || sp(k) < 2) return r;
      const ks = keysOf(k), a = ks[0].split('|')[1].split(':'), z = ks[ks.length - 1].split('|')[1].split(':');
      return r.replace(/\s\S+$/, ' ' + a[0] + ':' + a[1] + (z[1] !== a[1] ? '-' + z[1] : ''));
    };
  }
  function rowHTML(k) {
    const isV = k[0] === 'v';
    return `<div class="hlrow mkspan"><span class="lb">${TT('範圍', 'Range')}</span>
      <button class="spb" data-sp="back" title="${TT('往前加一句', 'Add the sentence before')}">${TT('↑前一句', '↑ Prev')}</button>
      <button class="spb" data-sp="-1">－</button>
      <span class="spn" id="mkSpn">${TT(sp(k) + ' 句', sp(k) + '')}</span>
      <button class="spb" data-sp="1">＋</button>
      ${isV ? '<button class="spb" data-sp="v">' + TT('整節', 'Verse') + '</button>' : ''}
      <button class="spb" data-sp="p" title="${isV ? TT('這一段解經涵蓋的經文', 'The verses this exegesis covers') : TT('這一段', 'This paragraph')}">${TT('整段', 'Passage')}</button></div>
      <div class="mkspan-hint">${TT('按 ＋ 往下多畫一句、按「↑前一句」往上加一句，畫線就不只一句，可以連成一整段。' + (isV ? '「整段」是這段解經涵蓋的經文。' : ''), 'Tap ＋ to add the next sentence or “↑ Prev” to add the one before, so one highlight can cover a whole passage.' + (isV ? ' “Passage” covers the verses of this exegesis section.' : ''))}</div>`;
  }
  window.mkSheet = function (k) {
    MKS_SHEET(k);
    const box = $('#sheet'); if (!box) return;
    const row = box.querySelector('.hlrow') || box.querySelector('.mkq');
    if (row && !box.querySelector('.mkspan')) row.insertAdjacentHTML('afterend', rowHTML(k));
    const q0 = box.querySelector('#mkq') || box.querySelector('.mkq');
    if (q0 && sp(k) > 1) q0.textContent = window.mkText(k).slice(0, 300);
    box.querySelectorAll('button').forEach(b => {
      if (window.GXS && /做成美[圖图]/.test(b.textContent)) b.onclick = e => { e.stopPropagation(); window.mkSpanCard(k); };
    });
    box.querySelectorAll('[data-sp]').forEach(b => b.onclick = e => { e.stopPropagation(); spanAct(k, b.dataset.sp); });
  };
  function refresh(k, ta) {
    const box = $('#sheet');
    const q = box && (box.querySelector('#mkq') || box.querySelector('.mkq')); if (q) q.textContent = window.mkText(k).slice(0, 300);
    const n = box && box.querySelector('#mkSpn'); if (n) n.textContent = TT(sp(k) + ' 句', sp(k) + '');
    mkKeep(k, render);
    if (ta != null) { const t = $('#mkin'); if (t) t.value = ta; }
  }
  function spanAct(k, a) {
    if (!mkHas(k)) return;
    const ta = ($('#mkin') || {}).value;
    const m = S.mk[k], was = sp(k), L = seq(k), i = L.findIndex(x => x.k === k);
    if (a === 'back') {
      if (i <= 0) return toast(TT('前面沒有句子了', 'Nothing before this'));
      const pk = L[i - 1].k;
      if (mkHas(pk)) return toast(TT('前一句已經畫了線', 'The sentence before is already highlighted'));
      const own = document.querySelector('[data-k="' + pk + '"][data-own]');
      if (own) return toast(TT('前一句屬於另一條畫線', 'The sentence before belongs to another highlight'));
      if (ta != null) m.n = ta.trim();
      S.mk[pk] = Object.assign({}, m, { sp: was + 1, at: Date.now() });
      delete S.mk[k]; save();
      mkKeep(pk, render);
      window.mkSheet(pk);
      const t = $('#mkin'); if (t) { t.value = S.mk[pk].n || ''; setTimeout(() => { try { t.blur(); } catch (e) {} }, 80); }
      toast(TT('已往前加一句，共 ' + (was + 1) + ' 句', 'Added — ' + (was + 1) + ' sentences'));
      return;
    }
    let n;
    if (a === 'v' || a === 'p') {
      n = spanTo(k, a);
      toast(n === was ? (a === 'v' ? TT('這一節已經整節畫起來了', 'The whole verse is already highlighted') : TT('這一段已經整段畫起來了', 'The whole passage is already highlighted'))

    } else {
      n = was + (+a);
      if (n < 1) return toast(TT('至少要畫一句', 'At least one sentence'));
      if (i >= 0 && i + n > L.length) return toast(TT('後面沒有句子了', 'Nothing after this'));
    }
    if (n > 1) m.sp = n; else delete m.sp;
    save(); refresh(k, ta);
  }
  const st = document.createElement('style');
  st.textContent = `.mkspan{display:flex;align-items:center;margin:10px 0 12px;gap:6px!important;flex-wrap:wrap!important}

/* ═══════════════════════════════════════════════════════════════════
   朗讀標示一句一句走（照《321互動聖經》）
   朗讀引擎一次把一整段（好幾句）標成 .spk-now，聲音也是整段連著唸；
   這裡只留「正在唸的那一句」亮著，依音檔播放進度（按字數比例）往下移。
   用裝置內建語音（沒有音檔）時，依語速估算。
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  if (window.__spkStep) return; window.__spkStep = 1;
  let lastAudio = null;
  try {
    const P0 = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function () {
      if (this.tagName === 'AUDIO' || !this.videoWidth) lastAudio = this;
      return P0.apply(this, arguments);
    };
  } catch (e) {}
  let G = null;            // { els, w[], tot, cur, t0, a, src }
  let hold = 0;
  ['wheel', 'touchstart', 'touchmove', 'pointerdown'].forEach(ev =>
    window.addEventListener(ev, () => { hold = Date.now() + 6000; }, { passive: true }));
  const len = el => Math.max(1, String(el.textContent || '').replace(/\s+/g, '').length);
  function show(i) {
    if (!G) return;
    i = Math.max(0, Math.min(G.els.length - 1, i));
    if (i === G.cur) return;
    G.els.forEach((e, j) => { if (j !== i) e.classList.remove('spk-now'); });
    const el = G.els[i]; el.classList.add('spk-now'); G.cur = i;
    if (Date.now() < hold) return;
    try {
      const r = el.getBoundingClientRect();
      if (r.top < 70 || r.bottom > innerHeight - 150) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) {}
  }
  function frac() {
    const a = G.a;
    if (a && a.duration && isFinite(a.duration) && a.duration > 0 && (a.currentSrc || a.src) === G.src)
      return a.currentTime / a.duration;
    /* 裝置語音：依語速估算（中文約每秒 4.6 字，英文約每秒 14 個字母） */
    const ss = window.speechSynthesis;
    if (ss && ss.paused) { G.t0 += 250; return null; }
    const en = /[A-Za-z]{3}/.test(G.els[0].textContent || '');
    const cps = en ? 14 : 4.6;
    return ((Date.now() - G.t0) / 1000 * cps) / G.tot;
  }
  function tick() {
    if (document.hidden) return;
    const now = Array.prototype.slice.call(document.querySelectorAll('.spk-now'));
    if (G) {
      const mine = G.els[G.cur];
      /* 引擎換了下一段（或重繪）：舊的那一組結束 */
      const sameGroup = now.length === 1 && now[0] === mine;
      if (!sameGroup) G = null;
    }
    if (!G && now.length > 1) {
      const a = lastAudio && !lastAudio.paused ? lastAudio : null;
      const w = now.map(len);
      G = { els: now, w, tot: w.reduce((x, y) => x + y, 0), cur: -1, t0: Date.now(), a, src: a ? (a.currentSrc || a.src) : '' };
      if (!a && lastAudio && lastAudio.paused && lastAudio.currentTime > 0) { G.a = lastAudio; G.src = lastAudio.currentSrc || lastAudio.src; }
      show(0);
    }
    if (!G) return;
    if (!G.a && lastAudio && !lastAudio.paused) { G.a = lastAudio; G.src = lastAudio.currentSrc || lastAudio.src; }
    const f = frac();
    if (f == null) return;
    let acc = 0, i = 0;
    const target = Math.min(0.999, Math.max(0, f)) * G.tot;
    for (; i < G.w.length; i++) { acc += G.w[i]; if (acc > target) break; }
    if (i > G.cur) show(i);             // 只往前走，不倒退閃動
  }
  setInterval(tick, 200);
  /* 引擎一標上新的一段就立刻處理，不等下一次計時——不然換段那一瞬間會閃一下整段 */
  let queued = false;
  try {
    new MutationObserver(ms => {
      if (queued) return;
      for (const m of ms) if (m.attributeName === 'class' && m.target.classList && m.target.classList.contains('spk-now')) {
        queued = true; Promise.resolve().then(() => { queued = false; tick(); }); return;
      }
    }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();

    var moves = [[1, 1, 0], [1, 2, .6], [2, 1, .6], [1, 3, 1.4], [3, 1, 1.4], [2, 2, 1], [1, 0, 3], [0, 1, 3]];
    for (i = 0; i <= m; i++) for (j = 0; j <= n; j++) {
      if (C[i][j] >= INF) continue;
      moves.forEach(function (mv) {
        var a = i + mv[0], b = j + mv[1]; if (a > m || b > n) return;
        var x = 0, y = 0, k; for (k = i; k < a; k++) x += M[k]; for (k = j; k < b; k++) y += A2[k];
        var c = C[i][j] + mv[2] + Math.abs(y - r * x) / Math.sqrt(r * x + y + 1);
        if (c < C[a][b]) { C[a][b] = c; B[a][b] = [i, j]; }
      });
    }
    var groups = []; i = m; j = n;
    while (i > 0 || j > 0) { var p = B[i][j]; if (!p) break; groups.unshift([p[0], i, p[1], j]); i = p[0]; j = p[1]; }
    return groups;                                      // [主起, 主迄, 譯起, 譯迄]
  }
  function mkSpan(t) { var d = document.createElement('span'); d.className = 'cps'; d.setAttribute('lang', ALT_LANG); d.textContent = t; return d; }
  function sentPair(me, altText) {
    var bounds = mainBounds(me), alts = splitSents(altText, EN);
    if (!bounds.length || !alts.length) return 0;
    var groups = bounds.length === 1 ? [[0, 1, 0, alts.length]] : align(bounds.map(function (b) { return b.text; }), alts);
    var ins = [];                                       // [主要句尾索引, 文字]
    groups.forEach(function (g) {
      var t = alts.slice(g[2], g[3]).join(EN ? '' : ' ');
      if (!t) return;
      var at = g[1] > g[0] ? g[1] - 1 : Math.max(0, g[0] - 1);
      if (ins.length && ins[ins.length - 1][0] === at) ins[ins.length - 1][1] += (EN ? '' : ' ') + t; else ins.push([at, t]);
    });
    for (var k = ins.length - 1; k >= 0; k--) {         // 從後面插回來，前面的位移不受影響
      var b = bounds[ins[k][0]], sp = mkSpan(ins[k][1]);
      if (b.unit) b.unit.parentNode.insertBefore(sp, b.unit.nextSibling);
      else if (b.node) { var rest = b.node.splitText(b.off); rest.parentNode.insertBefore(sp, rest); }
      else me.appendChild(sp);
    }
    return ins.length;
  }
  function css() {
    if (document.getElementById('cparCss')) return;
    var st = document.createElement('style'); st.id = 'cparCss';
    st.textContent = '.cpar{margin:4px 0 12px;padding:4px 0 4px 10px;border-left:3px solid color-mix(in srgb,var(--pine) 45%,transparent);font-size:.9em;line-height:1.7;color:color-mix(in srgb,currentColor 64%,transparent);font-weight:400;letter-spacing:0;text-transform:none}'
      + 'h1+.cpar,h2+.cpar,h3+.cpar,h4+.cpar{font-weight:600}li>.cpar,td>.cpar{margin:4px 0 2px}'
      + '.cps{display:block;margin:2px 0 8px;padding:1px 0 1px 9px;border-left:3px solid color-mix(in srgb,var(--pine) 40%,transparent);font-size:.88em;line-height:1.65;color:color-mix(in srgb,currentColor 62%,transparent);font-weight:400;font-style:normal;letter-spacing:0;text-transform:none;text-align:left}'
      + 'h1 .cps,h2 .cps,h3 .cps,h4 .cps{font-weight:600}'
      + '.cparbtn{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;margin-left:6px}'
      + '.cparbtn.on{border-color:var(--pine);color:var(--pine)}.cparbar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin:-4px 0 8px}.cpar-st{font-size:12.5px;opacity:.75;margin:0 0 8px}';
    document.head.appendChild(st);
  }
  function btnHtml() { var on = isOn(); return '<button class="cparbtn' + (on ? ' on' : '') + '" onclick="CPAR321.toggle()">🌐 ' + T('btn') + '：' + (on ? T('on') : T('off')) + '</button>'; }
  function addBtn(h) {
    if (h.indexOf('<div class="parbar">') >= 0) return h.replace('<div class="parbar">', '<div class="parbar">' + btnHtml());
    var i = h.indexOf('</div>');                        // 放在第一個區塊（章標題）之後
    return i >= 0 ? h.slice(0, i + 6) + '<div class="cparbar">' + btnHtml() + '</div>' + h.slice(i + 6) : '<div class="cparbar">' + btnHtml() + '</div>' + h;
  }
  function status(root, msg) {
    if (!root) return; var s = root.querySelector('.cpar-st');
    if (!msg) { if (s) s.parentNode.removeChild(s); return; }
    if (!s) { s = document.createElement('div'); s.className = 'cpar-st'; var bar = root.querySelector('.cparbar,.parbar'); if (bar) bar.parentNode.insertBefore(s, bar.nextSibling); else root.insertBefore(s, root.firstChild); }
    s.textContent = msg;
  }
  /* ── 畫面掛鉤 ── */
  function wrapView(name, test) {
    var orig = window[name]; if (typeof orig !== 'function') return;
    window[name] = function () {
      var args = arguments, h = orig.apply(this, args);
      if (typeof h !== 'string' || !test()) return h;
      css(); h = addBtn(h);
      if (isOn()) {
        var key = R.tab + '|' + R.ch + '|' + R.sub;
        setTimeout(function () {
          var root = document.getElementById('view'); if (!root || R.tab + '|' + R.ch + '|' + R.sub !== key) return;
          if (!ALT) { status(root, failed ? T('fail') : T('loading')); load(function (ok) { if (R.tab + '|' + R.ch + '|' + R.sub !== key) return; if (ok) render(); else status(root, T('fail')); }); return; }
          pairInto(root, altRun(orig, args));
        }, 0);
      }
      return h;
    };
  }
  wrapView('vCourse', function () { return R.tab === 'course' && !!R.ch; });
  wrapView('vText', function () { return R.tab === 'text' && !!R.ch && R.sub !== 'vpk'; });
  function wrapSheet(name) {
    var orig = window[name]; if (typeof orig !== 'function') return;
    window[name] = function () {
      var args = arguments, r = orig.apply(this, args);
      if (isOn()) {
        var go2 = function () { var sb = document.getElementById('sbody'); if (sb) { css(); pairInto(sb, altRun(orig, args)); } };
        if (ALT) setTimeout(go2, 0); else load(function (ok) { if (ok) go2(); });
      }
      return r;
    };
  }
  ['openV', 'openIssue'].forEach(wrapSheet);
  window.CPAR321 = {
    toggle: function () {
      var on = !isOn(); setOn(on); var y = window.scrollY;
      if (on && !ALT) load(function () { render(); window.scrollTo(0, y); });
      render(); window.scrollTo(0, y);
    },
    _pair: pairInto, _run: altRun, _load: load
  };
})();
