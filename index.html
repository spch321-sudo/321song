,"然後，他說出那句很有名的話：「我妹子，我新婦，你奪了我的心」（歌4:9）。他用了兩個稱呼：妹子，新婦。「妹子」在這裡，不是血緣上的妹妹，而是古代近東情詩裡一個親暱而平等的稱呼：同伴、一家人的那種親近。我們不需要在這裡做太多文章，只要知道，這是一個親近、不帶高低的稱呼。"],["p","他說：你奪了我的心。這是一句很特別的話。王，擁有一切；可是他說，他被奪走了心。他的眼，只要她一看；她項上的一條金鏈，就奪走了他的心。愛，讓一個強者變得柔軟。他沒有說「我要占有你」，他說「你奪了我的心」：他是被吸引的那一個，不是占有的那一個。這對每一個習慣用力去爭取的人，是很好的提醒：真正的親近，不是用力搶來的，是被吸引來的。"],["p","第十節，他又說：「你的愛情何其美！你的愛情比酒更美」（歌4:10）。這句話，我們在第一章聽過，只是那時候，是她對他說；現在，是他回給她。讚美是往返的。她曾說他的愛情比酒更美，現在他說她的也是。你看，兩個人說話的方式，漸漸有了回聲。"],["d",["「我妹子，我新婦」，稱自己的妻子為妹子，是什麼意思？","在古代近東的情詩裡，「妹子」、「兄弟」常用作親暱而平等的稱呼，並不一定指血緣關係。在雅歌裡，「妹子」帶著同伴、一家人的親近感，與「新婦」一起使用，表示他們既是愛人，也是親近的夥伴。我們不需要在這個稱呼上做太多文章，也不要把它讀成別的意思。只要知道：這是一個表達親近、不帶高低的稱呼。這個詞在後面的章節還會出現，我們到時候再看，特別是第八章的「小妹」，要分開來讀。"]],["h","三、原文亮光：園、關鎖、封閉"],["p","放大看三個字。第一個是 גַּן，念 gan，「園」。這個字，是整本聖經裡很重要的一個字：伊甸園，就是「伊甸的園」。園，是一個有圍牆的、被照顧的、有果子與泉水的地方。它不是荒野，也不是野地，它是有人精心經營的美地。把一個人稱為園，是極高的讚美。"],["p","第二個字是 נָעוּל，念 na‘ul，「關鎖的」。這個字的意思是「被鎖上」，是一個被動的形式：被鎖住的。它的畫面，是一扇上了鎖的門。注意：被鎖上的，不是一個空地，而是一個珍貴的園。人會鎖的東西，都是珍貴的東西：我們不會鎖一堆垃圾，我們鎖的是家，是保險箱，是孩子。"],["p","第三個字是 חָתוּם，念 khatum，「封閉的」、「蓋了印的」。這個字描寫的是一個被封上印記的泉源：蓋了印，代表屬於某一個人，不是任何人都可以取用。「關鎖的園」，加上「封閉的泉源」，表達的是同一件事：這是珍貴的，是有主人的，是有界限的。"],["p","三個字連起來，我們得到的不是「壓抑」，而是「珍貴」。園有牆有鎖，是因為園中有果子、有香氣、有泉水。界限，不是羞恥，是福分的守護。這一點，在今天特別需要被說清楚：聖經沒有說身體是羞恥的、愛是不潔的，它說的是，因為珍貴，所以有界限。"],["p","還有一個細節。第四章第十五節，他說她是：「園中的泉，活水的井，從黎巴嫩流下來的溪水」（歌4:15）。這個畫面和前面的「封閉的泉源」放在一起，很有意思：泉是封閉的，卻是活水。封閉，不是死水；守護，不是僵硬。一個被好好守護的人，最後是流動的、滋潤別人的。"],["d",["「關鎖的園」是不是在說婚前不可以有性行為？","這一章談的是珍貴與界限，也在聖經對婚姻與性的整體教導之中，我們不否認。但是，這一段的重心，不是列規條，而是一幅畫：一座珍貴的園，有牆有鎖，鑰匙在園主人手中。如果把它只讀成「禁止」，會失去它最動人的地方：因為珍貴，所以守護。本講義的立場是把它講成福分，而不是壓抑。講的時候，次序要清楚：先看見她的珍貴，再談界限，並且特別留意曾被傷害的人，不要在這裡造成二次傷害。"]],["d",["我的園曾被人闖入，讀到「關鎖的園」我覺得自己被定罪了，怎麼辦？","請先聽這句話：那不是你的錯，你的園仍然珍貴。被闖入，不會使一座園變得不珍貴；這一章不是在評價誰「還乾不乾淨」。如果讀到這裡很痛，你可以先停下來，不必勉強讀下去。你也可以把這段經文，放在一邊，先找一位你信任的人，或專業的輔導，陪伴你整理。在小組裡，沒有人有權利追問細節，也沒有人可以要求你「要原諒」。你有權決定什麼時候說、說給誰聽。神看見你，不嫌棄你。"]],["h","四、關鎖的園，門由她自己打開"],["p","現在我們來到這一章最關鍵的幾句話。第十二節，他說：「我妹子，我新婦，乃是關鎖的園，禁閉的井，封閉的泉源」（歌4:12）。他說：你是一座關鎖的園。注意他沒有說「我要撬開你」，他說的是，你是被關鎖的，被封閉的。他承認這座園是有主人的，而且，主人是她自己。"],["p","第十三、十四節，他描寫園內的東西：石榴、鳳仙花、哪噠樹、番紅花、菖蒲、桂樹、乳香木、沒藥、沉香，與一切上等的果品。這是一個什麼都有的園。這麼多的香料與果子，是園主人精心栽培的。你可以想像：這個園中，有主人多年的心血、時間與愛。它珍貴，因為它被好好地經營。"],["p","然後，在這一章的結尾，出現了整個故事最關鍵的轉折。第十六節，是她開口了：「北風啊，興起！南風啊，吹來！吹在我的園內，使其中的香氣發出來。願我的良人進入自己園裡，吃他佳美的果子」（歌4:16）。你看，說話的是她。門，是她自己打開的。"],["p","請注意這裡的次序：關鎖，等待，她開口，他進入。這個次序，不可以顛倒。他在第四章前面所有的話，都只是讚美、邀請、等待，他沒有伸手去推那扇門。直到她自己說：「願我的良人進入」。沒有她的邀請，他不進去。這是這一章最重要的原則：同意與自由，放在最前面。"],["p","她還說了一句很溫柔的話：「進入自己園裡」。她把這座園，稱作「他的園」。那是她的園，卻因為愛，成為他可以進入的園。這不是被占有，是被給予；不是她被拿走，是她願意給。同一座園，在鎖著的時候，屬於她；在她開門的時候，成為她送給他的禮物。禮物與掠奪的差別，只在一個字：願。她願意，這座園就成為禮物；她不願意，同一座園，就是不可侵犯的地方。"],["p","這裡有一個重要的提醒，是對於曾經受過傷害的人。有人的園，曾經被闖入；有人的門，不是自己打開的。如果你是這樣的人，聽到「關鎖的園」或「守住」這些話，可能會很痛，甚至覺得自己被定罪了。讓我很清楚地對你說：那不是你的錯。你的園，仍然珍貴。被闖入，不會讓一座園變得不珍貴。"],["p","我們也要對帶領的人說：講這一章的時候，請特別補上這一句。不要講成「你要把自己守住，否則你就不乾淨」。這不是聖經的意思。請在會後單獨關心那些低頭、沉默、離席的人。如果有人向你透露他曾被傷害，請不追問細節，不要求他原諒，並協助他尋求專業的協助。"],["p","最後，我們把這一章放回全卷的脈絡。第一章她說「願他親我」，是渴；第二章，他站在牆外邀請；第三章，她夜裡尋找；第四章，她在被完整地看見之後，自己打開了門。這是一個很漂亮的次序：渴，被邀請，尋找，被看見，然後，自由地給出去。愛的最後一步，是自由的給出，而不是被取走。這也是整個福音的樣式：神的愛，從來不是搶奪，而是邀請；祂等待人自己說：「願你進來。」"],["d",["「她自己打開門」是不是說婚姻裡只要她同意就行，開門之後就沒有自由了？","不是。同意不是一次性的簽名，而是持續的、可以被尊重的自由。在婚姻裡，雙方彼此的愛，是彼此的邀請與回應，而不是一方的義務與另一方的權利。「她開門」的重點，是她有自由、她願意；而他也在整章裡展現了等待與尊重。這一章的次序，是一個原則：沒有同意，就不是愛。即使在婚姻裡，也要彼此尊重、彼此傾聽。如果你的關係中，有一方經常被迫、被威脅或被冷暴力，請找牧者或專業協助，不要獨自承擔。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：把身體的讚美，講成評論別人身體的依據。這是私下的情話，不是評分清單。檢驗標準：聽完之後，會眾是更感到被珍愛，還是更焦慮自己的身體？"],["p","第二個偏差：把「關鎖的園」講成「性是羞恥的」。聖經不說性是羞恥，園是有果子、有香氣、有泉水的美地；因為珍貴，所以有界限。檢驗標準：年輕人聽完，是覺得被守護、被看重，還是覺得被壓抑？"],["p","第三個偏差：對曾被傷害的人，講「守住」，造成二次傷害。有人的園曾被闖入，那不是他的錯。檢驗標準：曾受傷的人聽完，是被擁抱，還是被定罪？"],["p","第四個偏差：把「她自己打開門」講成「可以隨便」。重點是同意與自由，次序是關鎖、等待、她開口、他進入，不可顛倒；沒有同意，就不是這一章的愛。檢驗標準：你講的「開門」，有沒有把「同意」與「自由」放在最前面？"],["p","第五個偏差：把「離開黎巴嫩」講成「拯救」，把某些人的處境說成「被困」。經文沒有說她被困。檢驗標準：你的講法，是邀請，還是替別人的處境下結論？"],["d",["這一章可以怎麼跟青少年談身體與界限，才不會傷害也不會羞辱？","可以從三個方向開始：第一，先說珍貴，再說界限。讓孩子先聽見「你很珍貴，你的身體是你的」，再談為什麼要有界限。第二，先談同意，再談其他。教孩子說「不」，也教孩子尊重別人的「不」。第三，保持對話的門是開的：不要用羞辱或恐嚇的口氣，讓孩子在有疑問的時候，願意來問你。可以使用這一章的圖像：關鎖的園，不是壓抑，是因為裡面有珍貴的東西。若孩子曾被傷害，請不追問細節，不指責，尋求專業協助。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：華人文化裡，談身體、談愛，常常是一種沉默或羞恥。長輩不談，教會也不談，於是年輕人從網路、從同儕、從不安全的地方，學到扭曲的資訊。第四章給教會一個機會：可以用健康的方式，談被珍愛、談界限、談同意，而不是只有「不可以」。談這一章，要用一種讓人感到被守護、而不是被壓抑的語言。"],["p","第二個問題：華人社會裡，有許多沉默的受害者。他們的園曾被闖入，卻因為怕丟臉、怕被責怪，一輩子沒說。教會裡有時一句「要守住自己」，無意中把責任壓回受害者身上。這一章請我們說：那不是你的錯，你的園仍然珍貴。如果你是受害者，請找可信的牧者或專業人員；如果你是聽的人，請相信他，不追問，不要求原諒。"],["h","七、活出321——看、下、開"],["p","耶穌是我的榜樣：祂看人，是完整地看，不羞辱人，也不占有人。祂站在門外叩門，不闖進去。我學祂：看見人的時候，不挑剔；愛人的時候，等她自己開門。"],["p","聖經是我的準則：這一章的準則，是同意與自由，放在最前面。次序是：關鎖、等待、她開口、他進入。我不把「開門」講成可以隨便，也不把「守住」講成壓抑人。"],["p","聖靈是我的引導：我學習分辨：這個聲音，是邀請，還是壓力？被聖靈引導的人，不急著推開別人的門，也不因為怕受傷，永遠把自己鎖在高山上。"],["p","讓耶穌作王：王是那位求我「下來」、卻不拖我下來的主。我放下的，是替別人的心做主的權力，也放下用鎖把自己和所有人隔開的控制。"],["p","讓耶穌得著一切的榮耀：我被稱為「全然美麗」，不是因為我完美，是因為被愛的眼睛這樣看我。我若能自由地給出去，那是恩典；榮耀歸給那位使我自由的主。"],["p","建立屬神的體系：一個屬神的團體，是安全的園：有牆、有界限、有泉水；人在裡面被完整地看見，不羞愧，也不被占有。門，永遠由每個人自己打開。"],["h","八、四種心，一座園"],["p","驕傲型的心，覺得自己有權進入別人的園。他以為「我是為你好」，所以可以不問同意。驕傲，就是離開本位，抓住不屬於我的權力：替別人的門做決定。他需要學的，是站在園外，等那一句「願你進入」。"],["p","恐懼型的心，把自己鎖在黎巴嫩的高山上。他怕被看見，怕下來之後受傷，所以乾脆誰也不讓靠近。他需要聽見的，是那個「求你」：邀請的聲音，是溫柔的，不是命令。他可以慢慢地，一步一步地下來。"],["p","羞恥型的心，不相信自己「全然美麗」。他聽到讚美，只會想：他沒看到我的缺點。他需要的，是一雙看得很久、看得很全的眼睛，一直到他願意相信：我不需要遮。這需要時間，也需要陪伴。"],["p","受傷型的心，曾有人闖入他的園。他聽到「關鎖的園」，心裡是一陣痛。我們不催他開門，也不說「你要原諒」、「你要有信心」；我們先對他說：那不是你的錯，你的園仍然珍貴。然後，陪他慢慢找回自己的鑰匙。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天對鏡子說一句不帶評價的話：「我是被愛的，我不需要遮。」若說不出口，就先說：「我願意學習相信。」"],["p","第二，這週不要評論任何人的身體，包括自己的。每次想評論，就換成一句看見：「我看見你的努力。」"],["p","第三，檢查你的界限：有沒有一件事，你一直說「好」，其實心裡想說「不」？選一件，這週說出來。"],["p","第四，如果你曾被傷害，找一位可信的牧者或專業人員，說一次。不需要細節，只需要說：我需要陪伴。"],["p","第五，如果你是父母或帶領者，找一個機會，向孩子或會眾說：「你有說不的權利，你的身體是你的。」"],["p","我宣告：我是被完整看見、仍然被愛的人，我不需要遮。"],["p","我宣告：我的園是珍貴的，門由我自己打開，沒有人可以替我決定。"],["p","我宣告：我不闖入任何人的園，我學習等待，並尊重每一個人的「不」。"],["p","我宣告：我所在的家與團契，是一個安全的園，人在這裡被看見，而不被占有。"],["d",["我很難說「不」，在關係裡常被推著走，這一週可以怎麼練習？","從最小的事開始。選一件不危險、不重要的小事，例如拒絕多加一份餐點，或延後回覆一則訊息，用一句短短的話說出來：「我這次不方便。」說完不需要解釋太多。第二，寫下一個你常常勉強答應的情境，想一想，你最怕對方的什麼反應。第三，找一位安全的人，陪你練習說不。最後，記得：說不，不是不愛，也不是不屬靈。如果你的關係裡，說不會招來威脅或暴力，請立刻尋求可信的牧者或專業人員的協助，保護自己的安全。"]],["h","十、結語"],["p","雅歌第四章，是整卷書裡最容易讀偏的一章。因為它談到身體，談到園，談到進入。可是我們一路讀下來，看見的不是慾望的張揚，也不是羞恥的壓抑，而是一個安靜的次序：看見，召喚，等待，她自己開口。"],["p","這是神對人的方式。祂看見我們的全部，卻不嫌棄；祂邀請我們，卻不闖入。祂站在門外叩門，等我們自己打開。這就是愛：有力量，卻不使用力量去占有；有權柄，卻讓人自由。"],["p","所以，如果你一直被人看得很傷，我要對你說：有一種看，是安全的；你可以不再遮。如果你的園曾被闖入，我要對你說：那不是你的錯，你的園仍然珍貴。我們一起把焦點放回耶穌：不在自己的缺點，不在別人的眼光，不在過去的傷，只在那位看見我們全部、仍然說「全然美麗」的主。"],["p","讓我們禱告：親愛的主，謝謝祢用愛的眼睛看我們。求祢醫治曾被傷害的人，使他們知道，那不是他們的錯。求祢使我們每一個人，都學會尊重別人的門，也在祢面前自由地打開自己的門。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：安全的愛，讓人被完整看見也不羞愧；園有牆有鎖，是因為珍貴；門，由她自己打開。"],["n","1. ★ 用自己的話說一遍：這一章裡「看、下、開」三個動作，各是誰的動作？次序是什麼？"],["n","2. ★★ 「毫無瑕疵」不是說她沒有缺點，而是說沒有一處需要被藏起來。你有沒有一個地方，是你一直想遮的？（不必說細節）"],["n","3. ★★★ 「關鎖的園」是因為珍貴，不是因為羞恥。這個說法，對你怎麼看界限有什麼不同？"],["n","4. ★ 第十六節是她自己開口。為什麼「同意與自由」要放在最前面？"],["m","帶領提醒：這一課碰到身體、界限與曾被傷害的經驗，請放慢。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命。"],["t","【看】看見自己"],["n","5. ★★ 你比較像「躲在黎巴嫩高山上」的人、「急著進入別人園裡」的人，還是兩者都不是？舉一個例子。"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，聽那一句「我的佳偶，你全然美麗」。你心裡第一個反應是什麼？（不必說出來也可以）"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你不敢被人完整地看見？是怕被評價、怕被利用，還是過去的傷？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，其中一人說：「我很難說不，因為……」；另一人只回答：「謝謝你告訴我，你有說不的權利。」"],["t","【行】走一步"],["n","9. ★★ 這一週，你要在哪一件事上，說出一個「不」，或尊重一個人的「不」？寫下時間與對象。"],["m","帶領提醒：這一化可能有人曾被傷害、被闖入。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課帶進本週的生活：界限、同意、操練 920、把這一課傳出去。"],["n","10. ★★ 在你的家庭或團契裡，有沒有一個地方，讓人覺得「不能說不」？你可以先改變哪一件小事？"],["n","11. ★★★ 920 操練：找出那一位你一直想替他做決定的「2」，現場說出他的名字，並說這週你要用哪一種聖靈的果子，代替替他做主。"],["n","12. ★★ 如果你帶小組或帶孩子，你要怎麼談「被珍愛」與「界限」，才不會讓人羞愧？你的第一句話會是什麼？"],["n","13. ★ 有沒有一位你認識的人，可能曾被傷害，需要被陪伴？你可以用什麼方式，在不追問的前提下，讓他知道你在？"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說「被完整看見也不羞愧」，第二句說「因為珍貴所以有界限」，第三句說「門由她自己打開」。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，求你讓我的弟兄（姊妹）知道，他是被完整看見、仍然被愛的人；求你醫治他曾受的傷。」然後彼此說：「你的園，是珍貴的。」最後，由一位帶領者簡短禱告結束。"]]},"5":{"no":5,"vol":"《321雅歌講義》第5課·雅歌第5章","title":"遲了一步的門——敲、遲、傷","chars":4843,"min":60,"deep":8,"dchars":1462,"tchars":23,"blocks":[["h","一、先回應了，園就成為他的"],["p","弟兄姊妹平安。門鈴響了。你剛洗完澡，頭髮還滴著水，身上的衣服也還沒穿好。你猶豫了三秒：現在去開門嗎？要不要先換件衣服？等你終於走到門口，把門打開，門外已經沒有人了，只有走廊上還留著一點人走過去的聲音。你站在那裡，手握著門把，心裡有一點說不出來的空。今天的經文，就是這樣的一扇門。"],["p","我們先回到第四章的結尾。她開口說話了：「願我的良人進入自己園裡」。那是一個自由的邀請，是園主人親手打開的門。第五章一開頭，良人回答了：「我妹子，我新婦，我進了我的園中，採了我的沒藥和香料」（歌5:1）。他說「我進了」。你看，他是在被邀請之後，才進去的。"],["p","這一節的第一句，我們不要讀快。「我進了我的園中」，園是「我的」，因為她在上一章，把園稱作「他的」。她給了，他收了，這座園就成為彼此的園。這裡沒有占有的口氣，沒有搶奪的味道，只有一個被邀請之後的回應。愛，從自由的給予開始，也從感謝的接受繼續。"],["p","接著，經文出現了一個聲音，沒有指名是誰：「我的朋友們，請吃！我所親愛的，請喝，且多多地喝」（歌5:1）。有人說這是良人對賓客說的話，有人說是詩人的一句宴席祝福。我們不爭論說話者，只看氣氛：滿滿的豐盛，滿滿的歡喜。這是整卷雅歌，到目前為止最圓滿的一個畫面。"],["p","圓滿之後，通常就是故事的結束。可是聖經沒有在這裡停下來。它接著寫下一個夜晚，一次遲疑，一扇太慢打開的門。這是雅歌誠實的地方。它不假裝歡宴之後，人就永遠被歡宴托著；它知道，最圓滿的畫面之後，也可能是最真實的失落。這也是為什麼，這本書可以放在聖經裡：它不是一本只有歡喜的書，它是一本誠實的書。誠實的書，才可以陪人走過一整段人生。"],["d",["「我進了我的園中」，是不是說他已經占有了她？","不是。要看這一節與第四章結尾的關係。第四章第十六節，是她自己開口：「願我的良人進入自己園裡」。第五章第一節的「我進了我的園中」，是對這個邀請的回應。次序是：她邀請，他進入。這裡沒有占有，只有一個被邀請之後的回應。園是「我的」，因為她把園稱為「他的」；她把它給了，他接受了，從此成為彼此的園。這一幅畫面告訴我們：愛，是自由的給予與感謝的接受，不是掠奪。這對今天的夫妻關係，也是很好的提醒：同意，是愛的語言，不是障礙。"]],["h","二、我身睡臥，我心卻醒"],["p","第二節，她說：「我身睡臥，我心卻醒」（歌5:2）。這句話，說的是一個很熟悉的狀態：身體累了，睡著了；可是心裡面，有一個地方，還亮著。你有沒有這樣的經驗？明明很累，卻總覺得有人在叫你；明明躺在床上，卻知道有一個重要的事情，等著你起來。"],["p","然後，她聽見了：「這是我良人的聲音；他敲門說」。他敲門，他說話，而他說的話，全是稱呼：「我的妹子，我的佳偶，我的鴿子，我的完全人」（歌5:2）。四個稱呼，一個比一個親。他站在門外，一開口，先叫她的名字。他說：「求你給我開門」（歌5:2）。又是「求你」。他沒有拍門，沒有破門，他求。"],["p","他還給了一個理由：「因我的頭滿了露水，我的頭髮被夜露滴濕」（歌5:2）。他說，我在外面，夜很深，我濕了。這是一個很柔軟的理由，不是命令，是說明：我在這裡，我在等，我需要你。一個站在雨夜門外的人，不用說大道理，只要說「我濕了」。"],["p","她怎麼回應？第三節：「我脫了衣裳，怎能再穿上呢？我洗了腳，怎能再玷污呢？」（歌5:3）她的回答，聽起來很小：我已經脫了衣服，要再穿上很麻煩；我已經洗了腳，不想再弄髒。這是一個很真實、很家常的理由。你看，她不是拒絕他，她只是覺得不方便。而最危險的拒絕，往往就是這種不叫做拒絕的拒絕：我沒有說不，我只是說，等一下。等一下，常常就是門外的人，轉身離開的時間。"],["p","很多時候，我們錯過神，不是因為我們拒絕了祂，而是因為我們覺得「現在不太方便」。禱告的時間到了，可是我剛坐下來；服事的邀請來了，可是我今天特別累；有人需要我打電話，可是已經很晚了。這些理由都很小、很合理，但是，門鈴響的時候，我們慢了一步。"],["p","這裡，我們要特別小心，不要責備她。經文沒有說「她不夠愛他」，沒有定她的罪。經文只是如實地記下：一個很小的、很真實的遲疑。聖經對人的軟弱，是溫柔的。它沒有因為她遲了一步，就把她放進「失敗者」的名單；它只是說：這是真的，這種事會發生。"],["p","第四節，他的手從門孔裡伸進來：「我的良人從門孔裡伸進手來，我便因他動了心」（歌5:4）。他沒有破門，只是伸進一隻手。這個動作，讓她心動了。第五節，她起來開門，兩手滴下沒藥，指頭的沒藥汁，滴在門閂上：「我起來，要給我良人開門」（歌5:5）。她動了，她來了，她手上是香的。有人讀到這裡，會注意到：她雖然遲了，卻沒有放棄；她雖然慢，卻終於起身。這是一個很重要的細節：起身，永遠不嫌晚。就算最後還是遲了，這個起身，是愛的證明。"],["d",["她說「我脫了衣裳，怎能再穿上」，是藉口，還是真的有理由？","經文沒有定她的罪，也沒有替她辯護，它只是如實記下。從字面上看，這是一個很家常、很小的理由：衣服已經脫了，腳已經洗了，不想再弄髒。這類理由，我們今天也常說：現在不太方便，我剛坐下，等一下再說。這些理由本身不一定是錯的，只是，有時候，它讓我們慢了一步。讀這一段，最好的反應不是責備自己，而是承認：我也這樣。承認之後，不是更自責，而是更快一點起來開門，因為門外那位，始終是愛你的。"]],["d",["良人轉身走了，是不是在懲罰她的遲疑？","經文沒有這樣說。原文的動詞「轉身」，帶著一個安靜的口氣，不是憤怒的甩門，也沒有責備的話。本講義的立場，是不把它講成懲罰，也不定她的罪。更重要的是，這一章要和第六章對讀：第六章第二、三節，她說「我的良人下入自己園中」，又說「我屬我的良人，我的良人也屬我」。他沒有離開，他在園裡。所以，遲了一步，是真實的失落，但不是被拋棄；遲了一步的人，需要的是安慰，不是責備。這也是我們彼此對待的方式：看見別人遲了，先給安慰。"]],["h","三、原文亮光：醒、敲、轉身"],["p","放大看三個字。第一個是 עֵר，念 ‘er，「醒著」。「我身睡臥，我心卻醒」，原文把「睡」與「醒」並列：身體是睡著的，心是醒著的。這個「醒」，不是勉強撐著不睡，而是一個有覺察的狀態。她的心，是一個還在聽的心。真正的屬靈敏銳，不是身體不累，而是心還醒著。"],["p","第二個字是 דוֹפֵק，念 dofeq，「敲」。這是一個分詞，表示一個持續的動作：他正在敲。不是敲一下就走，是敲著、等著。這和啟示錄裡那位站在門外敲門的畫面，聽起來很相似；我們不說「這就是預言」，我們只說：這使我們想起，神也是一位肯站在門外、持續敲著的主。"],["p","第三個字是 חָמַק，念 khamaq，「轉身」、「退去」。第六節說：「我的良人卻已轉身走了」。這個字的畫面，是一個人轉過身去，離開。注意它的口氣：不是憤怒的甩門而去，也不是懲罰性的離開，它是一個很安靜的、平常的轉身。他沒有責備她，他只是走了。"],["p","三個字連起來，是一個很真實的順序：心醒著；他敲著；轉身了。心醒著，是她的愛；敲著，是他的愛；轉身，是遲了一步的結果。這三個字合起來告訴我們：兩個人都是愛著對方的，可是時間沒有對上。有時候，我們錯過的，不是因為不愛，而是因為遲了一步。你可以把這三個字，當成一個很小的自我檢查：今天，我的心是醒著的嗎？我有沒有聽見敲門的聲音？如果我遲了，我願意起來嗎？"],["d",["5:7 說她被看守的人打傷，這是神的管教嗎？","不是。經文沒有一個字說她有錯，也沒有說這是神的管教或磨練。看守的人，本來是保護者，卻傷害了她，這是失職，是暴力。把暴力說成「神要你學習功課」，是一種很傷人的講法。我們要說得很清楚：被打的人沒有錯，暴力不是神的管教。如果你曾聽過這樣的說法，請把它放下。神的話把這一節留在這裡，是在如實地說：這件事真實地發生了。如果你正處在危險中，請聯絡當地的緊急電話，並尋求可信的人與專業的協助。"]],["d",["我曾受過傷害，讀到 5:7 很想關掉，我可以不讀嗎？","可以。你不必勉強自己讀完這一段，也不必立刻有什麼感受。你可以先把它放在一邊，等你準備好了，再回來；或者，由一位你信任的人陪你一起讀。在小組裡，沒有人有權利追問你的細節，沒有人可以要求你公開說出來，也沒有人可以說「你要原諒」。如果這段經文勾起很強烈的情緒，請找可信的牧者或專業的輔導，慢慢整理。你的感受是真的，你的節奏，由你決定，而神的愛不會因為你讀得慢而減少。"]],["h","四、被打傷的夜，與她想說的話"],["p","第六節是這一章最痛的一個轉折：「我給我的良人開了門；我的良人卻已轉身走了」（歌5:6）。她終於開了門，門外已經沒有人。我們把這一節停在這裡，停一下。她的手上還有沒藥的香氣，她的心還熱著，而門外只有夜。這種遲了一步，沒有什麼可以替代。"],["p","接下來，經文如實記錄：「我尋找他，竟尋不見；我呼叫他，他卻不回答」（歌5:6）。這句話，和第三章第一節很像，但是更痛。第三章，她尋找，卻尋不見，最後遇見了；這裡，她尋找，也呼叫，卻沒有回答。我們不要急著替這個沉默找答案。聖經讓它如實地存在。很多人讀到這裡，會想趕快翻到下一頁，看看有沒有好消息。可是這一節邀請我們，先在這裡停一停，和她一起，站在沒有回答的夜裡。能夠和一個人一起沉默，是很深的陪伴。"],["p","然後，第七節，出現了整卷雅歌最難讀的一句話：「城中巡邏看守的人遇見我，打了我，傷了我；看守城牆的人奪去我的披肩」（歌5:7）。這是暴力。這不是比喻，我們要正視它的字面意思：她在夜裡，在城中，被本來應該保護她的人打了、傷了，連披肩也被奪走了。披肩，是遮蔽，是尊嚴；被奪走的，不只是衣服，還有她站在人前的體面。傷害，不只是身體上的，也是尊嚴上的。"],["p","讓我們把這一節，說得很清楚。第一，被打的人沒有錯。經文沒有一個字說她有錯。第二，這不是神的管教，也不是磨練。把暴力說成「神要你學習功課」，是在傷害受傷的人。第三，看守的人是失職的保護者。他們應該保護，卻傷害了。這是一個應該被指出的錯，不是一個應該被忍受的「試煉」。"],["p","如果你的生命裡，曾經有人以保護的名義傷害你，或者，曾有人在最需要保護的時候，沒有保護你，我想對你說：聖經看見了。聖經沒有把它寫成理所當然，沒有說「這沒什麼」。它把這一節留在神的話裡，是在說：這是真的，這件事發生了，它是傷害。"],["p","對帶領的人，我想請你特別留意。講到這一節，不要追問細節，不要叫人公開再說一次。不要說「要原諒」，不要說「這是試煉」。會後，單獨關心有可能被觸動的人，協助他尋求保護與專業的幫助；如果有立即的危險，請聯絡當地的緊急電話。這一節不是講道的高潮，而是需要溫柔對待的傷口。"],["p","第八節，她對眾女子說：「若遇見我的良人，要告訴他，我因思愛成病」（歌5:8）。在被傷害之後，她最想說的，仍然是她的愛。這不是要求所有受傷的人，都必須這樣說；這是她在那一刻想說的話。有的人在受傷之後，想說的是憤怒，有的人想說的是沉默，這些都是真實的。"],["p","這一節還有一個值得注意的地方：她把話託付給別人。「若遇見他，要告訴他」。她受傷了，走不動，所以她請別人幫她傳話。你看，在最痛的夜裡，她沒有一個人硬撐，她開口，請求幫忙。這是一種勇氣：在受傷的時候，找人。"],["p","眾女子聽了，反問她一個問題：「你的良人比別人的良人有何強處」（歌5:9）。這個問題，聽起來有一點尖銳：他值得你這樣嗎？他有什麼特別？每一個在受傷之後仍然愛著的人，都聽過類似的話。你為什麼還要找他？他有什麼好？這是一個很真實的問題。"],["p","她的回答，沒有辯論，沒有比較。她用描述：「我的良人白而且紅，超乎萬人之上」（歌5:10）。然後，她從頭到腳，一樣一樣地說：他的頭、眼、兩腮、嘴唇、手、身體、腿。這是第四章良人讚美她的回聲：她也用同樣細緻的眼睛，看他。被愛的人，也學會了愛的看見。"],["p","最後，她用一句很安靜的話，結束這一長串描述：「他的口極其甘甜；他全然可愛。耶路撒冷的眾女子啊，這是我的良人；這是我的朋友」（歌5:16）。「我的良人，我的朋友」，兩個稱呼並排。他是愛人，也是朋友。在最痛的夜之後，她對他最後的話，不是控訴，而是這句：這是我的朋友。"],["d",["眾女子問「你的良人比別人的良人有何強處」，我怎麼回答不信的朋友？","她沒有用辯論回答，她用描述。從第十節開始，她一項一項地說：他是怎樣的人。這給我們一個很好的示範：見證，從「祂是怎樣的人」開始，而不是從「你應該信」開始。你不需要用比較去證明祂比別人好，也不需要打一場辯論。你只要說：我認識的祂是這樣。然後說一件具體的事：在你最難的時候，祂怎樣陪過你。說完，不必逼對方有什麼反應。你的責任是說，不是說服；剩下的，交給聖靈。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：把 5:7 講成「磨練」、「管教」，或「她該受」。經文沒有一個字說她有錯，看守人是失職的保護者。檢驗標準：若在座有被傷害的人，他聽完是否仍然相信「這不是我的錯」？"],["p","第二個偏差：用 5:8 要求受傷的人「不抱怨」或「趕快原諒」。她說的是那一刻她想說的話，不是對所有受傷者的規定。檢驗標準：講完之後，受傷的人是有空間說出自己的感受，還是被要求趕快沒事？"],["p","第三個偏差：在講台上追問細節，或要求人公開分享。帶領者要避免追問，也不要求人在眾人面前再說一次。檢驗標準：你有沒有給受傷的人「不必說」的自由？"],["p","第四個偏差：責備她的遲疑，說「她不夠愛他」。她的理由很小，很真實，經文如實記下，沒有定罪。檢驗標準：會眾聽完，是更自責，還是更確信那一位的手仍在門孔裡？"],["p","第五個偏差：把「呼叫沒有回答」講成「神離開了」。詩篇裡有許多這樣的呼求，也是信心的語言；這一章要與下一章對讀。檢驗標準：講完之後，會眾是更敢禱告，還是更不敢說真話？"],["d",["她在被打之後說「請告訴他，我因思愛成病」，是不是說受傷的人應該不抱怨？","不是。這是她那一刻想說的話，不是對所有受傷者的規定。有的人在受傷之後，最想說的是愛；有的人想說的是憤怒；有的人什麼都說不出來。這些都是真實的。我們不可以把第八節，變成「你不可以憤怒」或「你要趕快沒事」。更好的讀法是：受傷的人，有權利用自己的語言說話；聽的人，不要替他決定他應該說什麼。帶領的人要特別留意：不要用這一節，去堵住受傷者的嘴，也不要用它來替任何傷害找藉口。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：華人社會裡，有許多人受了傷，卻沒有地方說。因為怕家醜外揚，怕被說成「想太多」，怕被要求「你要原諒」。有時候，教會也不知不覺成為壓住聲音的地方。第五章第七節告訴我們：聖經沒有壓住這個聲音。它把「被打傷」寫了下來。你可以說出來，也可以不說，這是你的自由；但是，你不是在自己想像。"],["p","第二個問題：華人信徒常常有一個隱藏的想法：「我若遲了一步，我就失去了。」錯過一次的禱告，錯過一次的服事，錯過一個機會，就覺得神已經離開了。第五章讓我們看見：遲了一步，是真的；但是，這不是最後一扇門。到第六章，我們會看見，他沒有離開，他在園裡。遲了一步的人，需要的是安慰，不是責備。"],["h","七、活出321——敲、遲、傷"],["p","耶穌是我的榜樣：祂站在門外，等人開門，祂也在人受傷的地方陪伴人。祂不責備遲來的人，也不要求受傷的人假裝沒事。我學祂：先陪伴，後談道理。"],["p","聖經是我的準則：這一章的準則，是誠實地讀每一句，不繞開 5:7。聖經沒有說她有錯，我就不說；聖經如實地記下暴力，我就正視它。"],["p","聖靈是我的引導：在遲了一步的夜裡，我不靠自責，我靠被安慰。聖靈是保惠師，祂不是責備我的靈，祂在我最痛的地方，陪我。祂也引導我在有人受傷的時候，閉上嘴，先陪伴。"],["p","讓耶穌作王：我放下的，是「我必須完美地回應」的權力。王不是要我永遠不遲到，王是在我遲到的時候，仍然沒有離開。我也放下替受傷的人解釋「為什麼」的權力。"],["p","讓耶穌得著一切的榮耀：我沒有因為遲疑而被拋棄，不是因為我夠好，是因為他夠信實。我若在傷害裡仍然站得住，那是恩典；一切的榮耀歸給那位不離棄我的主。"],["p","建立屬神的體系：一個屬神的團體，是受傷的人可以說「我被傷害了」而不被責備的地方。我們不替傷害找藉口，我們不追問細節，我們陪伴，也協助他找到保護與專業的幫助。"],["h","八、四種心，一扇門"],["p","驕傲型的心，不能接受自己遲了一步。他一定要有一個理由：不是我慢，是你沒有講清楚。驕傲，就是離開本位，不肯承認自己是有限的人。他需要學習的，是很簡單的一句話：我遲了，我很抱歉，我現在來了。"],["p","恐懼型的心，一次錯過，就怕再也不敢開門。他把「遲了一步」翻成「我永遠不夠格」。他需要的，是知道門不只有一次；愛的人，會再來。他也需要一個很小的開始：這一次，我先開一條縫。"],["p","羞恥型的心，把被傷害，當成是自己的錯。他聽到「看守的人打傷她」，心裡想的卻是：一定是我哪裡做錯了。他需要聽見很清楚的一句話：被打的人沒有錯。這句話，要說很多遍，直到他相信。"],["p","受傷型的心，就是那個被看守人打傷的人。他聽到這一節，可能很想關掉，可能很憤怒，也可能一句話都說不出來。我們都不要催他。不要求他原諒，也不要叫他再說一次；先讓他知道：我們看見了，你不是一個人。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這週找一件你「遲了一步」的事，不要自責，只對主說：「主，我遲了，我現在來了。」"],["p","第二，如果有人向你說出他的傷，請你只做兩件事：聽，與陪。不追問，不評論，不說「你要原諒」。"],["p","第三，如果你是受傷的人，這週找一位你信任的人，或專業的輔導，說一次。不必全部，只需要說一句：「我需要被陪伴。」"],["p","第四，如果有人問你「你的神有什麼好」，這週試著只回答一句：「我認識的祂是這樣。」說完不必辯。"],["p","第五，為一位「遲了一步」的朋友，寫一張卡片：「你遲了，我還在。」這週送出去。"],["p","我宣告：遲了一步的門，不是最後一扇門；主沒有離開我。"],["p","我宣告：被傷害的人沒有錯，我不會把暴力說成管教，也不會把受傷的人推回沉默。"],["p","我宣告：我可以誠實地呼叫，我的呼求不是不信，是愛。"],["p","我宣告：我所在的家與團契，是受傷的人可以安全說話的地方。"],["d",["我遲了一步，錯過了某個機會（或某個人），這一週可以做什麼？","先停止自責，因為自責不能把時間拿回來。第一步，對主誠實地說一句話：「主，我遲了，我現在來了。」第二步，如果對象是人，可以主動做一件小事：一通電話、一封簡短的訊息，說：「我之前沒有回應你，我想你。」不要一次說太多，也不要要求對方立刻原諒。第三步，把這件事放在手上一個星期，不再反覆咀嚼。如果錯過的是一個無法挽回的人或事，也請找可信的人，陪你把這份失落說出來。"]],["h","十、結語"],["p","雅歌第五章，是整卷書中最痛的一章。它寫了一次遲疑，一個錯過，一個夜裡的呼叫，和一頓暴力。它沒有急著給答案，也沒有急著安慰。它只是把這個夜，如實地寫在神的話裡。"],["p","這是神對受傷者的態度。祂沒有說「你不該受傷」的那一句空話，祂也沒有說「這是你該學的功課」。祂把你的夜，收在祂的話裡，說：我看見了。這是一個很重要的開始：先被看見，才有可能被醫治。"],["p","所以，如果你正在一個遲了一步的夜裡，我要對你說：你的門，不是最後一扇。如果你曾被傷害，我要對你說：那不是你的錯。我們一起把焦點放回耶穌：不在自己遲了多少，不在別人的批評，不在環境的黑暗，只在那位在門外敲著、也在傷處陪伴的主。"],["p","讓我們禱告：親愛的主，謝謝祢沒有因為我們遲了一步，就離開我們。求祢醫治每一個被傷害的人，讓他們知道，那不是他們的錯。求祢使我們成為安全的人，陪伴受傷的人，而不是追問他們。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：遲了一步的門不是最後一扇；被打傷的人沒有錯；先被看見，才有醫治。"],["n","1. ★ 用自己的話說一遍：這一章裡「敲、遲、傷」三件事，各發生在哪一節？"],["n","2. ★★ 她說「我身睡臥，我心卻醒」。你有沒有過「身體累了，心卻醒著」的時候？那時候，你聽見了什麼？"],["n","3. ★★★ 經文如實記下她遲了一步，沒有定罪。這對你怎麼看自己的「遲疑」，有什麼不同？"],["n","4. ★ 5:7 說被打傷的人沒有錯，暴力不是神的管教。為什麼這一點要說得這麼清楚？"],["m","帶領提醒：這一課碰到暴力與受傷的經驗，請放慢。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助；若有立即危險，請聯絡當地緊急電話。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命。"],["t","【看】看見自己"],["n","5. ★★ 你最近有沒有「遲了一步」的事？是遲了一個回應、一個道歉，還是一次禱告？"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，聽這一句：「我的妹子，我的佳偶，我的鴿子，我的完全人，求你給我開門。」你心裡有什麼反應？"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你覺得「遲了就完了」？這個想法，是從哪裡來的？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，其中一人說：「我遲了，因為……」；另一人只回答：「謝謝你告訴我，我還在。」"],["t","【行】走一步"],["n","9. ★★ 這一週，你要對誰說一句「我遲了，我現在來了」？寫下名字與時間。"],["m","帶領提醒：這一化可能有人曾被傷害。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助；若有立即危險，請聯絡當地緊急電話。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課帶進本週的生活：陪伴受傷的人、不責備遲疑、操練 920、把這一課傳出去。"],["n","10. ★★ 你的家庭或團契裡，有沒有一個地方，讓受傷的人覺得「不能說」？你可以先改變哪一件小事？"],["n","11. ★★★ 920 操練：找出那一位正在「遲了一步」或受傷的「2」，現場說出他的名字，並說這週你要用哪一種聖靈的果子陪伴他。"],["n","12. ★★ 如果有人在小組裡說出他曾被傷害，你的第一句話會是什麼？哪三句話，是你不會說的？"],["n","13. ★ 如果有朋友問你「你的神有什麼好」，你會用哪一句話開始描述祂？寫下來。"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說「遲了一步的門不是最後一扇」，第二句說「被打傷的人沒有錯」，第三句說「祂沒有離開」。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助；若有立即危險，請聯絡當地緊急電話。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，求你陪伴我的弟兄（姊妹）在遲了一步的夜裡；求你醫治他曾受的傷。」然後彼此說：「我看見你，你不是一個人。」最後，由一位帶領者簡短禱告結束。"]]},"6":{"no":6,"vol":"《321雅歌講義》第6課·雅歌第6章","title":"屬於，也被看見——同行、獨一、被看","chars":4862,"min":60,"deep":8,"dchars":1473,"tchars":23,"blocks":[["h","一、說出需要，就有人與你同去"],["p","弟兄姊妹平安。「你還好嗎？」「還好啦。」這樣的對話，我們一天不知道會說多少次。說的人，其實不太好；問的人，其實也不太指望聽到真話。兩個人客氣地點點頭，就各自走開了。可是你有沒有發現，只要有一個人，多問了一句：「真的嗎？」整個對話，就改變了。今天的經文，是從一句多問的話開始的。"],["p","第五章結束的時候，她剛剛說完她的良人。她從頭到腳，一樣一樣地描繪他，最後說：這是我的良人，這是我的朋友。眾女子聽完，回應她了。第六章的第一節：「你的良人往何處去了…我們好與你同去尋找他」（歌6:1）。你看，她們的話，從「你的良人比別人有何強處」，變成了「我們好與你同去」。"],["p","這是一個很美的轉變。第五章的末了，眾女子的問題，帶著一點質疑：他有什麼好？她用了一整段話，描述他是怎樣的人。她們聽了，不再質疑，改為陪同：我們與你一起去找。你看，真實的見證，有一個果子：它使旁邊的人，從旁觀者，成為同行者。"],["p","還有一個細節：她們說「你這女子中極美麗的」。這個稱呼，是第一章良人叫她的稱呼，如今從眾女子的口中說出來。她被良人這樣稱呼過，現在別人也這樣稱呼她。愛，有一個傳染的作用：被好好叫過名字的人，會讓周圍的人，也學會好好叫她的名字。"],["p","這一節對我們有一個很實際的提醒：說出需要，就會有人走近。在第五章，她受了傷，她向眾女子開口託付：「若遇見我的良人，要告訴他」。她開口了，所以眾女子才有機會說：我們與你同去。如果她一直把話吞在肚子裡，這句話就不會出現。很多時候，不是沒有人願意同行，而是我們沒有說出口。說出口，需要一點勇氣；可是我們一旦說了，往往發現，旁邊早就有人，在等著這一句話。"],["p","接著，第二節，她回答了，而這個回答很特別：「我的良人下入自己園中，到香花畦，在園內牧放群羊」（歌6:2）。你看，她知道他在哪裡。她剛剛才說「尋不見」，現在，她卻說得清清楚楚：他在他的園中，在香花畦，在牧放群羊。她不是不知道，她是在說出口之後，才發現她知道。"],["p","這是很多人的經驗。我們說「我找不到神」，可是，在別人的陪伴與詢問之下，慢慢發現，原來我知道祂在哪裡：祂在祂的園中，在祂的話語裡，在祂的羊群裡。找不到的時候，常常不是真的不知道，而是心太亂，需要有人在旁邊，陪我靜下來。"],["p","第三節，是這一章的中心：「我屬我的良人，我的良人也屬我；他在百合花中牧放群羊」（歌6:3）。這句話，在第二章第十六節出現過，那時候是「良人屬我，我也屬他」。你有沒有注意到次序換了？第二章，先說「良人屬我」；第六章，先說「我屬我的良人」。這一個小小的調換，說明了一個成熟的過程。"],["d",["眾女子為什麼願意和她一起去找？她們是誰？","「耶路撒冷的眾女子」，在雅歌裡，像是一個旁邊的見證者，也像是一個回應的群體。她們在第一章被她傾訴，在第五章被她託付，到了第六章，她們說：我們與你同去。經文沒有告訴我們她們的身分，我們也不需要猜。重要的是這個轉變：當她開口說出需要，並且描述她所愛的人是怎樣的人，旁邊的人就從質疑，變成了同行。這給我們一個很實際的提醒：你說出口，教會才有機會成為教會。"]],["h","二、「屬」是歸屬，不是擁有"],["p","第二章的時候，她剛剛被愛，剛剛被看見，所以她最先說的是：他是我的。那是新鮮的歡喜，也帶一點占有的口氣：這個人，屬於我。經歷了第三章的尋找，第五章的失落與傷痛之後，到了第六章，她說的次序變了：我屬他。先說自己的歸屬，再說他的歸屬。我們可以把這看成一個靈命的記號：愛神的人，一開始常常先數算「神為我做了什麼」；走過一些夜晚之後，才學會先說「我是祢的」。"],["p","這不是一個小小的文字遊戲，而是一個生命成熟的記號。愛，一開始常常是想擁有；走過一些夜晚，才知道愛是歸屬。擁有，是「你是我的，所以你要聽我的」；歸屬，是「我屬於你，也歡喜你屬於我，我們彼此歸向對方」。擁有，把人抓緊；歸屬，把人放在愛裡。"],["p","更重要的是這一句的處境。她說這句話的時候，是在他不在眼前的時候。他轉身走了，她找不到，她被打傷了。在這樣的時候，她仍然說：我屬我的良人。歸屬，不是在一切順利時才成立的宣告，而是在找不到的時候，仍然成立的事實。你的歸屬，不是靠你每一天的感覺來維持的。感覺會起伏，歸屬卻是事實；你可以在感覺很差的日子裡，仍然對主說：我是你的。"],["p","這裡有一個重要的提醒：「你是我的」這句話，不可以拿來限制別人的自由。有人用「你是我的」去控制配偶，用「你是我的孩子」去控制子女，甚至用「你是我們教會的人」去控制會友。雅歌的「屬」，是相互的，是自願的，是在愛中的歸屬，不是一方對另一方的擁有。"],["p","接著，第四節，良人開口了：「你美麗如得撒，秀美如耶路撒冷，威武如展開旌旗的軍隊」（歌6:4）。得撒，是北方的一座美麗的城；耶路撒冷，是首都，是最美的城。他把她比作兩座城，又比作一支舉著旌旗的軍隊。他說的是：你有美麗，也有威嚴；你有溫柔，也有力量。"],["p","然後，他說了一句讓很多人停下來的話：「求你掉轉眼目不看我，因你的眼目使我驚亂」（歌6:5）。這是責備嗎？不是。這是一個男人，被愛人的眼睛，弄得心神不定。「驚亂」這個詞，是被吸引到無法自持的意思。這是一句很甜的抱怨：你這樣看我，我受不了。"],["p","再往下，第五到第七節，他重複了第四章的讚美：頭髮、牙齒、兩太陽。這些話，幾乎一字不改。有人覺得重複很奇怪，可是，愛的人是會重複的。他重新說一遍，不是沒有新話可說，而是在說：我對你的看法，沒有變。經過了夜裡的遲疑，經過了傷痛，我看你，還是這樣看。"],["d",["2:16 和 6:3 的「屬」，為什麼次序顛倒了？有什麼意義？","第二章第十六節，是「良人屬我，我也屬他」；第六章第三節，是「我屬我的良人，我的良人也屬我」。這個次序的轉換，原文也是如此。我們可以把它讀成一個成熟的過程：新鮮的愛，容易先說「他是我的」；走過夜晚與傷痛之後，更成熟的愛，先說「我是他的」。這不是一個需要證明的教義，而是一個值得留意的細節。無論怎麼讀，這個「屬」，是相互的歸屬，不是一方對另一方的擁有；你若曾被「你是我的」這句話傷過，可以慢慢把它換成「我們彼此屬於」。"]],["d",["「你的眼目使我驚亂」是責備還是讚美？","是讚美。這是一個男人，被愛人的眼睛所吸引，到無法自持的地步，所以說「求你掉轉眼目」。原文的動詞，有「使我心神不寧」、「使我震動」的意味。這是一句甜蜜的抱怨：你這樣看我，我受不了。我們不需要把它讀成責備，也不需要把它屬靈化。它只是告訴我們：愛的眼睛，有力量。在愛裡，被看的人，也會看人；看的人，也會被看所觸動。讀這一句，微笑就夠了；不必每一句經文，都要立刻挖出一個大道理。"]],["h","三、原文亮光：只有一個、旌旗、回來"],["p","放大看三個字。第一個是 אַחַת，念 akhat，「一」、「獨一」。第九節：「只有這一個是她母親獨生的」。這個字，就是數字「一」的陰性形。在這裡，它不是在說「第一名」，而是在說「唯一的」：不是比較之後的最好，而是無法比較的獨一。"],["p","這個區別很重要。「第一名」是比較出來的，有人在你上面，有人在你下面，隨時可能被超越。「唯一」是不需要比較的：這個人，只有這一個，沒有第二個。被當作第一名，會緊張；被當作唯一，才能放鬆。你在神的眼中，不是第一名，你是唯一。這個差別，足以改變一個人的一生：一個總在爭第一的人，總是累；一個知道自己是唯一的人，可以安靜。"],["p","第二個字是 נִדְגָּלוֹת，念 nidgalot，「旌旗」，是「展開旗幟」的意思。這個字的字根，和第二章第四節的「旗」，是同一個字根：那時候，是「以愛為旗在我以上」；現在，是「威武如展開旌旗的軍隊」。從第二章被愛的旗，到第六章展開的旗，這個字，把兩章接在一起。"],["p","第三個字是 שׁוּב，念 shuv，「回來」。第十三節，眾人說：「回來，回來，書拉密女」。這個字，是舊約裡很重要的一個動詞，常常用來說「悔改」、「歸回」。但是在這裡，它是一個很單純的呼喚：回來，讓我們看看你。它帶著思念，不帶任何責備。"],["p","三個字連起來：獨一，旌旗，回來。你是唯一的，不需要與別人比較；你有一面愛的旗，在你以上；而當你走遠的時候，有一個聲音在說：回來。這三個字，把這一章的三個主題接在一起：不比較的愛，歸屬的愛，呼喚的愛。"],["d",["六十王后八十妃嬪，是不是在贊同多妻？我們可以羨慕王宮嗎？","不是。這一段的重點，不在於王宮的數字，而在「只有這一個」。數字，是詩歌的誇張，是為了烘托她的獨一。聖經在創造的起初，是一男一女成為一體，我們不借這一段，為任何形式的不忠實找藉口，也不要因為讀了這一段，而羨慕王宮的排場。更好的讀法是：在眾多選擇中，仍然說「就是你」，這就是愛的專一。專一，不是因為沒有別的選擇，而是在有選擇的時候，仍然選你。每一對夫妻，都可以在日常中，重新說一次這句話。"]],["d",["「只有這一個」是不是說我必須是最特別的才算被愛？我為什麼總覺得自己不夠特別？","不是。「只有這一個」，原文的意思是「唯一」，不是「第一名」。第一名是比較出來的，有人在上，有人在下；唯一，是不需要比較的：你是你，沒有第二個。你不需要成為最特別的、最優秀的、最有恩賜的，才被愛；被愛，不是因為你特別，而是因為愛你的那位，這樣看你。如果你一直覺得自己不夠特別，可以每天對自己說一句：「在愛我的眼中，我是唯一，不是第幾名。」慢慢地，這句話會變成真的。也請你把這句話，說給別人聽，因為他也一樣需要。"]],["h","四、只有這一個，與被看的人有權問"],["p","現在我們來到第八節，一段看起來很奇怪的話：「有六十王后八十妃嬪，並有無數的童女」（歌6:8）。王宮裡，有這麼多的女子。有人會問：這是不是在說，一個男人擁有這麼多女人，是理想的？這是不是在羨慕王宮的奢華？我們要說得很清楚：不是。"],["p","這是王宮背景的一個對比。第九節接著說：「我的鴿子，我的完全人，只有這一個是她母親獨生的」（歌6:9）。你看，重點不在六十，不在八十，不在無數；重點在「只有這一個」。王宮裡有這麼多人，可是他的眼中，只有她。愛的專一，不是因為選擇少，而是在眾多選擇當中，仍然說：就是你。"],["p","我們也要說，這一段的背景，不是在支持多妻的制度。聖經在創造的起初，是一男一女，二人成為一體。這裡的數字，是詩歌的誇張，是為了烘托「只有這一個」的分量。我們不要借這一段，為任何形式的不忠實，找一個藉口，也不要讓人羨慕王宮的排場。"],["p","這一節對被比較的人，特別是一句安慰。從小到大，我們被比較了多少次？和兄弟姊妹比，和同學比，和同事比，和別人的孩子比。比較，使人活在緊張裡：我夠不夠好？我有沒有輸？可是這一節說：在愛你的人眼中，沒有比較，只有「這一個」。你不是第一名，你是唯一的。"],["p","第九節的後半句，是這樣的：「眾女子見了就稱她有福；王后妃嬪見了也讚美她」。就連那些王后、妃嬪，也讚美她。你看，一個真正被愛的人，不會成為別人的對手，反而成為別人讚美的對象。愛，使人不必比較，也使人不用嫉妒。這是一個很大的福氣：當我們都知道自己是被愛的，就可以由衷地，為別人的好歡喜。"],["p","然後，第十節，眾人問：「那向外觀看、如晨光發現、美麗如月亮、皎潔如日頭」（歌6:10）的是誰呢？這是一個被注視的畫面：一個人從遠處走來，像晨光、像月亮、像日頭，所有的人，都在看她。這是被看的人，面對的處境：被讚美，也被注目。"],["p","第十三節，眾人呼喚：「回來，回來，書拉密女」；然後，是她的反問：「你們為何要觀看書拉密女，像觀看瑪哈念跳舞的呢」（歌6:13）。這是她在被注視時，開口問的一句話：你們為什麼要看我？她沒有躲，也沒有逃，她問。被看的人，有權利問：為什麼看我？"],["p","這一句反問，我們要好好珍惜。在一個人人被注視的時代，在社群媒體上、在教會裡、在家族中，我們常常覺得被看。有的目光，是愛的目光，讓人更像自己；有的目光，是消費的目光，把人變成表演者，變成別人期待的樣子。被看的人，有權分辨，有權發問。"],["p","「書拉密女」是誰？學者有不同的看法：有人說是「所羅門」的陰性形，有人說是地名「書念」，也有人說是一個專名或他稱。本講義只陳列，不爭論。我們把重點，放在她被看時，有權反問。不要讓一場身分的爭論，佔據了這一章的重點。"],["d",["書拉密女是誰？我需要弄清楚嗎？","學者有不同的看法：有人認為「書拉密」是「所羅門」的陰性形，意思是「屬所羅門的女子」；有人認為是地名「書念」的女子；也有人認為是一個專名或他稱。本講義的立場是：只陳列，不爭論。你不需要弄清楚，就能從這一節裡，領受她被注視時的反問：「你們為何要觀看？」不要讓身分的爭論，佔據這一章的重點。如果你想進一步研究，可以去查閱各家的註釋，但是請記得，最重要的，是這個反問，對今天被注視的我們，說了什麼。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：把「六十王后八十妃嬪」講成理想的婚姻制度。這是王宮背景的對比，重點是「只有這一個」。聖經創造的起初，是一男一女成為一體。檢驗標準：講完之後，會眾是否理解愛的專一，而不是羨慕王宮？"],["p","第二個偏差：用「書拉密女」的身分爭論，佔據整個講章。身分只陳列各家說法，不爭論。檢驗標準：會眾走出去，記住的是爭論，還是「你們為何要觀看」？"],["p","第三個偏差：把她的反問，講成「不順服」或「驕傲」。她在被注視時，保有自己的聲音，是健康的。檢驗標準：講完之後，被看、被比較的人，是更自由，還是更緊張？"],["p","第四個偏差：把「我屬我的良人」，講成擁有或控制。這一句是相互的歸屬，不是一方對另一方的擁有。檢驗標準：這句話在你口中，是在邀請，還是在限制人的自由？"],["p","第五個偏差：把「只有這一個」，講成「你必須是最特別的才算被愛」。「獨一」不是比較出來的第一名，是不用比較的唯一。檢驗標準：你的講法，是讓人更放鬆，還是更想證明自己？"],["d",["她反問「你們為何要觀看書拉密女」，這是不是不順服或驕傲？","不是。這是一個在被注視時，仍保有自己聲音的人。她沒有躲，也沒有逃，她問：你們為什麼看我？這是一個很健康的反應。愛的目光，讓人更像自己；消費的目光，讓人變成表演者。被看的人，有權分辨這兩種目光，也有權發問。把這一句反問，講成不順服，反而是在讓人更不敢說話。我們要鼓勵每一個被注視、被比較的人：你有權問，你有權說不。同時，我們也要檢查自己：我看別人的時候，是愛的目光，還是消費的目光？這個檢查，要從我們自己開始。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：華人社會是一個非常愛比較的社會。成績比、薪水比、孩子比、房子比，連屬靈也比：誰禱告得多、誰服事得多、誰的見證更有力。在這樣的環境裡，一個人很容易覺得自己「不夠好」，也很容易把別人當作對手。雅歌第六章給我們一個不同的位置：在愛你的那一位眼中，你不是第一名，你是獨一。你可以停止比較，放鬆下來。"],["p","第二個問題：華人文化裡，有許多人活在「被看」的壓力下。怕別人的眼光，怕家族的議論，怕教會的批評。於是我們學會了表演：在家人面前一個樣子，在教會一個樣子，在社群媒體上又一個樣子。第六章的反問，是一個很健康的提醒：被注視的人，有權問：你們為何要看我？你可以用愛人的眼光看，也可以拒絕被消費。"],["h","七、活出321——同行、獨一、被看"],["p","耶穌是我的榜樣：祂在人群中走近人，也單獨看一個人，叫他的名字。祂不拿人與人比較，祂看每一個人為獨一。我學祂：陪人同行，不比較，看重每一個人的名字。"],["p","聖經是我的準則：這一章的準則，是不比較。我不借「六十王后八十妃嬪」羨慕任何排場，也不借「書拉密女」的身分爭論，偏離「只有這一個」。"],["p","聖靈是我的引導：在被看、被比較的壓力下，我不靠自己撐住形象，我學習被引導：什麼時候該回應，什麼時候該反問，什麼時候該沉默。聖靈使我在眾人的目光中，仍然像我自己。"],["p","讓耶穌作王：我放下的，是「我必須比別人好」的權力。王看我是獨一，我就不必成為第一。我也放下替別人貼標籤、比較別人的權力。"],["p","讓耶穌得著一切的榮耀：我被看為獨一，不是因為我特別，是因為愛的眼睛這樣看我。我若能放下比較，那是恩典；一切的榮耀，歸給那位看我為獨一的主。"],["p","建立屬神的體系：一個屬神的團體，是不比較、不消費人的地方。有人說出需要，旁邊就有人說「我們與你同去」；每一個人，都被當作「只有這一個」。"],["h","八、四種心，一道目光"],["p","驕傲型的心，需要被看成第一名。他把愛，變成一場比賽，贏了就覺得安全，輸了就覺得被拋棄。驕傲，就是離開本位，想用比較去證明自己的價值。他需要學的，是在「獨一」裡放鬆：不用贏，也被愛。"],["p","恐懼型的心，怕被比較，怕輸。他看別人的優點，都覺得自己不夠。他需要聽見的，是那一句「只有這一個」：在愛他的人眼中，不是在和誰比，他本身就是唯一。"],["p","羞恥型的心，不敢被看。他覺得一被看，就會被發現自己的不足。他需要有人，用愛的眼光看他，不批評、不比較，讓他慢慢學會，被看也是安全的。他也需要練習那句反問：你為什麼看我？"],["p","受傷型的心，曾被人拿去比較、去消費。他對任何「被看」，都很警覺。我們不催他走到人前，也不說「你要放下」；先讓他知道：他有權說不，有權問，有權拒絕被注視。慢慢的，他才敢被愛的眼睛看見。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這週對一位你信任的人，說一句不是「還好」的真話：「我最近有一點不好，你可以陪我坐一下嗎？」"],["p","第二，這週戒掉一次比較：每當你發現自己在和別人比，停下來，對自己說：「我是獨一的，他也是。」"],["p","第三，找一個正在「找不到」的人，告訴他：「我們與你同去。」不必給答案，只要陪他走一段。"],["p","第四，檢查你說的「你是我的」：有沒有一個人，是你用這句話限制的？選一個，把這句話換成「我們彼此屬於」。"],["p","第五，如果你被注視得很累，這週選一個時間，關掉社群媒體二十四小時，問自己：我要被誰看？"],["p","我宣告：我屬我的良人，我的良人也屬我，這個歸屬，在我找不到的時候仍然成立。"],["p","我宣告：我是「只有這一個」，我不需要比較，也不需要成為第一名。"],["p","我宣告：我可以說出需要，也可以陪伴別人說出需要：我們與你同去。"],["p","我宣告：我有權在被注視時發問，我不被消費，也不消費別人。"],["d",["我常常被拿來和別人比較，這一週可以怎麼做？","可以做三件小事。第一，辨認：每次你發現自己在被比較，或在比較別人，就在心裡默默說：「我看到了。」不批評，只是看到。第二，改寫：把「我不如他」，改成「我是我，他是他，我們都是被愛的」。第三，找一位你信任的人，說出你被比較的經驗，請他只聽，不給建議。你也可以選一個人，這週給他一個不帶比較的讚美，例如：「我喜歡你這樣做的方式。」如果比較的壓力已經影響你的睡眠與生活，請尋求牧者或專業輔導的協助。"]],["h","十、結語"],["p","雅歌第六章，是從夜晚走向白天的一章。夜裡她說「尋不見」，天亮了，她說「我屬我的良人」。夜裡她孤單地呼叫，天亮了，有人說「我們與你同去」。愛，不是只有兩個人，愛也把周圍的人，帶進來。"],["p","這是神的教會的樣式。有人說出需要，旁邊就有人說：我們與你同去。有人被比較得很累，就有人對他說：你是唯一。有人被注視得很緊張，就有人陪他說：你有權問。這是一個不比較、不消費、彼此歸屬的地方。願我們的家、我們的小組、我們的教會，都成為這樣的地方；願每一個走進來的人，都聽見那一句：我們與你同去。"],["p","所以，如果你正在找不到的夜裡，我要對你說：開口，說出來，旁邊會有人。如果你被比較得很累，我要對你說：你是唯一。我們一起把焦點放回耶穌：不在自己比別人好不好，不在別人的眼光，不在環境的壓力，只在那位說「只有這一個」的主。"],["p","讓我們禱告：親愛的主，謝謝祢看我們為獨一。求祢幫助我們，說出需要，也陪伴別人說出需要。求祢使我們停止比較，也停止消費人。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：說出需要，就有人同行；「屬」是歸屬，不是擁有；你是唯一，不是第一名。"],["n","1. ★ 用自己的話說一遍：這一章裡「同行、獨一、被看」三件事，各出現在哪一節？"],["n","2. ★★ 第六章三節說「我屬我的良人」，第二章十六節卻是「良人屬我」。次序的轉換，說明了什麼？"],["n","3. ★★★ 「第一名」和「唯一」有什麼不同？你比較常活在哪一個裡？"],["n","4. ★ 「你們為何要觀看」這句反問，對今天的你有什麼意義？"],["m","帶領提醒：這一課碰到比較、被注視的壓力與被控制的經驗。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命。"],["t","【看】看見自己"],["n","5. ★★ 你最近一次拿自己和別人比較，是在什麼時候、什麼事上？"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，聽這一句：「只有這一個。」你心裡第一個反應是什麼？"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你不敢開口說出需要？是怕麻煩別人，還是怕被看輕？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，其中一人說：「我最近需要……」；另一人只回答：「謝謝你告訴我，我們與你同去。」"],["t","【行】走一步"],["n","9. ★★ 這一週，你要對誰說出一個需要，或陪誰走一段路？寫下名字與時間。"],["m","帶領提醒：這一化可能有人曾被比較、被控制或被傷害。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課帶進本週的生活：不比較、陪人同行、操練 920、把這一課傳出去。"],["n","10. ★★ 你家裡或團契裡，有沒有一個常被比較的人？你可以用哪一句話，讓他知道他是唯一？"],["n","11. ★★★ 920 操練：找出那一位你常拿來比較的「2」，現場說出他的名字，並說這週你要用哪一種聖靈的果子，代替比較。"],["n","12. ★★ 如果你帶小組，你要怎麼讓一個說出需要的人，覺得被接住，而不是被當成問題？你的第一句話會是什麼？"],["n","13. ★ 你有沒有被注視得很累的時候？你可以用什麼具體的方式，保護自己的空間？"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說「說出需要，就有人與你同去」，第二句說「你是唯一，不是第一名」，第三句說「被看的人，有權發問」。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，求你讓我的弟兄（姊妹）知道，他是你眼中唯一的；求你使他不再與人比較。」然後彼此說：「你是唯一的，我們與你同去。」最後，由一位帶領者簡短禱告結束。"]]},"7":{"no":7,"vol":"《321雅歌講義》第7課·雅歌第7章","title":"被戀慕，而不是被管轄——完整、戀慕、田間","chars":4860,"min":60,"deep":8,"dchars":1428,"tchars":23,"blocks":[["h","一、被讚美的，是一個完整的人"],["p","弟兄姊妹平安。有一對結婚四十年的夫妻，每天早上起床，丈夫都會對太太說同一句話：「你今天很好看。」太太有時候翻白眼，有時候說「老了還好看什麼」，可是三十幾年來，她沒有一天不期待這句話。有一次丈夫重感冒，早上沒力氣說，太太站在鏡子前，等了一下，自己輕輕說了一句：「今天沒人說我好看喔。」兩個人一起笑了。話語，原來可以這樣滋養一段婚姻。"],["p","今天讀的雅歌第七章，是一段很長的讚美。「王女啊，你的腳在鞋中何其美好」（歌7:1）。這是一個很特別的開始：他從她的腳開始說。不是從臉，不是從眼睛，而是從腳，從最日常、最不被看見的地方。她的走路，她腳步的姿態，在他眼裡，何其美好。他看的，是她整個人，在日常中走路的樣子。"],["p","第四章，他的凝視是從上往下，從眼睛、頭髮，一路看到頸項；第七章，是從下往上，從腳，一路看到頭髮。有人說，這是兩種不同的目光：第四章是新婚的初見，第七章是走過了一些日子之後的重看。一個是被驚豔，一個是被熟悉。兩種目光，都是愛，只是愛的深度不同。初見的目光，是驚歎；老友的目光，是熟悉裡的珍惜。一段愛若能從驚歎走到珍惜，就走過了一段很長的路。"],["p","這一章有大量對身體的描寫，我們必須先說清楚怎麼讀。第一，這是私密的情話，不供評分，不供比較。第二，我們不逐項解釋這些比喻，也不借它們去評論任何人的外貌。第三，我們只讀它的語氣，與看人的方式。聽完這一段，在座的人，應該是更珍愛自己與他人，而不是更在意外貌。"],["p","那麼，這一段的語氣是什麼？是欣賞，是歡喜，是不帶羞辱的凝視。他看她的每一個部分，都用美好的東西作比喻：玉、杯、麥子、象牙、水池、塔、山。沒有一個比喻，是貶低的；沒有一個地方，是被挑剔的。她被看見的，是一個完整的人，每一個部分，都被好好地看，好好地說。對一個人來說，被這樣細細地、溫柔地看過，是一種很深的醫治：原來我的每一個部分，都可以被愛。你若不曾被這樣看過，也請記得：神的眼睛，是這樣的眼睛。"],["p","這和我們多數人被看的經驗，很不一樣。我們被評論過：太胖，太瘦，太高，太矮，皮膚不夠好，頭髮不夠多。有的批評，是惡意的；更多的，是無心的。時間一久，我們學會自己批評自己。雅歌第七章給我們一個不同的聲音：有一種語言，可以用來滋養人，而不是羞辱人。"],["p","第五節，有一句很特別的話：「王的心因這下垂的髮綹繫住了」（歌7:5）。原文的意思是，王被繫在她的髮綹之中。一個擁有權力的人，自願被一個人的頭髮繫住。這是愛的方向：不是向上征服，而是向下彎腰；強者在愛中，自願被繫。這一點，我們後面還要再說。現在先記住：愛的力量，不是用來制伏人的，是用來彎腰的。這一個彎腰，是整本雅歌，也是整本聖經，最美的一個姿勢。"],["d",["這一章對身體的描寫，在教會裡該怎麼讀、怎麼講才適當？","先掌握三個原則：第一，這是私密的情話，不是公開的評分清單；第二，我們讀的是語氣與看人的方式，不逐項解釋身體的比喻；第三，聽完之後，在座的人應該是更珍愛自己與他人，而不是更在意外貌或更焦慮。在小組裡，可以把重點放在「他怎麼看她」：欣賞、完整、不羞辱。未婚的會眾，要讓他們聽得懂、不被挑動；曾被傷害的人，要留意不要讓這段經文造成二次傷害。如果不確定怎麼講，寧可少講，也不要借此評論任何人的身體。"]],["h","二、讚嘆，與她的接話"],["p","第六節，他的語氣更放鬆了：「我所愛的，你何其美好！何其可悅，使人歡暢喜樂」（歌7:6）。到了這裡，他不再逐項描述，他是直接地嘆息：你何其美好！這是一個人看著另一個人，內心滿溢的讚嘆。這時候，不需要比喻，只需要一個「何其」。"],["p","接著，他繼續說：身量像棕樹，兩乳像纍纍下垂的果子；他說要上這棕樹，抓住枝子。這段話裡，有他的渴望。我們不迴避這件事：愛情詩裡，有渴望，這是被造的人的一部分。我們也要說，這是在婚姻的親密裡，是私密的話，不是用來在公開場合挑動情慾的。"],["p","然後，第九節，發生了一件很有意思的事。他說：「你的口如上好的酒」，話還沒有說完，她接話了：「女子說：為我的良人下咽舒暢」（歌7:9）。她打斷了他，把他的話接過去，順著說下去。這是一個很可愛的細節：她不是安靜聽完，她加入了對話。我們甚至可以說，這個接話，是被愛的人最健康的樣子：她不是被動地聽完，而是用自己的話，接住了愛。"],["p","你看，這是一段平等的對話。他說，她接；他起了頭，她把話說完。不是一個人在說，另一個人在被說。在很多文化裡，女子是被描述的對象，是被看的、被說的、被評價的。可是在雅歌裡，被讚美的人，自己也開口，自己也接話，自己也有聲音。"],["p","這對所有的關係，是一個很好的提醒：讚美，不是單向的。一個人說完讚美的話，也要給對方一個接話的空間。有一種讚美，是一個人高高在上地評價；也有一種讚美，是兩個人一起說話。後者，才是雅歌裡的讚美。"],["d",["「王的心被髮綹繫住」，是說男人被女人控制嗎？","不是。這一句的重點，是「愛的方向」。一個擁有權力的人，在愛裡，自願被一個人所吸引、所繫住。這不是被控制，而是自願的彎腰；不是被迫的捆綁，而是歡喜的歸屬。「繫住」這個字，在別處常用於被迫的捆綁，在這裡卻是被愛所繫，兩者的差別，在於「自願」。我們不可以用這一句，教人用美貌或手段去掌控對方，也不可以拿它來說「女人可以操縱男人」。它說的是：愛，使強者彎腰，不是使人用手段去掌握誰。"]],["d",["第九節她為什麼打斷他、接過話去？這有什麼意義？","經文沒有解釋，我們只能從畫面來看：他還在說，她已經接上了，把他的話順著說下去，變成她自己的話。這是一個很可愛的細節，也是一個很重要的記號：在這段關係裡，被讚美的人，也有聲音；被說的人，也能說。讚美不是單向的評價，而是一段兩個人的對話。你也可以問自己：在你的關係裡，被讚美的人，有沒有接話的空間？如果沒有，也許可以從下一次開始，在說完讚美之後，停一下，讓對方開口。"]],["h","三、原文亮光：戀慕、繫住、田間"],["p","放大看三個字。第一個是 תְּשׁוּקָה，念 teshuqah，「戀慕」，也有「渴求」的意思。這個字，在整本舊約裡只出現三次，而第七章第十節，是第三次。另外兩次，在創世記，第三章與第四章。這是一個很特別的字，值得停下來看。"],["p","在創世記第三章，人犯罪之後，神對女人說的話裡，有這個字：女人對丈夫的「戀慕」，與丈夫對她的「管轄」，並排出現。在創世記第四章，神對該隱說的話裡，也有這個字：罪的「戀慕」，要你制伏。這兩處，這個字都帶著一種管轄與爭奪的張力：一方想要，另一方要壓制。"],["p","現在，我們來到雅歌第七章第十節。這個字，第三次出現，卻變了方向。她說：「他也戀慕我」。戀慕的方向，是他對她，而不是她對他；而且，這個戀慕，沒有管轄的張力，只有珍愛。在創世記，這個字帶著破碎的痕跡；在雅歌，它被醫治成了愛的語言。我們不說這是「預言」，我們只說：這使我們想起，神要把破碎的，醫治成完整。這是一個很盼望的畫面：一個字，從咒詛的語氣，走進愛的語言；一個人，也可以從破碎的關係，一步一步走進被愛的經驗。"],["p","第二個字是 אָסַר，念 asar，「繫住」、「捆綁」。第五節的「繫住」，就是這個字。這個字常用來描寫捆綁囚犯，可是在這裡，是被愛繫住的王。同一個字，在別處是被迫的捆綁；在這裡，是自願的被繫。權力，在愛裡，彎下了腰。"],["p","第三個字是 שָׂדֶה，念 sadeh，「田間」、「田野」。第十一節，她說：「你我可以往田間去」。田間，是日常的地方，是勞動的地方，是收成的地方。愛，不只在屋內，也在田間；不只在夜裡，也在早晨；不只在激情裡，也在日常裡。"],["p","三個字連起來：戀慕，是被醫治的渴望；繫住，是自願的彎腰；田間，是愛走進日常。這三個字，把這一章帶到一個很有力的結論：最深的歸屬，不是被管轄，而是被戀慕；最大的力量，不是征服，而是彎腰；最長久的愛，不是在高峰，而是在田間。"],["d",["「戀慕」這個字在創世記三、四章也出現，意思一樣嗎？","字根相同，這是聖經裡只有三次出現的字：創世記三章、四章，與雅歌七章。前兩處的語氣，都帶著管轄與爭奪的張力；雅歌七章的語氣，是珍愛，沒有爭奪。我們不說這是「預言」，也不做太多推論，只說：這是一個值得留意的呼應，使我們想起，神願意把破碎的關係，醫治成完整。要注意的是，不要因為這個呼應，就教導說「所有的關係問題，都因為這個字」，或者用這個呼應去要求某一方順服。它是一個溫柔的提醒，不是一條規條。"]],["d",["「他也戀慕我」會不會被拿來要求配偶一定要回應我的需要？","不可以。「戀慕」在這一章裡，是一種珍愛與渴慕，是自由的，不是義務。若有人拿「他也戀慕我」去要求配偶必須滿足自己，或者以此施壓，那就把這一句話扭曲了。雅歌裡的愛，有節奏，有自由，有「等他自己情願」的叮嚀。一對夫妻，若在這方面有差異或困難，最好的做法，是誠實地對話，彼此傾聽，必要時尋求牧者或專業婚姻輔導的協助。愛，不是索取，而是在自由裡彼此給予，這才是雅歌七章要我們學的。"]],["h","四、我屬我的良人，他也戀慕我"],["p","現在我們來到整章的中心。第十節，她說：「我屬我的良人，他也戀慕我」（歌7:10）。這句話，我們已經在第二章和第六章聽過類似的句子，但是這一次，多了一個東西：最後一個字，「戀慕」。這一個字，是整章的重量所在，也是整卷歌的一個轉折點。第二章是「良人屬我，我也屬他」；第六章是「我屬我的良人，我的良人也屬我」；到了第七章，是「我屬我的良人，他也戀慕我」。"],["p","你看這三次的變化。第二章，是互屬；第六章，是在傷痛之後，仍然互屬；第七章，歸屬被加上了「戀慕」。她不只是屬於他，她也被他所渴慕、所珍愛。歸屬，不只是一個關係上的身分，也是一個被愛的經驗：我不是被擁有，我是被想念、被渴望的那一個。"],["p","這句話對很多人，特別是對曾經在關係裡被輕看、被管轄的人，是很深的安慰。你不是被「管」的那一個，你是被「戀慕」的那一個。在愛裡，你的存在，使另一個人歡喜；你的臉，使另一個人想念；你的名字，使另一個人心跳。這是愛的最深的形狀：被戀慕，而不是被管轄。"],["p","我們要特別提醒：不可以用「戀慕」這個字，去合理化管轄、佔有或控制。在創世記，這個字帶著管轄與佔有的味道；在雅歌，它被醫治成珍愛。如果一個人說「我戀慕你」，卻要求你順服、要求你不許離開、要求你符合他的期待，那不是雅歌的戀慕。雅歌的戀慕，是對方更自由、更像自己。你可以用一個很簡單的測試：在這個人身邊，我是更敢做自己，還是更不敢？愛的目光，使人敞開；管轄的目光，使人縮小。"],["p","接著，第十一節，她發出邀請：「我的良人，來吧！你我可以往田間去；你我可以在村莊住宿」（歌7:11）。注意，這個邀請，是她發出的。她說「來吧」，她帶他去田間，帶他去村莊。在一段親密的關係裡，她是一個有主動權的人，她有自己的聲音，自己的決定，自己的邀請。這是一個健康的關係的樣子：兩個人都可以說「來吧」，兩個人都可以帶領，也都可以跟隨。"],["p","第十二節，她說：「我們早晨起來往葡萄園去，看看葡萄發芽開花沒有，石榴放蕊沒有；我在那裡要將我的愛情給你」（歌7:12）。這是很日常的畫面：早晨起來，去葡萄園，看葡萄有沒有發芽。愛，不只是浪漫的夜晚，也是一起早晨起來，去看園子。"],["p","第十三節的最後一句，是這樣的：「我的良人，這都是我為你存留的」（歌7:13）。「存留」，是用心預備、長時間保存的意思。門內有各樣新的、舊的美果，都是她為他存留的。這是一種長期的愛：不是一時衝動，而是一直為對方留著。愛，是日復一日，為所愛的人，存留好東西。你可以問問自己：我為誰存留了什麼？是一句沒有說出口的謝謝，是一個預備好的擁抱，還是一段專心的時間？存留，是愛的耐心；耐心，是愛最安靜的證明。"],["p","這裡也要提醒：田間與村莊的邀請，是婚姻裡的愛走進日常。重點在「早晨起來」、「葡萄園」、「存留」，不是在鼓勵婚前或婚外的親密。同時，單身的人，也有自己的田間與村莊：工作、朋友、教會、服事，都是你日常的田野，你一樣可以在那裡，被愛，也愛人。日常，是愛最誠實的考場：不是在講台上，而是在廚房、辦公室、公車上，我們怎樣對待身邊的人。"],["d",["「往田間去、在村莊住宿」，是不是在鼓勵婚前同居？","本講義的立場是：這是婚姻裡的愛走進日常的畫面，重點在「早晨起來」、「葡萄園」、「存留」，不是在鼓勵婚前或婚外的親密。如果拿這一段去合理化婚外的親密，就偏離了經文的重點。這個邀請所展現的，是承諾之中的日常：一起早起，一起看園子，一起把好東西存留下來。這樣的愛，需要時間，需要承諾，也需要日復一日的忠實。單身者讀這一段，也可以領受它的原則：愛，要走進日常，不只是感覺。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：公開解釋身體的比喻，或逐項評論。這些話是私密的情話，不供評分，也不供比較。檢驗標準：聽完之後，在座的人是更珍愛自己與他人，還是更在意外貌？"],["p","第二個偏差：用「戀慕」合理化管轄、佔有或控制。創世記三章與四章的「戀慕」帶著管轄與佔有；雅歌七章是珍愛。檢驗標準：你的關係裡，是對方更自由，還是更緊張？"],["p","第三個偏差：把「王的心被繫住」講成權力遊戲。原文是王被繫在髮綹中，強者在愛中自願被繫，是向下，不是征服。檢驗標準：這句話在你口中，是在教人彎腰，還是教人操縱？"],["p","第四個偏差：把「田間與村莊」講成婚外親密的合理化。這是婚姻裡的愛走進日常。檢驗標準：講完之後，會眾是更重視承諾與日常，還是更重視當下的感覺？"],["p","第五個偏差：把這一章講成只有已婚者的專利。單身的人也有自己的田間與村莊。檢驗標準：你的講法，有沒有同時讓單身的人，也覺得這一章有他的位置？"],["d",["單身的人，讀這一章可以領受什麼？","很多。第一，你可以領受「被完整看見」：你不需要婚姻，才配被愛、被珍惜。第二，你可以學習用話語滋養人：對朋友、家人、同工，說出真誠的讚美。第三，你可以辨識「戀慕」與「管轄」的差別，這在任何一種關係裡都適用。第四，你可以找出自己的「田間與村莊」：工作、社區、教會、服事，都是你日常的田野，你可以在那裡愛人。這一章不是只有已婚者的專利，它是每一個想好好愛、好好被愛的人的功課。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：華人文化裡，很少有人說出口的讚美。我們習慣了謙虛：「哪裡哪裡」；習慣了含蓄：「心裡知道就好」；習慣了批評：「你還可以更好」。於是許多夫妻，一輩子沒有聽過對方一句真誠的讚美。雅歌第七章給我們一個很實際的功課：把話說出口。讚美，不是肉麻，是滋養；不說，是缺乏。"],["p","第二個問題：華人婚姻裡，有許多關係是以「管轄」代替「戀慕」的。丈夫管妻子，妻子管孩子，長輩管晚輩，都是以愛為名，其實是管。「他也戀慕我」這句話，是一個很好的提醒：愛，是珍愛，不是管轄。你可以問自己：我在這段關係裡，是在戀慕對方，還是在管轄對方？對方在我面前，是更自由，還是更緊張？如果是後者，請不要等到對方開口抗議；從今天開始，先放手一件小事。"],["h","七、活出321——完整、戀慕、田間"],["p","耶穌是我的榜樣：祂看人，是完整地看；祂說話，是滋養人而不是羞辱人。祂彎下腰，洗門徒的腳，不是征服，而是服事。我學祂：用話語滋養人，用彎腰愛人。"],["p","聖經是我的準則：這一章的準則，是不逐項解釋身體，不借此評論別人，也不用「戀慕」合理化管轄。創世記與雅歌的回應，我們說「這使我們想起」，不說「這就是預言」。"],["p","聖靈是我的引導：愛是日常的功課，不只是感覺。聖靈引導我，在田間與村莊裡，每天早晨起來，為所愛的人存留好東西，也引導我分辨：我是在戀慕，還是在管轄。"],["p","讓耶穌作王：我放下的，是用權力、用管轄去愛人的方式。王在愛裡彎腰，我也學會彎腰。我不再用「我是為你好」，去控制所愛的人。"],["p","讓耶穌得著一切的榮耀：我被戀慕，我能戀慕人，都不是因為我有什麼，而是因為愛的源頭是神。我若能在日常裡愛人，那是恩典；一切的榮耀，歸給那位使愛完整的主。"],["p","建立屬神的體系：一個屬神的團體，是話語滋養人、而不是羞辱人的地方。在這裡，每一個人都被完整地看見，被珍愛，而不被管轄；愛走進田間，走進日常，走進每一天。"],["h","八、四種心，一句讚美"],["p","驕傲型的心，不習慣讚美，也不習慣被讚美。他覺得讚美是軟弱，是浪費時間；他認為，我做得好，不需要別人說。驕傲，就是離開本位，想靠自己完成一切，不需要別人的話。他需要學的，是彎腰：把一句真誠的讚美，說出口。"],["p","恐懼型的心，不敢說出讚美，也不敢接受。他怕說了之後被誤會，怕被當成討好，怕被拒絕。他需要的，是一個很小的練習：每天說一句具體的好話，對一個安全的人，不求回應。"],["p","羞恥型的心，聽到讚美，會立刻反駁：不是這樣的，你不知道我的缺點。他把讚美擋回去，因為他不相信。他需要的，是一個一直重複的聲音：你是完整的，你不需要遮。也需要練習說：謝謝。"],["p","受傷型的心，曾被人用話語羞辱，也曾被人以「愛」為名管轄。他對任何的「戀慕」，都很警覺。我們不催他放下防備，也不說「你要信任」；先讓他知道：被戀慕，不等於被管轄；他可以說不，也可以慢慢來。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這週每天對一個人說一句具體的好話：不是「你很棒」，而是「你今天這樣做，我很感謝」。"],["p","第二，這週戒掉一次批評：當你想批評一個人的外貌或表現時，停下來，換成一句看見他努力的話。"],["p","第三，如果你有伴侶，這週找一個早晨，一起去散步十五分鐘，不談事情，只談彼此的感受。"],["p","第四，檢查你的「管轄」：有沒有一個人，是你用「為你好」控制的？選一個，這週放手一件事，讓他自己決定。"],["p","第五，如果你是單身，這週為你日常的「田間」，寫下三個你可以愛的人，為他們各做一件小事。"],["p","我宣告：我是被珍愛的人，我不是被管轄的人。"],["p","我宣告：我要用話語滋養人，不用話語羞辱人。"],["p","我宣告：我要在愛裡彎腰，不用權力征服，也不用管轄去愛。"],["p","我宣告：我要把愛帶進日常，每一天，為我所愛的人存留好東西。"],["d",["我的婚姻已經很冷淡，很久沒有說過讚美了，這一週可以從哪裡開始？","從最小的開始。第一，選一個安全的時間，不是吵架時，也不是睡前很累的時候，說一句具體的好話：「你今天做的那件事，我很感謝。」不要加「但是」。第二，不要期待對方立刻有反應；很久沒有說的話，需要時間，對方也需要時間相信。第三，每天說一次，持續一週，再看看氣氛有沒有改變。如果婚姻中有比較深的傷害、冷暴力或其他困難，請尋求牧者或專業婚姻輔導的協助，不要獨自承擔。"]],["h","十、結語"],["p","雅歌第七章，是一首長長的讚美詩。它從腳開始，到頭髮結束；它從一個人的凝視開始，到另一個人的接話結束。它告訴我們：愛，是可以用話語滋養的，也是可以走進田間的。話語，與田間，一個是嘴上的功課，一個是手上的功課；愛需要兩者。"],["p","最動人的，是第十節那一句：「他也戀慕我」。這個在創世記裡曾經帶著管轄與爭奪的字，在雅歌裡，被醫治成了珍愛。神要把我們破碎的關係，一步一步地醫治。我們不說這已經完成，我們說：這使我們想起，祂要使一切更新。"],["p","所以，如果你一直活在被管轄的關係裡，我要對你說：被愛，不是被管；你可以慢慢學會，什麼是被戀慕。如果你一直習慣用管轄去愛人，我要對你說：彎下腰，學習珍愛。我們一起把焦點放回耶穌：不在自己的外貌，不在別人的評論，不在環境的壓力，只在那位彎腰愛我們的主。"],["p","讓我們禱告：親愛的主，謝謝祢用愛的眼睛看我們。求祢醫治我們破碎的關係，使我們學會用話語滋養人，用彎腰愛人。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：話語可以滋養，而不是羞辱；被戀慕，而不是被管轄；愛要走進日常。"],["n","1. ★ 用自己的話說一遍：這一章裡「完整、戀慕、田間」三個詞，各說了什麼？"],["n","2. ★★ 第一節從「腳」開始讚美，不是從臉。這對你怎麼看「被看」，有什麼不同？"],["n","3. ★★★ 「戀慕」在創世記帶著管轄的張力，在雅歌被醫治成珍愛。「被戀慕」和「被管轄」，在你的經驗裡有什麼不同？"],["n","4. ★ 第九節她接過了他的話。在你的關係裡，被讚美的人有沒有接話的空間？"],["m","帶領提醒：這一課碰到身體、親密關係與曾被管轄、被羞辱的經驗，請放慢。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命。"],["t","【看】看見自己"],["n","5. ★★ 你比較常用話語滋養人，還是用話語批評人？舉一個最近的例子。"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，聽這一句：「我屬我的良人，他也戀慕我。」你心裡第一個反應是什麼？"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你不敢說讚美，或不敢接受讚美？是謙虛、是害怕，還是過去的傷？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，彼此說一句具體的、真誠的好話；另一人只回答：「謝謝你。」"],["t","【行】走一步"],["n","9. ★★ 這一週，你要對誰說出一句讚美，或放手一件原本想管轄的事？寫下名字與時間。"],["m","帶領提醒：這一化可能有人曾被羞辱、被管轄或被傷害。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課帶進本週的生活：用話語滋養、不管轄、操練 920、把這一課傳出去。"],["n","10. ★★ 你家裡或團契裡，有沒有一個常被批評、少被讚美的人？你這週可以對他說哪一句話？"],["n","11. ★★★ 920 操練：找出那一位你一直想管轄的「2」，現場說出他的名字，並說這週你要用哪一種聖靈的果子，代替管轄。"],["n","12. ★★ 如果你帶小組，你要怎麼談這一章的身體描寫，才不會讓人羞愧、也不會挑動人？你的第一句話會是什麼？"],["n","13. ★ 你的「田間與村莊」在哪裡？有沒有一件日常小事，你可以用愛重新做一次？"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說「話語可以滋養人」，第二句說「被戀慕，而不是被管轄」，第三句說「愛要走進日常」。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，求你讓我的弟兄（姊妹）知道，他是被珍愛的；求你醫治他曾受的話語的傷。」然後彼此說一句具體而真誠的好話，並互相回答：「謝謝你，我收下了。」最後，由一位帶領者簡短禱告結束。"]]},"8":{"no":8,"vol":"《321雅歌講義》第8課·雅歌第8章","title":"印記，與一句求你快來——印、牆、快來","chars":5111,"min":60,"deep":8,"dchars":1457,"tchars":23,"blocks":[["h","一、在光中被承認"],["p","弟兄姊妹平安。「我是因為愛你，才要看你的手機。」這句話，你聽過嗎？也許是別人對你說的，也許是你自己說過的。說的時候，語氣很真誠，眼神很擔心，好像只要愛得夠深，這一切都是應該的。今天我們讀的，是雅歌的最後一章。這一章裡，有整卷書最有名的一句話——也有最容易被拿來合理化控制的一句話。我們要一句一句，慢慢讀。"],["p","第八章一開始，是一個很深的願望：「巴不得你像我的兄弟，像吃我母親奶的兄弟；我在外頭遇見你就與你親嘴，誰也不輕看我」（歌8:1）。她希望他像她的兄弟。為什麼？因為在她的世界裡，兄弟之間的親近，可以在大街上公開表示，沒有人會說閒話；可是愛人之間的親近，卻不行。"],["p","你看她心裡的願望：我希望我的愛，可以在光中被承認，不被輕看。她不是想要躲在暗處的愛，她想要的是，在外頭遇見他，可以大大方方地走過去，而且「誰也不輕看我」。這是一種很人性的渴望：我愛一個人，我希望這份愛，可以被看見，被尊重，被祝福。"],["p","這個處境，不是今天每一個人都懂的。有些人的愛，不被家人接受；有些人的關係，不被教會承認；有些人的喜歡，不能說出口。聖經沒有立刻給答案，也沒有替這些處境下結論。它只是如實記下她的願望，並且給我們一對同理的耳朵：聽見她想在光中被承認的心。"],["p","第二節，她說：「我必引導你，領你進我母親的家」（歌8:2）。你看，這是一個第三章出現過的畫面：她把他領入母家。她要把這份愛，帶進家，帶到母親面前，帶進一個被祝福的地方。愛，想要走進光中，走進家，走進人群，不是躲起來。"],["p","第四節，那一句副歌，最後一次出現：「不要驚動、不要叫醒我所親愛的，等他自己情願」（歌8:4）。這是第三次，也是最後一次。在雅歌的第二章，在第三章，到這裡，這句話像是一個整卷的安全守則：愛，永遠在自由裡。三次出現，三次提醒：我們要等，我們要尊重，我們不逼。"],["p","接著，第五節，出現了第三個「那是誰呢」。第一次是第三章：從曠野上來，形狀如煙柱的是誰呢？第二次是第六章：向外觀看，如晨光發現的是誰呢？第三次，在這裡：「那靠著良人從曠野上來的是誰呢」（歌8:5）。這一次，她不是被抬著上來，也不是被眾人觀看，而是靠著良人，一起從曠野上來。"],["p","「靠著」，這個字很重要。她不是一個人，從曠野走過來；她是靠著他，一路走過來的。整卷雅歌，從一個人的「願」，走到兩個人的「靠著」。你不需要一個人撐過曠野，你可以靠著。愛，到最後，不是一個完美的形象，而是一個彼此倚靠的姿勢。"],["d",["「巴不得你像我的兄弟」是什麼意思？她為什麼希望他像兄弟？","在她的世界裡，兄弟之間的親近，可以在公開場合表示，不會被人說閒話；愛人之間的親近，卻要小心。所以她說，巴不得你像我的兄弟，這樣我在外頭遇見你，就可以與你親嘴，誰也不輕看我。這是一個渴望：我的愛，可以在光中被承認、被尊重。本講義的立場是不用今天的觀念直接評斷，只聽出她的願望。你也可以把它讀成：愛不需要躲藏，愛想要走到光中。如果你的愛，現在還不被別人接受，這節經文給你一對同理的耳朵。"]],["h","二、將我放在你心上如印記"],["p","現在我們來到整卷書的高峰。第六節：「求你將我放在你心上如印記，帶在你臂上如戳記」（歌8:6）。印記，是蓋在文件上的印章，標示這是誰的；戳記，是戴在身上的印章，隨時帶著。她求他：把我放在你的心上，把我帶在你的臂上；心，是最裡面；臂，是最外面。從裡到外，都帶著。"],["p","你看這個求：她不是說「我要你屬於我」，她說「求你將我放在你心上」。這是一個請求，不是一個要求。她求他，把她放在最重要的地方，隨身帶著。印記，不是為了占有，而是為了不忘記；戳記，不是為了標示所有權，而是為了標示：這是我愛的人。"],["p","然後，她說出了這一句名言：「愛情如死之堅強」（歌8:6）。死，是最堅強的東西：沒有人可以抵擋，沒有人可以逃脫。她說，愛，和死一樣堅強。死，不會因為你的拒絕而停止；愛，也不會因為困難而放棄。這是愛的力量：不是脆弱的感覺，而是不離不棄的委身。"],["p","接著她說：「嫉恨如陰間之殘忍」（歌8:6）。這一句，是最容易被誤用的。我們必須說得很清楚：這句話說的，是愛的「忌邪」，也就是不容被奪走，不容被取代；它不是在說，你可以用「我愛你」去管別人的手機、限制別人的交友、威脅別人、傷害別人。凡是用愛的名義，去控制人的，都不是雅歌的愛。"],["p","你可以用一個很簡單的測試：愛的火，是使人更自由，還是更緊張？雅歌的愛，是自由裡的委身：我願意為你付出，你也有自由；我很在乎你，你也可以做你自己。控制，是用「愛」，去縮小對方的世界；愛，是用「愛」，去擴大對方的世界。"],["p","第六節的最後，她說：「所發的電光是火焰的電光，是耶和華的烈焰」。有人認為，這裡的字尾是神的名字，所以是「耶和華的烈焰」；也有人認為，只是一個加強語氣的說法，意思是「極猛的火焰」。本講義不下定論，兩種讀法，我們都陳列。無論哪一種，愛是火，火是猛烈的，這一點，是一致的。"],["p","第七節，她說：「愛情，眾水不能熄滅，大水也不能淹沒」（歌8:7）。眾水，是混亂、是威脅、是困難；大水，是一切可能淹沒人的東西。愛，是一把火，水澆不熄。然後她說：「若有人拿家中所有的財寶要換愛情，就全被藐視」（歌8:7）。愛，不能買賣，不能用金錢衡量。"],["p","這句話，我們要小心。它不是說「錢不重要」，也不是在批評貧窮的人。生活需要錢，這是事實。它說的是：愛，不是用錢可以換來的東西。一個再有錢的人，也買不到一個真心的愛；一個再窮的人，也可以擁有真心的愛。窮的人與富的人聽了，都要能被愛，而不是被衡量。"],["d",["「印記」和「戳記」是什麼？為什麼要放在心上、臂上？","印記，是蓋在文件上的印章，標示身分與歸屬；戳記，是隨身帶著的印章，掛在頸上或戴在手臂上。「放在心上，帶在臂上」，是從最裡面到最外面，從感受到行動，都帶著。她求他：把我放在你最裡面的地方，也帶在你每天的行動上。這是一個請求，不是要求；印記的重點，不在抓得多緊，而在放在哪裡。我們不需要把它解釋成別的東西，先聽見這是一個很深的渴望：我想被你記得，被你帶著，在你的心裡與生活裡，都有我的位置。"]],["h","三、原文亮光：印記、牆、快來"],["p","放大看三個字。第一個是 חוֹתָם，念 khotam，「印記」，也就是印章。在古代，印章是身分的證明，是權威的記號。一個人把印章戴在身上，或掛在頸上，就像今天的身分證，隨時隨地不離身。她求他把她放在心上如印記：把我當成你最貼身、最不可離開的東西。"],["p","這個字提醒我們，印記是「被放上去」的，不是「去抓住」的。她是被放置的那一個，是被他所帶著的那一個。愛，不是我抓緊你，而是你願意把我放在心上。印記的力量，不在於它抓得多緊，而在於它放在哪裡：放在心上，放在臂上。"],["p","第二個字是 חוֹמָה，念 khomah，「牆」。第九節、第十節，都出現這個字。「她若是牆」，「我是牆」。牆，是保護，是界限；牆不是監獄，牆是為了守護裡面珍貴的東西。我們在第四章看見關鎖的園；在第八章，我們看見牆，同一種意象，同一種守護。"],["p","第三個字是 בְּרַח，念 berakh，「快來」，字根有「逃跑」、「疾走」的意思。第十四節：「求你快來」。這個字的畫面，是一個人快步奔跑。她在整卷歌的最後，說：快來。不是「我已經得到」，不是「一切都完成了」，而是：你快來。愛，仍在路上。"],["p","三個字連起來：印記，是被放在心上；牆，是被守護的界限；快來，是仍在路上的盼望。這三者，是整卷雅歌的總結：愛，是被放在心上；愛，是被守護；愛，是還在路上，仍在呼求。"],["d",["「嫉恨如陰間之殘忍」可以用來要求對方只能屬於我嗎？","不可以。這句話說的是愛的「忌邪」，也就是不容被奪走、不容被取代，它是對愛本身的描寫，不是給人去控制別人的許可。凡是用「我愛你」去管手機、限制交友、威脅、傷害的，都不是雅歌的愛。你可以用一個簡單的測試：這份愛，使對方更自由，還是更緊張？如果對方在你面前，不敢說真話、不敢做自己、不敢有朋友，那就是控制，不是愛。如果你正在被這樣對待，請尋求可信的牧者或專業人員的協助，保護自己的安全。"]],["d",["「耶和華的烈焰」是不是說愛就是神？","這一句有兩種讀法。有人認為字尾是神的名字，所以是「耶和華的烈焰」，意思是愛的火源自神；也有人認為這只是一個加強語氣的說法，意思是「極猛的火焰」。本講義不下定論，兩種讀法都陳列。不論哪一種，愛是猛烈的火，這一點是一致的。至於「愛就是神」，這是約翰一書第四章所說的，那是新約自己作過的話，我們可以尊重它；但我們不需要靠雅歌這一句，去證明這個教導。先讓這一句，作為愛的火的描寫，慢慢被聽見。"]],["h","四、小妹、牆，與求你快來"],["p","現在我們要面對這一章最需要小心對待的一段：第八到第十節。「我們有一小妹」（歌8:8），後面接著說：「人來提親的日子，我們當為她怎樣辦理？」這段話，說的是一個還年幼的女孩，她的哥哥們，在討論：等到有人來提親的日子，我們要怎麼對待她？"],["p","我們必須先說清楚這一段是什麼。第一，這是一段保護的經文：哥哥們問的，是如何保護她。第二，我們不支持早婚，也不評價任何人的身體。第三，對於未成年或處於弱勢的人，保護優先。這一段，不是用來說「女孩幾歲可以嫁」，也不是用來說「女孩的身體如何」。"],["p","哥哥們的回答，很有意思：「她若是牆，我們要在其上建造銀塔；她若是門，我們要用香柏木板圍護她」（歌8:9）。如果她是牆，就在牆上增建銀塔，加強她；如果她是門，就用香柏木板圍護她，保護她。你看，不論她選擇成為牆，還是門，哥哥們的角色，都是：建造、圍護、守護。"],["p","有學者認為，這一段，是哥哥們的問話，後面是新娘的回答；也有學者認為，是新娘在回憶自己年幼時，哥哥們怎樣對待她。我們不下定論。無論哪一種讀法，核心都是一個：這個年幼的女孩，被看見、被看重，周圍的人，要為她建造保護，而不是利用她。"],["p","然後，第十節，她說：「我是牆」（歌8:10）。這是一個很堅定的宣告。不是「別人說我是牆」，也不是「我被當成牆」，而是「我是牆」。她已經長大，她有自己的界限，她有自己的聲音。接著她說：「那時，我在他眼中像得平安的人」（歌8:10）。她在他眼中，得到平安。這是在保護中，被好好對待的人，會有的樣子。"],["p","請特別聽，這一段對一些人，可能是很痛的。如果你在年幼的時候，沒有被好好保護；如果本來應該保護你的人，沒有盡到責任，甚至傷害了你：我想對你說，那不是你的錯。那是本來該保護你的人，沒有盡責。你值得被守護，你一直是值得的。"],["p","對教會，我們要說：這一段話，是對我們的呼召。教會要成為「牆」與「門」。我們要有制度，保護孩子與弱者；我們要有眼睛，看見危險的徵兆；我們要有行動，在有人受傷的時候，站出來。不要等有人受傷之後，才學習如何保護。若有未成年人涉及傷害，請依法通報，並尋求專業協助。"],["p","接下來，第十一、十二節，出現了兩個葡萄園：所羅門在巴力．哈們有一個葡萄園，他把園子交給看守的人，每個人要交一千舍客勒銀子；而她說：「我自己的葡萄園在我面前」（歌8:12）。你有沒有想起第一章？那裡她說：「我自己的葡萄園卻沒有看守」（歌1:6）。從「沒有看守」，到「在我面前」：這是整卷歌的一個大逆轉。"],["p","第一章，她被迫看守別人的葡萄園，自己的卻荒了；第八章，她自己的葡萄園，就在她面前，由她自己看守。從被使喚的人，變成有自己的園的人；從被別人安排，變成自己擁有。這是愛的醫治：愛，使一個人，回到自己。這不是說她不再與他人連結，而是說，她成了一個完整的人。"],["p","最後，整卷歌的最後一句話，是這樣的：「我的良人哪，求你快來！如羚羊或小鹿在香草山上」（歌8:14）。她說：求你快來。不是「結束」，是「快來」。整卷歌的開頭，是「願他用口與我親嘴」（歌1:2）；結尾，是「求你快來」。從「願」，到「快來」，愛，始終在渴慕裡。"],["p","這是一個很誠實的結尾。聖經沒有給一個「從此以後，過著幸福快樂的日子」的結局。它說：愛，還在路上。我們的愛，我們的盼望，都是還在路上的。以弗所書第五章，把婚姻的奧祕，指向基督與教會；這是新約自己作過的連結，我們可以引用。我們也聽見，整本聖經的結尾，也是一句呼求：主啊，快來。這使我們想起，我們的愛，終究要等到那位良人的再來。"],["d",["8:8–10 的「小妹」是什麼意思？這是在支持早婚嗎？","不是。本講義的立場是：這是一段保護的經文。哥哥們問的是：到有人來提親的日子，我們當怎樣辦理？他們的答案是：她若是牆，我們就在牆上建銀塔；她若是門，我們就用香柏木板圍護她。重點是「建造」與「圍護」，是保護與守護。我們不支持早婚，也不評價任何人的身體。對於未成年與弱勢的人，保護優先。如果你讀到這裡覺得不安，那是對的；這一段不是用來談婚嫁年齡，而是在說：身邊的人有責任，去保護年幼、軟弱的人。"]],["d",["我年幼時沒有被好好保護，讀到這一段很難過，怎麼辦？","請先停下來，不必勉強自己讀完。然後，請聽這句話：那不是你的錯。是本來該保護你的人，沒有盡責。你值得被守護，你一直是值得的。你不需要現在就原諒，也不需要馬上好起來；你有權決定什麼時候說、說給誰聽。如果你願意，可以找一位可信的牧者或專業的輔導，陪你慢慢整理。在小組裡，沒有人有權利追問細節。神看見你，也不嫌棄你；祂沒有要求你，在受傷的地方，假裝沒事。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：用「嫉恨如陰間之殘忍」合理化控制、監視或暴力。這句話說的是愛的忌邪，絕不是要求任何人用「我愛你」去管手機、限制交友、威脅或傷害。檢驗標準：講完之後，被愛的人是更自由，還是更緊張？"],["p","第二個偏差：把 8:8–10 講成「早婚」或「評價身體」。這是保護的經文，哥哥們問的是如何保護；對未成年與弱勢者，保護優先。檢驗標準：講完之後，孩子與弱者是被保護，還是被物化？"],["p","第三個偏差：對曾在年幼時未被好好保護的人，說「你要原諒」。那不是他的錯，是本來該保護他的人沒有盡責。檢驗標準：曾受傷的人聽完，是被擁抱，還是被要求趕快好？"],["p","第四個偏差：把「財寶換愛情，就全被藐視」講成「錢不重要」。重點是愛不能被買賣，也不能用金錢衡量，不是批評貧窮的人。檢驗標準：窮的人與富的人聽完，是否都能被愛，而不是被衡量？"],["p","第五個偏差：把整卷雅歌一次講成「基督與教會」的代號。先讓字面的情詩被聽見；新約自己作過的連結，才可以引用，其餘說「使我們想起」，不說「這是預表」。檢驗標準：會眾是更愛主，還是更佩服解經者？"],["d",["「財寶換愛情就全被藐視」，是不是說錢不重要？","不是。這句話說的是：愛，不能被買賣，也不能用金錢衡量。生活需要錢，這是事實；它不是在否定生活的需要，也不是在批評貧窮的人。一個再有錢的人，也買不到真心的愛；一個再窮的人，也可以擁有真心的愛。窮的人與富的人聽了，都應該能被愛，而不是被衡量。若有人以為，給再多禮物就能代替陪伴，這句話正好提醒他：禮物不能代替在場，錢也不能代替愛。我們可以練習：這週，用時間，而不是用錢，去愛一個人。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：華人文化裡，「愛」與「控制」常常是分不清的。父母查孩子的手機、配偶翻對方的訊息、情侶要求密碼，都說是「因為在乎」。於是，許多人在被控制中長大，也學會了用控制去愛人。雅歌第八章的「愛如死之堅強」，是委身，不是控制；你可以問自己：我的愛，使對方更自由，還是更緊張？如果你正在被控制，請尋求可信的牧者或專業協助。"],["p","第二個問題：華人社會對孩子的保護，常常是沉默的。有些孩子受了傷害，因為怕「家醜外揚」、怕「毀了名聲」，沒有人問，也沒有人說。教會也可能無意中，成為沉默的一部分。「我們有一小妹」這一段話，提醒我們：要有牆，要有門，要有眼睛，要有行動。保護孩子，不是多管閒事，是我們的責任。"],["h","七、活出321——印、牆、快來"],["p","耶穌是我的榜樣：祂把我們刻在手掌上，祂為朋友捨命，這是比死更堅強的愛。祂的愛，從來不控制人，也不監視人；祂的愛，使人自由。我學祂：用委身去愛，不用控制去愛。"],["p","聖經是我的準則：這一章的準則，是保護與自由。我不用「嫉恨如陰間之殘忍」去合理化控制，也不用 8:8–10 去評價任何人的身體或支持早婚。新約自己作過的連結，我才引用。"],["p","聖靈是我的引導：愛如火，火需要被引導，否則會燒毀。聖靈引導我分辨：這份火，是使人更自由，還是更緊張？祂也引導我，在有孩子與弱者需要保護的時候，站出來。"],["p","讓耶穌作王：我放下的，是用愛去控制人的權力。王用愛使人自由，我也學會用愛使人自由。我也放下「我必須完美」的權力，學會靠著良人，從曠野上來。"],["p","讓耶穌得著一切的榮耀：我被放在心上如印記，我能夠守護人、保護人，都不是因為我強，而是因為愛的源頭是神。我若成為一道牆、一扇門，那是恩典；一切的榮耀，歸給那位愛我們到底的主。"],["p","建立屬神的體系：一個屬神的團體，是有牆、有門、有眼睛、有行動的地方。孩子與弱者，在這裡被保護；每一個人，在這裡被放在心上，不被控制。愛，在這裡仍然趕路，仍然呼求：主啊，快來。"],["h","八、四種心，一枚印記"],["p","驕傲型的心，把愛當成一種擁有。他以為「我愛你」，就有權管你、查你、決定你。驕傲，就是離開本位，抓住不屬於我的權力：管理另一個人的自由。他需要學的，是放手：愛，是把人放在心上，不是把人抓在手裡。"],["p","恐懼型的心，怕失去，所以抓得很緊。「愛如死之堅強」，他聽成了「我必須抓緊，否則會被奪走」。他需要的，是一個安靜的提醒：愛的堅強，是不離不棄的委身，不是怕得要死的控制。他可以慢慢練習，把手鬆開一點。"],["p","羞恥型的心，不相信自己可以被放在別人心上。他覺得自己不夠好，不值得成為印記。他需要聽見：愛，不是你配得，而是被給予；你可以被放在心上，不需要先變好。這也需要時間，需要有人，一遍一遍地說。"],["p","受傷型的心，曾被人用「愛」控制、監視、傷害。他對「愛如死之堅強」、「嫉恨如陰間之殘忍」，特別敏感。我們不催他原諒，也不說「你要信任」；先讓他知道：那不是愛，那不是你的錯。然後，陪他慢慢找回，什麼是被自由地愛。"],["h","九、這一週，你可以做的幾件事"],["p","第一，這週檢查你的「愛」：有沒有一個人，是你用「我愛你」去管他的？選一件事，放手。"],["p","第二，如果你正在被控制，這週找一位可信的牧者或專業輔導，說一次。不需要全部，只需要說：我需要幫助。"],["p","第三，如果你是父母或教會同工，這週檢查一次：我們的孩子，有沒有一個安全的地方，可以說出不舒服的事？"],["p","第四，這週為一個你愛的人，做一件不求回報的小事，不讓他知道是誰做的。"],["p","第五，把雅歌八章十四節，寫在一張卡片上：「求你快來」，每天讀一遍，為主再來的日子禱告。"],["p","我宣告：我被放在主的心上如印記，我不需要被控制，也不需要控制別人。"],["p","我宣告：我要用自由的愛，去愛人；愛如死之堅強，卻使人更自由。"],["p","我宣告：我要成為一道牆、一扇門，保護孩子與弱者，不沉默，不推卸。"],["p","我宣告：愛仍在路上，我盼望，我呼求：主啊，求你快來。"],["d",["整卷雅歌讀完了，我要怎麼把它放進日常，而不只是讀過就算？","可以選一個最小的行動，用一週的時間去做。第一，如果你學到的是「說願」，每天對主說一句：「主，我渴。」第二，如果你學到的是「不控制」，選一個你一直想控制的人，這週放手一件事。第三，如果你學到的是「保護」，檢查一次：你的家庭或教會，有沒有一個安全的地方，讓孩子與弱者可以說出不舒服的事？第四，如果你學到的是「快來」，把這節經文寫在卡片上，每天為主再來禱告。不要一次做太多，一件，就夠了。"]],["h","十、結語"],["p","雅歌，從第一章的「願」，走到第八章的「快來」。從一個人在曠野裡的渴，到兩個人靠著，從曠野上來。愛，是被放在心上的印記，是自由的火，是牆與門的保護，是仍在路上的盼望。"],["p","這整卷書，是神給人的一首情詩。祂沒有把愛寫成一堂課，一個規條，一套技巧；祂把愛寫成一首歌。歌裡有渴，有傷，有尋找，有失落，有歸屬，有戀慕，有保護，有呼求。每一個人，都可以在歌裡，找到自己的聲音。"],["p","所以，如果你一直在渴，我要對你說：你可以說「願」。如果你一直在受傷，我要對你說：那不是你的錯。如果你一直在尋找，我要對你說：你不是一個人。我們一起把焦點放回耶穌：不在自己的渴，不在別人的眼光，不在環境的重壓，只在那位把我們放在心上如印記的主。"],["p","讓我們禱告：親愛的主，謝謝祢把我們放在祢的心上如印記。求祢醫治我們被控制、被傷害的愛，使我們學會用自由去愛人。求祢使我們成為牆與門，保護孩子與弱者。我們盼望，求祢快來。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：愛如死之堅強，卻使人自由；愛不是控制的理由；愛需要牆與門的保護；愛仍在路上。"],["n","1. ★ 用自己的話說一遍：這一章裡「印、牆、快來」三個詞，各說了什麼？"],["n","2. ★★★ 第八章的「愛如死之堅強」，和「愛是控制」有什麼不同？用「使人更自由，還是更緊張」這個標準，說說你的看法。"],["n","3. ★★ 第一章她說「我自己的葡萄園卻沒有看守」，第八章她說「我自己的葡萄園在我面前」。這個轉變，對你有什麼提醒？"],["n","4. ★ 整卷歌從「願」走到「快來」。為什麼聖經沒有給一個「從此幸福快樂」的結局？"],["m","帶領提醒：這一課碰到控制、年幼時未被保護與暴力的經驗，請放慢。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助；涉及未成年人時，請依法通報；有立即危險，請聯絡當地緊急電話。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命。"],["t","【看】看見自己"],["n","5. ★★ 你在哪一段關係裡，曾用「我愛你」去管、去查、去限制？或者，曾被這樣對待？（不必說細節）"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，聽這一句：「求你將我放在你心上如印記。」你心裡第一個反應是什麼？"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你不敢放手？是怕失去、怕被拋棄，還是過去的傷？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，其中一人說：「我需要學習放手的是……」；另一人只回答：「謝謝你告訴我，我在這裡。」"],["t","【行】走一步"],["n","9. ★★ 這一週，你要放手哪一件事，或在哪一個地方，成為一道牆、一扇門？寫下名字與時間。"],["m","帶領提醒：這一化可能有人曾被控制、被傷害。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助；涉及未成年人時，請依法通報；有立即危險，請聯絡當地緊急電話。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課帶進本週的生活：用自由去愛、成為牆與門、操練 920、把這一課傳出去。"],["n","10. ★★ 你的家庭或教會，有沒有一個安全的地方，讓孩子與弱者可以說出不舒服的事？你可以先改善哪一件小事？"],["n","11. ★★★ 920 操練：找出那一位你一直想控制的「2」，現場說出他的名字，並說這週你要用哪一種聖靈的果子，代替控制。"],["n","12. ★★ 如果你帶小組或帶孩子，你要怎麼談「愛」與「控制」的差別？你的第一句話會是什麼？"],["n","13. ★ 「求你快來」是整卷歌的最後一句。這週你要怎麼用一個具體的方式，練習盼望主再來？"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說「愛如死之堅強」，第二句說「愛不是控制的理由」，第三句說「愛仍在路上，求你快來」。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助；涉及未成年人時，請依法通報；有立即危險，請聯絡當地緊急電話。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，求你把我的弟兄（姊妹）放在你心上如印記；求你使他在愛裡得自由，也使他成為別人的牆與門。」然後彼此說：「你被放在祂心上，你是被愛的。」最後，全組一起說：「主啊，求你快來。」由一位帶領者簡短禱告結束。"]]}}}</script>

  /* ── 帶入詞 ────────────────────────────────────────────────────────

    /* 開始：{t} 是這一課的名字 */
    start: [

    startBare: [
      '我們開始。',

      '我們一起來讀這一段。',

    resume: [

  /* 表格與條列讀出來的零件。

    rowFirst: ['先看', '我們先看', '第一個'],
    rowMid: ['再看', '接著', '然後', '再來', '接下來'],
    rowLast: ['最後'],
    cols: '這張表有{n}欄：{list}。',

    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {

      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

  function title_(t) {
    return String(t == null ? '' : t).replace(/[。．.\s]+$/, '');
  }

  function start(title, i) {
    var t = title_(title);
    if (!t) return pick('startBare', i);

  }

  function startAt(n, title, i) {
    var t = title_(title);
    var v = { n: num(n), t: t };
    if (!t) return fill(pick('startAtBare', i), v);
    return fill(pick('startAt', i), v);
  }

  function resume(n, i) {
    return fill(pick('resume', i), { n: num(n) });
  }

  function pause(i) { return pick('pause', i); }
  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────
   * 只認小智真的會用到的那幾種：標題、粗體、條列、編號、表格、引用、行內碼。
   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

  function cells(l) {
    var t = String(l).replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    var out = t.split('|'), i;
    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  /* 把整段切成一塊一塊：段落、標題、條列、編號、表格、引用 */
  function blocks(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.replace(/\s/g, '')) { i++; continue; }

      if (isTableLine(l) && i + 1 < lines.length && isDivider(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push({ k: 'table', head: head, rows: rows });
        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;

      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

  function inlineHTML(t) {

      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }
  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  const songName = s => EN ? (s.ne || s.n) : (isSC() ? (s.ns || s.n) : s.n);

    if (hymnEl) return hymnEl;

    hymnEl.setAttribute('playsinline', ''); hymnEl.setAttribute('webkit-playsinline', '');

  function hymnPlay(i) {
    const s = hymns && hymns[i]; if (!s) return;
    const a = hymnAudio();
    if (hymnPrev === i) { hymnStop(); return; }
    hymnStop();
    const base = songBase[s.f] != null ? songBase[s.f] : '';
    a.src = SITE + base + encodeURIComponent(s.f);
    const p = a.play(); if (p && p.catch) p.catch(() => {
      if (base === '') { a.src = SITE + 'music/' + encodeURIComponent(s.f); const p2 = a.play(); if (p2 && p2.catch) p2.catch(() => say(T('這首歌暫時放不出來', 'This song could not play'))); }
    });
    hymnPrev = i;
    const b = q1('#gxhp' + i); if (b) b.textContent = '⏸';
  }
  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();
        if (!blob.size || /text\/html/.test(blob.type || '')) { why = T('檔案不對', 'bad file'); continue; }
        songBase[s.f] = b;
        return blob;
      } catch (e) { why = T('網路', 'network'); }
    }
    throw new Error(why || 'fail');
  }

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){

  function assemble(mdatStart){
    const newTraks=[];

      const tkc=mx_children(b,tk);
      const tkhd=mx_one(tkc,"tkhd");
      const v=b[tkhd.body];

      const mdia=mx_one(tkc,"mdia");
      const mdc=mx_children(b,mdia);
      const mdhd=mx_one(mdc,"mdhd");
      const mv=b[mdhd.body];
      const mts=mx_u32(b,mdhd.body+(mv===1?20:12));

      const mdhdBuf=b.slice(mdhd.start,mdhd.end);
      if(mv===1)writeU64(mdhdBuf,mdhd.body-mdhd.start+24,dur);
      else writeU32(mdhdBuf,mdhd.body-mdhd.start+16,dur);

      const minf=mx_one(mdc,"minf");

      const stblParts=parts.map(x=>x.__co?mx_box("co64",x.data):x);

      const minfParts=mic.map(x=>x.type==="stbl"?newStbl:b.slice(x.start,x.end));

    let maxDur=0;

      let d=0;tk.samples.forEach(s=>d+=s.dur);

    if(b[mvhd.body]===1)writeU64(mvhdBuf,mvhd.body-mvhd.start+24,maxDur);
    else writeU32(mvhdBuf,mvhd.body-mvhd.start+16,maxDur);

    return mx_box("moov",mvhdBuf,...newTraks);
  }

  function writeU32(buf,p,v){buf[p]=(v>>>24)&255;buf[p+1]=(v>>>16)&255;buf[p+2]=(v>>>8)&255;buf[p+3]=v&255;}
  function writeU64(buf,p,v){const hi=Math.floor(v/4294967296),lo=v>>>0;

  const ftypBuf=ftyp?b.slice(ftyp.start,ftyp.end)

  const mdatHead=new Uint8Array(16);

  writeU32(mdatHead,8,hi);writeU32(mdatHead,12,lo);

  const out=new Uint8Array(ftypBuf.length+moovNew.length+16+mdatSize);
  let p=0;
  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;
  order.forEach(o=>{out.set(b.subarray(o.off,o.off+o.size),p);p+=o.size;});

    try { mr = new MediaRecorder(stream, Object.assign(mime ? { mimeType: mime } : {}, { videoBitsPerSecond: 2200000 })); }
    catch (e) { cancelAnimationFrame(recAnim); say(T('這台裝置不能錄影片', 'This device cannot record video')); return; }
    chunks = []; recSec = 0;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearInterval(recTimer); cancelAnimationFrame(recAnim); curFade = null; recFading = false;
      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}
      const type = mr.mimeType || mime || 'video/webm';
      await finishRec(new Blob(chunks, { type }), type, 'video');
    };
    mr.start(1000);
    try { await bgmEl.play(); } catch (e) {}
    fadeIn(mcGain, ac, 1, 0.6);
    curFade = () => fadeOutStop(mcGain, ac, BGM_FADEOUT);
    const len = +st().mc;
    bgmEl.onended = () => { if (recOn()) mr.stop(); };
    bgmEl.ontimeupdate = () => {
      if (len > 0 || recFading || !isFinite(bgmEl.duration)) return;
      const left = bgmEl.duration - bgmEl.currentTime;
      if (left <= BGM_FADEOUT && recOn()) fadeOutStop(mcGain, ac, Math.max(.5, left));
    };
    const lim = len > 0 ? len : 8 * 60;
    setTimeout(() => { if (!recFading && recOn()) fadeOutStop(mcGain, ac, BGM_FADEOUT); }, Math.max(0, lim - BGM_FADEOUT) * 1000);
    setTimeout(() => { if (recOn()) mr.stop(); }, lim * 1000 + 300);
    paint();
    recTick(T('音樂卡片製作中', 'Making music card') + '　♪');
  }

function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = LASTCH;

      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur + .5).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="雅歌全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">渴 · 尋 · 讚 · 印</p></div>`;
}
