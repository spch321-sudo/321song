<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雅歌講義">
<meta name="application-name" content="321雅歌講義">
<meta name="description" content="321雅歌講義：全書八章逐節原文解經、講章逐字稿、教學講章與321生命應用。">
<title>321雅歌講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

{"ch":[{"n":1,"t":"願他親我，願你吸引我","sub":"渴、傷、尋","lv":"C","arc":"渴","sec":[["1:1--1","篇名——歌中的雅歌"],["1:2--4","渴慕與香膏——先說「願」，再說「快跑」"],["1:5--6","「我雖然黑，卻是秀美」——被日頭曬黑，被弟兄使喚"],["1:7--8","「你在何處牧羊」——尋找的第一句，與一串腳蹤"],["1:9--14","良人的讚美與香氣——金辮銀釘，一袋沒藥"],["1:15--17","彼此讚美——以青草為床榻"]],"serm":{"pts":[["願他親我","1:2--4","愛從開口說「願」開始：承認自己有渴，是愛的第一步。"],["不要輕看我","1:5--6","被日頭曬黑、被弟兄使喚的人，仍然可以說「我秀美」。"],["你在何處牧羊","1:7--17","愛的第一個動作是去問、去找，而被愛的人先聽見的是：你美。"]]},"q":"一個人說「我渴」，是不是不夠屬靈？雅歌第一章的開口，不是信心的宣告，是一個「願」：「願他用口與我親嘴。」整本聖經最高的一首歌，從一個承認缺乏的人開始。她渴，她被日頭曬黑，她不知道他在哪裡；而良人的第一句回答，不是糾正，是稱呼——「你這女子中極美麗的」，然後給她一串腳蹤，讓她跟著走。","truth":"愛從承認「我渴」開始；被愛的人不必先變好，因為稱呼在前、改變在後——先被叫作「極美麗的」，才有金辮銀釘。","mv":{"t":"願你吸引我，我們就快跑跟隨你。","r":"歌1:4"},"card":["全卷的第一章，是一個新娘的開口：她渴慕良人，也承認自己被日頭曬黑、被弟兄使喚、不知道他在何處牧羊；良人稱她「極美麗的」，指給她腳蹤的方向，兩人以讚美和青草為床榻作結。","愛不是先把空補滿，而是先說「願」：她先被吸引（מָשַׁךְ，拉、吸引），然後才快跑。","被愛在前，改變在後（現在式，持續地）：良人先稱她「極美麗的」，再為她編上金辮；恩典不是獎賞好人，是先給名字，再給裝飾。","無己，不是假裝不需要，而是敢說「我渴、我曬黑了、我不知道你在哪裡」；承認空，才有地方讓祂進來。","「你若不知道，只管跟隨羊群的腳蹤去。」","今天，用一句沒有修飾的話對主說出你的渴；再說出一個你不想被人看見的「曬黑」之處。","最終整合：她站在眾人面前，先自己說出來：\n「我雖然黑。」\n不是因為不痛，\n是因為她知道，有人在等她開口。\n\n她問：你在哪裡？\n沒有人責備她連他在哪裡都不知道。\n只有一個聲音說：你這女子中，極美麗的。\n跟著腳蹤去。\n\n愛，不是先把空補滿。\n愛，是先說：願。\n\n無己不是沒有；\n無己，是敢說「我渴」，\n然後被吸引，然後快跑。\n\n你不必等到有房子，\n不必等到有時間，\n不必等到一切整理好。\n青草，今天就是床榻；\n田野，今天就是殿。\n你在哪裡，就在那裡，\n跟著腳蹤，走向祂。"],"self":"有己的定義：怕被看見自己的渴與缺，把自己擺成好看的樣子，離開本位，靠用力撐住，而不是被愛吸引。","t321":{"k":"耶穌是我的榜樣：祂在井邊說「給我水喝」，在十字架上說「我渴了」。\n> 祂不假裝不需要。\n> 所以我也可以先說真話，再談服事。","g":"讓耶穌作王：這一章要我交出的，是「我要看起來很好」的權力。\n> 王不是先要我完美，王是先稱我「極美麗的」。\n> 我放下的是修飾，不是尊嚴。","p":"建立屬神的體系：一個屬神的團體，是可以說「我渴」的地方。\n> 不是每個人都擺出屬靈的樣子，而是每個人都可以在這裡被稱呼、被指路。\n> 羊群的腳蹤，是同行，不是表演。"},"grp":["【一、破冰】你最近一次對一個人說「我很想念你」，是什麼時候？說出來之前，你擔心什麼？","【二、扎心】歌1:2的第一個字是「願」，歌1:4是「願你吸引我，我們就快跑」。你信主以來，比較常靠「用力跑」還是靠「被吸引」？舉一個最近的例子。","【三、福音】歌1:5–6她說自己被日頭曬黑、被弟兄發怒。你有沒有一個「被曬黑」的地方，是你一直想遮的？不必說細節，只說它存在。","【四、行動】歌1:8良人沒有責備她不知道他在哪裡，而是指一條路：跟著腳蹤走。這一週，你可以跟著哪一個人（或哪一種習慣）的腳蹤，靠近主一步？","【五、代禱】請兩人一組，各用一句沒有修飾的話對主說：「主，我渴。」然後互相說：「你這女子（你這弟兄）極美麗，在祂眼中。」"],"prac":{"main":"這一週，每天用一句沒有修飾的話對主說：「主，我渴。」","items":["對神：每天一句，不用禱告稿——「主，我渴」或「主，祢在哪裡」。","對自己：寫下一個你一直想遮住的「曬黑」之處，不改它，只對自己說：這是真的。","對人：找一位你信任的人，說一句真話：「我最近有點累，你可以陪我禱告嗎？」","對生活：選一個你平常靠意志力撐的習慣，改成先問「我是被吸引，還是被逼迫？」","對使命：在帶領人之前，先讓自己被帶領——找一個你跟隨的腳蹤，寫下他的名字。"]},"safe":["① 把雅歌第一章講成「愛情技巧課」或「談戀愛指南」","雅歌是情詩，不是技巧手冊。第一章的重點是渴慕與被接納，不是如何追到誰。","檢驗標準：講完之後，會眾是更認識「被愛的安全」，還是只學到了怎麼說甜言蜜語？","② 用「我雖然黑，卻是秀美」去評論任何人的膚色","這句話的重點是被日頭曬過、被弟兄使喚的處境，以及「不要輕看我」的心聲；不是膚色的等級，也不是對任何族群的評價。","檢驗標準：這句話在你口中，是在保護一個被輕看的人，還是在替某種外貌下結論？","③ 為了「屬靈」，立刻把每句話翻成代號","先聽字面的情詩，再讓會眾自己聽見神與祂百姓的愛；不要在第一章就說「這就是預表」。新約自己作過的連結，才可以引用。","檢驗標準：你有沒有先讓會眾聽見她的聲音，再談屬靈的意義？"]},{"n":2,"t":"百合在荊棘中，良人在牆外","sub":"看見、邀請、守護","lv":"C","arc":"渴","sec":[["2:1--3","百合與蘋果樹——在眾人中被看見"],["2:4--7","「以愛為旗」與「不要叫醒」——安息與等候"],["2:8--15","良人的聲音——「起來，與我同去」，春天與小狐狸"],["2:16--17","「良人屬我，我也屬他」——互屬，與黃昏"]],"serm":{"pts":[["百合在荊棘中","2:1--7","被愛的人，是被一雙專注的眼睛，從眾人中看見的人。"],["起來，與我同去","2:8--14","愛的邀請站在牆外，不闖進來，只等你自己起身。"],["屬於，也要守護","2:15--17","愛是彼此歸屬，也要一起擒拿毀壞葡萄園的小狐狸。"]]},"q":"愛是被一雙專注的眼睛，從眾人中看見。她說「我是谷中的百合」，他說「在荊棘內」。然後，最安靜的邀請來了：良人翻山越嶺，卻停在牆外，從窗戶往裡看，說「起來，與我同去」。他有力量闖進，卻選擇站在窗外等。雅歌第二章問每一個人：你的牆裡有沒有一個冬天？而那個站在窗外的聲音，是催促，還是尊重？","truth":"愛的邀請站在牆外，不闖進來；站在窗外的那一位說了兩次「起來」，然後繼續等待——因為愛只有在自由裡，才是愛。","mv":{"t":"我良人對我說：我的佳偶，我的美人，起來，與我同去！","r":"歌2:10"},"card":["第二章以一朵花開始，以一個黃昏結束：她與良人互相讚美，坐在他的蔭下，被他的旗庇護；他在春天的窗外呼喚她起來；兩人要一同擒拿毀壞葡萄園的小狐狸，並彼此歸屬。","在荊棘中被一雙眼睛看見，是愛的第一個動作；不是比較誰更美，而是專注於「你」。","祂先來到牆外，不破門而入（現在式）：祂的邀請是兩次「起來，與我同去」，不是一次的闖入。恩典尊重人的自由。","無己，是不再為位置爭取、為被看見焦慮：坐在祂的蔭下，歡歡喜喜，就是安息。","「起來，與我同去。冬天已過，我在窗外等你。」","這週找出一隻「小狐狸」，一件小事，現在就處理，不等它毀壞整座園。","最終整合：冬天太長了，\n長到她忘記窗外有春天。\n\n然後，她聽見一個聲音。\n不是砸門，是在窗外，\n輕輕說：「起來，與我同去。」\n\n他有力量躥山越嶺，\n卻在她的牆外停住。\n他說兩次，然後等。\n\n愛，不催。\n愛，等你自己情願。\n\n無己不是沒有；\n無己，是在祂的蔭下坐下來，\n讓旗，插在我頭上。\n\n冬天，也許還在；\n小狐狸，也許還沒抓。\n但窗外有聲音，\n黃昏時，祂說：我會轉回。\n你只要說：好，我聽見了。\n\n愛，從來不是搶來的。\n愛是被邀請，也是被尊重。"],"self":"有己的定義：用力證明自己配得，為位置和比較焦慮，不敢在祂的蔭下坐下，離開本位，抓住不屬於自己的掌控。","t321":{"k":"耶穌是我的榜樣：祂站在門外叩門，祂問瞎子「你要我為你做什麼」。\n> 祂不替人決定，祂等人情願。\n> 我在帶領人的時候，要學祂的站位。","g":"讓耶穌作王：這一章要我放下的，是「催促別人」與「替人決定」的權力。\n> 王的邀請站在牆外。\n> 我也不用拆別人的牆。","p":"建立屬神的體系：兩個人一起擒拿小狐狸，是「我們的葡萄園」的責任。\n> 屬神的體系，不是靠大風暴保護，而是靠一起處理小事、早早說出口。\n> 在家庭、在教會，都是。"},"grp":["【一、破冰】說一個你生命裡的「春天」時刻——有人叫你出門、起身、重新開始。誰？怎麼做的？","【二、扎心】歌2:7說「不要驚動、不要叫醒，等他自己情願」。你有沒有曾經被催著表態、被替你決定的經驗？或是你曾經催過別人？","【三、福音】歌2:9–10良人站在牆外、窗邊，說「起來，與我同去」。你的牆裡有沒有一個冬天？你想不想把窗開一條縫？","【四、行動】歌2:15小狐狸毀壞葡萄園，是因為葡萄正在開花。你的家庭或關係裡，有沒有一隻「小狐狸」，現在就可以處理？誰會與你一起？","【五、代禱】兩人一組，說出一個「冬天」，彼此禱告：「主，祢站在窗外，求祢使他聽見春天。」"],"prac":{"main":"這一週，找出一隻小狐狸，一起處理。","items":["對神：每天五分鐘，把窗開一條縫，只說：「主，我聽見了。」","對自己：問「我知道自己被愛嗎？」不為位置焦慮，坐下來五分鐘。","對人：在一個你很想催促的人面前，先問：「你準備好的時候，告訴我。」","對生活：找出一件「一直沒說的對不起」或「答應了沒做的小事」，這週做。","對使命：在帶領人時，用邀請，不用壓力；先寫下你會怎麼說「起來，與我同去」。"]},"safe":["① 把「不要叫醒」講成「不要談感情／婚姻」","這句話的重點是尊重同意與等候，不是壓抑感情，也不是替人決定時機。","檢驗標準：會眾聽完，是更懂得尊重人的自由，還是更怕談愛？","② 用「等他自己情願」去要求被傷害的人沉默或等待","這句話保護人的選擇，絕不是要求任何人在壓力下回應，或把虐待、威脅當作「等待」的一部分。","檢驗標準：這句話是在保護一個人說「不」的權利，還是在要求他忍耐？","③ 把「小狐狸」講成羞辱會眾的罪名清單","小狐狸是日常小事，會毀壞正在開花的關係；講的目的是一起早處理，不是點名誰有問題。","檢驗標準：講完之後，會眾想的是「我們一起來處理」，還是「我被指責了」？"]},{"n":3,"t":"夜裡，我起來尋找我心所愛的","sub":"尋、拉、冠","lv":"C","arc":"尋","sec":[["3:1--2","夜裡的尋找——「我尋找他，卻尋不見」"],["3:3--5","找到了——「我拉住他，不容他走」與副歌"],["3:6--8","曠野上來的行列——六十個勇士守夜"],["3:9--11","華轎與冠冕——裡面鋪的是愛，母親給他戴上"]],"serm":{"pts":[["找不到的夜","3:1--2","找不到的夜，被如實記在神的話裡，不被責備；愛要起來行動。"],["找到，不容他走","3:3--5","找到之後抓緊，終點是被祝福的家；愛也要把時間交給愛。"],["裡面鋪的是愛","3:6--11","最華麗的行列，最要緊的，是轎裡鋪的東西。"]]},"q":"你有沒有在半夜醒來，腦子裡只有一個人的名字？雅歌第三章從這樣的夜開始：「我尋找他，卻尋不見。」聖經沒有責備她，也沒有急著安慰她。找不到的夜，被如實記進神的話裡；而她沒有停在床上，她起來，走進街市。找到之後，她拉住他，把他領回母親的家。這一章回答兩個問題：找不到的時候，怎麼辦？找到之後，怎麼愛？","truth":"找不到的夜不是失敗，是愛的一部分；找到之後，真正的愛是把人帶進光中，而不是藏起來——最華麗的轎，最要緊的是裡面鋪的是愛。","mv":{"t":"我剛離開他們就遇見我心所愛的。我拉住他，不容他走，領他入我母家，到懷我者的內室。","r":"歌3:4"},"card":["一個女子在夜裡躺臥，想念，尋不見；她起來遊行城中，問看守的人，剛離開他們就遇見所愛的，拉住他、領他回母家；接著，曠野上來一個有六十勇士守護的婚禮行列，轎裡鋪的是愛，冠冕是母親戴上的。","尋找要「起來」：想念可以在床上，尋找必須動身；愛要行動，也要承擔找不到的那一刻。","祂先尋找我們（現在式）：人子來是要尋找、拯救失喪的人；我們的尋找，是在被尋找的愛裡發生的。","無己，是敢承認「我還在找」，不假裝已經找到；價值不在我找到多少，而在我所愛的那一位。","「你不必看見路，只要知道誰在愛你。我在這裡，守夜。」","這一週，為一個睡不著的人守夜：打一通電話、陪一個晚上；不給道理，只說「我陪你」。","最終整合：凌晨三點，\n她睡不著，\n她的心裡只有一個名字。\n\n聖經沒有說「不要怕」，\n只說：她起來了。\n街市、寬闊處，她都走了。\n\n她問看守的人：你們看見他沒有？\n沒有人答。\n她剛轉身，就遇見了。\n\n她拉住他，不放手，\n卻是把他領回母親的家，\n領回有人認得她、也祝福她的地方。\n\n愛，不是把人藏起來。\n愛，是把人帶進光中。\n\n最華麗的轎，\n銀的柱、金的底、紫的墊，\n都是外面。\n最裡面，鋪的是愛。\n\n無己不是沒有；\n無己，是承認我還在找，\n然後，被找到。"],"self":"有己的定義：不敢讓人看見自己還在尋找，假裝已經找到、已經夠屬靈，離開本位，用「我很好」守住位置。","t321":{"k":"耶穌是我的榜樣：祂為一隻走失的羊，把九十九隻留在曠野去找。\n> 祂也在夜裡尋找。\n> 我要學的，是不放棄任何一個走失的人。","g":"讓耶穌作王：這一章要我放下的，是「抓住人、控制人」的手。\n> 「不容他走」若變成鎖，就不是愛。\n> 王把人帶進光中，不把人藏在身邊。","p":"建立屬神的體系：她把他領進「母家」，一個認識她、祝福她的家。\n> 屬神的體系不是只有兩個人的小圈，而是有守夜的人、有母家、有冠冕的見證。\n> 教會要成為有人守夜的地方。"},"grp":["【一、破冰】說一個你睡不著的夜晚，那時你腦子裡想的是誰？（不必說原因，只說那個夜）","【二、扎心】歌3:1–2她「起來」。你有沒有一件事，已經想了很久，卻一直沒有起來做？是什麼？","【三、福音】歌3:4她拉住他，領他入母家。你抓住的人，是因為愛，還是因為怕失去？你怎麼分辨？","【四、行動】歌3:7–8有六十個勇士守夜。你的身邊有沒有一個正在夜裡的人？這週你可以做什麼，陪他守夜？","【五、代禱】為一位「找不到」的人代禱：「主，祢知道他在夜裡，求祢使他剛離開，就遇見。」"],"prac":{"main":"這一週，為一個在夜裡的人守夜。","items":["對神：不假裝找到了，誠實地對主說一句：「我還在找祢。」","對自己：找不到的時候，不責備自己；寫下「這是愛的一部分」。","對人：打一通電話給一位正在黑夜裡的人，只說：「我陪你。」","對生活：檢查你「抓得很緊」的一個人或事，問：這是愛，還是怕？","對使命：寫下一件你想「起來」做的事，這週走第一步。"]},"safe":["① 把「找不到」講成「信心不夠」或「有罪」","聖經把找不到的夜如實記錄，沒有責備；詩篇裡也有人在夜裡淚濕床鋪。","檢驗標準：聽的人是更敢誠實，還是更覺得自己屬靈失敗？","② 把「我拉住他，不容他走」講成「要抓緊對方」","「不容他走」是失而復得的情感，終點是領他進母家，不是控制、監視、切斷對方的關係。","檢驗標準：這句話在你口中，是把人帶進光中，還是把人鎖在身邊？","③ 把婚禮與冠冕講成「人人都該結婚」","單身不是不完整；這一節是在說愛被祝福的喜樂，不是對任何人說「你欠缺了什麼」。","檢驗標準：單身的弟兄姊妹聽完，是被祝福，還是被比下去？"]},{"n":4,"t":"關鎖的園，門由她自己打開","sub":"看、下、開","lv":"B","arc":"尋","sec":[["4:1--7","細看與讚美——被愛的人，被完整地看見"],["4:8--11","「與我一同離開黎巴嫩」——奪了我的心"],["4:12--15","關鎖的園，活水的井——珍貴所以有界限"],["4:16--16","北風南風——她自己說：願我的良人進入自己園裡"]],"serm":{"pts":[["被細看，不羞愧","4:1--7","安全的愛，讓人可以被完整地看見，而不覺得羞恥。"],["你奪了我的心","4:8--11","愛的召喚，把人從遙遠與孤立中，帶到近處。"],["關鎖的園，自己開門","4:12--16","界限是福分的守護；門，要由園子的主人自己打開。"]]},"q":"被人細細地看，也不羞愧——有這種愛嗎？雅歌第四章，良人從頭到腳讚美她，說「你全然美麗，毫無瑕疵」。然後他說：你是關鎖的園、禁閉的井。園有牆，不是壓抑，是因為裡面有珍貴的東西。而這一章最重要的一句話，不是他說的，是她說的：「願我的良人進入自己園裡。」門，是她自己開的。","truth":"安全的愛，讓人被完整地看見也不羞愧；珍貴的園有牆有鎖，而鑰匙在園主人的手中——門，只能由她自己打開。","mv":{"t":"我的佳偶，你全然美麗，毫無瑕疵！","r":"歌4:7"},"card":["良人細細讚美新娘的美，稱她「毫無瑕疵」，請她與他一同下山；他說她是關鎖的園、禁閉的井，同時是流動的泉；最後她自己呼喚北風南風，說願良人進入自己的園。","愛的眼光看見一個「完整的人」：不是在清單上打分，而是說「你全然美麗」。","祂用愛的眼睛看我們（現在式）：不放大我們的缺點，而是看見我們在祂裡面所成為的樣子；祂的接納在前，不是我們變好之後。","無己，是把鑰匙自己交出去：不是被奪走，而是因為認識祂、信任祂，自己打開門。","「我看見你，全部的你。我在門外等你開門。」","這週用一句「滴蜜的話」稱讚一個人；並對主說：這一個我最怕的角落，請進來。","最終整合：他細細地看她，\n一處一處，用他最愛的畫面：\n基列山的羊群，洗淨的羊，石榴，高臺。\n然後他說：「你全然美麗，毫無瑕疵。」\n\n不是因為她沒有疤，\n是因為他愛她，連疤都看見了。\n\n他說：你是園，有牆，有鎖。\n因為珍貴。\n他沒有翻牆。\n他等。\n\n等到北風興起，\n等到她自己開口：\n「願我的良人進入自己園裡。」\n\n門，是她自己打開的。\n\n如果你的園，曾被闖入，\n那不是你的錯，\n你的園，仍然是你的園，\n仍然珍貴。\n\n無己不是沒有；\n無己，是自己，把鑰匙，交出去。"],"self":"有己的定義：把羞恥藏在牆後，躲在高山與深洞，以為只有隱藏才會被愛；離開本位，不敢被看見、也不敢自己開門。","t321":{"k":"耶穌是我的榜樣：祂對一個被看不起的女人說「我也不定你的罪」，祂看見她的全部，仍然叫她站起來。\n> 祂的眼光不是放大鏡。\n> 我用同樣的眼光，看待別人與自己。","g":"讓耶穌作王：把整座園交給祂，是我自己的決定，不是被逼的。\n> 王不闖門，等我打開。\n> 我放下的，是「我自己守住一切」的權力。","p":"建立屬神的體系：園有牆、有鎖、有泉水；好的界線不是隔絕，而是讓水流得更清。\n> 屬神的體系，是保護珍貴、同意先行、人人都有自己的門。\n> 教會是安全的園，不是公共的路。"},"grp":["【一、破冰】說一個你小時候被人稱讚的外表或特質，那句話你記到現在嗎？","【二、扎心】歌4:7「毫無瑕疵」。你有沒有一個地方，你一直不敢給人看？不用說細節，只說：它存在。","【三、福音】歌4:8良人請她從高遠的山上下來，與他同去。你有沒有一座「山頂」或「洞穴」，是你自己躲起來的地方？","【四、行動】歌4:16門是她自己開的。你有沒有一個領域，你還沒有把鑰匙交給主？這週先交出一個角落，是哪一個？","【五、代禱】兩人一組：「主，祢看見他全部，求祢醫治他被闖入的地方，使他知道他仍然珍貴。」"],"prac":{"main":"這一週，說一句滴蜜的話，並交出一個角落。","items":["對神：把最怕的一個角落交出來，說：「主，這一塊，請進來。」","對自己：對著鏡子，說一句不帶評價的話，不比較。","對人：對一個很久沒被稱讚的人，說一句真實的好話。","對生活：檢查你的話語——在家裡是蜜還是刺？選一個場合，改成蜜。","對使命：若你在帶領人，確認：我是否尊重每個人自己決定開門的權利？"]},"safe":["① 把身體的讚美講成「評論別人的身體」","這是丈夫對妻子私下說的情話，不是公開的評分清單；比喻來自田園與城牆，重點是完整、潔淨、尊嚴。","檢驗標準：聽完之後，會眾是更感到被珍愛，還是更焦慮自己的身體？","② 把「關鎖的園」講成「性是羞恥的」","聖經不說性是羞恥，園是有果子、有香氣、有泉水的美地；因為珍貴，所以有界限。","檢驗標準：年輕人聽完，是覺得被守護、被看重，還是覺得自己被壓抑？","③ 對曾被傷害的人講「守住」，造成二次傷害","有人的園曾被闖入，那不是他的錯；講「守護」時要特別補上這一句，並在會後單獨關心。","檢驗標準：曾受傷的人聽完，是被擁抱，還是被定罪？","④ 把「她自己打開門」講成「可以隨便」","重點是同意與自由，次序是關鎖、等待、她開口、他進入，不可顛倒；沒有同意，就不是這一章的愛。","檢驗標準：你講的「開門」，有沒有把「同意」與「自由」放在最前面？"]},{"n":5,"t":"他敲門，我開門，他已轉身走了","sub":"敲、遲、傷","lv":"A","arc":"尋","sec":[["5:1--1","良人進園——「我進了我的園中」"],["5:2--5","夜裡的敲門——「我身睡臥，我心卻醒」"],["5:6--8","尋不見——被打傷，與託付：「我因思愛成病」"],["5:9--16","眾女子的問與她的描述——「這是我的良人，這是我的朋友」"]],"serm":{"pts":[["敲門與遲疑","5:1--5","心醒著，人卻累了；愛的人站在門外，而遲來的回應是很真實的。"],["尋不見，也被打傷","5:6--8","尋找的路上，傷害是真的；被傷的人沒有錯，她最想說的，還是她的愛。"],["他是怎樣的人","5:9--16","別人問你的信仰值不值得，你可以從描繪他是誰開始。"]]},"q":"你有沒有開了門，卻發現已經晚了一步？雅歌第五章有全卷最甜的開頭，也有最痛的中間：良人在夜裡敲門，她因為累而遲疑，起來開門時他已轉身走了；她去尋找，竟被城中的看守打傷。聖經沒有說她該受，沒有說這是磨練。這一章要先說清楚：遲疑是真實的人性，暴力是真實的傷害，被打的人沒有錯；然後，在傷痛中，她仍然說得出：「他是我的朋友。」","truth":"遲了一步的門不是最後一扇，被打傷的人沒有錯；在最痛的夜裡，她仍然認得他是誰，也沒有人可以用愛的名義要求她沉默。","mv":{"t":"他的口極其甘甜；他全然可愛。耶路撒冷的眾女子啊，這是我的良人；這是我的朋友。","r":"歌5:16"},"card":["良人進園後，夜裡敲門，新娘因累而遲疑；起來時他已走，她出城尋找，被看守人打傷、奪去披肩，仍託眾女子轉告「我因思愛成病」；眾女子問，她描述良人，以「我的朋友」作結。","心醒著，人卻累了，這是真實的愛：她的遲疑沒有被定罪，良人從門孔伸進手來，她被觸動就起來。","祂不撇下我們（現在式，持續地）：開門慢了，祂的手仍在門孔裡；呼叫沒有立刻回答的夜，也被記在神的話裡。","無己，不是壓抑傷痛，而是讓「祂是誰」比「我被誰傷」更大；焦點在祂，不在我遲了一步。","「我的頭滿了露水，我的手還在門孔裡。我沒有走遠。」","這週找一位在傷痛中的人，先說「我信你、我在這裡」；若有人需要保護，協助他尋求專業與安全。","最終整合：夜深了，\n他在門外敲，\n頭上滿了露水。\n他叫她四個名字，\n一口氣，全是疼惜。\n\n她說：我已經睡下了。\n不是不愛，是累了。\n\n他沒有走。\n他的手，從門孔伸進來。\n她的心，動了。\n\n她起來，兩手滴著沒藥。\n開了門，他已轉身走了。\n遲了一步。\n\n她出去找，\n看守的人打了她、傷了她。\n這不是她的錯。\n這不是神要她承受的。\n\n她仍說：告訴他，我因思愛成病。\n她仍認得：他是我的朋友。\n\n遲了的門，不是最後一扇。\n傷痛的夜，也不是被丟棄。\n\n無己不是沒有；\n無己，是在最痛的時候，\n焦點仍在那位，從門孔伸手的人。"],"self":"有己的定義：以為自己必須先不累、不遲、不痛，才配得被愛；離開本位，把「是否做對」放在「祂是誰」之上。","t321":{"k":"耶穌是我的榜樣：祂被差役打、被兵丁打、被剝去衣服，祂懂得被傷害的滋味。\n> 所以我不必在祂面前假裝。\n> 我可以把傷一處一處給祂看。","g":"讓耶穌作王：這一章要我放下的，是「我要自己扛」的權力。\n> 王不撇下我，也不要求我為傷害沉默。\n> 我交出的是孤單，不是尊嚴。","p":"建立屬神的體系：看守的人本該保護，卻成了傷害人的人——責任的顛倒是真實的。\n> 屬神的體系要有保護：相信、陪伴、轉介專業、不追問細節。\n> 眾女子說「我們同去」，是體系的起點。"},"grp":["【一、破冰】說一次你「累得不想起來」的夜晚，但後來還是起來了的經驗。是什麼讓你起來？","【二、扎心】歌5:3她說「我脫了衣裳，怎能再穿上呢」。你有沒有曾經對主說「等一下」？後來呢？","【三、福音】歌5:4「從門孔裡伸進手來，我便因他動了心」。你曾經被什麼小小的東西觸動？一句話？一首詩？一個人？","【四、行動】歌5:7她被打了、傷了。（帶領者請特別注意：不追問細節，不要求任何人分享傷害。）若有人願意，可分享：誰在你受傷時說過一句讓你覺得「被相信」的話？","【五、代禱】為組內每一個人指名禱告：「主，祢的手還在門孔裡，求祢讓他知道祢沒有走遠。」"],"prac":{"main":"這一週，找一位在傷痛中的人，說「我信你，我在這裡」。","items":["對神：每天一次，不管有沒有感覺，說一句：「我是祢的。我累，但我心醒著。」","對自己：對那個「遲了一步」的自己說：「這不是最後一扇門。」","對人：不追問、不講道理，只說：「我相信你。我在。」必要時，陪他找牧者、輔導或專業協助。","對生活：檢查你身邊有沒有人處於危險中；若有立即危險，協助他撥打當地緊急電話。","對使命：寫下一句「我認識的耶穌是⋯⋯」，這週說給一個人聽。"]},"safe":["① 把 5:7 講成「磨練」「管教」或「她該受」","經文沒有一個字說她有錯，看守人是失職的保護者；暴力是真實的，被打的人沒有錯。","檢驗標準：若在座有被傷害的人，他聽完是否仍相信「這不是我的錯」？","② 用 5:8 要求受傷的人「不抱怨」或「趕快原諒」","她說的是那一刻她想說的話，不是對所有受傷者的規定；不要把這句話變成「你不可以憤怒或沉默」。","檢驗標準：講完之後，受傷的人是有空間說出自己的感受，還是被要求趕快沒事？","③ 在講台上追問細節，或要求人公開分享","帶領者要避免追問細節；不要求人在眾人面前再說一次。會後單獨關心，必要時轉介專業。","檢驗標準：有沒有給受傷的人「不必說」的自由？","④ 責備她的遲疑，說「她不夠愛他」","她的藉口很小，很真實；經文如實記下，沒有定罪。「我心卻醒」說明愛是活著的。","檢驗標準：會眾聽完，是更自責，還是更確信祂的手仍在門孔裡？","⑤ 把「呼叫沒有回答」講成「神離開了」","詩篇裡有許多這樣的呼求，也是信心的語言；這一章與下一章要對讀，他並沒有離開。","檢驗標準：講完之後，會眾是更敢禱告，還是更不敢說真話？"]},{"n":6,"t":"我們與你同去尋找他","sub":"同行、獨一、被看","lv":"C","arc":"讚","sec":[["6:1--3","「我們與你同去」——說出需要，與「我屬我的良人」"],["6:4--7","良人的回應——「你的眼目使我驚亂」"],["6:8--9","「只有這一個」——不比較的愛"],["6:10--13","「那是誰呢」與「回來，書拉密女」——被看，也有權問"]],"serm":{"pts":[["我們與你同去","6:1--3","說出需要，旁邊的人就會走近；找不到的人，常常其實已經知道他在哪裡。"],["只有這一個","6:4--9","愛的專一，不靠比較，而是一句：就是你。"],["被看，也有權問為甚麼","6:10--13","被人注視時，你有權利問：你們為甚麼要看？"]]},"q":"有人問她：你的良人往哪裡去了？她們說：我們與你同去尋找他。一個人在夜裡找了很久，現在有人說：我們陪你。轉折很小，卻很深：說出需要，就有人走近。然後她忽然知道他在哪裡——在自己的園中；她說出整卷最重要的一句：「我屬我的良人，我的良人也屬我。」次序換了：先「我屬他」，再「他屬我」。這一章，有人同行、有人獨一，也有人被看卻敢問：你們為何要看？","truth":"說出需要，就有人與你同行；愛不靠比較，也不供人觀看——你是獨一，而且你屬於祂，在你找不到的時候，仍然成立。","mv":{"t":"我屬我的良人，我的良人也屬我；他在百合花中牧放群羊。","r":"歌6:3"},"card":["眾女子願與新娘同去尋找，她忽然知道良人在自己園中，說「我屬我的良人」；良人讚美她，說六十王后八十妃嬪之外，她是獨一；眾人呼喚她回來觀看，她反問：你們為何要觀看？","歸屬先於擁有：「我屬我的良人」放在「他屬我」之前，是經過夜晚後成熟的次序。","祂在祂的園中，並沒有離開（現在式）：你找不到的時候，祂仍在百合花中牧放；你的歸屬，不取決於你的感覺。","無己，是不靠比較、不靠被別人的目光來確認價值；你屬祂，這就夠了，不必再用力證明。","「你是獨一。不管你找到沒有，你屬於我。」","這週向一個人說出需要：「我最近有點累，可以陪我禱告嗎？」並對主說：「我屬祢。」","最終整合：她說了：告訴他，我思愛成病。\n然後，有人說：我們與你同去。\n\n一個人，不用再一個人找了。\n\n她忽然知道：他在自己的園中，\n在百合花中，牧放。\n他沒有走遠。\n\n她說：我屬我的良人，\n他也屬我。\n次序，變了。\n先是：我屬他。\n不再先說「他是我的」。\n\n六十王后，八十妃嬪，\n無數的童女，\n他說：我的鴿子，只有一個。\n不是第一名，是獨一。\n\n眾人喊：回來，回來！使我們觀看。\n她問：你們為何要觀看？\n\n你屬於祂。\n你不是被比較的名次，\n你是一個名字。\n\n無己不是沒有；\n無己，是你屬祂，\n不必再靠別人的眼光活著。"],"self":"有己的定義：以比較與被看來確認自己，說「他是我的」多過「我是他的」，離開本位，抓住不屬於自己的位置與目光。","t321":{"k":"耶穌是我的榜樣：祂在客西馬尼園對門徒說「你們在這裡，與我一同警醒」。\n> 祂也需要人同行，祂沒有逞強。\n> 我也可以向人求助。","g":"讓耶穌作王：「我屬我的良人」——不是我擁有祂，而是我屬祂。\n> 王不是我的資產，我是王的百姓。\n> 我放下的，是「我要掌控」。","p":"建立屬神的體系：「我們與你同去」，同行的人是屬神體系的雛形。\n> 屬神的體系，不是比較誰更美，而是每個人都是獨一，連王后妃嬪也稱讚。\n> 沒有嫉妒的群體，是愛充滿的群體。"},"grp":["【一、破冰】說一次有人對你說「我陪你」的經驗，那時的感覺是什麼？","【二、扎心】歌6:3她說「我屬我的良人」放在前面。你對主的說法，比較像「祢是我的」，還是「我是祢的」？為什麼？","【三、福音】歌6:8–9「只有這一個」。你平常最常被拿來比較的是什麼？成績、收入、孩子、服事？這句話對你說了什麼？","【四、行動】歌6:13她反問「你們為何要觀看」。你有沒有曾經活在別人的目光下，覺得必須表演？這週，你想用什麼方式，選擇不被目光定義？","【五、代禱】兩人一組，彼此說：「你是獨一，在祂眼中。」然後禱告：「主，求祢使他知道：我屬祢。」"],"prac":{"main":"這一週，向一個人說出需要，並對主說「我屬祢」。","items":["對神：每天一分鐘安靜，說：「我屬祢，不管我感覺如何。」","對自己：寫下一個你常拿來比較的項目，對自己說：「這不是我的名字。」","對人：向一位信任的人說：「我最近有點累，可以陪我禱告嗎？」","對生活：檢查社群媒體上的比較；選一天，不看、不發。","對使命：找一個「不夠被看見」的人，對他說：「我看見你。」"]},"safe":["① 把「六十王后八十妃嬪」講成理想的婚姻制度","這是王宮背景的比較，重點是「只有這一個」；不是支持多妻，聖經創造的起初是一男一女成為一體。","檢驗標準：講完之後，會眾是否理解愛的專一，而不是羨慕王宮？","② 用「書拉密女」的身分爭論去佔據講章","身分只陳列各家說法（所羅門的陰性形、地名等），不爭論；講章重點在被看與反問。","檢驗標準：會眾走出去，記住的是爭論，還是「你們為何要觀看」？","③ 把她的反問講成「不順服」","她在被注視時保有自己的聲音，是健康的；愛的目光讓人更像自己，消費的目光讓人變成別人。","檢驗標準：講完之後，被看、被比較的人是更自由，還是更緊張？"]},{"n":7,"t":"我屬我的良人，他也戀慕我","sub":"完整、戀慕、田間","lv":"B","arc":"讚","sec":[["7:1--5","王女——被讚美的是一個完整的人"],["7:6--9","讚嘆與接話——「何其美好」，她接過了話"],["7:10--10","「我屬我的良人，他也戀慕我」——戀慕被醫治"],["7:11--13","田間與村莊——愛走進日常"]],"serm":{"pts":[["被讚美的是完整的人","7:1--5","私密的讚美，是給被愛的人，不是給別人評分的清單。"],["我屬我的良人，他也戀慕我","7:6--10","最深的歸屬，不是被管轄，而是被戀慕。"],["田間與村莊","7:11--13","愛不只在屋內，它要走進日常，走進田野與收成。"]]},"q":"這是雅歌最直接的一章，也是最需要小心讀的一章。丈夫用熱烈的比喻讚美妻子，而她在中間接過了話，最後只說一句：「我屬我的良人，他也戀慕我。」那個「戀慕」，在舊約只出現三次：創世記三章，是破碎中的管轄；創世記四章，是罪的佔有；雅歌七章，是被珍愛。我們要問的是：你的關係裡，是哪一種「戀慕」？","truth":"愛可以用語言滋養，而不是羞辱；在雅歌裡，原本帶著管轄與佔有的「戀慕」，被醫治成珍愛——她被戀慕，而不是被管轄。","mv":{"t":"我屬我的良人，他也戀慕我。","r":"歌7:10"},"card":["良人從腳步開始讚美「王女」，把她看作巧匠的作品；一句直接的讚嘆之後，她接過了話；她宣告「我屬我的良人，他也戀慕我」，並邀請他往田間、村莊與葡萄園，說這都是為他存留的。","被讚美的是完整的人：他看見她是行走的、有聲音的、有選擇的，而不是被擺放的物品。","祂稱我們為「王女」（現在式）：不是因為血統，而是因為祂的眼光；我們本來是被使喚、被曬黑的人，如今被稱呼為祂的兒女。","無己，不是沒有聲音：她有聲音、有願望、有選擇，也把自己交出去；交出去的，才是真的有自己的人。","「我戀慕你，不是管轄你。你是我的王女。」","這週對你愛的人說一句滋養的話，而不是評價；並檢視你的關係是哪一種「戀慕」。","最終整合：她走過來，\n他最先看見的，是她的腳步。\n他叫她：王女。\n不是因為血統，\n是因為他的眼光。\n\n他說了許多比喻，\n說到一半，\n她接過了話。\n她有聲音。\n\n然後她只說一句：\n「我屬我的良人，\n他也戀慕我。」\n\n這個字，\n在創世記，帶著管轄；\n在創世記，帶著佔有；\n在這裡，被醫治了：\n被戀慕，不是被管轄。\n\n她說：來吧，我們往田間去，\n早晨起來，往葡萄園去，\n看看葡萄發芽沒有。\n愛，走進日常。\n\n無己不是沒有；\n無己，是被愛充滿，\n也有自己的聲音，\n然後自由地，交出去。"],"self":"有己的定義：把關係變成管轄與佔有，或把自己變成被看、被評價的物品；離開本位，抓住不屬於自己的權力。","t321":{"k":"耶穌是我的榜樣：祂彎下腰洗門徒的腳，不用權力管轄人。\n> 祂是被愛繫住的王。\n> 我學的是向下，不是向上。","g":"讓耶穌作王：這一章要我放下的，是在關係中「管人」的權力——金錢、年齡、地位。\n> 王不用權力管轄你，而是戀慕你，使你成為你自己。","p":"建立屬神的體系：愛從屋內走進田野，早晨再起來一次；屬神的體系是日常的、有收成的。\n> 單身者也有田間與村莊——工作、鄰舍、教會、朋友。\n> 愛是願意走進別人日常的心。"},"grp":["【一、破冰】說一句曾經讓你一輩子記得的、關於你外表的話——不論是好的還是傷人的。你怎麼看那句話？","【二、扎心】歌7:1「王女」。你平常怎麼稱呼自己？失敗的人？多餘的人？沒用的人？對照這個稱呼，你想說什麼？","【三、福音】歌7:10「他也戀慕我」。創3:16和雅7:10同一個字。你的關係裡，現在比較像哪一個？有什麼是你想改變的？","【四、行動】歌7:12「早晨起來」。這一週，你想在哪個日常的場合，用一句滋養的話對誰說？","【五、代禱】兩人一組：「主，求祢醫治他的關係，使他的戀慕成為珍愛，不是管轄。」"],"prac":{"main":"這一週，對一個人說一句滋養的話，並檢視自己的關係。","items":["對神：每天早晨說一句：「我是祢的兒女，祢稱我為王女（王子）。」","對自己：寫下你常用的自我稱呼，換成一句祂對你說的話。","對人：對你愛的人說一句「你在，我很歡喜」，不評價外貌。","對生活：選一個日常場景（早晨、市場、田間），一起做一件小事，並說出新芽。","對使命：為一位單身或孤單的人預備一個「田間」：邀請他一起去做一件事。"]},"safe":["① 公開解釋身體的比喻，或逐項評論","這些話是私密的情話，不供評分，也不供比較；讀經時只談語氣與看人的方式，不逐項解釋。","檢驗標準：聽完之後，在座的人是更珍愛自己與他人，還是更在意外貌？","② 用「戀慕」合理化管轄、佔有或控制","創世記三章與四章的「戀慕」帶著管轄與佔有；雅歌七章是被珍愛。這是聖經三處回聲，不是要人在關係中要求對方順從。","檢驗標準：你的關係裡，是對方更自由，還是更緊張？","③ 把「王的心被繫住」講成權力遊戲","原文是「王被繫在髮綹中」，強者在愛中自願被繫，是向下，不是征服；不可用來講「如何掌控對方」。","檢驗標準：這句話在你口中，是在教人彎腰，還是教人操縱？","④ 把「田間與村莊」講成「婚姻外的親密合理化」","這是婚姻裡的愛走進日常；重點在「早晨起來」「葡萄園」「存留」，不是在鼓勵婚前或婚外的親密。","檢驗標準：講完之後，會眾是更重視承諾與日常，還是更重視當下的感覺？"]},{"n":8,"t":"將我放在你心上如印記","sub":"印、牆、快來","lv":"A","arc":"印","sec":[["8:1--4","「巴不得你像我的兄弟」——在光中被承認"],["8:5--5","「靠著良人從曠野上來」——第三個「那是誰呢」"],["8:6--7","「將我放在你心上如印記」——愛如死之堅強"],["8:8--10","小妹的問題——「我是牆」"],["8:11--14","兩個葡萄園與「求你快來」"]],"serm":{"pts":[["在眾人面前，靠著他上來","8:1--5","愛想要走到光中，不被輕看；到最後，不再是一個人從曠野上來。"],["放我在你心上如印記","8:6--7","愛如死之堅強，不靠財寶買賣，也不是用來控制人的理由。"],["牆、門與自己的園","8:8--14","被保護的人，可以自己說：我是牆；而整卷的結尾，是一句呼求：快來。"]]},"q":"一首歌從「願他親我」開始，到「求你快來」結束。中間，有一個印記：「求你將我放在你心上如印記，帶在你臂上如戳記。」愛如死之堅強，眾水不能熄滅，財寶買不到。但這句「嫉恨如陰間之殘忍」，不是任何人控制、監視、傷害的理由。這一章也有小妹的問題：哥哥們問如何保護；她自己說：我是牆。愛的堅強，不等於愛的傷害。","truth":"愛如死之堅強，而且自由：眾水不能熄滅，財寶買不到，也絕不是控制的理由；整首歌從一個「願」走到一句「快來」，愛仍在趕路。","mv":{"t":"求你將我放在你心上如印記，帶在你臂上如戳記。因為愛情如死之堅強","r":"歌8:6"},"card":["新娘渴望愛能在光中被承認，並說明她要靠著良人從曠野上來；她求被放在心上如印記，宣告愛如死堅強、眾水不能熄滅、財寶買不到；兄長們問如何保護小妹，她說我是牆；整卷以兩個葡萄園與「求你快來」作結。","愛如印記：被放在心上（裡面）、帶在臂上（外面）；愛的所屬是被帶著的，不是被藏起來。","祂已把我們銘刻在祂掌上（完成式）：我們不必擔心被忘記；祂的愛如死之堅強，大水不能淹沒。","無己，是自己把葡萄園放在祂面前，不是被搶走；也是在愛裡承認：「我是祢的」。","「我把你銘刻在我掌上。你不會被忘記。」","這週對一個你愛的人說「你在我心上」；並檢查你的愛裡，有沒有把控制當成愛。","最終整合：一首歌，\n從「願他親我」開始。\n\n經過夜裡的尋找，\n經過遲了的門，\n經過傷，\n經過讚美，\n經過「我屬我的良人」。\n\n到了最後，她說：\n「將我放在你心上如印記，\n帶在你臂上如戳記。」\n\n愛如死之堅強。\n眾水不能熄滅。\n財寶，買不到。\n\n但愛，不是控制。\n愛，不是監視。\n愛，不是傷害。\n愛是自由裡的委身。\n\n小妹說：我是牆。\n哥哥們說：我們保護她。\n她站在自己的園前。\n\n最後一句，不是「完結」，是：\n「我的良人哪，求你快來！」\n\n愛，還在趕路。\n\n無己不是沒有；\n無己，是被放在祂心上，\n也把祂放在我心上。"],"self":"有己的定義：把愛當作擁有與控制，用財寶與監視確保關係，不敢讓愛在光中、在自由中；離開本位，抓住神的權力。","t321":{"k":"耶穌是我的榜樣：祂把我們放在心上如印記，手上有釘痕；以賽亞書說「我將你銘刻在我掌上」。\n> 祂的愛不是控制，是捨己。\n> 我跟隨祂的愛法。","g":"讓耶穌作王：這一章要我放下的，是「用愛的名義控制、監視、買賣」的權力。\n> 讓祂作我心上的印記，不是我掌控祂。\n> 王的愛是自由裡的委身。","p":"建立屬神的體系：牆、門、銀塔、香柏木板——是對弱者的保護。\n> 屬神的體系，有哥哥們問「我們怎麼保護」，也有小妹說「我是牆」。\n> 教會要成為保護孩子與弱者的地方。"},"grp":["【一、破冰】說一個曾經被人放在心上的經驗——一個母親、朋友或師長。你怎麼知道自己被放在心上？","【二、扎心】歌8:6「嫉恨如陰間之殘忍」。你有沒有曾用「我愛你」來解釋控制、監視或限制？或是被人這樣對待過？（不需細節，只說有或沒有。）","【三、福音】歌8:7「眾水不能熄滅」。你曾經過什麼很大的水？在水中，有沒有一個人或一句話把你撐住？","【四、行動】歌8:8–9教會如何成為保護孩子與弱勢者的「牆與門」？這週，你可以先做的一件事是什麼？","【五、代禱】為每個人指名禱告：「主，祢把他放在心上如印記，求祢使他知道，他不會被忘記。」"],"prac":{"main":"這一週，對一個你愛的人說：你在我心上，並檢查我的愛有沒有控制。","items":["對神：每天一次，對主說：「求祢把我放在祢心上如印記，我也把祢放在我心上。」","對自己：檢查你的愛裡，有沒有「監視」「限制」「財寶換關係」，寫下一件，這週放下。","對人：對你愛的人說：「你在我心上。我尊重你的自由。」","對生活：檢查家中是否有不安全的處境；若有人受威脅，協助他尋求專業與緊急協助。","對使命：為教會寫下一項保護孩子與弱勢者的具體做法，與同工討論。"]},"safe":["① 用「嫉恨如陰間之殘忍」合理化控制、監視或暴力","這句話說的是愛的忌邪（不容被奪走），絕不是要求任何人用「我愛你」去管手機、限制交友、威脅或傷害。","檢驗標準：講完之後，被愛的人是更自由，還是更緊張？","② 把 8:8–10 講成「早婚」或「評價身體」","這是保護的經文，哥哥們問的是如何保護；不支持早婚，也不評價任何人的身體；對未成年或弱勢者，保護優先。","檢驗標準：講完之後，孩子與弱者是被保護，還是被物化？","③ 對曾在年幼時未被好好保護的人，說「你要原諒」","那不是他的錯，是本來該保護他的人沒有盡責；先說「你值得被守護」，會後單獨關心，必要時協助專業。","檢驗標準：曾受傷的人聽完，是被擁抱，還是被要求趕快好？","④ 把「財寶換愛情，就全被藐視」講成「錢不重要」","重點是愛不能被買賣，也不能用金錢衡量；不是要否定生活需要，也不是批評貧窮的人。","檢驗標準：窮的人與富的人聽完，是否都能被愛，而不是被衡量？","⑤ 把整卷雅歌一次講成「基督與教會」的代號","先讓字面的情詩被聽見；新約自己作過的連結（如弗5:32）才可以引用，其餘說「使我們想起」，不說「這是預表」。","檢驗標準：會眾是更愛主，還是更佩服解經者？"]}],"txt":{"1":["所羅門的歌，是歌中的雅歌。","願他用口與我親嘴；因你的愛情比酒更美。","你的膏油馨香；你的名如同倒出來的香膏，所以眾童女都愛你。","願你吸引我，我們就快跑跟隨你。王帶我進了內室，我們必因你歡喜快樂。我們要稱讚你的愛情，勝似稱讚美酒。他們愛你是理所當然的。","耶路撒冷的眾女子啊，我雖然黑，卻是秀美，如同基達的帳棚，好像所羅門的幔子。","不要因日頭把我曬黑了就輕看我。我同母的弟兄向我發怒，他們使我看守葡萄園；我自己的葡萄園卻沒有看守。","我心所愛的啊，求你告訴我，你在何處牧羊？晌午在何處使羊歇臥？我何必在你同伴的羊群旁邊好像蒙著臉的人呢？","你這女子中極美麗的，你若不知道，只管跟隨羊群的腳蹤去，把你的山羊羔牧放在牧人帳棚的旁邊。","我的佳偶，我將你比法老車上套的駿馬。","你的兩腮因髮辮而秀美；你的頸項因珠串而華麗。","我們要為你編上金辮，鑲上銀釘。","王正坐席的時候，我的哪噠香膏發出香味。","我以我的良人為一袋沒藥，常在我懷中。","我以我的良人為一棵鳳仙花，在隱‧基底葡萄園中。","我的佳偶，你甚美麗！你甚美麗！你的眼好像鴿子眼。","我的良人哪，你甚美麗可愛！我們以青草為床榻，","以香柏樹為房屋的棟樑，以松樹為椽子。"],"2":["我是沙崙的玫瑰花〔或譯：水仙花〕，是谷中的百合花。","我的佳偶在女子中，好像百合花在荊棘內。","我的良人在男子中，如同蘋果樹在樹林中。我歡歡喜喜坐在他的蔭下，嘗他果子的滋味，覺得甘甜。","他帶我入筵宴所，以愛為旗在我以上。","求你們給我葡萄乾增補我力，給我蘋果暢快我心，因我思愛成病。","他的左手在我頭下；他的右手將我抱住。","耶路撒冷的眾女子啊，我指著羚羊或田野的母鹿囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願〔不要叫醒......情願：或譯不要激動愛情，等它自發〕。","聽啊！是我良人的聲音；看哪！他躥山越嶺而來。","我的良人好像羚羊，或像小鹿。他站在我們牆壁後，從窗戶往裡觀看，從窗欞往裡窺探。","我良人對我說：我的佳偶，我的美人，起來，與我同去！","因為冬天已往，雨水止住過去了。","地上百花開放，百鳥鳴叫的時候〔或譯：修理葡萄樹的時候〕已經來到；斑鳩的聲音在我們境內也聽見了。","無花果樹的果子漸漸成熟；葡萄樹開花放香。我的佳偶，我的美人，起來，與我同去！","我的鴿子啊，你在磐石穴中，在陡岩的隱密處。求你容我得見你的面貌，得聽你的聲音；因為你的聲音柔和，你的面貌秀美。","要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸，因為我們的葡萄正在開花。","良人屬我，我也屬他；他在百合花中牧放群羊。","我的良人哪，求你等到天起涼風、日影飛去的時候，你要轉回，好像羚羊，或像小鹿在比特山上。"],"3":["我夜間躺臥在床上，尋找我心所愛的；我尋找他，卻尋不見。","我說：我要起來，遊行城中，在街市上，在寬闊處，尋找我心所愛的。我尋找他，卻尋不見。","城中巡邏看守的人遇見我；我問他們：你們看見我心所愛的沒有？","我剛離開他們就遇見我心所愛的。我拉住他，不容他走，領他入我母家，到懷我者的內室。","耶路撒冷的眾女子啊，我指著羚羊或田野的母鹿囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願〔不要叫醒......情願：或譯不要激動愛情，等它自發〕。","那從曠野上來、形狀如煙柱、以沒藥和乳香並商人各樣香粉薰的是誰呢？","看哪，是所羅門的轎；四圍有六十個勇士，都是以色列中的勇士；","手都持刀，善於爭戰，腰間佩刀，防備夜間有驚慌。","所羅門王用黎巴嫩木為自己製造一乘華轎。","轎柱是用銀做的，轎底是用金做的；坐墊是紫色的，其中所鋪的乃耶路撒冷眾女子的愛情。","錫安的眾女子啊，你們出去觀看所羅門王！頭戴冠冕，就是在他婚筵的日子、心中喜樂的時候，他母親給他戴上的。"],"4":["我的佳偶，你甚美麗！你甚美麗！你的眼在帕子內好像鴿子眼。你的頭髮如同山羊群臥在基列山旁。","你的牙齒如新剪毛的一群母羊，洗淨上來，個個都有雙生，沒有一隻喪掉子的。","你的唇好像一條朱紅線；你的嘴也秀美。你的兩太陽在帕子內，如同一塊石榴。","你的頸項好像大衛建造收藏軍器的高臺，其上懸掛一千盾牌，都是勇士的籐牌。","你的兩乳好像百合花中吃草的一對小鹿，就是母鹿雙生的。","我要往沒藥山和乳香岡去，直等到天起涼風、日影飛去的時候回來。","我的佳偶，你全然美麗，毫無瑕疵！","我的新婦，求你與我一同離開黎巴嫩，與我一同離開黎巴嫩。從亞瑪拿頂，從示尼珥與黑門頂，從有獅子的洞，從有豹子的山往下觀看。","我妹子，我新婦，你奪了我的心。你用眼一看，用你項上的一條金鏈，奪了我的心！","我妹子，我新婦，你的愛情何其美！你的愛情比酒更美！你膏油的香氣勝過一切香品！","我新婦，你的嘴唇滴蜜，好像蜂房滴蜜；你的舌下有蜜，有奶。你衣服的香氣如黎巴嫩的香氣。","我妹子，我新婦，乃是關鎖的園，禁閉的井，封閉的泉源。","你園內所種的結了石榴，有佳美的果子，並鳳仙花與哪噠樹。","有哪噠和番紅花，菖蒲和桂樹，並各樣乳香木、沒藥、沉香，與一切上等的果品。","你是園中的泉，活水的井，從黎巴嫩流下來的溪水。","北風啊，興起！南風啊，吹來！吹在我的園內，使其中的香氣發出來。願我的良人進入自己園裡，吃他佳美的果子。"],"5":["我妹子，我新婦，我進了我的園中，採了我的沒藥和香料，吃了我的蜜房和蜂蜜，喝了我的酒和奶。我的朋友們，請吃！我所親愛的，請喝，且多多地喝！","我身睡臥，我心卻醒。這是我良人的聲音；他敲門說：我的妹子，我的佳偶，我的鴿子，我的完全人，求你給我開門；因我的頭滿了露水，我的頭髮被夜露滴濕。","我回答說：我脫了衣裳，怎能再穿上呢？我洗了腳，怎能再玷污呢？","我的良人從門孔裡伸進手來，我便因他動了心。","我起來，要給我良人開門。我的兩手滴下沒藥；我的指頭有沒藥汁滴在門閂上。","我給我的良人開了門；我的良人卻已轉身走了。他說話的時候，我神不守舍；我尋找他，竟尋不見；我呼叫他，他卻不回答。","城中巡邏看守的人遇見我，打了我，傷了我；看守城牆的人奪去我的披肩。","耶路撒冷的眾女子啊，我囑咐你們：若遇見我的良人，要告訴他，我因思愛成病。","你這女子中極美麗的，你的良人比別人的良人有何強處？你的良人比別人的良人有何強處，你就這樣囑咐我們？","我的良人白而且紅，超乎萬人之上。","他的頭像至精的金子；他的頭髮厚密纍垂，黑如烏鴉。","他的眼如溪水旁的鴿子眼，用奶洗淨，安得合式。","他的兩腮如香花畦，如香草臺；他的嘴唇像百合花，且滴下沒藥汁。","他的兩手好像金管，鑲嵌水蒼玉；他的身體如同雕刻的象牙，周圍鑲嵌藍寶石。","他的腿好像白玉石柱，安在精金座上；他的形狀如黎巴嫩，且佳美如香柏樹。","他的口極其甘甜；他全然可愛。耶路撒冷的眾女子啊，這是我的良人；這是我的朋友。"],"6":["你這女子中極美麗的，你的良人往何處去了？你的良人轉向何處去了，我們好與你同去尋找他。","我的良人下入自己園中，到香花畦，在園內牧放群羊，採百合花。","我屬我的良人，我的良人也屬我；他在百合花中牧放群羊。","我的佳偶啊，你美麗如得撒，秀美如耶路撒冷，威武如展開旌旗的軍隊。","求你掉轉眼目不看我，因你的眼目使我驚亂。你的頭髮如同山羊群臥在基列山旁。","你的牙齒如一群母羊洗淨上來，個個都有雙生，沒有一隻喪掉子的。","你的兩太陽在帕子內，如同一塊石榴。","有六十王后八十妃嬪，並有無數的童女。","我的鴿子，我的完全人，只有這一個是她母親獨生的，是生養她者所寶愛的。眾女子見了就稱她有福；王后妃嬪見了也讚美她。","那向外觀看、如晨光發現、美麗如月亮、皎潔如日頭、威武如展開旌旗軍隊的是誰呢？","我下入核桃園，要看谷中青綠的植物，要看葡萄發芽沒有，石榴開花沒有。","不知不覺，我的心將我安置在我尊長的車中。","回來，回來，書拉密女；你回來，你回來，使我們得觀看你。你們為何要觀看書拉密女，像觀看瑪哈念跳舞的呢？"],"7":["王女啊，你的腳在鞋中何其美好！你的大腿圓潤，好像美玉，是巧匠的手做成的。","你的肚臍如圓杯，不缺調和的酒；你的腰如一堆麥子，周圍有百合花。","你的兩乳好像一對小鹿，就是母鹿雙生的。","你的頸項如象牙臺；你的眼目像希實本、巴特‧拉併門旁的水池；你的鼻子彷彿朝大馬士革的黎巴嫩塔。","你的頭在你身上好像迦密山；你頭上的髮是紫黑色；王的心因這下垂的髮綹繫住了。","我所愛的，你何其美好！何其可悅，使人歡暢喜樂！","你的身量好像棕樹；你的兩乳如同其上的果子，纍纍下垂。","我說：我要上這棕樹，抓住枝子。願你的兩乳好像葡萄纍纍下垂，你鼻子的氣味香如蘋果；","你的口如上好的酒。女子說：為我的良人下咽舒暢，流入睡覺人的嘴中。","我屬我的良人，他也戀慕我。","我的良人，來吧！你我可以往田間去；你我可以在村莊住宿。","我們早晨起來往葡萄園去，看看葡萄發芽開花沒有，石榴放蕊沒有；我在那裡要將我的愛情給你。","風茄放香，在我們的門內有各樣新陳佳美的果子；我的良人，這都是我為你存留的。"],"8":["巴不得你像我的兄弟，像吃我母親奶的兄弟；我在外頭遇見你就與你親嘴，誰也不輕看我。","我必引導你，領你進我母親的家；我可以領受教訓，也就使你喝石榴汁釀的香酒。","他的左手必在我頭下；他的右手必將我抱住。","耶路撒冷的眾女子啊，我囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願〔不要叫醒......情願：或譯不要激動愛情，等它自發〕。","那靠著良人從曠野上來的是誰呢？我在蘋果樹下叫醒你。你母親在那裡為你劬勞；生養你的在那裡為你劬勞。","求你將我放在你心上如印記，帶在你臂上如戳記。因為愛情如死之堅強，嫉恨如陰間之殘忍；所發的電光是火焰的電光，是耶和華的烈焰。","愛情，眾水不能熄滅，大水也不能淹沒。若有人拿家中所有的財寶要換愛情，就全被藐視。","我們有一小妹；她的兩乳尚未長成，人來提親的日子，我們當為她怎樣辦理？","她若是牆，我們要在其上建造銀塔；她若是門，我們要用香柏木板圍護她。","我是牆；我兩乳像其上的樓。那時，我在他眼中像得平安的人。","所羅門在巴力‧哈們有一葡萄園；他將這葡萄園交給看守的人，為其中的果子必交一千舍客勒銀子。","我自己的葡萄園在我面前。所羅門哪，一千舍客勒歸你，二百舍客勒歸看守果子的人。","你這住在園中的，同伴都要聽你的聲音，求你使我也得聽見。","我的良人哪，求你快來！如羚羊或小鹿在香草山上。"]},"blk":{"1":[{"a":1,"z":1,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁיר הַשִּׁירִים אֲשֶׁר לִשְׁלֹמֹֽה׃</p></blockquote>","lit":"「歌中之歌，屬所羅門的。」","key":"","gram":"<p><strong>「歌中的歌」是希伯來文的最高級寫法</strong>，與「聖中之聖」（出 26:33，至聖所）同一個語法。它說的是地位，不是長短。</p><p>「所羅門的」可以讀作作者、獻給他的，或關於他的。歷代三說並陳，本講義不在此定論。</p>","exp":"<p><strong>「歌中的歌」——希伯來文用最高級的寫法，告訴你：這首歌在一切的歌中站第一。</strong></p><p>書名的第一個字是「歌」，而且是「歌中之歌」。這個寫法，和「聖中之聖」（至聖所）是同一個語法。它不是在說歌的長短，而是在說它的地位。</p><p>卷首就說「所羅門的」。這四個字讓讀者先問：誰在唱？是所羅門，是新娘，是牧人，還是替這對新人寫歌的人？歷代都有人爭論，本講義只陳列，不在這裡定論。</p><p>但有一件事是確定的：這卷書從第一句開始，就不是在講道理，是在唱。一對相愛的人在唱，耶路撒冷的女子在旁邊聽。今天讀它的人，先要學會的不是分析，而是<strong>安靜地聽見一個人說：我愛你</strong>。</p><p>「所羅門的」可以讀作「出於所羅門」「獻給所羅門」或「關於所羅門」，原文只有一個前置詞 לְ，經文沒有替我們決定。讀者不必先解決作者問題才能讀這首歌；要緊的是，它從一開始就被放進以色列的聖典，成為神的百姓認識愛的一首歌。</p>"},{"a":2,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>יִשָּׁקֵנִי מִנְּשִׁיקוֹת פִּיהוּ כִּֽי־טוֹבִים דֹּדֶיךָ מִיָּֽיִן׃ לְרֵיחַ שְׁמָנֶיךָ טוֹבִים שֶׁמֶן תּוּרַק שְׁמֶךָ עַל־כֵּן עֲלָמוֹת אֲהֵבֽוּךָ׃ מָשְׁכֵנִי אַחֲרֶיךָ נָּרוּצָה הֱבִיאַנִי הַמֶּלֶךְ חֲדָרָיו נָגִילָה וְנִשְׂמְחָה בָּךְ נַזְכִּירָה דֹדֶיךָ מִיַּיִן מֵישָׁרִים אֲהֵבֽוּךָ׃</p></blockquote>","lit":"「願他用他的口與我親嘴——因為你的愛（複數）比酒更美；你的膏油有香氣，你的名如同倒出來的香膏，所以眾童女愛你。願你吸引我，我們就快跑跟隨你。王帶我進了內室……」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>親嘴</td><td>יִשָּׁקֵנִי</td><td>yishaqeni</td><td>H5401</td><td>親吻（願式：願他親我）</td></tr><tr><td>愛情</td><td>דֹּדֶיךָ</td><td>dodeykha</td><td>H1730</td><td>愛（複數）加你的後綴；可指愛情，也可指所愛的人</td></tr><tr><td>酒</td><td>יַיִן</td><td>yayin</td><td>H3196</td><td>葡萄酒</td></tr><tr><td>膏油</td><td>שֶׁמֶן</td><td>shemen</td><td>H8081</td><td>油；此處為香油</td></tr><tr><td>名</td><td>שֵׁם</td><td>shem</td><td>H8034</td><td>名字、名聲</td></tr></table>","gram":"<p><strong>動詞 יִשָּׁקֵנִי 是願式（optative）：「願他……」。</strong>新娘不說「他要親我」，而說「願他親我」。這是渴慕的語氣，她還站在等待的位置上。</p>","exp":"<p><strong>第一句話不是「我愛你」，是「願他親我」。</strong></p><p>新娘先開口，說的是渴望。她不說「我要嫁給他」，她說「願他……」。渴慕是從別人那裡得到的，她還站在等待的位置上。</p><p>她說「你的愛情比酒更美」。用的字是 <strong>דֹּדֶיךָ</strong>，愛（複數）加上「你的」。經文用抽象的複數，把愛本身擺在酒的對面：酒使人暫時歡暢，愛使人被完全地認識。</p><blockquote><p>渴慕本身是好的。問題只在於，它要指向誰。新娘渴慕的是那一位愛她的人，不是愛本身被抓來當成滿足。</p></blockquote><p>第三節用「香膏」與「名」說話。一個人的名字被倒出來，像香膏倒出來，滿屋子都香。所以童女們愛他。吸引人的，是香氣先到。</p><p>第四節的「我們」，從她一個人轉成一群人。她說「我們就快跑跟隨你」。愛情在這裡已經不是私房的事，是一群人被吸引，一起跑。讀的人要問：<strong>我的渴慕，是把我一個人拉向那一位，還是把我拉進一群彼此扶持的人裡面去？</strong></p><p>這一段的人稱不斷搖擺：先說「他」，轉成「你」，又變成「我們要快跑」，最後又回到「王領我」。人稱的跳動，正是渴慕的語氣：渴慕的人不會用整齊的文法說話。</p>"},{"a":5,"z":6,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שְׁחוֹרָה אֲנִי וְֽנָאוָה בְּנוֹת יְרוּשָׁלִָם כְּאָהֳלֵי קֵדָר כִּירִיעוֹת שְׁלֹמֹֽה׃ אַל־תִּרְאוּנִי שֶׁאֲנִי שְׁחַרְחֹרֶת שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ בְּנֵי אִמִּי נִֽחֲרוּ־בִי שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים כַּרְמִי שֶׁלִּי לֹא נָטָֽרְתִּי׃</p></blockquote>","lit":"「耶路撒冷的眾女子啊，我雖然黑，卻是秀美，如同基達的帳棚，好像所羅門的幔子。不要因日頭把我曬黑了就輕看我。我同母的弟兄向我發怒，使我看守葡萄園；我自己的葡萄園卻沒有看守。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>黑</td><td>שְׁחוֹרָה</td><td>shekhorah</td><td>H7838</td><td>黑（被日頭曬黑的膚色）</td></tr><tr><td>秀美</td><td>נָאוָה</td><td>navah</td><td>H5000</td><td>秀美、合宜、可愛</td></tr></table>","gram":"<p>「我雖然黑，卻是秀美」是兩個形容詞以最小的連接詞「和」（וְ）相連：原文字面是「黑，我，並且秀美」，和合本的「雖然……卻是」是為了中文通順而加。<strong>黑與美在她身上同時為真，不互相取消</strong>。這一點是全段的鑰匙。</p>","exp":"<p><strong>她先替自己辯護，然後沒有人替她辯護。</strong></p><p>新娘在這裡說自己黑。她把原因說得很清楚：是日頭看顧（曬）過她。第 6 節說她被派去看守葡萄園，這是一個人在勞動、在被使喚的處境裡得到的顏色。</p><p>但她接著說「卻是秀美」。兩個字只用一個「和」相連（和合本的「雖然……卻是」是中文的潤飾）。經文不替她選擇：她黑，也美。我們常用「黑」來否定「美」，她卻不肯。</p><p>第六節說出真正的傷：「我同母的弟兄向我發怒，使我看守葡萄園；我自己的葡萄園卻沒有看守。」她被兄弟們逼去做工，自己的園子反而荒了。這裡有家庭裡的不公，也有一個女子在日頭下被輕看的委屈。</p><blockquote><p>被曬黑的，不一定是罪人；被輕看的，也不一定是不美。</p></blockquote><p>今天讀這段的人，可能正被別人用外貌、膚色或出身衡量。經文不教人去爭辯膚色，而是讓一個被輕看的人先開口：<strong>我雖然如此，我仍然是我</strong>。那是一個人在神面前的自我承認。</p><p>「基達的帳棚」一般認為以黑山羊毛織成，外表粗黑；「所羅門的幔子」則是華美的帷幔。她用兩個比喻同時承認外表的黑，與內裡的華美，沒有為了討好誰而否認任何一邊。</p>"},{"a":7,"z":8,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַגִּידָה לִּי שֶׁאָהֲבָה נַפְשִׁי אֵיכָה תִרְעֶה אֵיכָה תַּרְבִּיץ בַּֽצָּהֳרָיִם שַׁלָּמָה אֶֽהְיֶה כְּעֹטְיָה עַל עֶדְרֵי חֲבֵרֶֽיךָ׃ אִם־לֹא תֵדְעִי לָךְ הַיָּפָה בַּנָּשִׁים צְֽאִי־לָךְ בְּעִקְבֵי הַצֹּאן וּרְעִי אֶת־גְּדִיֹּתַיִךְ עַל מִשְׁכְּנוֹת הָרֹעִֽים׃</p></blockquote>","lit":"「我心所愛的啊，求你告訴我，你在何處牧羊？晌午在何處使羊歇臥？我何必在你同伴的羊群旁邊，好像蒙著臉的人呢？」「你這女子中極美麗的，你若不知道，只管跟隨羊群的腳蹤去，把你的山羊羔牧放在牧人帳棚的旁邊。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>牧羊</td><td>תִּרְעֶה</td><td>tirʿeh</td><td>H7462</td><td>牧放、放養（羊群）</td></tr><tr><td>使羊歇臥</td><td>תַּרְבִּיץ</td><td>tarbits</td><td>H7257</td><td>使（羊群）躺臥歇息</td></tr></table>","gram":"<p>第 7 節是新娘的問句，第 8 節是良人（或眾女子）的回答。<strong>兩段對話的語氣不同</strong>：她問得急，他答得慢，而且答案是「跟著羊群的腳蹤去」。</p>","exp":"<p><strong>愛的第一個動作，是去找，而不是等。</strong></p><p>新娘問：「你在何處牧羊？」她不知道他在哪裡。她問得很誠懇，也很著急：為甚麼要我在你同伴的羊群旁邊，像蒙著臉的人一樣徘徊？</p><p>良人的回答很平靜，甚至有點幽默：「你若不知道，只管跟隨羊群的腳蹤去。」沒有地圖，沒有解釋，只有腳蹤。尋找的人不被要求先看見全景，只被要求跟著他前面的記號走。</p><blockquote><p>信心常常是這樣：不是看見了再走，而是跟著看得見的腳蹤，一步一步走到看見為止。</p></blockquote><p>值得注意的是，「你若不知道」一句，是在鼓勵，不是在責備。良人不嫌棄她的不知道，他只說：去吧，跟著就是。</p><p>讀的人可能正在某個處境裡問：神在哪裡？為甚麼我找不到？經文不急著給你答案，它先給你一個方向：<strong>跟著羊群的腳蹤去</strong>，就是跟著那些已經走過的人、已經被帶領的人。</p><p>良人沒有直接告訴她他在哪裡，只指出一條路：跟著羊群的腳蹤走。在愛裡，找人的路常常就是跟著他走過的腳蹤，而不是靠自己的猜測繞圈子。</p>"},{"a":9,"z":11,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לְסֻסָתִי בְּרִכְבֵי פַרְעֹה דִּמִּיתִיךְ רַעְיָתִֽי׃ נָאווּ לְחָיַיִךְ בַּתֹּרִים צַוָּארֵךְ בַּחֲרוּזִֽים׃ תּוֹרֵי זָהָב נַעֲשֶׂה־לָּךְ עִם נְקֻדּוֹת הַכָּֽסֶף׃</p></blockquote>","lit":"「我的佳偶，我將你比法老車上套的駿馬。你的兩腮因髮辮秀美，你的頸項因珠串華麗。我們要為你編上金辮，鑲上銀釘。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>駿馬</td><td>סֻסָתִי</td><td>susati</td><td>H5483</td><td>母馬（馬的陰性形，比喻美麗與力量）</td></tr><tr><td>車</td><td>רֶכֶב</td><td>recheb</td><td>H7393</td><td>戰車、車輛</td></tr></table>","gram":"<p>「駿馬」的字形是陰性，「我將你比」用的是 <strong>比喻的明喻</strong>。良人讚美的對象是「你」，不是馬；馬只是讓「美」與「力」可以被看見的影像。</p>","exp":"<p><strong>讚美是從具體的細節開始的：兩腮、頸項、髮辮。</strong></p><p>良人把新娘比作法老車上套的駿馬。這個比喻今天聽來有點怪。但在古代近東，馬與戰車是力量與華麗的象徵，把一個人比作法老車上的馬，是很高的讚美。</p><p>他接著說到兩腮、頸項，還有髮辮和珠串。他不說「你很美」，而是一處一處地看。被愛的人被仔細地看見，這本身就是一種尊重。</p><blockquote><p>愛是會注意細節的。被愛的人，不只是一個「整體」，而是一個被細心看過的人。</p></blockquote><p>在這裡，讀的人要小心：讚美不是為了把人變成物件，像馬，像飾品。良人讚美的是一個完整的人，而新娘的美，在他的眼裡是她整個人的美，不是一件件可替換的東西。</p><p>第 11 節的「我們要為你造」是複數，是王與隨從，還是修辭上的複數，經文沒有說明。值得留意的是：這些金鍊與銀釘是給她「已有之美」的裝飾，不是補她的缺欠；愛的讚美，是在已經被看見的人身上加添喜悅。</p>"},{"a":12,"z":14,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַד־שֶׁהַמֶּלֶךְ בִּמְסִבּוֹ נִרְדִּי נָתַן רֵיחֽוֹ׃ צְרוֹר הַמֹּר דּוֹדִי לִי בֵּין שָׁדַי יָלִֽין׃ אֶשְׁכֹּל הַכֹּפֶר דּוֹדִי לִי בְּכַרְמֵי עֵין גֶּֽדִי׃</p></blockquote>","lit":"「王正坐席的時候，我的哪噠香膏發出香味。我以我的良人為一袋沒藥，常在我懷中。我以我的良人為一棵鳳仙花，在隱基底葡萄園中。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>沒藥</td><td>מֹר</td><td>mor</td><td>H4753</td><td>沒藥（樹脂，香料與防腐用）</td></tr><tr><td>鳳仙花</td><td>כֹּפֶר</td><td>kopher</td><td>H3724</td><td>鳳仙花（染指甲的植物）</td></tr><tr><td>葡萄園</td><td>כֶּרֶם</td><td>kerem</td><td>H3754</td><td>葡萄園（★ 全卷的園意象從這裡開始）</td></tr></table>","gram":"<p>第 12 節的「王正坐席」是一個場景，而「我的香膏」是新娘自己的香氣。<strong>香氣先於相見</strong>：她是在他不在場的時候，就被他的香氣包住了。</p>","exp":"<p><strong>她把良人當成一袋沒藥，掛在胸前。</strong></p><p>沒藥是一種樹脂，可以入藥，可以做防腐，也可以放在衣物裡薰香。新娘說：我的良人是一袋沒藥，常在我懷中。這是一個把愛人貼身帶著的意象：他的香氣，不離開她。</p><p>第 12 節有「王正坐席」，是一個宴會的場景。宴會上，她的香膏發出香味。她不需要說話，香氣已經在場。</p><blockquote><p>愛有時是無聲的：一個人的存在，就讓另一個人被香氣包住。</p></blockquote><p>第 14 節說他是鳳仙花，在隱基底的葡萄園裡。隱基底是死海西岸的綠洲，葡萄園是一個被照顧、被看守的地方。這裡的「園」，預告了全卷會反覆出現的園意象：<strong>被看守的園，是愛被保護的地方</strong>。</p><p>第 12 節的「王」與第 13、14 節的「我的良人」是同一個人：遠處他是王，貼身時他是她懷中的香囊，在葡萄園裡他是一串散香的花。稱呼隨距離改變，愛沒有變。「隱基底」是死海西岸有泉水的綠洲，在乾燥的地方出現一串花，所以這個意象帶著意外的滋潤。</p>"},{"a":15,"z":17,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנָּךְ יָפָה רַעְיָתִי הִנָּךְ יָפָה עֵינַיִךְ יוֹנִֽים׃ הִנְּךָ יָפֶה דוֹדִי אַף נָעִים אַף־עַרְשֵׂנוּ רַעֲנָנָֽה׃ קֹרוֹת בָּתֵּינוּ אֲרָזִים רַהִיטֵנוּ בְּרוֹתִֽים׃</p></blockquote>","lit":"「我的佳偶，你甚美麗！你甚美麗！你的眼好像鴿子眼。」「我的良人哪，你甚美麗可愛！我們以青草為床榻，以香柏樹為房屋的棟樑，以松樹為椽子。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>鴿子</td><td>יוֹנִים</td><td>yonim</td><td>H3123</td><td>鴿子（溫柔、清澈的眼睛）</td></tr></table>","gram":"<p>第 15、16 節互相回應：他說「你甚美麗」，她說「你甚美麗可愛」。<strong>讚美是往返的</strong>，不是一方站在高處說，另一方站在低處聽。</p>","exp":"<p><strong>這一章的結尾，是兩個人互相讚美。</strong></p><p>良人先說：「我的佳偶，你甚美麗！你甚美麗！」他重複兩次，像是忍不住。新娘回應：「我的良人哪，你甚美麗可愛！」她也重複，也忍不住。</p><p>鴿子的眼，在古詞裡是溫柔、清澈、不閃躲的眼神。他讚美的是她的眼睛，因為那是她看著他的方式。</p><p>最後一節，他們把床榻鋪在青草上，把房屋的棟樑想成香柏樹，把椽子想成松樹。這是一個曠野裡的家，沒有牆，只有樹。兩個人在大自然裡的房屋，是一種被造界的親密。</p><blockquote><p>這一章從「渴慕」開始，到「彼此讚美、以樹為屋」結束。愛從一個人的願望，走到兩個人共同的家。</p></blockquote><p>讀的人可以問：我身邊的人，是我用甚麼方式讚美的？是只看他的缺欠，還是肯像良人一樣，一處一處地說：你甚美麗？</p><p>第 16、17 節的「我們的」床榻、「我們的」房屋，是全卷第一次出現「我們的」居所：兩個人還沒有房子，卻已經以綠草、香柏與松樹為自己搭起一間屋子。愛先在心裡蓋了房子。</p>"}],"2":[{"a":1,"z":1,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אֲנִי חֲבַצֶּלֶת הַשָּׁרוֹן שֽׁוֹשַׁנַּת הָעֲמָקִֽים׃</p></blockquote>","lit":"「我是沙崙的玫瑰花，是谷中的百合花。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>百合</td><td>שׁוֹשַׁנָּה</td><td>shoshannah</td><td>H7799</td><td>百合（或玫瑰、水仙，古義不定）</td></tr><tr><td>玫瑰</td><td>חֲבַצֶּלֶת</td><td>chavatselet</td><td>H2261</td><td>野生的花（和合本譯玫瑰，一說為番紅花）</td></tr></table>","gram":"<p>這一節是新娘的自我介紹，用的是<strong>自謙的花名</strong>：「我是……花」。她不說自己是甚麼了不起的花，只說自己是原野上的一朵。</p>","exp":"<p><strong>她先說自己是一朵花，一朵野地裡的花。</strong></p><p>沙崙是一片平原，谷中的百合是低地裡長出來的。新娘把自己放在最普通的地方：不在宮殿，不在山頂，在谷裡，在原野。</p><p>希伯來文的花名，古代的字義並不完全確定。和合本譯作玫瑰，註釋裡可以看見百合、水仙、番紅花等不同的說法。這裡不必在字典裡爭論，重要的是她的姿態：<strong>她自謙，她說自己只是原野上的一朵</strong>。</p><blockquote><p>愛的人若要被看見，不必先把自己抬高。</p></blockquote><p>接下來的一節，良人會把她從眾花裡認出來。被認出來，不是因為她特別，而是因為他的眼睛只看她。</p><p>有人把這一節讀成良人的自我介紹，但原文沒有標明說話者，傳統上多讀為新娘。不論是誰，調子都是謙遜的：「一朵」花，而不是「那一朵」；她沒有說自己是最美的，只說自己是原野裡的一朵花。把她從眾花中揀出來的，是下一節良人的眼睛。</p><p>在谷裡長出來的花，不需要別人的讚許才存在；但被人認出來，卻是另一種喜樂。</p>"},{"a":2,"z":2,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כְּשֽׁוֹשַׁנָּה בֵּין הַחוֹחִים כֵּן רַעְיָתִי בֵּין הַבָּנֽוֹת׃</p></blockquote>","lit":"「我的佳偶在女子中，好像百合花在荊棘內。」","key":"","gram":"<p>這一節是「比喻的對照」：<strong>百合在荊棘中間，就顯得特別醒目</strong>。這是良人的回答，也是他的一句讚美。</p>","exp":"<p><strong>在一片荊棘裡，百合就是那一朵。</strong></p><p>良人說：「我的佳偶在女子中，好像百合花在荊棘內。」前一節她說自己是原野的一朵，他就把她放回原野：在荊棘之中，她是百合，醒目，純淨，不可替代。</p><p>荊棘代表粗糙、艱難、被刺傷的環境。新娘在那樣的環境裡，仍然是百合。這不是說她沒有遇過荊棘，而是說荊棘沒有把她變成荊棘。</p><p>讀的人可以問：我身處的環境，是否也是一片荊棘？我是否還保留著百合的樣子？經文不要求你不遇見荊棘，只說你在其中仍然可以被看見、被珍惜。</p><p>這種「在眾人中看見你」的眼光，是愛最基本的動作。被愛的人不是因為別人差才顯得美，而是因為有人專注地看見了她。良人並沒有貶低別的女子，他只說：在我眼中，她是不同的。</p><p>讀的人若常覺得自己淹沒在荊棘般的環境裡，可以記得：有一雙眼睛，是專為你而看的。這是經文給的安慰，不是要人去貶低身邊的人。</p>"},{"a":3,"z":4,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כְּתַפּוּחַ בַּעֲצֵי הַיַּעַר כֵּן דּוֹדִי בֵּין הַבָּנִים בְּצִלּוֹ חִמַּדְתִּי וְיָשַׁבְתִּי וּפִרְיוֹ מָתוֹק לְחִכִּֽי׃ הֱבִיאַנִי אֶל־בֵּית הַיָּיִן וְדִגְלוֹ עָלַי אַהֲבָֽה׃</p></blockquote>","lit":"「我的良人在男子中，如同蘋果樹在樹林中。我歡歡喜喜坐在他的蔭下，嘗他果子的滋味，覺得甘甜。他帶我入筵宴所，以愛為旗在我以上。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>蘋果樹</td><td>תַּפּוּחַ</td><td>tappuach</td><td>H8598</td><td>蘋果樹（一說為杏、柑橘，古義未定）</td></tr><tr><td>蔭</td><td>צֵל</td><td>tsel</td><td>H6738</td><td>蔭、遮蔽</td></tr><tr><td>旗（★）</td><td>דֶּגֶל</td><td>degel</td><td>H1714</td><td>旗幟、軍旗；本節的鑰匙字：以愛為旗</td></tr><tr><td>愛</td><td>אַהֲבָה</td><td>ahavah</td><td>H160</td><td>愛、愛情（與旗並列）</td></tr></table>","gram":"<p><strong>① 「以愛為旗」的 דֶּגֶל 是甚麼？</strong></p><ul><li><strong>字面讀</strong>：愛是他們之間的標記，像軍旗，宣告他對她的愛。</li><li><strong>寓言讀</strong>：神的愛、基督的愛覆蓋信徒，像軍旗在上方飄揚。</li></ul><p>本講義先依字面讀：<strong>愛是一面看得見的旗</strong>。寓言讀的分量在議題中陳列，不在此取代字面。</p>","exp":"<p><strong>他把她帶進筵宴的屋子，頭上的旗幟是愛。</strong></p><p>新娘說：我坐在他的蔭下，嘗他果子的滋味，覺得甘甜。蘋果樹是樹林中最特別的樹，它的蔭涼與果子的甜美，讓她想到他。她不用說他是甚麼，她說她在他的蔭下，覺得甘甜。</p><p>第四節的「筵宴所」，原文是宴會的屋子。他帶她進去，屋頂上方有一面旗，旗上寫的是「愛」。這是一個公開的標記：這段關係，不是私下的，是被看見的。</p><blockquote><p>愛若是真的，它會有一面旗，讓人看見它在哪裡。它不是躲起來的，也不是需要解釋的。</p></blockquote><p>寓言讀的傳統，會把這面旗讀作神的愛覆蓋信徒。這個讀法有它的歷史與感動，但本講義先讓字面站穩：他們之間的愛，是可以被看見的。</p><p>和合本「以愛為旗」，原文是「他的旗在我以上是愛」。旗是軍隊辨認歸屬的標幟；這面旗不是向外示威，而是掛在她頭上，讓她知道自己屬於誰、被誰覆庇。</p><p>她「喜悅坐在他的蔭下」的「喜悅」（חִמַּדְתִּי），是強烈的渴想：她不是被迫坐下，是自己選了這片蔭涼。</p>"},{"a":5,"z":6,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>סַמְּכוּנִי בָּֽאֲשִׁישׁוֹת רַפְּדוּנִי בַּתַּפּוּחִים כִּי־חוֹלַת אַהֲבָה אָֽנִי׃ שְׂמֹאלוֹ תַּחַת לְרֹאשִׁי וִימִינוֹ תְּחַבְּקֵֽנִי׃</p></blockquote>","lit":"「求你們給我葡萄乾增補我力，給我蘋果暢快我心，因我思愛成病。他的左手在我頭下；他的右手將我抱住。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>思愛成病</td><td>חוֹלַת אַהֲבָה</td><td>cholat ahavah</td><td>H2470 + H160</td><td>「病」（動詞/形容詞）加「愛」：為愛而病（字面）</td></tr></table>","gram":"<p>「因我思愛成病」用的是<strong>以愛為病的說法</strong>，字面是「為愛而生病」。這是情詩常見的誇張，不宜直接當成醫學描述。</p>","exp":"<p><strong>她說自己因愛而病，所以請眾女子拿葡萄乾和蘋果來扶持她。</strong></p><p>葡萄乾與蘋果，是當時補身、提神的食物。她請求的是實際的支持：給我力量，給我安慰。這是一個人在思念中的身體反應。</p><p>第六節是一個安靜的畫面：「他的左手在我頭下；他的右手將我抱住。」她在他的懷裡，被抱著，被托著。思念的人，被實際地抱住。</p><blockquote><p>愛的病，有時需要的不是說道理，而是一雙手，一個懷抱。</p></blockquote><p>讀的人若正在思念中、在失落中、在孤單中，經文給的不是一套理論，而是一個被抱住的畫面。今天，身邊能這樣抱住人的，是誰？我又能抱住誰？</p><p>「因愛而病」（חוֹלַת אַהֲבָה）在 5:8 又出現一次，同一個說法，指向兩種心境：這一次是甜蜜中的虛弱，那一次是失去之後的痛。可見愛的重量不只有甜。第 6 節說的是被抱住，病才找到安靜。</p><p>她向眾女子求的是葡萄乾與蘋果，是實在的食物。思念中的人，不一定先需要道理，常常先需要被照顧。</p>"},{"a":7,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִשְׁבַּעְתִּי אֶתְכֶם בְּנוֹת יְרוּשָׁלִַם בִּצְבָאוֹת אוֹ בְּאַיְלוֹת הַשָּׂדֶה אִם־תָּעִירוּ וְֽאִם־תְּעֽוֹרְרוּ אֶת־הָאַהֲבָה עַד שֶׁתֶּחְפָּֽץ׃</p></blockquote>","lit":"「耶路撒冷的眾女子啊，我指著羚羊或田野的母鹿囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>驚動</td><td>תָּעִירוּ</td><td>ta‘iru</td><td>H5782</td><td>叫醒、激起（動詞，使動式）</td></tr><tr><td>情願</td><td>חָפֵץ</td><td>chafets</td><td>H2654</td><td>喜悅、願意（本節為 שֶׁתֶּחְפָּץ，單數，「等到它／他願意」）</td></tr></table>","gram":"<p><strong>「等他自己情願」的主詞是誰？</strong>動詞 שֶׁתֶּחְפָּץ 是單數，原文「愛情」（אַהֲבָה）是陰性名詞，動詞形態也與它吻合。</p><ul><li><strong>和合本正文</strong>：「等他自己情願」，指所愛的人自己願意。</li><li><strong>和合本旁註</strong>：「不要激動愛情，等它自發」，指愛情本身自己成熟。</li></ul><p>兩個讀法的方向相同：<strong>不要催促、不要強迫，等到願意的時候</strong>。</p>","exp":"<p><strong>愛情不能被催。等他自己情願。</strong></p><p>新娘囑咐眾女子：不要驚動、不要叫醒我所親愛的。她用羚羊和母鹿作比喻：這些動物很容易受驚，一受驚就跑掉。愛情也是如此，催促會讓它逃走。</p><p>這句話在卷中出現三次（2:7；3:5；8:4）。每一次，都是同一個叮嚀，在不同的處境裡重說。</p><blockquote><p>愛的關係裡，等待是一種尊重。等對方自己願意，比逼他回應更有分量。</p></blockquote><p>這一句也是保護的話：不要替別人決定，不要在壓力下要求回應。愛若不是自願的，就不是愛。</p><p>「情願」（חָפֵץ）的主詞有兩種讀法：愛情自己情願，或良人自己情願。無論哪一種，重點都在「自己」：不是旁人替他們決定時間。這句話保護兩個方向：愛還沒準備好，不要催；還沒情願，不要喚醒。對今天的人說，這是一句關於同意與等候的話：愛不能被逼出來、被催熟，也不能被別人代替。</p><p>這個副歌也提醒帶領者與長輩：不要替年輕人的感情趕進度，也不要替他們決定誰該愛誰。</p>"},{"a":8,"z":13,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>קוֹל דּוֹדִי הִנֵּה־זֶה בָּא מְדַלֵּג עַל־הֶהָרִים מְקַפֵּץ עַל־הַגְּבָעֽוֹת׃ דּוֹמֶה דוֹדִי לִצְבִי אוֹ לְעֹפֶר הָֽאַיָּלִים הִנֵּה־זֶה עוֹמֵד אַחַר כָּתְלֵנוּ מַשְׁגִּיחַ מִן־הַֽחֲלֹּנוֹת מֵצִיץ מִן־הַֽחֲרַכִּֽים׃ עָנָה דוֹדִי וְאָמַר לִי קוּמִי לָךְ רַעְיָתִי יָפָתִי וּלְכִי־לָֽךְ׃ כִּֽי־הִנֵּה הַסְּתָיו עָבָר הַגֶּשֶׁם חָלַף הָלַךְ לֽוֹ׃ הַנִּצָּנִים נִרְאוּ בָאָרֶץ עֵת הַזָּמִיר הִגִּיעַ וְקוֹל הַתּוֹר נִשְׁמַע בְּאַרְצֵֽנוּ׃ הַתְּאֵנָה חָֽנְטָה פַגֶּיהָ וְהַגְּפָנִים סְמָדַר נָתְנוּ רֵיחַ קוּמִי לָךְ רַעְיָתִי יָפָתִי וּלְכִי־לָֽךְ׃</p></blockquote>","lit":"「聽啊！是我良人的聲音；看哪！他躥山越嶺而來。我的良人好像羚羊，或像小鹿……他站在我們牆壁後，從窗戶往裡觀看，從窗欞往裡窺探。我良人對我說：我的佳偶，我的美人，起來，與我同去！因為冬天已往，雨水止住過去了。地上百花開放，百鳥鳴叫的時候已經來到；斑鳩的聲音在我們境內也聽見了。無花果樹的果子漸漸成熟；葡萄樹開花放香。我的佳偶，我的美人，起來，與我同去！」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>聲音</td><td>קוֹל</td><td>qol</td><td>H6963</td><td>聲音（第 8、14 節的鑰匙字）</td></tr><tr><td>斑鳩</td><td>תּוֹר</td><td>tor</td><td>H8449</td><td>斑鳩（春天的鳥）</td></tr><tr><td>無花果樹</td><td>תְּאֵנָה</td><td>te’enah</td><td>H8384</td><td>無花果樹，果子在春天漸熟</td></tr></table>","gram":"<p>「起來，與我同去」在 8、10、13 節出現，是<strong>邀請的祈使句</strong>。良人站在牆外，從窗戶往裡看，不是硬闖，是以聲音與春天來邀請。</p>","exp":"<p><strong>他在牆外說話，說的是春天到了。</strong></p><p>她先聽見他的聲音。他躥山越嶺而來，像羚羊，像小鹿，輕快，有力，遠遠就能聽見。他站在牆後，從窗戶往裡看。他不推門，他在窗外呼喚。</p><p>他的邀請，是一幅春天的畫面：冬天已往，雨水止住，百花開放，斑鳩在境內鳴叫，無花果漸漸成熟，葡萄樹開花放香。自然的甦醒，就是邀請的理由。</p><blockquote><p>愛的邀請，常常是跟著季節來的。當外面的世界醒過來，心裡的人也被喚醒。</p></blockquote><p>值得留意的是，他說「起來，與我同去」。這不是命令，是陪伴。讀的人可以想：在我的生命裡，有人在窗外呼喚我「起來」嗎？而我，願意聽見他的聲音嗎？</p><p>「起來，我的佳偶，我的美人，與我同去」這句邀請在第 10 節與第 13 節各出現一次，像春天的門鈴按了兩次。第 11 到 13 節的景象：冬天過了，雨止了，花開了，斑鳩叫了，無花果樹結了小果。他用季節說：時候到了。但他等的是她自己起身，他沒有闖進去。</p>"},{"a":14,"z":15,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>יוֹנָתִי בְּחַגְוֵי הַסֶּלַע בְּסֵתֶר הַמַּדְרֵגָה הַרְאִינִי אֶתּ־מַרְאַיִךְ הַשְׁמִיעִינִי אֶת־קוֹלֵךְ כִּי־קוֹלֵךְ עָרֵב וּמַרְאֵיךְ נָאוֶֽה׃ אֶֽחֱזוּ־לָנוּ שֽׁוּעָלִים שֽׁוּעָלִים קְטַנִּים מְחַבְּלִים כְּרָמִים וּכְרָמֵינוּ סְמָדַֽר׃</p></blockquote>","lit":"「我的鴿子啊，你在磐石穴中，在陡岩的隱密處。求你容我得見你的面貌，得聽你的聲音；因為你的聲音柔和，你的面貌秀美。要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸，因為我們的葡萄正在開花。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>鴿子</td><td>יוֹנָה</td><td>yonah</td><td>H3123</td><td>鴿子（隱密、柔和、不設防的意象）</td></tr><tr><td>狐狸</td><td>שׁוּעָל</td><td>shu‘al</td><td>H7776</td><td>狐狸（小狐狸毀壞葡萄園）</td></tr></table>","gram":"<p>第 15 節的「小狐狸」是<strong>小的破壞</strong>。它不是大敵，而是毀壞葡萄園的小東西。這一節的重點不在獵狐，在於保護正在開花的葡萄。</p>","exp":"<p><strong>愛裡最容易被毀壞的，往往是小事。</strong></p><p>良人稱她為鴿子，在磐石穴中，在陡岩的隱密處。鴿子躲在石縫裡，是一種不設防的、柔和的姿態。他說想見她的面貌，聽她的聲音，因為她的聲音柔和，面貌秀美。</p><p>第 15 節忽然轉到小狐狸：要把毀壞葡萄園的小狐狸擒拿起來，因為葡萄正在開花。這是一句很生活的話：愛情最需要的保護，常常是防備那些小的、不起眼的破壞。</p><blockquote><p>大的危險，人會戒備；小的破壞，最容易被忽略。愛的保護，就在這些小事上。</p></blockquote><p>寓言讀者會把小狐狸讀成試探、罪、或是教會裡的小問題。本講義陳列這些讀法，但先看字面：一片開花的葡萄園，需要有人留意那些會啃咬它的小東西。</p><p>第 15 節「捉拿小狐狸」的說話者，經文沒有標明，有人讀為良人，有人讀為眾人，也有人讀為女子。這裡不下定論，只留一個提醒：毀壞葡萄園的是小狐狸，不是大獅子；而且那是「我們的」葡萄園，保護它是兩個人的責任。</p>"},{"a":16,"z":17,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>דּוֹדִי לִי וַאֲנִי לוֹ הָרֹעֶה בַּשּׁוֹשַׁנִּֽים׃ עַד שֶׁיָּפוּחַ הַיּוֹם וְנָסוּ הַצְּלָלִים סֹב דְּמֵה־לְךָ דוֹדִי לִצְבִי אוֹ לְעֹפֶר הָאַיָּלִים עַל־הָרֵי בָֽתֶר׃</p></blockquote>","lit":"「良人屬我，我也屬他；他在百合花中牧放群羊。我的良人哪，求你等到天起涼風、日影飛去的時候，你要轉回，好像羚羊，或像小鹿在比特山上。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>屬</td><td>לִי</td><td>li</td><td>—</td><td>屬於我（介詞＋人稱）；「良人屬我，我也屬他」的關鍵字（★ 本卷的一條反覆）</td></tr></table>","gram":"<p>「良人屬我，我也屬他」是<strong>雙向的歸屬</strong>。兩個人互相屬於，不是一方擁有另一方。這句話在 6:3、7:10 會再出現。</p>","exp":"<p><strong>這一章的結尾，是兩個人的互屬。</strong></p><p>「良人屬我，我也屬他。」這句話很短，卻是整卷最重要的一句之一。它說明愛的結構：不是我擁有你，也不是你擁有我，而是我們彼此屬於。</p><p>他在百合花中牧放群羊。百合又出現了，她在荊棘中是百合，他在百合花中牧羊。兩個人都在自然裡，在這朵花與那朵花之間。</p><p>最後一節，她請他「等到天起涼風、日影飛去的時候，你要轉回」。這是一個等待的盼望：白晝還長，他還要離開，但她盼望他會回來。這一句，會在 4:6 再回應，是「日影飛去」的反覆。</p><blockquote><p>互屬的愛，不是把對方綁在身邊，而是知道：即使他暫時離開，他仍然屬於我，我仍然屬於他。</p></blockquote><p>讀的人可以問：我對誰的歸屬，是建立在佔有上，還是建立在彼此的承諾上？這個問題，會在第 6 章再被推到前面。</p><p>「良人屬我」放在「我屬他」之前，是她先確認他是她的，再說自己是他的。這個次序在 6:3 反過來，在 7:10 又變成只說「我屬我的良人」。三次次序的改變，記下她的心如何從「擁有」走向「歸屬」。</p>"}],"3":[{"a":1,"z":2,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַל־מִשְׁכָּבִי בַּלֵּילוֹת בִּקַּשְׁתִּי אֵת שֶׁאָהֲבָה נַפְשִׁי בִּקַּשְׁתִּיו וְלֹא מְצָאתִֽיו׃ אָקוּמָה נָּא וַאֲסוֹבְבָה בָעִיר בַּשְּׁוָקִים וּבָרְחֹבוֹת אֲבַקְשָׁה אֵת שֶׁאָהֲבָה נַפְשִׁי בִּקַּשְׁתִּיו וְלֹא מְצָאתִֽיו׃</p></blockquote>","lit":"「在我的床榻上，在夜間，我尋求我魂所愛的；我尋求他，卻沒有找到。我要起來，在城中四處走動，在街市上，在寬闊處，尋求我魂所愛的；我尋求他，卻沒有找到。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>床榻</td><td>מִשְׁכָּב</td><td>mishkav</td><td>H4904</td><td>床、躺臥之處</td></tr><tr><td>尋找（★）</td><td>בִּקֵּשׁ</td><td>biqqesh</td><td>H1245</td><td>尋求、尋找（Piel，著力地找）</td></tr><tr><td>心（魂）</td><td>נֶפֶשׁ</td><td>nefesh</td><td>H5315</td><td>魂、整個人；「我魂所愛的」＝我整個人所愛的</td></tr><tr><td>街市</td><td>שׁוּק</td><td>shuq</td><td>H7784</td><td>街道、市集</td></tr></table>","gram":"<p>「尋找」用的是 Piel 詞幹 בִּקַּשְׁתִּי，是<strong>著力地、反覆地去找</strong>。第 1、2 節的同一句「我尋找他，卻尋不見」重複兩次，讓讀的人感覺到夜的長。</p>","exp":"<p><strong>她在床上找他，找不到，就起來到街上去找。</strong></p><p>全章的第一句，就是「我夜間躺臥在床上」。她睡不著。夜把她對他的思念放大了。她尋找的是「我魂所愛的」：不是「我的丈夫」，不是「他」，而是「我整個人所愛的那一位」。</p><p>「我尋找他，卻尋不見」，同一句話在第 1、2 節各出現一次。第二次，她已經從床上起來，到了城中的街市、寬闊處。她不只是想念，她動身了。</p><blockquote><p>想念可以在床上，尋找卻要起來。愛要有行動，也要承受找不到的那一刻。</p></blockquote><p>讀的人若正在某個夜裡找不到，經文不責備。它讓你看見：找不到的夜，是被經文如實記下來的，而且它出現在整卷愛的詩的中間。</p><p>第 2 節的「我要起來」是下定決心的語氣。夜裡的尋找不是迷路，是一個人決定不再只是躺著想念。她找的地方是城裡最公開的地方：街市和寬闊處，她不怕被人看見自己在找。</p><p>尋不見的夜，在經文裡不被縮短，也不被解釋；經文只是如實記下，這本身就是對尋找者的尊重。</p>"},{"a":3,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מְצָאוּנִי הַשֹּׁמְרִים הַסֹּבְבִים בָּעִיר אֵת שֶׁאָהֲבָה נַפְשִׁי רְאִיתֶֽם׃ כִּמְעַט שֶׁעָבַרְתִּי מֵהֶם עַד שֶֽׁמָּצָאתִי אֵת שֶׁאָהֲבָה נַפְשִׁי אֲחַזְתִּיו וְלֹא אַרְפֶּנּוּ עַד־שֶׁהֲבֵיאתִיו אֶל־בֵּית אִמִּי וְאֶל־חֶדֶר הוֹרָתִֽי׃</p></blockquote>","lit":"「城中巡邏看守的人遇見我；我問他們：你們看見我魂所愛的沒有？我剛離開他們，就遇見我魂所愛的。我拉住他，不容他走，直到領他入我母家，到懷我者的內室。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>看守的人</td><td>שֹׁמֵר</td><td>shomer</td><td>H8104</td><td>看守者（分詞；字根 שׁמר「守」）</td></tr><tr><td>拉住</td><td>אָחַז</td><td>achaz</td><td>H270</td><td>抓住、握住</td></tr><tr><td>不容他走</td><td>רָפָה</td><td>rafah</td><td>H7503</td><td>鬆手、放開（否定：不放開）</td></tr><tr><td>內室</td><td>חֶדֶר</td><td>cheder</td><td>H2315</td><td>內室、房間</td></tr></table>","gram":"<p>第 4 節「我剛離開他們，就遇見我魂所愛的」中的 <strong>כִּמְעַט（剛剛、幾乎）</strong>說明：她找到他，就在離開看守人之後不久。找到的時間點，不在她期待的地方。</p>","exp":"<p><strong>她剛離開看守的人，就遇見他。</strong></p><p>她問巡邏的看守人：你們看見我魂所愛的沒有？經文沒有記下他們的回答。她沒有等答案，因為轉身不久，就遇見了。找到的時間，常常是在你放棄問路之後。</p><p>接著是全章最動人的兩個動詞：「我拉住他，不容他走。」她抓住他，不放手。這不是控制，是找了一整夜之後的失而復得。</p><blockquote><p>找到之後，她把他領進「我母家，到懷我者的內室」。尋找的終點，不是街市，是一個被保護、被祝福的家。</p></blockquote><p>值得提醒的是：愛裡的「不放手」和「控制」不同。前者是因為怕再失去，後者是因為不信任。讀的人要用這一節檢驗自己：我抓住的，是我找了很久的那一位，還是我怕失去的東西？</p><p>「拉住他」與「不容他走」連在一起，語氣很強。但她抓住以後做的事，是把他帶回母親的家。她不是把他藏在私處，而是帶他回到一個認識她、也會祝福她的地方。愛的抓緊，若走對方向，終點是被祝福的關係，而不是把人藏起來。</p>"},{"a":5,"z":5,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִשְׁבַּעְתִּי אֶתְכֶם בְּנוֹת יְרוּשָׁלִַם בִּצְבָאוֹת אוֹ בְּאַיְלוֹת הַשָּׂדֶה אִם־תָּעִירוּ וְֽאִם־תְּעֽוֹרְרוּ אֶת־הָאַהֲבָה עַד שֶׁתֶּחְפָּֽץ׃</p></blockquote>","lit":"「耶路撒冷的眾女子啊，我指著羚羊或田野的母鹿囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願。」","key":"","gram":"<p>這是 2:7 的<strong>原句重複</strong>。重複出現在全章的節點上（2:7、3:5、8:4），像副歌。這裡的位置在「找到之後」，意義是：找到了，更不要催。</p>","exp":"<p><strong>找到之後，她又說一次：不要叫醒。</strong></p><p>這是副歌，與 2:7 逐字相同。第一次出現是在互相讚美、以愛為旗的甜蜜裡；這一次出現，是在漫長的夜、找到之後。</p><p>同一句話，在不同的處境裡，意思更深。經過夜裡的尋找，她更明白：愛不能被催促，也不能被強求。不論是找不到的時候，還是剛找到的時候，這句話都成立。</p><blockquote><p>不催，不逼，等他自己情願。這是愛的規矩，在尋找之前、之中、之後，都一樣。</p></blockquote><p>這句話的位置值得留意。它出現在「找到」之後，不是「找不到」的時候。找到的人最容易想緊緊守住、催他把話說定。她卻先囑咐旁人：不要驚動。這句副歌因此不只在說「不要催他」，也在說：找到了，也要把時間交給愛。越重要的關係，越不能靠催逼推進。</p><p>這句副歌在全卷出現三次，次次站在關鍵的轉折點上：2:7 是甜蜜之後，3:5 是尋見之後，8:4 是一切將近完成之後。每一次，都是在提醒：愛不是任何人可以掌控的事。</p>"},{"a":6,"z":6,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מִי זֹאת עֹלָה מִן־הַמִּדְבָּר כְּתִֽימֲרוֹת עָשָׁן מְקֻטֶּרֶת מוֹר וּלְבוֹנָה מִכֹּל אַבְקַת רוֹכֵֽל׃</p></blockquote>","lit":"「那從曠野上來、形狀如煙柱、以沒藥和乳香並商人各樣香粉薰的是誰呢？」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>曠野</td><td>מִדְבָּר</td><td>midbar</td><td>H4057</td><td>曠野</td></tr><tr><td>乳香</td><td>לְבוֹנָה</td><td>levonah</td><td>H3828</td><td>乳香（樹脂，焚燒時有香氣）</td></tr><tr><td>沒藥</td><td>מֹר</td><td>mor</td><td>H4753</td><td>沒藥</td></tr></table>","gram":"<p>「那……是誰呢？」是<strong>修辭問句</strong>，回答出現在下一節：「看哪，是所羅門的轎」。同樣的問句形式在 6:10、8:5 再出現。</p>","exp":"<p><strong>曠野裡升起一道香氣的煙柱，眾人問：那是誰？</strong></p><p>場景從夜裡的街道，轉到曠野。遠遠地，有一道煙柱升起，帶著沒藥與乳香的香氣。這是一個行列來了，香氣先到。</p><p>「是誰呢？」這個問句，讓讀的人停下來張望。在曠野中升起的煙柱，使聖經的讀者想起以色列出埃及時的雲柱、火柱——這使我們想起，但經文並沒有這樣講，我們不把它說成預表。</p><blockquote><p>被愛的人，在眾人眼中，是從曠野上來的一道香氣。</p></blockquote><p>這是全卷「那……是誰呢？」三個問句的第一個（3:6；6:10；8:5）。每一次，問的是同一件事：這位被愛的人，是誰？</p><p>「煙柱」（תִּימֲרוֹת עָשָׁן）是少見的字，帶出一縷一縷往上升的煙。沒藥與乳香都要焚燒才有香氣，香氣是經過火才有的。讀者不免想到：被愛的人，常是走過曠野、經過火煉之後，才散發出香氣的人。這是應用，不是經文的明說。</p><p>另外，第 6 節用的是「從曠野上來」，而不是「從城裡出來」：這位被愛的人走過的路，不是平坦的路。愛她的人，也沒有因此看輕她。</p>"},{"a":7,"z":8,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנֵּה מִטָּתוֹ שֶׁלִּשְׁלֹמֹה שִׁשִּׁים גִּבֹּרִים סָבִיב לָהּ מִגִּבֹּרֵי יִשְׂרָאֵֽל׃ כֻּלָּם אֲחֻזֵי חֶרֶב מְלֻמְּדֵי מִלְחָמָה אִישׁ חַרְבּוֹ עַל־יְרֵכוֹ מִפַּחַד בַּלֵּילּֽוֹת׃</p></blockquote>","lit":"「看哪，是所羅門的床榻（轎）；四圍有六十個勇士，都是以色列中的勇士；手都持刀，善於爭戰，腰間佩刀，防備夜間有驚慌。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>轎</td><td>מִטָּה</td><td>mittah</td><td>H4296</td><td>床榻、臥榻；和合本譯「轎」，原字平常指「床」</td></tr><tr><td>勇士</td><td>גִּבּוֹר</td><td>gibbor</td><td>H1368</td><td>勇士、戰士</td></tr><tr><td>驚慌</td><td>פַּחַד</td><td>pachad</td><td>H6343</td><td>驚恐、懼怕</td></tr></table>","gram":"<p>和合本譯作「轎」的 מִטָּה，平常意思是「床榻」。第 9 節另用一個罕見字 אַפִּרְיוֹן（見下一段）。<strong>是床還是轎，歷代譯本不一致</strong>；讀作「抬著的臥榻」，兩者可以相通。</p>","exp":"<p><strong>六十個勇士圍著他，不是因為他弱，是因為夜裡有驚慌。</strong></p><p>答案揭曉：是所羅門的床榻，四圍有六十個持刀的勇士。這是一個王的婚禮行列，有威儀，也有保護。</p><p>最耐人尋味的是第 8 節的最後一句：「防備夜間有驚慌。」夜，又出現了。第 1 節是她在夜裡尋找，這裡是他的勇士在夜裡防備。夜的危險是真的，不是矯情。</p><blockquote><p>連所羅門的婚禮，也要有六十個勇士守夜。愛不是天真地忽略黑夜，而是在黑夜裡被保護著。</p></blockquote><p>讀的人可以問：我所愛的人，在夜裡有人守護嗎？我自己，又能不能成為守護別人的一位？</p><p>「六十」這個數字，在 6:8 又出現（六十王后）。兩處都是王的排場：這裡是保護的勇士，那裡是后妃的人數。到了 6:9，她是「獨一」的。可以對著讀：王有六十，愛卻只認一個。第 8 節腰間佩刀，說明這是一支隨時能戰的守衛，不是儀仗隊。</p><p>婚禮需要守衛，說明愛是在真實的世界裡發生的。讀者可以想：我所愛的人，我能為他守住甚麼？</p>"},{"a":9,"z":10,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אַפִּרְיוֹן עָשָׂה לוֹ הַמֶּלֶךְ שְׁלֹמֹה מֵעֲצֵי הַלְּבָנֽוֹן׃ עַמּוּדָיו עָשָׂה כֶסֶף רְפִידָתוֹ זָהָב מֶרְכָּבוֹ אַרְגָּמָן תּוֹכוֹ רָצוּף אַהֲבָה מִבְּנוֹת יְרוּשָׁלִָֽם׃</p></blockquote>","lit":"「所羅門王用黎巴嫩木為自己製造一乘華轎。轎柱是用銀做的，轎底是用金做的；坐墊是紫色的，其中所鋪的乃耶路撒冷眾女子的愛情。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>華轎</td><td>אַפִּרְיוֹן</td><td>appiryon</td><td>H668</td><td>肩輿、華麗的轎（全舊約只出現這一次）</td></tr><tr><td>轎柱</td><td>עַמּוּד</td><td>ammud</td><td>H5982</td><td>柱子</td></tr><tr><td>愛情</td><td>אַהֲבָה</td><td>ahavah</td><td>H160</td><td>愛（「鋪滿了愛」，一說「以愛鑲嵌」）</td></tr></table>","gram":"<p>第 10 節最後一句 תּוֹכוֹ רָצוּף אַהֲבָה 的 רָצוּף（鋪、鑲嵌）是罕見字，<strong>歷代譯法不一</strong>：「鋪的是愛情」「以愛鑲嵌」，或「由耶路撒冷的女子以愛鋪成」。大意相同：這華麗的轎，最裡面是愛。</p>","exp":"<p><strong>外面是銀、金與紫色；最裡面鋪的是愛。</strong></p><p>所羅門用黎巴嫩的香柏木造了一乘華轎，柱是銀的，底是金的，坐墊是紫色。這是財富與威儀的堆疊。</p><p>可是第 10 節的最後一句，把視線從外面收到裡面：其中所鋪的，乃是「愛情」。最華麗的東西，最後被一個字比下去。</p><blockquote><p>銀、金、紫色，都是外面的。最裡面的，只有一樣是不可少的：愛。</p></blockquote><p>這是第 8 章 7 節的預備：「若有人拿家中所有的財寶要換愛情，就全被藐視。」那時，這幅華轎的畫面會再被想起。</p><p>紫色在古代是昂貴的染料，坐墊用紫色，說明他捨得在舒適上花錢。第 10 節「其中所鋪的」，主詞不明，有人讀為耶路撒冷的女子以愛心鋪成，有人讀為內裡鑲嵌著愛。無論怎樣讀，焦點都在轎子的「裡面」。今天的人很容易把婚禮、房子、車子，算成愛的證明；這一節溫和地問：你的華轎，裡面鋪的是甚麼？</p><p>黎巴嫩的香柏木，也是所羅門建造聖殿與王宮時用的名貴木材；這乘轎子的用料，與他的王宮相稱。</p>"},{"a":11,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>צְאֶינָה וּֽרְאֶינָה בְּנוֹת צִיּוֹן בַּמֶּלֶךְ שְׁלֹמֹה בָּעֲטָרָה שֶׁעִטְּרָה־לּוֹ אִמּוֹ בְּיוֹם חֲתֻנָּתוֹ וּבְיוֹם שִׂמְחַת לִבּֽוֹ׃</p></blockquote>","lit":"「錫安的眾女子啊，你們出去觀看所羅門王！頭戴冠冕，就是在他婚筵的日子、心中喜樂的時候，他母親給他戴上的。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>冠冕</td><td>עֲטָרָה</td><td>atarah</td><td>H5850</td><td>冠、花冠</td></tr><tr><td>婚筵</td><td>חֲתֻנָּה</td><td>chatunnah</td><td>H2861</td><td>婚禮、結婚</td></tr><tr><td>喜樂</td><td>שִׂמְחָה</td><td>simchah</td><td>H8057</td><td>喜樂、歡慶</td></tr></table>","gram":"<p>「他母親給他戴上」是<strong>以母親為行動者</strong>。婚禮的冠冕不是自己戴上的，是母親（家）給的。這一個動詞 עִטְּרָה 與名詞 עֲטָרָה 同字根，有「環繞、戴冠」的意思。</p>","exp":"<p><strong>婚禮的冠冕，是母親親手戴上的。</strong></p><p>這一章以一位女子夜裡的尋找開頭，以一位王的婚禮冠冕結束。夜與日，尋找與慶祝，都在同一章裡。</p><p>經文特別說：是他母親給他戴上的。婚禮不是兩個人的私事，是兩個家的事。在第 4 節，她把他領進「我母家」；在這一節，他的母親為他戴冠。兩個母親都在場。</p><blockquote><p>愛的終點不是兩個人躲起來，而是被兩個家一起祝福、一起歡喜。</p></blockquote><p>也要記得：不是每一個人都有這樣的婚禮，也不是每一段愛都要走到婚禮才有價值。這一節要說的，是愛被祝福時的喜樂，不是對單身的人說「你欠缺了甚麼」。</p><p>「錫安的女子」與前面的「耶路撒冷的女子」是同一批旁觀者的不同稱呼，她們被邀請出去「看」。在 3:5，她們被囑咐「不要驚動」；在這裡，她們被邀請「出去觀看」。可以看，不可以催：旁觀者的位置，是歡喜的見證人。</p><p>「心中喜樂的時候」這句話值得留下：經文說婚筵的日子，是心中喜樂的日子，而不是責任與負擔的日子。</p>"}],"4":[{"a":1,"z":3,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנָּךְ יָפָה רַעְיָתִי הִנָּךְ יָפָה עֵינַיִךְ יוֹנִים מִבַּעַד לְצַמָּתֵךְ שַׂעְרֵךְ כְּעֵדֶר הָֽעִזִּים שֶׁגָּלְשׁוּ מֵהַר גִּלְעָֽד׃ שִׁנַּיִךְ כְּעֵדֶר הַקְּצוּבוֹת שֶׁעָלוּ מִן־הָרַחְצָה שֶׁכֻּלָּם מַתְאִימוֹת וְשַׁכֻּלָה אֵין בָּהֶֽם׃ כְּחוּט הַשָּׁנִי שִׂפְתֹתַיִךְ וּמִדְבָּרֵיךְ נָאוֶה כְּפֶלַח הָֽרִמּוֹן רַקָּתֵךְ מִבַּעַד לְצַמָּתֵֽךְ׃</p></blockquote>","lit":"「看哪，你美麗，我的佳偶；看哪，你美麗，你的眼在帕子內如鴿子。你的頭髮如山羊群，從基列山上蜿蜒而下。你的牙齒如一群剛剪毛的母羊，洗淨上來，個個成對，沒有一隻喪掉子的。你的唇好像一條朱紅線，你的言語秀美；你的兩太陽在帕子內，如一塊石榴。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>佳偶</td><td>רַעְיָה</td><td>ra‘yah</td><td>H7474</td><td>女伴、佳偶（陰性；「我的朋友、我的愛侶」）</td></tr><tr><td>美麗</td><td>יָפָה</td><td>yafah</td><td>H3303</td><td>美麗（★ 開頭兩次重複）</td></tr><tr><td>眼</td><td>עַיִן</td><td>ayin</td><td>H5869</td><td>眼睛</td></tr><tr><td>鴿子</td><td>יוֹנָה</td><td>yonah</td><td>H3123</td><td>鴿子</td></tr></table>","gram":"<p>第 1 節兩次 <strong>הִנָּךְ יָפָה（看哪，你美麗）</strong>。這個重複與 1:15 相同，是良人的口頭禪，也是全章的基調。</p>","exp":"<p><strong>他一處一處地看她，每一處都配上一幅田園的畫。</strong></p><p>眼睛像鴿子，頭髮像基列山坡上蜿蜒下來的山羊群，牙齒像剛洗淨的羊群，嘴唇像朱紅線。這些比喻，今天讀來會覺得陌生。但它們都來自同一個世界：農夫與牧人熟悉的東西，是他們眼中最美好的畫面。</p><p>讀這段，不必把每個比喻硬翻成現代的外貌標準。重要的是方式：<strong>他細細地看她，而且說出來</strong>。被愛的人聽見自己被這樣地看，這本身就是一種醫治。</p><blockquote><p>讚美不是在評分，是在說：我看見你，我願意看你，我看你的每一處都珍貴。</p></blockquote><p>也請記得：被讚美的是一位完整的人。她在帕子後面，仍然有眼睛、言語，也有自己。</p><p>他的每一句讚美都從「你美」開始，這個重複在 1:15 也出現。他不是在列舉身體部位的清單，而是在說：我停下來細看你。能被人細看而不覺得羞恥，是安全的愛才能給的禮物。這些比喻的重點是整體的美、潔淨與完整，例如「個個都有雙生，沒有一隻喪掉子」說的是無缺。</p>"},{"a":4,"z":5,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כְּמִגְדַּל דָּוִיד צַוָּארֵךְ בָּנוּי לְתַלְפִּיּוֹת אֶלֶף הַמָּגֵן תָּלוּי עָלָיו כֹּל שִׁלְטֵי הַגִּבּוֹרִֽים׃ שְׁנֵי שָׁדַיִךְ כִּשְׁנֵי עֳפָרִים תְּאוֹמֵי צְבִיָּה הָרוֹעִים בַּשּׁוֹשַׁנִּֽים׃</p></blockquote>","lit":"「你的頸項好像大衛建造收藏軍器的高臺，其上懸掛一千盾牌，都是勇士的籐牌。你的兩乳好像百合花中吃草的一對小鹿，就是母鹿雙生的。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>高臺</td><td>מִגְדָּל</td><td>migdal</td><td>H4026</td><td>塔、高臺</td></tr><tr><td>脖子（頸項）</td><td>צַוָּאר</td><td>tsavvar</td><td>H6677</td><td>頸項</td></tr><tr><td>百合</td><td>שׁוֹשַׁנָּה</td><td>shoshannah</td><td>H7799</td><td>百合</td></tr></table>","gram":"<p>第 4 節的 לְתַלְפִּיּוֹת 是罕見字，意義歷代不一（「武庫」「層層疊疊」），本講義取和合本的「高臺」。這樣的字，<strong>提醒我們不要在細節上過度肯定</strong>。</p>","exp":"<p><strong>脖子是塔，上面掛滿盾牌：他讚美的是她站立的姿態。</strong></p><p>頸項如大衛的高臺，掛著一千盾牌，是勇士的籐牌。這是一幅威武的畫。說的不是她脖子的長度，而是她昂首站立時的尊嚴：一個女子站立時，像一座被保護、被尊重的塔。</p><p>第 5 節的小鹿，是柔軟與跳躍的意象，與前一節的塔形成對照。她既有塔的尊嚴，也有小鹿的輕盈。這是一個完整的人，不是單一的形象。</p><blockquote><p>真正的讚美，看見的是一個人的整體：有力，也有柔軟；站得穩，也跑得輕。</p></blockquote><p>身體的描寫，在聖經裡是被接納、被放在婚姻裡面的。讀的人不必害羞，也不必好奇，只要尊重。</p><p>盾牌掛在塔上，是展示榮耀的方式。他看見的，是她被護衛的、有尊嚴的站姿。第 5 節雙生的小鹿在百合花中吃草，是溫柔的畫面；與下一節「全然美麗」一同讀，語氣才不會走偏。</p><p>「大衛的高臺」是哪一座建築，今天已不可考；重要的是它像一座高聳而穩固的塔，用來形容她挺立時的尊嚴。</p>"},{"a":6,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַד שֶׁיָּפוּחַ הַיּוֹם וְנָסוּ הַצְּלָלִים אֵלֶךְ לִי אֶל־הַר הַמּוֹר וְאֶל־גִּבְעַת הַלְּבוֹנָֽה׃ כֻּלָּךְ יָפָה רַעְיָתִי וּמוּם אֵין בָּֽךְ׃</p></blockquote>","lit":"「等到天起涼風、日影飛去的時候，我要往沒藥山和乳香岡去。我的佳偶，你全然美麗，毫無瑕疵！」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>日影飛去</td><td>וְנָסוּ הַצְּלָלִים</td><td>venasu hatselalim</td><td>H5127 + H6738</td><td>影子逃走（日落或日出時的轉換）</td></tr><tr><td>瑕疵</td><td>מוּם</td><td>mum</td><td>H3971</td><td>缺點、污點</td></tr><tr><td>全然</td><td>כֹּל</td><td>kol</td><td>H3605</td><td>全部、整個</td></tr></table>","gram":"<p>第 6 節的「日影飛去」與 2:17 同一句，是副歌式的重複。「毫無瑕疵」的 מוּם 在利未記是指獻祭牲畜的缺陷（利 22:20）。<strong>這個詞出現在情詩裡，把「無缺陷」這個聖潔的詞，用在被愛的人身上</strong>。</p>","exp":"<p><strong>「你全然美麗，毫無瑕疵。」被愛的人，從頭到腳都被接納。</strong></p><p>良人說：等到天起涼風、日影飛去，我要往沒藥山、乳香岡去。這與 2:17 同一句，只是說話的人換了。上一次是她等他回來，這一次是他要去，也要回來。</p><p>接著，他說出整章的第一句總結：「你全然美麗，毫無瑕疵！」這句話裡有一個細節：「毫無瑕疵」的字 מוּם，在舊約常用來形容獻給神的祭牲，必須沒有缺陷。他把這個詞，放在被愛的人身上。</p><blockquote><p>被愛的人不必因自己的缺點而躲藏。在愛她的人眼中，她是全然的，沒有可挑剔的。</p></blockquote><p>這不是否認她有缺點，而是愛的眼睛看見她的整體：愛不是挑出缺陷，是接納整個人。</p><p>「毫無瑕疵」（מוּם אֵין בָּךְ）在舊約多用在獻祭的牲畜，要「無殘疾」才可以獻上。把這個詞放在一個人身上，是最高的接納：愛她的人，眼中看不見她的缺點。這使我們想起福音裡神對人的接納，但經文沒有這樣講，我們不把它說成預表。</p>"},{"a":8,"z":8,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אִתִּי מִלְּבָנוֹן כַּלָּה אִתִּי מִלְּבָנוֹן תָּבוֹאִי תָּשׁוּרִי מֵרֹאשׁ אֲמָנָה מֵרֹאשׁ שְׂנִיר וְחֶרְמוֹן מִמְּעֹנוֹת אֲרָיוֹת מֵֽהַרְרֵי נְמֵרִֽים׃</p></blockquote>","lit":"「我的新婦，與我同來，離開黎巴嫩，與我同來，離開黎巴嫩；從亞瑪拿頂，從示尼珥與黑門頂，從有獅子的洞，從有豹子的山，往下觀看。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>新婦</td><td>כַּלָּה</td><td>kallah</td><td>H3618</td><td>新娘、新婦（本章第一次出現，全卷共六次）</td></tr><tr><td>獅子</td><td>אַרְיֵה</td><td>aryeh</td><td>H738</td><td>獅子</td></tr><tr><td>豹子</td><td>נָמֵר</td><td>namer</td><td>H5246</td><td>豹</td></tr></table>","gram":"<p>第 8 節的稱呼<strong>從「佳偶」換成「新婦」</strong>，並且在下一節加上「我妹子」。稱呼的變化是這段的線索：關係更近了。</p>","exp":"<p><strong>他請她從獅子的山上下來，與他同來。</strong></p><p>稱呼變了：不再只是「我的佳偶」，現在是「我的新婦」。他請她離開黎巴嫩，從亞瑪拿、示尼珥與黑門的山頂，從獅子的洞、豹子的山，往下觀看。這些地方遙遠、高峻、危險。</p><p>這一節的用意，是請她從高處、從遠處、從危險的地方走回來，與他在一起。邀請的重點是「與我同來」，不是「你自己下來」。</p><blockquote><p>愛有時是這樣：請一個站在高處、孤單、防備的人，走下來，與我同行。</p></blockquote><p>讀的人若在自己的山上，被獅子與豹子般的恐懼包圍，這一節說：有人在請你下來，要與你同行。</p><p>原文連說兩次「與我從黎巴嫩」，語氣是邀請，也是催促，像一個人站在山口伸出手。獅子洞、豹子山，可能只是形容山地的高遠險峻；經文沒有說她真的身處危險，所以不要把這一節讀成「拯救受害者」。但愛的召喚，的確是把人從遙遠與孤立中接近。</p><p>「新婦」（כַּלָּה）這個稱呼，從這一節起密集出現，一直延續到 5:1：稱呼的改變，標示他們的關係進入了新的階段。</p>"},{"a":9,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לִבַּבְתִּנִי אֲחֹתִי כַלָּה לִבַּבְתִּינִי בְּאַחַת מֵעֵינַיִךְ בְּאַחַד עֲנָק מִצַּוְּרֹנָֽיִךְ׃ מַה־יָּפוּ דֹדַיִךְ אֲחֹתִי כַלָּה מַה־טֹּבוּ דֹדַיִךְ מִיַּיִן וְרֵיחַ שְׁמָנַיִךְ מִכָּל־בְּשָׂמִֽים׃ נֹפֶת תִּטֹּפְנָה שִׂפְתוֹתַיִךְ כַּלָּה דְּבַשׁ וְחָלָב תַּחַת לְשׁוֹנֵךְ וְרֵיחַ שַׂלְמֹתַיִךְ כְּרֵיחַ לְבָנֽוֹן׃</p></blockquote>","lit":"「我妹子，我新婦，你奪了我的心。你用眼一看，用你項上的一條金鏈，奪了我的心！我妹子，我新婦，你的愛情何其美！你的愛情比酒更美！你膏油的香氣勝過一切香品！我新婦，你的嘴唇滴蜜，好像蜂房滴蜜；你的舌下有蜜，有奶。你衣服的香氣如黎巴嫩的香氣。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>奪了我的心</td><td>לִבַּבְתִּנִי</td><td>libbavtini</td><td>H3823</td><td>使我心動、奪我的心（由「心」לֵב 而來的動詞）</td></tr><tr><td>妹子</td><td>אָחוֹת</td><td>achot</td><td>H269</td><td>姊妹（情詩中的親暱稱呼，不指血緣）</td></tr><tr><td>蜜</td><td>דְּבַשׁ</td><td>devash</td><td>H1706</td><td>蜜</td></tr><tr><td>奶</td><td>חָלָב</td><td>chalav</td><td>H2461</td><td>奶</td></tr></table>","gram":"<p>「我妹子，我新婦」是情詩的稱呼，<strong>「妹子」在古代近東的情詩中是親暱語，不是血緣</strong>。埃及的情詩也有類似的用法。</p>","exp":"<p><strong>「你奪了我的心」——一個眼神，一條項鏈，就夠了。</strong></p><p>第 9 節的動詞 לִבַּבְתִּנִי，由「心」這個字而來。意思是：你使我心動，你拿走了我的心。這是全卷最直接的告白之一。</p><p>他沒有說「你的條件好」，他說「你用眼一看」。一個眼神，一條金鏈，就已經足夠。被愛不需要事情做得很多，往往只是被這個人看見。</p><p>第 10 節把「愛情比酒更美」重說一次（比較 1:2），第 11 節用蜜與奶形容她的嘴唇與舌下。「蜜與奶」使聖經的讀者想起應許之地（出 3:8），這使我們想起，但我們不把它講成預表。</p><blockquote><p>愛的語言常常是感官的：香氣、蜜、奶。經文不迴避這個，也不要我們迴避。</p></blockquote><p>第 9 節「你奪了我的心」連說兩次，他又叫她「我妹子，我新婦」。「妹」在古代近東的情詩裡是愛稱，與血緣無關。第 11 節「嘴脣滴蜜，舌下有蜜和奶」說的是話語的甘甜，不只是親吻：話語帶來滋養的人，才叫人心動。</p><p>被一個眼神、一條項鏈就奪去了心的人，說明愛可以從很小的細節開始，不必等待宏大的場面。</p>"},{"a":12,"z":15,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>גַּן נָעוּל אֲחֹתִי כַלָּה גַּל נָעוּל מַעְיָן חָתֽוּם׃ שְׁלָחַיִךְ פַּרְדֵּס רִמּוֹנִים עִם פְּרִי מְגָדִים כְּפָרִים עִם־נְרָדִֽים׃ נֵרְדְּ וְכַרְכֹּם קָנֶה וְקִנָּמוֹן עִם כָּל־עֲצֵי לְבוֹנָה מֹר וַאֲהָלוֹת עִם כָּל־רָאשֵׁי בְשָׂמִֽים׃ מַעְיַן גַּנִּים בְּאֵר מַיִם חַיִּים וְנֹזְלִים מִן־לְבָנֽוֹן׃</p></blockquote>","lit":"「我妹子，我新婦，乃是關鎖的園，禁閉的泉，封閉的源。你園內所種的結了石榴，有佳美的果子，並鳳仙花與哪噠樹。有哪噠和番紅花，菖蒲和桂樹，並各樣乳香木、沒藥、沉香，與一切上等的果品。你是園中的泉，活水的井，從黎巴嫩流下來的溪水。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>園</td><td>גַּן</td><td>gan</td><td>H1588</td><td>園子（★ 全卷的園意象）</td></tr><tr><td>關鎖的</td><td>נָעוּל</td><td>na‘ul</td><td>H5274</td><td>鎖上的（被動分詞）</td></tr><tr><td>封閉的</td><td>חָתוּם</td><td>chatum</td><td>H2856</td><td>蓋了印的（字根 חתם「印」，與 8:6 的「印記」同源）</td></tr><tr><td>泉源</td><td>מַעְיָן</td><td>ma‘yan</td><td>H4599</td><td>泉源</td></tr><tr><td>活水</td><td>מַיִם חַיִּים</td><td>mayim chayyim</td><td>H4325 + H2416</td><td>流動的水、活水</td></tr></table>","gram":"<p><strong>① 「關鎖的園」是甚麼意思？</strong></p><ul><li><strong>字面讀</strong>：新娘的身體與愛，是專屬的、被保護的；只有她願意，才向所愛的人打開。</li><li><strong>寓言讀</strong>：教會、或信徒的心，是為基督保留的園。</li></ul><p>本講義字面先行：<strong>園子是她的，鑰匙在她手裡</strong>（見下一節 4:16，她自己開門）。</p><p>另外值得留意：4:12 的「封閉」（חָתוּם）與 8:6 的「印記」（חוֹתָם）出自同一字根 חתם，<strong>全卷的頭尾，以同一個字根互相呼應</strong>。</p>","exp":"<p><strong>一座園子，鎖著，封著；而園裡面，是流動的活水。</strong></p><p>良人用三個詞描述她：關鎖的園、禁閉的泉、封閉的源。三個詞都帶著「保護」的意思：這是一個不被隨意進入的地方，是專屬的，是被守護的。</p><p>但同一節裡，園內所種的，結了石榴，有佳美的果子，有各樣的香料；她是園中的泉，活水的井。<strong>鎖著，不是死的，是活的</strong>。被保護的，是一個豐盛、流動的生命。</p><blockquote><p>界線不是壓抑。有界線的愛，是被守護的愛，所以香氣不會被糟蹋。</p></blockquote><p>牧養上，這一段要小心講：它不是對人的身體說「你要守住」的律法，而是說這份愛本身是貴重的，所以值得被保護。園子的主人是她，這是對她的尊重。</p><p>園子與泉源，在舊約裡常是婚姻的比喻，箴言也這樣用過。「鎖」與「封」是保護的語言，不是囚禁的語言。注意第 15 節：他說她是「園中的泉」「活水的井」，是流出來的，不是死水。被守護的並不封閉；她既是園，也是流向外面的泉。</p>"},{"a":16,"z":16,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עוּרִי צָפוֹן וּבוֹאִי תֵימָן הָפִיחִי גַנִּי יִזְּלוּ בְשָׂמָיו יָבֹא דוֹדִי לְגַנּוֹ וְיֹאכַל פְּרִי מְגָדָֽיו׃</p></blockquote>","lit":"「北風啊，興起！南風啊，吹來！吹在我的園內，使其中的香氣發出來。願我的良人進入自己的園裡，吃他佳美的果子。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>北風</td><td>צָפוֹן</td><td>tsafon</td><td>H6828</td><td>北方、北風</t
