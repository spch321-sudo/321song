d></tr><tr><td>南風</td><td>תֵּימָן</td><td>teiman</td><td>H8486</td><td>南方、南風</td></tr><tr><td>進入</td><td>בּוֹא</td><td>bo’</td><td>H935</td><td>來、進入（願式：願他來）</td></tr></table>","gram":"<p>「願我的良人進入<strong>自己的園</strong>裡」：新娘稱這園為「他的」（לְגַנּוֹ）。她在 4:12 是被稱為「關鎖的園」，在 4:16 是她自己把園說成「他的園」。<strong>門是她開的</strong>。</p>","exp":"<p><strong>門是她自己打開的。她說：願我的良人進入自己的園。</strong></p><p>這一節是整章的轉折。前面四節，他說園是關鎖的；這一節，她說：北風啊，興起；南風啊，吹來；吹在我的園內，使香氣發出來。然後她說：願我的良人進入「自己的園」。</p><p>注意主詞：不是他闖進來，不是他強取，是她請他來。她把原本屬於自己的園，稱為「他的園」，然後邀請他來吃佳美的果子。</p><blockquote><p>愛的親密，不是奪取，是被邀請。進入的人，是被請進來的。</p></blockquote><p>這一節也是對所有人的保護：沒有人有權利替別人開門；即使是最親近的人，也要等「她自己情願」（2:7）。</p><p>「進入自己的園」的「自己的」是關鍵：園子是她的，她卻稱它為「他的」。她用同一句話，把擁有變成獻上，而且是在她自己開口說了「來」之後才發生。這與 2:7 的副歌互相解釋：不要叫醒，等她情願；現在她情願了，她開口了。邀請是由她發出的。</p><p>她說：「使我園內的香氣發出來。」香氣只有在風吹來時才散發，她邀請風，也邀請他：愛需要被打開，才能被分享。</p>"}],"5":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בָּאתִי לְגַנִּי אֲחֹתִי כַלָּה אָרִיתִי מוֹרִי עִם־בְּשָׂמִי אָכַלְתִּי יַעְרִי עִם־דִּבְשִׁי שָׁתִיתִי יֵינִי עִם־חֲלָבִי אִכְלוּ רֵעִים שְׁתוּ וְשִׁכְרוּ דּוֹדִֽים׃</p></blockquote>","lit":"「我妹子，我新婦，我進了我的園中，採了我的沒藥和香料，吃了我的蜜房和蜂蜜，喝了我的酒和奶。朋友們，請吃！所愛的人哪，請喝，且多多地喝！」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>吃</td><td>אָכַל</td><td>akhal</td><td>H398</td><td>吃</td></tr><tr><td>喝</td><td>שָׁתָה</td><td>shatah</td><td>H8354</td><td>喝</td></tr><tr><td>多多地喝</td><td>שָׁכַר</td><td>shakar</td><td>H7937</td><td>喝到盡興（本節為命令式；一般指醉，此處指「飲得暢快」）</td></tr><tr><td>朋友</td><td>רֵעַ</td><td>re‘a</td><td>H7453</td><td>朋友、同伴</td></tr></table>","gram":"<p><strong>① 「朋友們，請吃！所愛的人哪，請喝」是誰說的？</strong></p><ul><li><strong>良人</strong>（和合本）：他邀請朋友們分享這份歡喜。</li><li><strong>詩人或眾人的祝福</strong>：許多學者認為這是旁白式的祝賀，為前面四章的愛作結。</li></ul><p>本講義取和合本，同時承認原文沒有標明說話的人。<strong>無論是誰說的，這一節的意思都是：園被進入了，愛得了祝福</strong>。</p>","exp":"<p><strong>她開了園門之後，他說：我進來了，我收了，我吃了。</strong></p><p>上一章的末了，她說「願我的良人進入自己的園裡」。這一節是回答：他進來了。沒藥、香料、蜜房、蜂蜜、酒、奶——其中沒藥、香料、蜜、酒、奶，都是第 4 章園裡出現過的東西。她所邀請的，他都接受了。</p><p>最後一句是祝福的語氣：「朋友們，請吃！所愛的人哪，請喝，且多多地喝！」愛不是躲起來的事，它歡迎別人一同歡喜。這是全卷的巔峰之一。</p><blockquote><p>可是在接下來的一節，同一卷書把我們帶到夜裡。巔峰之後，不是一路平坦。</p></blockquote><p>讀的人要先記得這一節：<strong>愛是被接受過的，是有喜樂的過去的</strong>。因為下面的黑夜，不是從沒有愛開始的。</p><p>他一連串說「我進了、我採了、我吃了、我喝了」，語氣是「已經」。接著是對旁人說的話：「朋友們，你們都吃，都喝」。說話的聲音，有人讀為良人，有人讀為合唱，本講義不定論。可以看見的是：愛的滿足不只留給兩個人，旁邊的人也受邀歡慶。</p>"},{"a":2,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אֲנִי יְשֵׁנָה וְלִבִּי עֵר קוֹל דּוֹדִי דוֹפֵק פִּתְחִי־לִי אֲחֹתִי רַעְיָתִי יוֹנָתִי תַמָּתִי שֶׁרֹּאשִׁי נִמְלָא־טָל קְוֻּצּוֹתַי רְסִיסֵי לָֽיְלָה׃ פָּשַׁטְתִּי אֶת־כֻּתָּנְתִּי אֵיכָכָה אֶלְבָּשֶׁנָּה רָחַצְתִּי אֶת־רַגְלַי אֵיכָכָה אֲטַנְּפֵֽם׃</p></blockquote>","lit":"「我睡著，我的心卻醒著。這是我良人的聲音，他敲門：我的妹子，我的佳偶，我的鴿子，我的完全人，求你給我開門；因我的頭滿了露水，我的頭髮被夜露滴濕。我脫了衣裳，怎能再穿上呢？我洗了腳，怎能再玷污呢？」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>睡著</td><td>יְשֵׁנָה</td><td>yeshenah</td><td>H3463</td><td>睡著的（陰性形容詞）</td></tr><tr><td>醒著</td><td>עֵר</td><td>‘er</td><td>H5782</td><td>醒著（字根與 2:7、3:5 的「叫醒」同）</td></tr><tr><td>敲門</td><td>דוֹפֵק</td><td>dofeq</td><td>H1849</td><td>敲、叩（分詞，持續地敲）</td></tr><tr><td>完全人</td><td>תַמָּה</td><td>tammah</td><td>H8535</td><td>完整的、無瑕的（陰性，「我完整的那一位」）</td></tr><tr><td>開門</td><td>פָּתַח</td><td>patach</td><td>H6605</td><td>打開</td></tr></table>","gram":"<p>第 2 節的開頭 <strong>אֲנִי יְשֵׁנָה וְלִבִּי עֵר</strong>：「我睡著，我的心卻醒著」。這是一個<strong>半夢半醒的狀態</strong>，也是整段的鑰匙：她聽見了，但身體沒有跟上心。</p>","exp":"<p><strong>全卷最痛的一段，開頭是一個敲門的聲音。</strong></p><p>她說：我睡著，我的心卻醒著。這句話很準確：身體睡了，心沒有。她聽見他的聲音，在門外敲。他喊她四個名字：妹子、佳偶、鴿子、完全人。四個愛稱一次連用，他等得多麼殷切。</p><p>他說他的頭滿了露水。他在夜裡站在外面，等著她開門。然後她回答了。她的回答是兩個反問：「我脫了衣裳，怎能再穿上呢？我洗了腳，怎能再玷污呢？」</p><blockquote><p>她不是不愛他。她是疲倦，是猶豫，是不想起來。愛裡面，也有這樣的時刻。</p></blockquote><p>原文沒有說她錯了，也沒有說她對。經文只是如實記下：人在被呼喚的時候，有時候是會推遲的。讀的人若有這樣的經驗，不必立刻責備自己。你的心是醒著的。</p><p>她的藉口：脫了衣服，洗了腳。今天聽來像推託，也可以讀為被突然打斷的睡意裡的猶豫。不要太快斷定她錯了。經文如實記下一個真實的人：想他，也累；愛他，也捨不得起床。這使人不必在愛裡假裝永遠熱切。</p>"},{"a":4,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>דּוֹדִי שָׁלַח יָדוֹ מִן־הַחֹר וּמֵעַי הָמוּ עָלָֽיו׃ קַמְתִּֽי אֲנִי לִפְתֹּחַ לְדוֹדִי וְיָדַי נָֽטְפוּ־מוֹר וְאֶצְבְּעֹתַי מוֹר עֹבֵר עַל כַּפּוֹת הַמַּנְעֽוּל׃ פָּתַחְתִּֽי אֲנִי לְדוֹדִי וְדוֹדִי חָמַק עָבָר נַפְשִׁי יָֽצְאָה בְדַבְּרוֹ בִּקַּשְׁתִּיהוּ וְלֹא מְצָאתִיהוּ קְרָאתִיו וְלֹא עָנָֽנִי׃</p></blockquote>","lit":"「我的良人從門孔裡伸進手來，我便因他動了心。我起來，要給我良人開門。我的兩手滴下沒藥；我的指頭有沒藥汁滴在門閂上。我給我的良人開了門；我的良人卻已轉身走了。他說話的時候，我神不守舍；我尋找他，竟尋不見；我呼叫他，他卻不回答。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>動了心</td><td>הָמָה</td><td>hamah</td><td>H1993</td><td>激動、洶湧（「我的內腸為他而激動」）</td></tr><tr><td>轉身走了</td><td>חָמַק עָבָר</td><td>chamaq ‘avar</td><td>H2559 + H5674</td><td>轉身離去、經過（兩個動詞連用：他轉了身，走過去了）</td></tr><tr><td>呼叫</td><td>קָרָא</td><td>qara’</td><td>H7121</td><td>呼叫</td></tr><tr><td>回答</td><td>עָנָה</td><td>‘anah</td><td>H6030</td><td>回答（否定：他沒有回答）</td></tr></table>","gram":"<p>第 6 節「我神不守舍」原文是 <strong>נַפְשִׁי יָצְאָה בְדַבְּרוֹ</strong>，字面是「我的魂出去了，當他說話的時候」。和合本取意譯。<strong>意思是：他的話一出口，她整個人都跟著他去了</strong>。</p>","exp":"<p><strong>她起來了，也開了門；他卻已經走了。</strong></p><p>第 4 節是轉折：他從門孔裡伸手進來，她動了心。於是她起來，兩手沾滿了沒藥，開了門。但「我的良人卻已轉身走了」。她遲了一步。</p><p>她去找，找不到；她呼叫，他不回答。這是全卷第二次夜裡的尋找：第 3 章的夜裡，她找到了；這一次，她沒有找到。沒有人解釋為甚麼。</p><blockquote><p>有一種失落，不是因為不愛，也不是因為犯了罪，只是因為時機錯過了。經文沒有把它解釋成懲罰。</p></blockquote><p>牧養上，這一段要講得很慢。他沒有回答，不代表他不愛。這一章沒有說他為甚麼離開，經文只留下她的呼叫，與他的沉默。讀的人若正在等一個沒有回答的呼叫，要知道：經文與你同在那個夜裡。</p><p>她的手上、指頭上滿是沒藥汁，落在門閂上。愛她的人留下的記號先到，她才趕到。第 6 節「我的魂在他說話的時候就出去了」，是說她聽見他的話，心就隨他去了。遲來的悔，是很真實的痛。</p>"},{"a":7,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מְצָאֻנִי הַשֹּׁמְרִים הַסֹּבְבִים בָּעִיר הִכּוּנִי פְצָעוּנִי נָשְׂאוּ אֶת־רְדִידִי מֵֽעָלַי שֹׁמְרֵי הַחֹמֽוֹת׃</p></blockquote>","lit":"「城中巡邏看守的人遇見我，打了我，傷了我；看守城牆的人奪去我的披肩。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>打</td><td>הִכָּה</td><td>hikkah</td><td>H5221</td><td>擊打（Hiphil：「他們打了我」）</td></tr><tr><td>傷</td><td>פָּצַע</td><td>patsa‘</td><td>H6481</td><td>使受傷、打傷</td></tr><tr><td>披肩</td><td>רָדִיד</td><td>radid</td><td>H7289</td><td>披肩、面紗（這個字在舊約極少見）</td></tr></table>","gram":"<p><strong>看守的人為甚麼打她？</strong>原文沒有交代。比較 3:3：同樣是巡邏的看守，上一次只是遇見她，沒有傷害她。</p><ul><li><strong>字面讀</strong>：夜裡一位女子獨自在城中遊走，被看守人誤認、呵斥，甚至施暴。這是古代城市裡真實的危險。</li><li><strong>寓言讀</strong>：把看守人讀作教會的領袖，或世界的勢力。</li></ul><p>本講義字面先行：<strong>這是暴力，不是比喻</strong>。</p>","exp":"<p><strong>在尋找的路上，她被打了、傷了、被奪去披肩。</strong></p><p>這一節很短，而且很重。看守城的人遇見她，打了她，傷了她，奪去她的披肩。在第 3 章，她遇見看守人，還問他們「你們看見我魂所愛的沒有？」，沒有被傷害；這一次，同樣的人，同一座城，同一個夜，結果不一樣。</p><p>經文沒有替施暴的人辯護，也沒有說這是她該受的。<strong>她是被傷害的人，而且是在尋找愛的路上被傷害的</strong>。</p><blockquote><p>被打的人沒有錯。這一句，講台上要說得很清楚。</p></blockquote><p>牧養上，這一節必須被正視：若會眾裡有人曾被暴力、被權柄者傷害，這一節可能觸動他們。不要用「這是試煉」輕輕帶過；不追問細節；會後單獨關心，必要時協助尋求保護與專業協助。這一節說：她被傷害，那是真的。</p><p>這一節不替暴力找任何理由，也不把「被打」解成屬靈的磨練。看守人本是城中負責保護的人，卻成為加害者，這是責任的顛倒。被傷的人，沒有一個字說自己有錯。</p>"},{"a":8,"z":8,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִשְׁבַּעְתִּי אֶתְכֶם בְּנוֹת יְרוּשָׁלִָם אִֽם־תִּמְצְאוּ אֶת־דּוֹדִי מַה־תַּגִּידוּ לוֹ שֶׁחוֹלַת אַהֲבָה אָֽנִי׃</p></blockquote>","lit":"「耶路撒冷的眾女子啊，我囑咐你們：若遇見我的良人，要告訴他，我因思愛成病。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>病</td><td>חוֹלָה</td><td>cholah</td><td>H2470</td><td>病的、軟弱的（「為愛而病」，同 2:5）</td></tr><tr><td>告訴</td><td>נָגַד</td><td>nagad</td><td>H5046</td><td>告訴、使知道（Hiphil）</td></tr></table>","gram":"<p>「我因思愛成病」與 2:5 幾乎相同：2:5 作 כִּי־חוֹלַת אַהֲבָה אָנִי，這裡作 שֶׁחוֹלַת אַהֲבָה אָנִי，連接詞不同（כִּי 與 שֶׁ），意思都是「因為」。<strong>同一句話，在第 2 章是甜蜜的思念，在這裡是夜裡受傷後的呼求</strong>。</p>","exp":"<p><strong>她對眾女子說的話，只有一句：告訴他，我因思愛成病。</strong></p><p>她被打了，被傷了，被奪了披肩。可是她對眾女子的託付，不是「去替我討公道」，也不是「去告訴他我受了委屈」，而是：「告訴他，我因思愛成病。」</p><p>這句話與 2:5 幾乎一樣。第一次說，是春天裡的甜；這一次說，是黑夜裡的痛。同一句話，重量不同。</p><blockquote><p>人在最痛的時候，最想傳達的，常常不是控訴，而是：我仍然想念你。</p></blockquote><p>值得注意的是：她找到的是眾女子。在孤單的夜裡，她開口，向身邊的人求助。這是這一節給讀者的鼓勵：<strong>痛的時候，說出來，找人陪</strong>。</p><p>她的託付裡沒有「告訴他我受了傷」，但我們不應據此說她「不在乎」。更準確的讀法是：此刻她最想他知道的，不是她的受害，而是她的愛。這不是要求受傷的人都這樣說；每一個人在受傷時說的話都不同，這一節只記下她的一句。帶領的人尤其要記得：不要要求受傷的人把「說出自己的痛」換成「原諒」。</p>"},{"a":9,"z":13,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מַה־דּוֹדֵךְ מִדּוֹד הַיָּפָה בַּנָּשִׁים מַה־דּוֹדֵךְ מִדּוֹד שֶׁכָּכָה הִשְׁבַּעְתָּֽנוּ׃ דּוֹדִי צַח וְאָדוֹם דָּגוּל מֵרְבָבָֽה׃ רֹאשׁוֹ כֶּתֶם פָּז קְוּצּוֹתָיו תַּלְתַּלִּים שְׁחֹרוֹת כָּעוֹרֵֽב׃ עֵינָיו כְּיוֹנִים עַל־אֲפִיקֵי מָיִם רֹֽחֲצוֹת בֶּֽחָלָב יֹשְׁבוֹת עַל־מִלֵּֽאת׃ לְחָיָו כַּעֲרוּגַת הַבֹּשֶׂם מִגְדְּלוֹת מֶרְקָחִים שִׂפְתוֹתָיו שֽׁוֹשַׁנִּים נֹטְפוֹת מוֹר עֹבֵֽר׃</p></blockquote>","lit":"「你這女子中極美麗的，你的良人比別人的良人有何強處？……我的良人白而且紅，超乎萬人之上。他的頭像至精的金子；他的頭髮厚密纍垂，黑如烏鴉。他的眼如溪水旁的鴿子眼，用奶洗淨，安得合式。他的兩腮如香花畦，如香草臺；他的嘴唇像百合花，且滴下沒藥汁。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>白</td><td>צַח</td><td>tsach</td><td>H6703</td><td>光亮的、明淨的</td></tr><tr><td>紅</td><td>אָדוֹם</td><td>adom</td><td>H122</td><td>紅的</td></tr><tr><td>超乎</td><td>דָּגוּל</td><td>dagul</td><td>H1713</td><td>卓越的、出眾的（與「旗」דֶּגֶל 同字根）</td></tr><tr><td>精金</td><td>כֶּתֶם פָּז</td><td>ketem paz</td><td>H3800 + H6337</td><td>純金</td></tr></table>","gram":"<p>「超乎萬人之上」的 דָּגוּל 與 2:4「以愛為旗」的 דֶּגֶל 同字根。<strong>「旗幟」「在眾人中被立起來」的意思，貫穿頭尾</strong>：他是被愛旗插起來的那一位。</p>","exp":"<p><strong>眾女子問：你的良人，比別人的有甚麼強處？她的回答，不是辯論，是描寫。</strong></p><p>這個問題問得很好。在耶路撒冷的女子眼中，每個人都有自己的良人；為甚麼要為你的良人這樣尋找、這樣受傷？她沒有講道理，她開始說他：白而且紅，頭像精金，頭髮黑如烏鴉，眼如溪水旁的鴿子。</p><p>她從頭說到腳，一處一處。這是第 4 章良人讚美她的順序，現在換她來說他。<strong>她讚美他，是在失落的夜裡，不是在他在身邊的時候</strong>。</p><blockquote><p>人在失落中，常常才把一個人看得最清楚。她不是在憑空想像，她是在記憶裡把他仔細地看過一遍。</p></blockquote><p>也請記得：她的描寫不是為了證明他比別人強，而是說明他對她是誰。「你的良人比別人有何強處」這個比較的問題，她不用比較來回答。</p><p>眾女子問「你的良人比別人的強在哪裡」，語氣不是挑釁，而是真的想知道，因為她們後來願意與她一同去找（6:1）。她回答時不先講道理，而是描繪他：從頭、眼、腮、唇，一處一處說。愛的見證，常常是先描繪「他是怎樣的人」，再說為甚麼值得跟隨。</p>"},{"a":14,"z":16,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>יָדָיו גְּלִילֵי זָהָב מְמֻלָּאִים בַּתַּרְשִׁישׁ מֵעָיו עֶשֶׁת שֵׁן מְעֻלֶּפֶת סַפִּירִֽים׃ שׁוֹקָיו עַמּוּדֵי שֵׁשׁ מְיֻסָּדִים עַל־אַדְנֵי־פָז מַרְאֵהוּ כַּלְּבָנוֹן בָּחוּר כָּאֲרָזִֽים׃ חִכּוֹ מַֽמְתַקִּים וְכֻלּוֹ מַחֲּמַדִּים זֶה דוֹדִי וְזֶה רֵעִי בְּנוֹת יְרוּשָׁלִָֽם׃</p></blockquote>","lit":"「他的兩手好像金管，鑲嵌水蒼玉；他的身體如同雕刻的象牙，周圍鑲嵌藍寶石。他的腿好像白玉石柱，安在精金座上；他的形狀如黎巴嫩，且佳美如香柏樹。他的口極其甘甜；他全然可愛。耶路撒冷的眾女子啊，這是我的良人；這是我的朋友。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>甘甜</td><td>מַמְתַּקִּים</td><td>mamtaqqim</td><td>H4477</td><td>甘甜（複數，強調的說法）</td></tr><tr><td>可愛</td><td>מַחֲמַדִּים</td><td>machamaddim</td><td>H4261</td><td>可愛、令人嚮往的（複數，「全然可愛」）</td></tr><tr><td>朋友</td><td>רֵעַ</td><td>re‘a</td><td>H7453</td><td>朋友、同伴（★ 本章的最後一個字）</td></tr></table>","gram":"<p>末句 <strong>זֶה דוֹדִי וְזֶה רֵעִי</strong>：「這是我的良人，這是我的朋友」。「良人」是愛人，「朋友」是同伴。她用兩個詞，來講同一個人。</p>","exp":"<p><strong>她描寫完之後，用兩個詞作結：「我的良人」，「我的朋友」。</strong></p><p>手、身體、腿、口，她一路說下來，每一處都比作珍貴的東西：金管、象牙、白玉石柱、黎巴嫩的香柏。她說他的口極其甘甜，他全然可愛。</p><p>然後，她停下來，看著眾女子，說：「這是我的良人；這是我的朋友。」描寫的最後，沒有再加形容詞，只用了兩個身分：愛人，與朋友。</p><blockquote><p>愛的最高處，不是被迷住，是在最痛的夜裡，仍然把他當作「朋友」。</p></blockquote><p>這一章從園的歡喜開始，經過夜裡的失落與傷害，到這裡，是一個人在失落中的肯定。她沒有找到他，但她說出了他是誰。第 6 章的第一句，是眾女子的回應：「我們好與你同去尋找他。」</p><p>整段描繪用的是金、象牙、青玉、白玉石與黎巴嫩的香柏，多是王宮與聖殿工程裡會用到的貴重材料。她沒有說他是君王，卻用最貴重的物料來說他：在她眼裡，所愛的人配得上最好的字。最後「我的良人」「我的朋友」並排，說明他既是愛人，也是朋友。</p>"}],"6":[{"a":1,"z":1,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אָנָה הָלַךְ דּוֹדֵךְ הַיָּפָה בַּנָּשִׁים אָנָה פָּנָה דוֹדֵךְ וּנְבַקְשֶׁנּוּ עִמָּֽךְ׃</p></blockquote>","lit":"「你這女子中極美麗的，你的良人往何處去了？你的良人轉向何處去了？我們好與你同去尋找他。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>往何處去</td><td>הָלַךְ</td><td>halakh</td><td>H1980</td><td>去、走</td></tr><tr><td>轉向</td><td>פָּנָה</td><td>panah</td><td>H6437</td><td>轉身、轉向</td></tr><tr><td>尋找</td><td>בִּקֵּשׁ</td><td>biqqesh</td><td>H1245</td><td>尋求（與 3:1–2 同字；這次是「我們一起」尋找）</td></tr></table>","gram":"<p><strong>וּנְבַקְשֶׁנּוּ עִמָּךְ</strong>：「讓我們與你一同尋找他」。第 3 章她一個人找；這一章，眾女子加入。<strong>尋找從單人變成團體</strong>。</p>","exp":"<p><strong>上一章，她一個人在夜裡找；這一章，眾女子說：我們與你一同去找。</strong></p><p>眾女子的問話，有兩個層次。第一個是疑問：你的良人往哪裡去了？第二個是願意：我們好與你同去尋找他。</p><p>她在第 5 章結尾向眾女子描寫他，為的是讓她們明白，為甚麼值得去找。現在，她們聽懂了，說：我們也來。</p><blockquote><p>一個人的尋找，常常需要別人的加入。說出來，有人聽見，就不再是一個人找。</p></blockquote><p>讀的人若正在尋找的路上，經文留給你這句話：別一個人找。找一些「與你同去」的人。</p><p>眾女子的「同去尋找」，是她第一次不再孤身一人。第 5 章她向她們求助時只說「告訴他」，現在她們自己提議幫忙。轉折很小，卻很深：當一個人敢說出自己的需要，旁邊的人就可能走近。</p><p>這個問題裡包含了一份善意：她們沒有說「你別找了」，而是說「我們一同去找」。在尋找的路上，有人同行，不等於問題立刻解決，卻讓一個人不必再獨自承受找不到的重量。</p>"},{"a":2,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>דּוֹדִי יָרַד לְגַנּוֹ לַעֲרוּגוֹת הַבֹּשֶׂם לִרְעוֹת בַּגַּנִּים וְלִלְקֹט שֽׁוֹשַׁנִּֽים׃ אֲנִי לְדוֹדִי וְדוֹדִי לִי הָרֹעֶה בַּשׁוֹשַׁנִּֽים׃</p></blockquote>","lit":"「我的良人下入自己園中，到香花畦，在園內牧放群羊，採百合花。我屬我的良人，我的良人也屬我；他在百合花中牧放群羊。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>下入</td><td>יָרַד</td><td>yarad</td><td>H3381</td><td>下去、下到</td></tr><tr><td>牧放</td><td>רָעָה</td><td>ra‘ah</td><td>H7462</td><td>牧放（同 1:7、2:16）</td></tr><tr><td>採</td><td>לָקַט</td><td>laqat</td><td>H3950</td><td>採集、拾取</td></tr><tr><td>百合</td><td>שׁוֹשַׁנָּה</td><td>shoshannah</td><td>H7799</td><td>百合</td></tr></table>","gram":"<p><strong>「我屬我的良人」三次互屬的次序變化（原文可核對）：</strong></p><ul><li><strong>2:16</strong> דּוֹדִי לִי וַאֲנִי לוֹ：「良人屬我，我也屬他」——先說他屬於我。</li><li><strong>6:3</strong> אֲנִי לְדוֹדִי וְדוֹדִי לִי：「我屬我的良人，我的良人也屬我」——先說我屬於他。</li><li><strong>7:10</strong> אֲנִי לְדוֹדִי וְעָלַי תְּשׁוּקָתוֹ：「我屬我的良人，他也戀慕我」——先說我屬於他，後說他的戀慕在我身上。</li></ul><p>次序從「他屬我」，變成「我屬他」，最後是「他戀慕我」。這是原文可以核對的變化。</p>","exp":"<p><strong>她忽然知道他在哪裡了：他在自己的園裡。</strong></p><p>上一章，她找不到他。這一節，她回答了眾女子的問題：我的良人下入自己的園中，到香花畦，在園內牧放群羊，採百合花。經文沒有說她是怎樣知道的。也許是在夜之後的清晨，也許是在安靜之後的明白。她知道他沒有走遠。</p><p>然後說出全卷最堅定的一句：「我屬我的良人，我的良人也屬我。」與 2:16 相比，次序反過來了。2:16 是「他屬我」，是歡喜擁有；這一次是「我屬他」，是經過了夜與傷之後的歸屬。</p><blockquote><p>先說「我屬他」，不是因為失去了自己，而是因為經過了黑夜，她更知道自己要屬於誰。</p></blockquote><p>互屬不是佔有。「我屬我的良人」，讓我成為他的；「我的良人也屬我」，讓他成為我的。兩個人都是被給出去的，也都是被收下的。</p><p>第 3 節的次序與 2:16 相反：這一次「我屬我的良人」放在前面。上一次她先說「他是我的」，經過找不到的夜，她先說「我是他的」。找過、痛過之後，說話的先後換了。這個換位，是全卷愛情走向成熟的一個記號。</p>"},{"a":4,"z":7,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>יָפָה אַתְּ רַעְיָתִי כְּתִרְצָה נָאוָה כִּירוּשָׁלִָם אֲיֻמָּה כַּנִּדְגָּלֽוֹת׃ הָסֵבִּי עֵינַיִךְ מִנֶּגְדִּי שֶׁהֵם הִרְהִיבֻנִי שַׂעְרֵךְ כְּעֵדֶר הָֽעִזִּים שֶׁגָּלְשׁוּ מִן־הַגִּלְעָֽד׃ שִׁנַּיִךְ כְּעֵדֶר הָֽרְחֵלִים שֶׁעָלוּ מִן־הָרַחְצָה שֶׁכֻּלָּם מַתְאִימוֹת וְשַׁכֻּלָה אֵין בָּהֶֽם׃ כְּפֶלַח הָרִמּוֹן רַקָּתֵךְ מִבַּעַד לְצַמָּתֵֽךְ׃</p></blockquote>","lit":"「我的佳偶啊，你美麗如得撒，秀美如耶路撒冷，威武如展開旌旗的軍隊。求你掉轉眼目不看我，因你的眼目使我驚亂。你的頭髮如同山羊群臥在基列山旁。你的牙齒如一群母羊洗淨上來，個個都有雙生，沒有一隻喪掉子的。你的兩太陽在帕子內，如同一塊石榴。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>得撒</td><td>תִּרְצָה</td><td>tirtsah</td><td>H8656</td><td>地名，後來北國以色列的首都；字根有「悅納、美好」之意</td></tr><tr><td>威武</td><td>אֲיֻמָּה</td><td>ayummah</td><td>H366</td><td>令人敬畏的、威嚴的</td></tr><tr><td>旌旗</td><td>נִדְגָּלוֹת</td><td>nidgalot</td><td>H1713</td><td>展開旌旗的（被動分詞；字根 דגל，與 2:4 的「旗」同）</td></tr><tr><td>驚亂</td><td>הִרְהִיב</td><td>hirhiv</td><td>H7292</td><td>使慌亂、使震懾（Hiphil）</td></tr></table>","gram":"<p>「威武如展開旌旗的軍隊」的 <strong>נִדְגָּלוֹת 與 2:4「以愛為旗」同字根</strong>：第 2 章她被愛的旗覆蓋，這裡他說她像高舉旌旗的軍隊——<strong>兩個人互相被對方的「旗」震懾</strong>。</p>","exp":"<p><strong>他說：求你掉轉眼目，因你的眼目使我驚亂。</strong></p><p>這段讚美，大部分與 4:1–3 相同：頭髮如山羊群，牙齒如洗淨的羊，太陽穴如石榴。重複，是愛的語言。但開頭多了兩個新比喻：得撒與耶路撒冷。這是兩座城，美麗，也威嚴。</p><p>最耐人尋味的是第 5 節：「求你掉轉眼目不看我，因你的眼目使我驚亂。」這是一個被愛的人眼神震懾的人。他不說「你看著我」，他說「別看我」。被愛的力量，大到他無法承受。</p><blockquote><p>被愛有時是這樣的：不是溫柔，是令人慌亂的重量。</p></blockquote><p>讀的人可以注意：讚美她的人，在她面前並不是居高臨下的。他承認，她有一種他抵擋不了的力量。愛，把一個王，變成一個慌亂的人。</p><p>「得撒」的意思是「喜悅」，是北國早期的京城；耶路撒冷是南國的京城。把她比作兩座京城，一個悅目、一個莊嚴。「旌旗的軍隊」（נִדְגָּלוֹת）與 2:4 的「旗」（דֶּגֶל）同字根：2:4 他的旗在她頭上，這裡她自己成了令人驚嘆的旗陣。</p><p>這段讚美大部分與 4:1–3 相同，可見重複在愛裡不是貧乏，而是確認：他看見的，仍是同一個她。</p>"},{"a":8,"z":9,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׁשִּׁים הֵמָּה מְּלָכוֹת וּשְׁמֹנִים פִּֽילַגְשִׁים וַעֲלָמוֹת אֵין מִסְפָּֽר׃ אַחַת הִיא יוֹנָתִי תַמָּתִי אַחַת הִיא לְאִמָּהּ בָּרָה הִיא לְיֽוֹלַדְתָּהּ רָאוּהָ בָנוֹת וַֽיְאַשְּׁרוּהָ מְלָכוֹת וּפִֽילַגְשִׁים וַֽיְהַלְלֽוּהָ׃</p></blockquote>","lit":"「有六十王后，八十妃嬪，並有無數的童女。我的鴿子，我的完全人，只有這一個，是她母親獨生的，是生養她者所寶愛的。眾女子見了就稱她有福；王后妃嬪見了也讚美她。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>妃嬪</td><td>פִּילֶגֶשׁ</td><td>pilegesh</td><td>H6370</td><td>妾、次妻</td></tr><tr><td>童女</td><td>עַלְמָה</td><td>‘almah</td><td>H5959</td><td>年輕女子</td></tr><tr><td>只有一個</td><td>אַחַת</td><td>achat</td><td>H259</td><td>一個、獨一（★ 本節的鑰匙字）</td></tr><tr><td>純淨</td><td>בָּרָה</td><td>barah</td><td>H1249</td><td>純淨、潔淨（和合本譯「所寶愛的」）</td></tr></table>","gram":"<p>「有六十王后」的 <strong>שִׁשִּׁים הֵמָּה מְלָכוֹת</strong>是描寫王宮的場景，不是對一夫多妻的讚許。對照 3:7「六十個勇士」，同是「六十」；這一節的重點在 <strong>אַחַת（只有一個）</strong>。</p>","exp":"<p><strong>王宮裡有六十王后，八十妃嬪，無數的童女；他說，我的鴿子只有一個。</strong></p><p>這是在古代近東王宮的背景下說的話。王有許多后妃，這是當時的制度。但這裡的重點，不在制度，而在比較：與一整個王宮的人比，他的鴿子是「獨一的」。</p><p>值得提醒：這一節不是對多妻制度的認可。申命記 17:17 說王不可為自己多立妃嬪。雅歌講的是另一個畫面：在眾多選擇之中，他的眼睛只選一個。</p><blockquote><p>被選中的人，不是因為她勝過所有人，而是因為在他的眼中，她是「獨一」的。</p></blockquote><p>今天讀這一節，不要用它來比較誰更美、誰更好。「只有這一個」的意思是：愛不是比出來的，是專一的。</p><p>「只有一個」（אַחַת הִיא）不是排名第一，而是無法比較的獨一。第 9 節說眾女子見了稱她有福，王后妃嬪也稱讚她。可見在這首歌裡，被愛的人不是靠貶低別人才被抬高：連「比較」的人，最後也在讚美。</p><p>這一節也不是要用數字貶低別的女子，而是在說：愛的專一，不靠比較，而是靠一個人說「就是你」。</p>"},{"a":10,"z":10,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מִי־זֹאת הַנִּשְׁקָפָה כְּמוֹ־שָׁחַר יָפָה כַלְּבָנָה בָּרָה כַּֽחַמָּה אֲיֻמָּה כַּנִּדְגָּלֽוֹת׃</p></blockquote>","lit":"「那向外觀看、如晨光發現、美麗如月亮、皎潔如日頭、威武如展開旌旗軍隊的是誰呢？」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>晨光</td><td>שַׁחַר</td><td>shachar</td><td>H7837</td><td>黎明、晨光</td></tr><tr><td>月亮</td><td>לְבָנָה</td><td>levanah</td><td>H3842</td><td>月亮（字根有「白」之意）</td></tr><tr><td>日頭</td><td>חַמָּה</td><td>chammah</td><td>H2535</td><td>太陽（字根有「熱」之意）</td></tr><tr><td>威武</td><td>אֲיֻמָּה</td><td>ayummah</td><td>H366</td><td>令人敬畏的（與 6:4 相同）</td></tr></table>","gram":"<p>這是全卷三個「那……是誰呢？」的第二個（<strong>3:6、6:10、8:5</strong>）。這個問句每次的對象不同：3:6 是行列，6:10 是她，8:5 是她與他同行。</p>","exp":"<p><strong>眾人問：那向外觀看的是誰？她像晨光、月亮、日頭。</strong></p><p>這一句由四個比喻組成：晨光、月亮、日頭、旌旗軍隊。從黎明到月夜到白晝，再到威武的軍隊。她被比作天上所有的光，也被比作一支軍隊。</p><p>這是一個從「看」的角度出發的問句：「那向外觀看的是誰？」她是從窗口向外看的人。而眾人在問她：她是誰？</p><blockquote><p>被愛的人，在別人眼中，是一道光。可是在她自己，只是一個向外觀看的人。</p></blockquote><p>牧養上要留意：讚美的詞，不要被用來給人壓力，要求她「要像晨光」。這一節是描寫她在愛中的光，不是對讀者的要求。</p><p>這是三個「那是誰呢」的第二個。第一個（3:6）問的是行列與香氣，這一個問的是她本身，如晨光，第三個（8:5）問的是兩個人一起上來。三個問題的次序像一個故事：先看見氣勢，再看見一個人，最後看見兩個人。</p><p>讀者可以留意：這個比喻從黎明、月亮、太陽到旌旗軍隊，一層比一層亮；被愛的人在愛人眼中，是整片天空。</p>"},{"a":11,"z":12,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אֶל־גִּנַּת אֱגוֹז יָרַדְתִּי לִרְאוֹת בְּאִבֵּי הַנָּחַל לִרְאוֹת הֲפָֽרְחָה הַגֶּפֶן הֵנֵצוּ הָרִמֹּנִֽים׃ לֹא יָדַעְתִּי נַפְשִׁי שָׂמַתְנִי מַרְכְּבוֹת עַמִּי־נָדִֽיב׃</p></blockquote>","lit":"「我下入核桃園，要看谷中青綠的植物，要看葡萄發芽沒有，石榴開花沒有。我不知不覺，我的心將我安置在我尊長（或：我民中的貴族）的車中。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>核桃</td><td>אֱגוֹז</td><td>egoz</td><td>H93</td><td>核桃</td></tr><tr><td>谷</td><td>נַחַל</td><td>nachal</td><td>H5158</td><td>谷、溪谷</td></tr><tr><td>開花</td><td>פָּרַח</td><td>parach</td><td>H6524</td><td>開花、發芽</td></tr><tr><td>車</td><td>מַרְכָּבָה</td><td>merkavah</td><td>H4818</td><td>車、戰車（複數）</td></tr></table>","gram":"<p><strong>6:12 是全卷最難翻譯的一節。</strong>原文 <strong>לֹא יָדַעְתִּי נַפְשִׁי שָׂמַתְנִי מַרְכְּבוֹת עַמִּי־נָדִיב</strong> 有多種讀法：</p><ul><li><strong>和合本</strong>：「我不知不覺，我的心將我安置在我尊長的車中」。</li><li><strong>專名讀法</strong>：有些譯本把 עַמִּי־נָדִיב 讀成人名，類似舊約裡的人名 עַמִּינָדָב（亞米拿達，民 1:7）。</li><li><strong>作者或文本不確定</strong>：有學者認為經文可能在傳抄中有訛誤。</li></ul><p>本講義承認：<strong>這一節的原意，我們不確定</strong>。可以確定的是，這是一個突然的、被帶走的、她自己也沒有預料到的片刻。</p>","exp":"<p><strong>她說：我不知不覺，就被帶進了一輛車裡。</strong></p><p>第 11 節是一個園中的場景：下入核桃園，看谷中青綠的植物，看葡萄發芽沒有，石榴開花沒有。這是春天的查看，與 2:13、7:12 的語言相通。</p><p>第 12 節忽然轉折。學者坦白地承認：這一節的原文太難，歷代譯法不同。和合本的譯法是：她的心把她安置在尊長的車中。我們不替這一節硬編一個故事。</p><blockquote><p>不懂的地方，就說不懂。這也是讀經的誠實。</p></blockquote><p>但有一件事讀得出來：她說「不知不覺」。愛，有時是一種她自己都沒有預料到的、被帶走的感覺。讀的人若有過類似的、自己也說不清的經歷，這一節陪著你說：我不知道。</p><p>第 12 節是全卷最難譯的一節。和合本是「不知不覺，我的心將我安置在我尊長的車中」，原文的「我尊長」可能是專名「亞米拿達」（עַמִּי־נָדִיב），各家譯法不一。本講義保留原文的模糊，不替它硬找唯一答案。可以確定的是：愛有時把人帶到她沒有計畫去的地方。</p>"},{"a":13,"z":13,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שׁוּבִי שׁוּבִי הַשּׁוּלַמִּית שׁוּבִי שׁוּבִי וְנֶחֱזֶה־בָּךְ מַֽה־תֶּחֱזוּ בַּשּׁוּלַמִּית כִּמְחֹלַת הַֽמַּחֲנָֽיִם׃</p></blockquote>","lit":"「回來，回來，書拉密女；你回來，你回來，使我們得觀看你。你們為何要觀看書拉密女，像觀看瑪哈念跳舞的呢？」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>回來</td><td>שׁוּב</td><td>shuv</td><td>H7725</td><td>回來、轉回（命令式，連說四次）</td></tr><tr><td>書拉密女</td><td>שׁוּלַמִּית</td><td>shulammit</td><td>H7759</td><td>書拉密女（可能是「書念」女子，或是「所羅門」的陰性稱呼；全卷只出現在本節，共兩次）</td></tr><tr><td>瑪哈念</td><td>מַחֲנַיִם</td><td>machanayim</td><td>H4266</td><td>地名，意為「兩營」；也可能指兩隊舞者</td></tr></table>","gram":"<p><strong>① 說話的人是誰？「書拉密女」是誰？</strong></p><ul><li><strong>眾人</strong>叫她回來，好觀看她；第二句反問的，可能是她，也可能是良人。</li><li><strong>書拉密</strong>可能是「書念」（Shunem）女子的稱呼；也有人認為是「所羅門」（שְׁלֹמֹה）的陰性形式，意思是「屬所羅門的女子」或「平安的女子」。</li></ul><p>本講義只陳列，不在這裡爭論。<strong>無論是誰，這一節的畫面是：一位女子被眾人要求回來，被人注視，而她被問：你們為何一直看？</strong></p>","exp":"<p><strong>眾人說：回來，書拉密女，好讓我們看你。她反問：你們為何要看？</strong></p><p>「書拉密女」這個稱呼，在全卷只出現在這一節（兩次）。四次「回來」，是急切的呼喚。眾人希望她轉身，讓他們觀看。</p><p>接著是一個問句：「你們為何要觀看書拉密女，像觀看瑪哈念跳舞的呢？」這句話的語氣有一點防衛，也可能有一點俏皮。意思是：我不是表演，不是舞蹈，為甚麼要被這樣看？</p><blockquote><p>被看，是一種重量。愛她的人看她，是疼惜；眾人看她，可能是消費。同一雙眼睛，不同的意思。</p></blockquote><p>牧養上，這一節是提醒：在一群人面前，一個人不是展覽品。第 7 章馬上要有一段很長的身體描寫，要記得：讚美的眼睛，是愛她的人的眼睛，不是任何人都可以隨意看的眼睛。</p><p>「書拉密女」的意思，有人讀為「所羅門」的陰性形（意為平安），有人讀為地名書念，經文沒有定論。要緊的是：一群人想看她，她反問：你們為甚麼要看？她有權問這個問題。被看，不是一個人唯一的角色。</p>"}],"7":[{"a":1,"z":2,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מַה־יָּפוּ פְעָמַיִךְ בַּנְּעָלִים בַּת־נָדִיב חַמּוּקֵי יְרֵכַיִךְ כְּמוֹ חֲלָאִים מַעֲשֵׂה יְדֵי אָמָּֽן׃ שָׁרְרֵךְ אַגַּן הַסַּהַר אַל־יֶחְסַר הַמָּזֶג בִּטְנֵךְ עֲרֵמַת חִטִּים סוּגָה בַּשּׁוֹשַׁנִּֽים׃</p></blockquote>","lit":"「貴族之女（王女）啊，你的腳穿著鞋，何其美好！你大腿的曲線如美玉，是巧匠的手做成的。你的肚臍如圓杯，不缺調和的酒；你的腰如一堆麥子，周圍有百合花。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>腳（步）</td><td>פַּעַם</td><td>pa‘am</td><td>H6471</td><td>腳步、腳掌</td></tr><tr><td>貴族</td><td>נָדִיב</td><td>nadiv</td><td>H5081</td><td>慷慨的、高貴的人；「בַּת־נָדִיב」＝貴族之女（和合本譯「王女」）</td></tr><tr><td>麥子</td><td>חִטָּה</td><td>chittah</td><td>H2406</td><td>小麥</td></tr></table>","gram":"<p><strong>7:1 的描寫從腳開始，往上走到頭（7:5）</strong>；4:1–5 與 5:11–16 則是從頭往下。<strong>同一個身體，這一次是由下往上看</strong>——原文可以核對的順序變化。</p>","exp":"<p><strong>他一開口，稱她「貴族的女兒」。</strong></p><p>在第 1 章，她說自己黑，被兄弟們使喚去看守葡萄園。到了這裡，他稱她為「貴族的女兒」（בַּת־נָדִיב；和合本譯作王女）。這個稱呼，把她從被輕看的地方，提到一個有尊嚴的位置。</p><p>然後他從腳說起：腳在鞋中何其美好。這是全卷唯一一次從腳往上描寫的段落。前面兩次是從頭往下。他換了方向，仍然是一處一處地看。</p><blockquote><p>被愛的人，從頭到腳，都被看見、被稱許。</p></blockquote><p>牧養上，這一段要用尊重的語氣讀。這是一對夫妻之間的語言，是私密的讚美。它不是供人觀看的描寫，也不應被拿來給別人的身體打分數。</p><p>這一次他從腳開始往上讚美，與第 4 章從頭往下的次序不同，像是看見她走近。步伐的描寫，說明她是一個行走、活動的人，不只是被觀看的對象。「貴族的女兒」這個稱呼，是他的眼光抬高了她，不是血統。</p><p>「你大腿的圓轉」之類的字眼出現在第 1 節，是工匠手藝的比喻；這提醒我們，他把她看作一件精工之作，而不是一件可被佔有的物品。</p>"},{"a":3,"z":5,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שְׁנֵי שָׁדַיִךְ כִּשְׁנֵי עֳפָרִים תָּאֳמֵי צְבִיָּֽה׃ צַוָּארֵךְ כְּמִגְדַּל הַשֵּׁן עֵינַיִךְ בְּרֵכוֹת בְּחֶשְׁבּוֹן עַל־שַׁעַר בַּת־רַבִּים אַפֵּךְ כְּמִגְדַּל הַלְּבָנוֹן צוֹפֶה פְּנֵי דַמָּֽשֶׂק׃ רֹאשֵׁךְ עָלַיִךְ כַּכַּרְמֶל וְדַלַּת רֹאשֵׁךְ כָּאַרְגָּמָן מֶלֶךְ אָסוּר בָּרְהָטִֽים׃</p></blockquote>","lit":"「你的兩乳好像一對小鹿，就是母鹿雙生的。你的頸項如象牙臺；你的眼目像希實本、巴特拉併門旁的水池；你的鼻子彷彿朝大馬士革的黎巴嫩塔。你的頭在你身上好像迦密山；你頭上的髮是紫黑色；王被下垂的髮綹所繫住了。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>迦密山</td><td>כַּרְמֶל</td><td>karmel</td><td>H3760</td><td>迦密（山名；字義有「果園」之意）</td></tr><tr><td>紫黑色</td><td>אַרְגָּמָן</td><td>argaman</td><td>H713</td><td>紫色（昂貴的染料，王室的顏色）</td></tr><tr><td>繫住</td><td>אָסַר</td><td>asar</td><td>H631</td><td>捆綁、囚禁（被動分詞：被繫住的）</td></tr><tr><td>髮綹</td><td>רָהָט</td><td>rahat</td><td>H7298</td><td>髮綹、水槽（複數，字義有「流動」之意）</td></tr></table>","gram":"<p>和合本「王的心因這下垂的髮綹繫住了」的「心」字，<strong>原文沒有</strong>：原文是 <strong>מֶלֶךְ אָסוּר בָּרְהָטִים</strong>，「一位王被繫在髮綹中」。和合本為了通順添了「心」字。</p>","exp":"<p><strong>最後一句最耐人尋味：一位王，被她的髮綹繫住了。</strong></p><p>這一段從兩乳說到頭髮，用了許多地名：希實本、巴特拉併、黎巴嫩、大馬士革、迦密山。這些比喻，今天讀來生疏，都與壯觀的建築或地景有關：塔、水池、山。她被比作一座風景。</p><p>可是到了第 5 節的末尾，畫面反轉：原文說「王被繫在髮綹中」。和合本添了一個「心」字，使句子通順。但原文的畫面更直接：不是王的心被繫住，是這個人本身被繫住了。</p><blockquote><p>一位有權力、有軍隊、有六十個勇士的王，被一個女子的頭髮綁住了。愛，把權力放倒。</p></blockquote><p>這與 6:5 呼應：他說「你的眼目使我驚亂」。權力在這卷書裡，一再被愛的力量轉過來。讀的人要記得：真正的愛，是願意被對方「繫住」，而不是想要把對方繫住。</p><p>「迦密山」是山脈中最顯著的一座，草木茂盛；他看她的頭，像看一座山。接著「王被繫在髮綹中」：王，也成了被俘的人。強者在愛中，自願被繫住。這是全卷最反轉的畫面之一：權力在愛面前，不是征服，而是被俘。</p>"},{"a":6,"z":7,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מַה־יָּפִית וּמַה־נָּעַמְתְּ אַהֲבָה בַּתַּֽעֲנוּגִֽים׃ זֹאת קֽוֹמָתֵךְ דָּֽמְתָה לְתָמָר וְשָׁדַיִךְ לְאַשְׁכֹּלֽוֹת׃</p></blockquote>","lit":"「我所愛的，你何其美好！何其可悅，使人歡暢喜樂！你的身量好像棕樹；你的兩乳如同其上的果子，纍纍下垂。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>可悅</td><td>נָעַם</td><td>na‘am</td><td>H5276</td><td>令人愉悅、美好</td></tr><tr><td>歡暢</td><td>תַּעֲנוּג</td><td>ta‘anug</td><td>H8588</td><td>歡愉、享受（複數）</td></tr><tr><td>棕樹</td><td>תָּמָר</td><td>tamar</td><td>H8558</td><td>棕櫚樹（海棗樹）</td></tr><tr><td>果子（串）</td><td>אֶשְׁכּוֹל</td><td>eshkol</td><td>H811</td><td>果串、葡萄串（複數）</td></tr></table>","gram":"<p>第 6 節的 <strong>אַהֲבָה בַּתַּעֲנוּגִים</strong> 字面是「愛，在歡愉之中」。和合本取意為「何其可悅，使人歡暢喜樂」。<strong>「愛」與「歡愉」同在一句</strong>：愛是在享受裡被經歷的。</p>","exp":"<p><strong>「愛，在歡愉中，何其美好」。</strong></p><p>第 6 節是一聲讚嘆。他在一連串的比喻之後，只說了一句直接的話：你何其美好，何其可悅。原文用的是「愛」與「歡愉」放在一起。</p><p>第 7 節把她比作棕樹，高挑、有力，結著纍纍的果子。棕樹高挑，往往長在有水的地方，是有生命力的樹。</p><blockquote><p>聖經不把享受當作罪。愛可以是歡愉的，歡愉可以是被神祝福的。</p></blockquote><p>讀的人若長期把歡愉與屬靈對立起來，這一節給一個溫柔的提醒：在對的關係與對的位置上，歡愉是禮物，不是敵人。</p><p>第 7、8 節用棕樹與葡萄串作比喻。這段私密的讚美，是丈夫對妻子的話，不是給外人評分的清單。讀經的人，不要把這些比喻變成對別人身體的品頭論足；公開讀經的場合，也不適合逐項解釋身體部位。這段留給兩個人，我們只從中學到：愛可以用語言去滋養，而不是用語言去羞辱。</p><p>再提醒一次：愛的語言可以很熱烈，但它的目的是讓對方感到被珍愛，而不是感到被評價。</p>"},{"a":8,"z":9,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אָמַרְתִּי אֶעֱלֶה בְתָמָר אֹֽחֲזָה בְּסַנְסִנָּיו וְיִֽהְיוּ־נָא שָׁדַיִךְ כְּאֶשְׁכְּלוֹת הַגֶּפֶן וְרֵיחַ אַפֵּךְ כַּתַּפּוּחִֽים׃ וְחִכֵּךְ כְּיֵין הַטּוֹב הוֹלֵךְ לְדוֹדִי לְמֵישָׁרִים דּוֹבֵב שִׂפְתֵי יְשֵׁנִֽים׃</p></blockquote>","lit":"「我說：我要上這棕樹，抓住枝子。願你的兩乳好像葡萄纍纍下垂，你鼻子的氣味香如蘋果；你的口如上好的酒。」〔女子說：〕「為我的良人下咽舒暢，流入睡覺人的嘴中。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>枝子</td><td>סַנְסִנָּה</td><td>sansinnah</td><td>H5577</td><td>枝條（此字極罕見）</td></tr><tr><td>蘋果</td><td>תַּפּוּחַ</td><td>tappuach</td><td>H8598</td><td>蘋果（同 2:3）</td></tr><tr><td>舒暢</td><td>מֵישָׁרִים</td><td>meisharim</td><td>H4339</td><td>順暢、平順（複數；和合本「舒暢」）</td></tr><tr><td>流入</td><td>דּוֹבֵב</td><td>dovev</td><td>H1680</td><td>流動、輕輕移動（分詞）</td></tr></table>","gram":"<p><strong>7:9 下半「為我的良人下咽舒暢」是誰說的？</strong></p><ul><li><strong>新娘打斷了他</strong>（和合本標示「女子說」）：她接過話，把「你的口如上好的酒」轉成「那酒是為我的良人而流的」。</li><li><strong>仍是良人的話</strong>：有些譯本不分說話者，把整節視為他的讚美。</li></ul><p>本講義依和合本：<strong>她接過了話</strong>。原文用的是 לְדוֹדִי（為我的良人），同一個字也出現在下一節「我屬我的良人」。</p>","exp":"<p><strong>他說到一半，她接過了話。</strong></p><p>這一段的前半，是他的願望：我要上這棕樹，抓住枝子。這是直接的、帶著渴望的話，也是這一章最直接的一句。經文不迴避，也不展開，用一個比喻停住了：枝子、葡萄、蘋果、酒。</p><p>然後，在他說完「你的口如上好的酒」之後，她開口了：「為我的良人下咽舒暢。」她沒有讓他把話說完，也沒有讓這個比喻停在自己身上，而是把它轉向「我的良人」。</p><blockquote><p>在這首詩裡，她不是只被描寫的人。她開口，她打斷，她把話轉到自己想說的地方。</p></blockquote><p>這是這一章最重要的細節：<strong>被讚美的人，有自己的聲音</strong>。愛的關係裡，被描寫的一方，也要是說話的一方。下一節，她會用一句話，把整個關係定下來。</p><p>第 9 節後半「流動在睡覺人的嘴脣上」，是她接過了話。主詞轉換很快，可見他們的話是彼此接力的。愛的對話，不是一個人說到底，而是你說一半、我接下去；聽對方說到一半，就把話接過去的，是知心。</p>"},{"a":10,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אֲנִי לְדוֹדִי וְעָלַי תְּשׁוּקָתֽוֹ׃</p></blockquote>","lit":"「我屬我的良人，他的戀慕在我身上。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>戀慕</td><td>תְּשׁוּקָה</td><td>teshuqah</td><td>H8669</td><td>渴望、戀慕（★ 舊約只出現三次：創 3:16、創 4:7、歌 7:10）</td></tr><tr><td>屬</td><td>לְדוֹדִי</td><td>ledodi</td><td>H1730</td><td>屬於我的良人（介詞 לְ＋「我的良人」）</td></tr></table>","gram":"<p><strong>תְּשׁוּקָה（戀慕）在舊約只出現三次：</strong></p><ul><li><strong>創 3:16</strong>：「你必戀慕你丈夫，你丈夫必管轄你」——女人對男人的戀慕。</li><li><strong>創 4:7</strong>：「罪必戀慕你，你卻要制伏它」——罪對該隱的渴望。</li><li><strong>歌 7:10</strong>：「他戀慕我」——男人對女人的戀慕。</li></ul><p>許多學者指出這個用字呼應。本講義只指出<strong>用字上的呼應</strong>，不把它講成口號：雅歌本身沒有引用創世記。</p>","exp":"<p><strong>她只說了一句話：我屬我的良人，他的戀慕在我身上。</strong></p><p>這是三次「互屬」的最後一次。2:16 是「他屬我，我也屬他」；6:3 是「我屬他，他也屬我」；這裡是「我屬他，他戀慕我」。第三次不再說「他屬我」，改說「他的戀慕在我身上」。</p><p>「戀慕」這個字（תְּשׁוּקָה），舊約只出現三次，另兩次在創世記，都和被扭曲的關係有關：創 3:16 說女人戀慕丈夫而被管轄，創 4:7 說罪戀慕該隱。到了這裡，是一個男人戀慕一個女人，而她說：他的戀慕，是在我身上。</p><blockquote><p>這裡的戀慕，不是管轄，也不是擁有，而是朝向。他的渴望，朝向她。</p></blockquote><p>讀的人可以對照自己的關係：我所說的愛，是想要擁有，還是願意朝向？經文沒有給教條，只留下這個用字，讓人慢慢想。</p><p>讀的人可以問自己：我在關係裡的「戀慕」，是想與他同在，還是想管他、佔有他？這一節的「戀慕」（תְּשׁוּקָה）是被祝福的戀慕，是「他戀慕我」，不是「他要管我」。</p><p>她的回答很短，沒有華麗的比喻，只有一句宣告。在他一連串的讚美之後，她不用同樣的長度回應，只說最要緊的那一句。</p>"},{"a":11,"z":13,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לְכָה דוֹדִי נֵצֵא הַשָּׂדֶה נָלִינָה בַּכְּפָרִֽים׃ נַשְׁכִּימָה לַכְּרָמִים נִרְאֶה אִם פָּֽרְחָה הַגֶּפֶן פִּתַּח הַסְּמָדַר הֵנֵצוּ הָרִמּוֹנִים שָׁם אֶתֵּן אֶת־דֹּדַי לָֽךְ׃ הַֽדּוּדָאִים נָֽתְנוּ־רֵיחַ וְעַל־פְּתָחֵינוּ כָּל־מְגָדִים חֲדָשִׁים גַּם־יְשָׁנִים דּוֹדִי צָפַנְתִּי לָֽךְ׃</p></blockquote>","lit":"「我的良人，來吧！你我可以往田間去；你我可以在村莊（或：鳳仙花叢）住宿。我們早晨起來往葡萄園去，看看葡萄發芽開花沒有，石榴放蕊沒有；我在那裡要將我的愛情給你。風茄放香，在我們的門內有各樣新陳佳美的果子；我的良人，這都是我為你存留的。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>來吧</td><td>לְכָה</td><td>lekhah</td><td>H1980</td><td>來吧、走吧（命令式；比較 2:10 他的邀請）</td></tr><tr><td>田間</td><td>שָׂדֶה</td><td>sadeh</td><td>H7704</td><td>田野</td></tr><tr><td>風茄</td><td>דּוּדָאִים</td><td>dudaim</td><td>H1736</td><td>風茄（一種被視為增進愛情的植物，創 30:14）</td></tr><tr><td>存留</td><td>צָפַן</td><td>tsafan</td><td>H6845</td><td>珍藏、儲存</td></tr></table>","gram":"<p>第 11 節的 <strong>בַּכְּפָרִים</strong> 可讀作「在村莊」，也可讀作「在鳳仙花叢中」（同形字；見 4:13 的 כְּפָרִים）。和合本取前者，旁註未特別標明。<strong>兩個讀法的畫面都是「離開城，到田野過夜」</strong>。</p>","exp":"<p><strong>這一次，是她邀請他：來吧，我們往田間去。</strong></p><p>在 2:10，是他說：起來，與我同去。現在角色對調：「我的良人，來吧！」她提出邀請，她決定去哪裡：田間、葡萄園、村莊。她還說：我在那裡要將我的愛情給你。這是給，不是被取。</p><p>第 13 節是這章的收尾：「各樣新陳佳美的果子；我的良人，這都是我為你存留的。」新的、舊的，都為他存著。她不是臨時給的，是早就為他預備的。</p><blockquote><p>真正的給，是早已存留的，是從豐盛裡拿出來的，不是在壓力下被拿走的。</p></blockquote><p>第 1 章，她說自己的葡萄園沒有看守；到了這裡，她的園裡有了新陳佳美的果子，並且她選擇把它給誰。這一章的結尾，不是被帶走，而是她把鑰匙交在他手上。</p><p>第 12 節「早晨起來往葡萄園去」，把愛從屋內帶到園裡。她提的地方不是房間，是田野、村莊與葡萄園：愛的場景是日常的、外面的、有收成的。她又說「有各樣新舊的果子，是我為你存留的」：存留，是她預備已久。愛的邀請不是臨時起意，是預備過的。</p>"}],"8":[{"a":1,"z":2,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מִי יִתֶּנְךָ כְּאָח לִי יוֹנֵק שְׁדֵי אִמִּי אֶֽמְצָאֲךָ בַחוּץ אֶשָׁקְךָ גַּם לֹא־יָבוּזוּ לִֽי׃ אֶנְהָֽגֲךָ אֲבִֽיאֲךָ אֶל־בֵּית אִמִּי תְּלַמְּדֵנִי אַשְׁקְךָ מִיַּיִן הָרֶקַח מֵעֲסִיס רִמֹּנִֽי׃</p></blockquote>","lit":"「巴不得你像我的兄弟，像吃我母親奶的兄弟！我在外頭遇見你，就與你親嘴，誰也不輕看我。我必引導你，領你進我母親的家；你可以教導我；我也就使你喝石榴汁釀的香酒。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>兄弟</td><td>אָח</td><td>ach</td><td>H251</td><td>兄弟</td></tr><tr><td>吃奶的</td><td>יוֹנֵק</td><td>yoneq</td><td>H3243</td><td>吸吮的（分詞）</td></tr><tr><td>親嘴</td><td>נָשַׁק</td><td>nashaq</td><td>H5401</td><td>親吻（與 1:2 同字，全卷首尾呼應）</td></tr><tr><td>輕看</td><td>בּוּז</td><td>buz</td><td>H936</td><td>藐視、輕看</td></tr></table>","gram":"<p>第 1 節的 <strong>אֶשָׁקְךָ（我就與你親嘴）</strong>與 1:2 的 יִשָּׁקֵנִי 同字根。<strong>全卷開頭是「願他親我」，結尾這裡是「我在外頭親你，誰也不輕看我」</strong>：從私下的渴望，變成想要在公開處被接納的愛。</p>","exp":"<p><strong>她說：巴不得你像我的兄弟，好讓我在外頭遇見你，就能親你，誰也不輕看我。</strong></p><p>這個願望，透露了一個處境：他們的愛，在公開的場合不被接納。一般認為，兄弟之間可以在街上親吻，沒有人會閒話；愛人之間，卻要避人耳目。她羨慕的，是那種可以被光明正大看見的關係。</p><p>第 2 節說：我必引導你，領你進我母親的家。這是回到 3:4，她把他領入「我母家」。愛想要的，不是躲藏，而是被家人、被眾人所接納。</p><blockquote><p>有些愛，是不能被公開的。經文沒有責備她，只是記下她的盼望：誰也不輕看我。</p></blockquote><p>牧養上，這一節給那些愛得小心的人一句話：想要被接納，是人之常情。同時也提醒：愛若要長久，需要有人願意與你一起承擔被看見的重量。</p><p>她期盼的是「誰也不輕看我」。在 1:6 她被兄弟輕看；這裡她盼望的是被承認的愛：在街上也能公開地愛，不被看輕。這是一個處境的呼聲：一般認為，當時男女之間的公開親近不被接納。今天讀的人可以想想：我們有沒有因為旁人的眼光，讓一些本當公開祝福的愛，只能躲在暗處？</p>"},{"a":3,"z":4,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שְׂמֹאלוֹ תַּחַת רֹאשִׁי וִֽימִינוֹ תְּחַבְּקֵֽנִי׃ הִשְׁבַּעְתִּי אֶתְכֶם בְּנוֹת יְרוּשָׁלִָם מַה־תָּעִירוּ וּֽמַה־תְּעֹֽרְרוּ אֶת־הָאַהֲבָה עַד שֶׁתֶּחְפָּֽץ׃</p></blockquote>","lit":"「他的左手必在我頭下，他的右手必將我抱住。耶路撒冷的眾女子啊，我囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願。」","key":"","gram":"<p><strong>8:3 與 2:6 逐字相同；8:4 與 2:7、3:5 相比有兩個差異（原文可核對）：</strong></p><ul><li>8:4 <strong>沒有</strong>「指著羚羊或田野的母鹿」的起誓；</li><li>8:4 的條件詞是 <strong>מַה</strong>（「何必」「為何」），2:7、3:5 是 <strong>אִם</strong>（「若」）。</li></ul><p>副歌第三次出現，<strong>誓詞變短了，語氣變直了</strong>。</p>","exp":"<p><strong>副歌第三次出現，這一次沒有羚羊，也沒有母鹿。</strong></p><p>第 3 節與 2:6 逐字相同：他的左手在我頭下，右手抱住我。這是全卷的第一個擁抱，現在重述，是收尾的呼應。</p><p>第 4 節是副歌：「不要驚動、不要叫醒我所親愛的，等他自己情願。」與前兩次相比，這次少了起誓的羚羊與母鹿。她不再需要用動物來加強語氣，她直接對眾女子說：我囑咐你們。</p><blockquote><p>三次叮嚀，一次比一次樸素。愛經過了夜、傷與尋找，不需要再多的修辭。</p></blockquote><p>這個叮嚀始終是同一件事：愛，要等到願意的時候。這是全卷最重要的一條界線，也是最溫柔的一條。</p><p>副歌在這裡變短了：沒有「羚羊與母鹿」，只剩「不要驚動、不要叫醒愛」，而且原文把 2:7、3:5 的「若」改成疑問詞「為何」（מַה），語氣變成：為甚麼要驚動呢？副歌越到後面越簡短，像是已經不需要加重語氣。</p><p>第 3 節的擁抱與 2:6 完全相同，說明她要說的是：經過這一切，我仍然回到這個姿勢。同樣的動作，意思卻更深：這一次，它不是初戀的甜，而是經過尋找與失去之後的安穩。</p>"},{"a":5,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מִי זֹאת עֹלָה מִן־הַמִּדְבָּר מִתְרַפֶּקֶת עַל־דּוֹדָהּ תַּחַת הַתַּפּוּחַ עֽוֹרַרְתִּיךָ שָׁמָּה חִבְּלַתְךָ אִמֶּךָ שָׁמָּה חִבְּלָה יְלָדַֽתְךָ׃</p></blockquote>","lit":"「那靠著良人從曠野上來的是誰呢？我在蘋果樹下叫醒你；你母親在那裡為你劬勞，生養你的在那裡為你劬勞。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>靠著</td><td>מִתְרַפֶּקֶת</td><td>mitrappeqet</td><td>H7514</td><td>倚靠（反身式分詞；此字極罕見）</td></tr><tr><td>叫醒</td><td>עוֹרֵר</td><td>‘orer</td><td>H5782</td><td>叫醒（與 2:7 的「叫醒」同字根）</td></tr><tr><td>蘋果樹</td><td>תַּפּוּחַ</td><td>tappuach</td><td>H8598</td><td>蘋果樹（回到 2:3）</td></tr><tr><td>劬勞</td><td>חָבַל</td><td>chaval</td><td>H2254</td><td>陣痛、受產苦</td></tr></table>","gram":"<p>這是全卷三個「那……是誰呢？」的最後一個（<strong>3:6、6:10、8:5</strong>）。前兩次，眾人問的是行列與她；這一次，問的是<strong>兩個人一起</strong>：她靠著良人。</p>","exp":"<p><strong>最後一次的「那是誰呢？」，答案是兩個人，一起從曠野上來。</strong></p><p>3:6 的「那是誰」，是香氣的行列；6:10 的「那是誰」，是她，如晨光。這一次，是「靠著良人從曠野上來的」。她不是一個人了，她靠著他。</p><p>然後有一個耐人尋味的句子：「我在蘋果樹下叫醒你。」她說的是「叫醒」，用的字與「不要叫醒」同一個字根。「不要叫醒」的副歌，才剛在第 4 節說過；這一節，她說她在蘋果樹下叫醒了他。有一種讀法是：愛已經到了「他自己情願」的時候，所以現在可以叫醒了。</p><blockquote><p>等待有它的時候，行動也有它的時候。愛知道甚麼時候不要驚動，也知道甚麼時候該開口。</p></blockquote><p>蘋果樹回到了 2:3。她第一次說「我歡歡喜喜坐在他的蔭下」；現在，是同一棵樹，她靠著他，從曠野走回來。</p><p>「我在蘋果樹下喚醒了你」：這個「喚醒」（עוֹרַרְתִּיךָ）與副歌「不要叫醒」的動詞同根。副歌禁止在愛沒有準備好時喚醒，這一節卻說我喚醒了你：可見副歌禁止的是「催逼」，不是「愛的邀請」；時機成熟時，喚醒是愛的行動。</p>"},{"a":6,"z":7,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שִׂימֵנִי כַֽחוֹתָם עַל־לִבֶּךָ כַּֽחוֹתָם עַל־זְרוֹעֶךָ כִּֽי־עַזָּה כַמָּוֶת אַהֲבָה קָשָׁה כִשְׁאוֹל קִנְאָה רְשָׁפֶיהָ רִשְׁפֵּי אֵשׁ שַׁלְהֶבֶתְ יָֽה׃ מַיִם רַבִּים לֹא יֽוּכְלוּ לְכַבּוֹת אֶת־הָֽאַהֲבָה וּנְהָרוֹת לֹא יִשְׁטְפוּהָ אִם־יִתֵּן אִישׁ אֶת־כָּל־הוֹן בֵּיתוֹ בָּאַהֲבָה בּוֹז יָבוּזוּ לֽוֹ׃</p></blockquote>","lit":"「求你將我放在你心上如印記，帶在你臂上如戳記。因為愛情如死之堅強，嫉恨（熱切）如陰間之殘忍；所發的電光是火焰的電光，是耶和華的烈焰（或：極猛的烈焰）。愛情，眾水不能熄滅，大水也不能淹沒。若有人拿家中所有的財寶要換愛情，就全被藐視。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>印記（★）</td><td>חוֹתָם</td><td>chotam</td><td>H2368</td><td>印、印章（字根 חתם；與 4:12「封閉的」同源）</td></tr><tr><td>堅強</td><td>עַזָּה</td><td>‘azzah</td><td>H5794</td><td>強壯的、堅固的</td></tr><tr><td>死</td><td>מָוֶת</td><td>mavet</td><td>H4194</td><td>死亡</td></tr><tr><td>嫉恨</td><td>קִנְאָה</td><td>qin’ah</td><td>H7068</td><td>熱切、嫉妒（可指「熱心」，也可指「嫉妒」）</td></tr><tr><td>陰間</td><td>שְׁאוֹל</td><td>she’ol</td><td>H7585</td><td>陰間、死人之地</td></tr><tr><td>烈焰</td><td>שַׁלְהֶבֶתְיָה</td><td>shalhevetyah</td><td>H7957</td><td>火焰（末了的 יָהּ 是「耶和華」的簡稱，或作加強語氣）</td></tr><tr><td>熄滅</td><td>כָּבָה</td><td>kavah</td><td>H3518</td><td>熄滅（不定詞：去熄滅）</td></tr><tr><td>淹沒</td><td>שָׁטַף</td><td>shataf</td><td>H7857</td><td>沖走、淹沒</td></tr></table>","gram":"<p><strong>① 「耶和華的烈焰」（שַׁלְהֶבֶתְיָה）怎麼讀？</strong></p><ul><li><strong>「耶和華的烈焰」</strong>（和合本）：末尾的 יָהּ 是神名「耶和華」的簡稱——這是雅歌全卷唯一可能直接出現神名的地方。</li><li><strong>「極猛的火焰」</strong>：יָהּ 作為加強語氣的詞尾（相當於「猛烈的」），並不指神名。</li></ul><p>兩種讀法歷代並陳，本講義兩者都記下；<strong>兩者都承認愛的火焰有神聖的來源與重量</strong>。</p><p><strong>② 「嫉恨」（קִנְאָה）</strong>可指熱切的忠誠，也可指嫉妒。和合本取「嫉恨」；這裡的意思，不是佔有與控制，而是<strong>不肯讓步的專一</strong>。</p>","exp":"<p><strong>「求你將我放在你心上如印記，帶在你臂上如戳記。」全卷的樞紐，在這裡。</strong></p><p>印記（חוֹתָם）是古代人用來證明身分與所屬的東西，戴在身上，人人都認得。心上，是裡面；臂上，是外面。她請求被放在他的裡面，也被放在他的外面：整個人都屬於他，也都被他帶著。</p><p>這個字（חוֹתָם）與 4:12「封閉的泉源」的「封閉」（חָתוּם）同一字根。第 4 章，她是被封好的泉；這裡，她請求成為印記。全卷以同一個字根，從「封閉的園」走到「印在心上」：愛從被保護，走到被確認。</p><p>然後是整卷最有力的一句：「愛情如死之堅強。」死亡是人最不能抵擋的力量。愛，與它並肩。接下來「眾水不能熄滅，大水也不能淹沒」——愛不是被環境保護的火，是在水中仍然燃燒的火。</p><blockquote><p>愛的堅強，不是強迫對方留下，而是在任何水面前，仍然沒有熄滅。</p></blockquote><p>牧養上要提醒：「嫉恨如陰間之殘忍」這句話，不可以被拿來合理化控制、跟蹤、監視或暴力。經文說的是愛的專一與堅定，不是對一個人的支配。<strong>凡以愛為名傷害人的，都不是這一節所講的愛</strong>。</p>"},{"a":8,"z":10,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אָחוֹת לָנוּ קְטַנָּה וְשָׁדַיִם אֵין לָהּ מַֽה־נַּעֲשֶׂה לַאֲחֹתֵנוּ בַּיּוֹם שֶׁיְּדֻבַּר־בָּֽהּ׃ אִם־חוֹמָה הִיא נִבְנֶה עָלֶיהָ טִירַת כָּסֶף וְאִם־דֶּלֶת הִיא נָצוּר עָלֶיהָ לוּחַ אָֽרֶז׃ אֲנִי חוֹמָה וְשָׁדַי כַּמִּגְדָּלוֹת אָז הָיִיתִי בְעֵינָיו כְּמוֹצְאֵת שָׁלֽוֹם׃</p></blockquote>","lit":"「我們有一小妹；她的兩乳尚未長成，人來提親的日子，我們當為她怎樣辦理？她若是牆，我們要在其上建造銀塔；她若是門，我們要用香柏木板圍護她。」「我是牆；我兩乳像其上的樓。那時，我在他眼中像得平安的人（或：像找到平安的人）。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>小</td><td>קְטַנָּה</td><td>qetannah</td><td>H6996</td><td>小的、年幼的</td></tr><tr><td>牆</td><td>חוֹמָה</td><td>chomah</td><td>H2346</td><td>城牆</td></tr><tr><td>門</td><td>דֶּלֶת</td><td>delet</td><td>H1817</td><td>門扇</td></tr><tr><td>銀塔</td><td>טִירָה</td><td>tirah</td><td>H2918</td><td>垛堞、營帳（此處：銀製的城垛）</td></tr><tr><td>平安</td><td>שָׁלוֹם</td><td>shalom</td><td>H7965</td><td>平安、完整</td></tr></table>","gram":"<p><strong>① 「我們有一小妹」是誰在說？</strong>原文沒有明說。一般讀作她的哥哥們（比較 1:6「我同母的弟兄」），也有讀作眾人的。</p><p><strong>② 「牆」與「門」的差別：</strong>牆是封死的，門是可開的。哥哥們的計畫是：若她是牆，就加固；若她是門，就圍護。<strong>她的回答只有一句：「我是牆。」</strong></p>","exp":"<p><strong>哥哥們說：我們有一個小妹妹，要為她怎麼辦？她自己回答：我是牆。</strong></p><p>這一段有兩個聲音。第一個，是哥哥們（原文沒有明說）：我們有一個小妹，她的兩乳尚未長成，人來提親的日子，我們當怎樣辦理？他們的設想是保護：她若是牆，我們要建造銀塔；她若是門，我們要用香柏木板圍護。</p><p>第二個聲音，是她自己：「我是牆；我兩乳像其上的樓。」她說：不需要你們替我決定，我已經長成了。「那時，我在他眼中像得平安的人。」她不再是那個被兄弟使喚、被派去看守別人葡萄園的人（1:6）。</p><blockquote><p>被保護的人，終於可以自己說：我是牆。這是從被決定，到自己決定。</p></blockquote><p>牧養上要特別小心：8:8 說的是一位年幼的女孩，「提親」是古代的習俗。本講義不把這一段當成支持早婚的根據。對年幼者與一切弱勢的人，今天的原則是保護，而且是真正的保護：不是替她們決定，也不是以保護為名控制她們。</p><p>這一段是全卷最需要小心讀的一段：不要用它支持早婚，也不要把女孩的身體當作需要家人看守的資產。</p>"},{"a":11,"z":12,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כֶּרֶם הָיָה לִשְׁלֹמֹה בְּבַעַל הָמוֹן נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים אִישׁ יָבִא בְּפִרְיוֹ אֶלֶף כָּֽסֶף׃ כָּרְמִי שֶׁלִּי לְפָנָי הָאֶלֶף לְךָ שְׁלֹמֹה וּמָאתַיִם לְנֹטְרִים אֶת־פִּרְיֽוֹ׃</p></blockquote>","lit":"「所羅門在巴力哈們有一葡萄園；他將這葡萄園交給看守的人，為其中的果子必交一千銀子（和合本補譯為「舍客勒」）。我自己的葡萄園在我面前。所羅門哪，一千歸你，二百歸看守果子的人。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>葡萄園</td><td>כֶּרֶם</td><td>kerem</td><td>H3754</td><td>葡萄園（回到 1:6、1:14）</td></tr><tr><td>看守的人</td><td>נֹטֵר</td><td>noter</td><td>H5201</td><td>看守者（分詞；與 1:6「看守」同字根）</td></tr><tr><td>銀子</td><td>כֶּסֶף</td><td>kesef</td><td>H3701</td><td>銀子、錢（原文只有「一千」，沒有「舍客勒」一詞；和合本補譯）</td></tr></table>","gram":"<p>8:12 的 <strong>כָּרְמִי שֶׁלִּי</strong>（我自己的葡萄園）與 1:6 的 <strong>כַּרְמִי שֶׁלִּי לֹא נָטָרְתִּי</strong>（我自己的葡萄園卻沒有看守）是同一個說法，只是母音略有不同。<strong>首尾用同一個詞，意思反轉</strong>：1:6 是沒看守，8:12 是「在我面前」。</p>","exp":"<p><strong>所羅門的葡萄園，交給別人看守，要收一千舍客勒；她說：我自己的葡萄園，在我面前。</strong></p><p>第 11 節講的是一筆生意：所羅門有一座葡萄園，交給看守的人，每人要為其中的果子交一千銀子（和合本補作「舍客勒」；原文只有「一千銀子」）。這是財富的世界，用錢計算的世界。</p><p>第 12 節，她說：「我自己的葡萄園在我面前。」這句話與 1:6 用字相同，但意思反過來了。1:6，她說：「我自己的葡萄園卻沒有看守」，是她被使喚去看守別人的園，自己的園卻荒廢了。現在，她的園子就在她面前，不需要別人替她看守，也不用被人收租。</p><blockquote><p>她從「看守別人的園」，走到「我自己的園在我面前」。這是整卷最安靜的一個轉身。</p></blockquote><p>與 8:7 一起讀：有人拿財寶要換愛情，全被藐視。所羅門的一千銀子，與她的葡萄園，比不上。愛不能用錢來買，她的自己，也不屬於任何出價的人。</p><p>「我自己的葡萄園在我面前」呼應 1:6：「我自己的葡萄園卻沒有看守」。她曾被別人派去看別人的園，現在她說：我自己的園是我的。這是一個人從被使喚到自己作主的轉折。</p>"},{"a":13,"z":14,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַיוֹשֶׁבֶת בַּגַּנִּים חֲבֵרִים מַקְשִׁיבִים לְקוֹלֵךְ הַשְׁמִיעִֽינִי׃ בְּרַח דּוֹדִי וּֽדְמֵה־לְךָ לִצְבִי אוֹ לְעֹפֶר הָֽאַיָּלִים עַל הָרֵי בְשָׂמִֽים׃</p></blockquote>","lit":"「你這住在園中的，同伴都要聽你的聲音，求你使我也得聽見。」「我的良人哪，求你快來！如羚羊或小鹿在香草山上。」","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong’s</th><th>意義</th></tr><tr><td>園</td><td>גַּן</td><td>gan</td><td>H1588</td><td>園（複數：園子們）</td></tr><tr><td>聲音</td><td>קוֹל</td><td>qol</td><td>H6963</td><td>聲音（回到 2:8、2:14）</td></tr><tr><td>快來</td><td>בְּרַח</td><td>berach</td><td>H1272</td><td>逃跑、疾行、趕快（命令式；與 2:17 的「轉回」סֹב 不同）</td></tr><tr><td>香草</td><td>בֹּשֶׂם</td><td>bosem</td><td>H1314</td><td>香料、香草（複數）</td></tr></table>","gram":"<p>最後一句 <strong>בְּרַח דּוֹדִי</strong> 的動詞 בָּרַח 平常是「逃跑」，這裡的意思，<strong>一般讀作「快快跑來」或「趕緊過來」</strong>（和合本：求你快來）。2:17 的對應句用的是 סֹב（轉回），本章換成 בְּרַח：<strong>從「轉回」到「快來」</strong>。</p>","exp":"<p><strong>全卷以一句呼求結束：我的良人哪，求你快來。</strong></p><p>第 13 節是良人的話：你這住在園中的，同伴都要聽你的聲音，求你使我也聽見。他想聽她的聲音。這是與 2:14 的呼應：「求你容我得見你的面貌，得聽你的聲音。」</p><p>最後一節，是她的回答。她沒有說「我們結婚了」，也沒有說「現在在一起了」。她說：「我的良人哪，求你快來！」全卷結束在一個仍在呼求的地方，不是一個圓滿的句點。</p><blockquote><p>愛的詩，沒有結束在擁有，而是結束在渴慕：求你快來。</p></blockquote><p>這個結尾，使讀聖經的人想起新約的最後一句：「主耶穌啊，我願你來！」（啟 22:20）。這使我們想起，但經文並沒有這樣說，本講義不把它說成預表。</p><p>讀的人可以帶著這個結尾回家：愛不是到了就停了。真正的愛，帶著一種還要更多的渴慕。</p><p>最後一句「如羚羊或小鹿」與 2:17 幾乎一樣，但 2:17 的「轉回」（סֹב）被「快來」（בְּרַח）取代，山也從「比特山」變成「香料山」。副歌式的結束，沒有「完結」，只有一個「快來」：愛在經文裡沒有被說完，仍在趕路。</p>"}]},"serm":{"1":{"min":13,"blocks":[["h","《渴慕的開始》"],["p","一本厚厚的聖經，翻到中間偏後。"],["p","有一卷，讀的人常常翻過去。不是它太難。是它太近。"],["p","近到有點不好意思。這一卷叫雅歌。"],["p","它的第一節，只有一句話。"],["q","「所羅門的歌，是歌中的雅歌。」"],["p","「歌中的雅歌」，原文的意思是「歌中之歌」。"],["p","希伯來文用這個寫法，是在說：最高的那一首。"],["p","就像「聖中之聖」，是最聖的那一處。"],["p","一千零五首歌，這一首排第一。這個教導，叫人吃驚。"],["p","神的話裡，最高的一首歌，不是戰歌。"],["p","不是律法的頌讚。不是在聖殿裡升高的詩。"],["p","是一個女子，在說：我想他。弟兄姊妹平安。"],["p","今天我們讀雅歌第一章。先說一個提醒。"],["p","這是一本情詩。字面上，是一個女子和她所愛的人。"],["p","歷代的教會，也有人從這裡，聽見神與祂百姓的愛。"],["p","這個讀法，可以有。但我們不急。"],["p","我們先照字面，聽一首情詩。"],["p","因為神把它放進聖經，不是要我們趕快翻譯它。"],["p","是要我們，先好好聽。好，我們來聽。"],["p","第一個字，不是「我愛你」。"],["q","「願他用口與我親嘴；因你的愛情比酒更美。」"],["p","開口第一句，是「願」。願他。"],["p","她不說「他已經來了」。她不說「我已經得到了」。"],["p","她說：願。這個字裡，有一個空。愛從一個空開始。"],["p","我想你。我缺你。我盼望你。"],["p","弟兄姊妹，這是不是很像我們跟神的關係？"],["p","我們常常覺得，信主要先把空補滿。先有力量。"],["p","先有答案。先有一副很屬靈的樣子。"],["p","可是這個女子，一開口就說：我渴。她沒有裝滿。"],["p","她沒有說，我很堅強。她說：願你吸引我。"],["q","「願你吸引我，我們就快跑跟隨你。」"],["p","你看這個次序。先是：吸引我。然後才是：快跑。"],["p","她不是靠意志力衝過去的。她是被吸引的。"],["p","是愛，把她拉過去。我們很多人，信主是這樣的："],["p","今天靠意志，禱告三十分鐘。明天靠意志，不發脾氣。"],["p","後天靠意志，多愛一個人。撐不了多久。"],["p","因為我們是在用力跑，卻沒有被吸引。"],["p","雅歌說：先讓愛吸引你。再快跑。"],["p","這裡有一個細節，值得留意。"],["p","她一下子說「他」，一下子說「你」，一下子說「我們」。"],["q","「王帶我進了內室，我們必因你歡喜快樂。」"],["p","人稱在跳。這不是文法錯。這是渴慕的口氣。"],["p","一個人真的想念誰，說話是不整齊的。"],["p","她想到他，就轉過身，對他說話。"],["p","想到旁邊的朋友，就說「我們」。愛，會把話說亂。"],["p","想一想，你上一次這樣說話，是甚麼時候？"],["p","也許是在等一通電話的時候。"],["p","也許是在，很想見一個人的時候。"],["p","話說到一半，自己都不知道在說甚麼。"],["p","可是對方聽得懂。因為聽的人知道，你不是在報告。"],["p","你是在渴。我們對神說話，常常太整齊了。"],["p","禱告稿，一條一條，像在交公文。第一，感謝。"],["p","第二，認罪。第三，祈求。都沒有錯。"],["p","可是有時候，神想聽的，是一句亂的話。"],["p","「主啊，我想你。」「主啊，我很累。」"],["p","「主啊，祢在哪裡？」這種話，沒有格式。卻是真的。"],["p","這是真的愛。可是這一節，有一個很要緊的地方。"],["q","「願你吸引我，我們就快跑跟隨你。」"],["p","她說，願你。不是她去抓。不是她去搶。是願。"],["p","她把主動，留給那位她愛的人。"],["p","這個「願」，我們等一下，還會在這一卷裡，聽見它變成另一句話。"],["p","就是三次的副歌："],["p","「不要驚動、不要叫醒我所親愛的，等他自己情願。」"],["p","愛，是願。不是逼。她還說了一句話，我們差點漏掉。"],["q","「你的名如同倒出來的香膏，所以眾童女都愛你。」"],["p","香膏，在瓶子裡的時候，不太聞得到。"],["p","要倒出來，香氣才滿屋。"],["p","她說，你的名，就像倒出來的香膏。"],["p","一個人的名字，可以是香氣。"],["p","你的名字，在家裡，是甚麼味道？"],["p","在同事口中，是甚麼味道？"],["p","我們的主耶穌，祂的名，是倒出來的。祂倒空了自己。"],["p","所以，祂的名，高過一切的名。這是新約自己說的。"],["p","我們不必把雅歌，硬翻成這個意思。"],["p","但讀到這裡，我們心裡，自然想起祂。"],["p","這使我們想起，不是在說，這是預表。"],["p","我們只是，在香氣面前，低下頭。"],["p","低下頭，不是因為懂了。是因為，被香氣圍住了。"],["p","愛，有時候，不是用腦理解的。是用心，聞到的。"],["p","這是第一點。愛，從說「願」開始。承認我有渴。"],["p","讓愛來吸引我。我們再往下看。"],["p","第二個畫面，很不一樣。她忽然，轉了語氣。"],["q","「耶路撒冷的眾女子啊，我雖然黑，卻是秀美，如同基達的帳棚，好像所羅門的幔子。」"],["p","前一刻，她還在甜蜜的渴慕裡。"],["p","下一刻，她忽然轉向旁邊的人。"],["p","好像聽見，有人在看她。"],["p","有人，在她的膚色上，停了一下。她說：我雖然黑。"],["p","她先自己說出來。你有沒有過這個經驗？"],["p","你知道別人在看你的某個地方。"],["p","你知道，那個地方，你不喜歡。"],["p","於是，你搶在別人前面，先說。先說出來，比較不痛。"],["p","她說：我雖然黑，卻是秀美。"],["p","這句話的原文，有一個小小的連接字。"],["p","這個連接字，可以譯成「而且」。也可以譯成「卻」。"],["p","我雖然黑，而且秀美。不是「黑，但是努力變美」。"],["p","是兩件事，同時為真。她不替自己把黑洗掉。"],["p","她也不因為黑，就說自己不美。"],["p","她用兩個畫面，說明這兩件事。基達的帳棚。"],["p","一般認為，是用黑色的山羊毛織成的，粗黑，經過風沙。"],["p","所羅門的幔子。是華麗的帷幔，用在王宮。"],["p","兩個都是她。粗黑的，和華美的，不是二選一。"],["q","「不要因日頭把我曬黑了就輕看我。」"],["p","她接著說，為甚麼黑。是日頭曬的。"],["q","「我同母的弟兄向我發怒，他們使我看守葡萄園；我自己的葡萄園卻沒有看守。」"],["p","這一節，很重。有人對她發怒。是同母的弟兄。"],["p","是家裡的人。她被派去看守別人的葡萄園。"],["p","日復一日，在太陽底下。手是粗的。皮膚是黑的。"],["p","可是，她自己的葡萄園呢？"],["p","沒有看守。弟兄姊妹，這是一個很真實的人生。"],["p","有人，被家裡使喚了一輩子。替別人的田工作。"],["p","自己的生命，卻沒有時間顧。"],["p","然後，有人在旁邊說：你怎麼黑黑的？"],["p","你怎麼這個樣子？"],["p","她不是羞愧地躲起來。她說：不要輕看我。"],["p","這句話，說得很有力。卻也有一點顫抖。"],["p","你看，經文沒有叫她，把傷說得很漂亮。"],["p","經文如實記下：我同母的弟兄，向我發怒。"],["p","家，不一定都是安全的地方。"],["p","這一節，要給今天的人一句話。"],["p","如果你的家，曾經讓你受傷。"],["p","如果你，是被使喚大的人。"],["p","如果你，有一個地方，是別人看了就停一下的。"],["p","聖經沒有說：你要趕快原諒，趕快好起來。"],["p","它先說：這是真的。你被日頭曬過。你被人發過怒。"],["p","你的葡萄園，沒有人顧。這些，都被記進了神的話裡。"],["p","然後，下一句，輪到另一個聲音。我們不要急。"],["p","她接著，問了一個問題。"],["q","「我心所愛的啊，求你告訴我，你在何處牧羊？晌午在何處使羊歇臥？」"],["p","我們剛才說，她轉向旁邊的人。現在，她轉向他。"],["p","她問：你在哪裡？"],["p","這是一個，很樸素的問題。不是甚麼屬靈的大問題。"],["p","就是：你在哪裡？"],["p","晌午的時候，天最熱。牧人帶羊，去哪裡歇息？"],["p","她想去那裡。"],["p","她說：我何必在你同伴的羊群旁邊，像蒙著臉的人呢？"],["p","我不想，在別人的羊群邊，徘徊。我想，找到你。"],["p","愛的第一個動作，不是等。是問。是動身去找。"],["p","我們很多人，對神，是這樣的：等祂來。等祂說話。"],["p","等祂做一件大事。然後，我再來決定，要不要靠近。"],["p","這個女子，沒有等。她問：你在哪裡？"],["p","她的問題，不漂亮。她的口氣，有一點急。"],["p","可是，這是真的。她得到了回答。"],["q","「你這女子中極美麗的，你若不知道，只管跟隨羊群的腳蹤去。」"],["p","你看，他沒有責備她。"],["p","他沒有說：你怎麼連我在哪裡都不知道？"],["p","他先叫她：你這女子中，極美麗的。"],["p","她剛剛才說，我黑。"],["p","他回答的第一句，就是：極美麗的。你注意了嗎？"],["p","她還沒說完自己的傷。"],["p","他已經，用另一個名字，稱呼她。"],["p","然後，他給了一條路：跟著羊群的腳蹤走。"],["p","不是給她一張地圖。是給她一串腳印。"],["p","愛，常常是這樣的：你不一定，馬上看見他。"],["p","但你可以，跟著他走過的地方走。"],["p","接下來，他開口，說了一連串的話。"],["q","「我的佳偶，我將你比法老車上套的駿馬。」"],["p","這個比喻，今天聽起來，有點奇怪。"],["p","但在古時候，馬和戰車，是力量與華麗。"],["p","他是說：你有力。你有華美。"],["p","你不是，一個被日頭曬壞的人。"],["q","「我們要為你編上金辮，鑲上銀釘。」"],["p","他說的是，要給她加添裝飾。注意："],["p","金辮和銀釘，是加在她身上。不是用來，補她的缺。"],["p","他說：你已經美。我們要讓這份美，更顯出來。"],["p","愛的讚美，是在一個已經被看見的人身上，加添喜悅。"],["p","不是用，一大堆條件，叫她變好。"],["p","我們很多人，從小聽到的，是另一種話："],["p","你要更乖，才可以。你要考好，才可以。"],["p","你要改掉這個毛病，才可以被愛。"],["p","久了，我們就以為，神也是這樣。"],["p","祂在門口，拿著一張單子。等我們，一項一項，改好。"],["p","但是你看這位良人。他先叫她「極美麗的」。"],["p","他先叫她「我的佳偶」。稱呼在前面。改變在後面。"],["p","這是福音的次序。先被接納。然後，才有裝飾。"],["p","先被愛。然後，才有力量。"],["p","神愛你，不是因為你值得，是因為祂是愛。"],["p","這句話，我們聽來很熟。可是，你的心，真的信了嗎？"],["p","還是，你仍然在，偷偷地，加班？"],["p","然後，她回應了。"],["q","「我以我的良人為一袋沒藥，常在我懷中。」"],["p","她說，他像一袋沒藥。沒藥，是樹脂。"],["p","要割開樹皮，才流出來。"],["p","乾了以後，帶著苦，也帶著香。她把它，放在胸前。"],["p","貼著心。這是一個很私密的畫面。"],["p","她不是，把他掛在牆上。她是，把他帶在身上。"],["p","我們的靈修，有時候，像掛在牆上的畫。"],["p","很漂亮，很正確，很遠。"],["p","可是，真正的親近，是貼身的。走路的時候，帶著。"],["p","被人誤會的時候，帶著。夜裡睡不著的時候，帶著。"],["p","不一定要很長的時間。有時候，只是一句話："],["p","主啊，祢與我同在。一袋沒藥。一種香氣，貼身帶著。"],["p","他的香氣，不離開她。"],["p","這一章，最後兩節，兩個人互相說："],["q","「我的佳偶，你甚美麗！你甚美麗！」"],["q","「我的良人哪，你甚美麗可愛！」"],["q","「我們以青草為床榻，以香柏樹為房屋的棟樑，以松樹為椽子。」"],["p","這一章的最後，是一幅畫。兩個人，沒有房子。"],["p","沒有存款。沒有任何擔保。"],["p","可是她說：我們以青草為床榻。香柏樹，是我們的樑。"],["p","松樹，是我們的椽子。他們的屋子，是田野。"],["p","愛，先在心裡，蓋好了房子。"],["p","然後，才在地上，找地方。"],["p","弟兄姊妹，這是一件很安慰人的事。"],["p","你不必等一切都齊全，才可以開始愛神。"],["p","不必等，有了時間。不必等，有了錢。"],["p","不必等，生活穩定下來。青草，也可以是床。"],["p","田野，也可以是殿。"],["p","你現在在哪裡，就在那裡，跟隨祂。"],["p","有人說，等我退休以後，再好好親近神。"],["p","有人說，等孩子大了。有人說，等這陣子忙完。"],["p","可是，青草的床榻，今天就在。她沒有說，將來。"],["p","她說，我們以青草為床榻。現在式。他說了兩次。"],["p","她也說了兩次。像是忍不住。愛，就是這樣，忍不住。"],["p","弟兄姊妹，我們來把這一章，收起來。"],["p","這一章，給我們三樣東西。第一樣：許可。"],["p","許可你說，我渴。不必假裝很飽。不必把空，藏起來。"],["p","愛，從說「願」開始。第二樣：安全。"],["p","你可以說，我有一個地方，曬黑了。"],["p","你可以說，我的葡萄園，沒有顧。"],["p","說出來，不會被神責備。它被記在神的話裡。"],["p","第三樣：方向。你可以問：你在哪裡？"],["p","然後，跟著腳蹤走。"],["p","接下來，我要用一點時間，把這三樣，放在我們的信仰裡。"],["p","我們一直說，耶穌是我們的榜樣。你想過嗎？"],["p","耶穌，也是一位，承認自己有渴的人。"],["p","祂在井邊，對一個女人說：給我水喝。"],["p","祂在十字架上，說：我渴了。"],["p","我們的主，沒有假裝，不需要。祂，是那位真實的人。"],["p","所以我們也不必假裝。"],["p","我們一直說，聖經是我們的準則。"],["p","今天，聖經給我們的準則是：先說真話。先說，我渴。"],["p","先說，我被曬黑。先說，我不知道你在哪裡。"],["p","我們一直說，聖靈是我們的引導。"],["p","聖靈的引導，是吸引。不是鞭打。祂先讓你，願意。"],["p","然後你，才快跑。有的人，一直用力，卻不快樂。"],["p","可能是，需要先停下來。"],["p","問一句：我是被吸引，還是被逼迫？"],["p","再來，是「無己」。有己的人，不肯說渴。"],["p","有己的人，要把自己，擺出好看的樣子。"],["p","有己的人，不能容許，自己被曬黑。"],["p","無己的人，可以說：我渴。可以說：我不夠。"],["p","可以說：我不知道。"],["p","因為他的焦點，不在自己的樣子，在那位他所愛的人身上。"],["p","今天，請你選一件事，說給神聽。不要修飾。"],["p","一句話就好。你的渴，是甚麼？"],["p","你的曬黑，是哪裡？"],["p","你想問祂的第一個問題，是甚麼？"],["p","就像那個女子，一開口：願。我們一起禱告。"],["p","親愛的主，謝謝祢，讓我們可以說真話。"],["p","我們很多時候，假裝很堅強，假裝不需要祢。"],["p","今天，我們承認，我們渴。"],["p","求祢吸引我們，讓我們因為愛，而不是因為害怕，跟隨祢。"],["p","我們被日頭曬黑的地方，求祢親自看見。"],["p","我們沒有顧的葡萄園，求祢親自醫治。"],["p","我們不知道祢在哪裡的時候，求祢給我們一串腳印，讓我們跟著祢走。"],["p","一切榮耀，都歸給耶穌。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"2":{"min":13,"blocks":[["h","《愛的初見與春天》"],["p","冬天過去了。你有沒有過這個經驗？"],["p","一個很長的冬天。天總是灰的。雨一直下。"],["p","你縮在屋子裡，甚至忘了，外面有太陽。"],["p","然後有一天早上，你推開窗，聽見一隻鳥叫。"],["p","只是一聲。你忽然明白：春天來了。"],["p","今天的經文，就是這樣的一章。雅歌第二章。"],["p","弟兄姊妹平安。上一章，我們聽見一個女子說：我渴。"],["p","這一章，她回答了。不是用道理。"],["p","是用一幅一幅春天的畫。我們分三個畫面來看。"],["p","第一個畫面，是一朵花。"],["q","「我是沙崙的玫瑰花，是谷中的百合花。」"],["p","這是她，介紹自己。"],["p","你有沒有留意，她用的是甚麼語氣？"],["p","她沒有說，我是最美的花。她說：我是一朵花。"],["p","沙崙，是一片平原。谷中，是低地。"],["p","她把自己，放在最普通的地方。不是王宮。不是山頂。"],["p","是谷。一朵野地裡的花，沒有人種，沒有人澆水。"],["p","我們不確定，原文的花名，到底是哪一種花。"],["p","和合本旁邊，也註明了「或譯水仙花」。"],["p","但是意思很清楚。她很謙卑。她不誇口。"],["p","謙卑的人，不是看輕自己的人。"],["p","謙卑，是不需要把自己，說得比別人大。"],["p","她說「我是一朵花」，說得很自在。"],["p","沒有自卑，也沒有炫耀。這個自在，從哪裡來？"],["p","從一個事實：她知道，自己被愛。"],["p","被愛的人，不必再爭取位置。"],["p","你若還在為了位置，焦慮、比較、討好，也許要回來，先問一句：我知道自己被愛嗎？"],["p","愛先於位置。被愛，不是努力的結果。"],["p","是一個，被接受的事實。"],["p","從這個事實出發，我們才能真的，謙卑。"],["p","然後，輪到另一個人說話了。"],["q","「我的佳偶在女子中，好像百合花在荊棘內。」"],["p","你看，他把她，放回原來的地方。"],["p","她說：我是谷中的花。他說：是的，你是花。"],["p","而且，你在荊棘裡。荊棘，是粗糙的。是扎人的。"],["p","是日子裡，那些不舒服的人事物。"],["p","可是，在他的眼中，周圍都是荊棘。唯獨她，是百合。"],["p","這句話，不是在貶低別的女子。"],["p","他沒有說，別人都是荊棘。"],["p","他是說：在我眼中，你是不同的。"],["p","這就是愛，最基本的動作。專注地看見一個人。"],["p","弟兄姊妹，你有沒有被這樣看見過？"],["p","在一個擠滿人的地方，有一雙眼睛，穿過所有人，找到你。"],["p","那個感覺，是一輩子忘不了的。"],["p","有的人，一生都沒有被這樣看見。"],["p","他很努力，在人群裡，舉手。卻沒有人，抬頭。"],["p","今天，我要告訴你一件事：有一位，專注地看見你。"],["p","你不必成為，最美的花。"],["p","你只要成為，祂眼中的那一朵。她接著，回應了。"],["q","「我的良人在男子中，如同蘋果樹在樹林中。」"],["p","她也不示弱。她說，你在男子中，像蘋果樹在樹林中。"],["q","「我歡歡喜喜坐在他的蔭下，嘗他果子的滋味，覺得甘甜。」"],["p","蘋果樹，有蔭涼，有果子。她坐在他的蔭下。"],["p","這個動詞「坐」，很重要。不是奔跑。不是爭取。"],["p","不是證明。就是坐下來。"],["p","我們很多人，信主，信得很累。一直在跑。"],["p","一直在服事。一直想證明，我配得。"],["p","可是，她說：我歡歡喜喜，坐在他的蔭下。"],["p","安息，是愛的樣子。然後，是一個很溫柔的畫面。"],["q","「他帶我入筵宴所，以愛為旗在我以上。」"],["p","旗，是甚麼？"],["p","旗，是軍隊用來，辨認自己屬於哪一邊的。"],["p","她說：他的旗，在我頭上。"],["p","那面旗上，寫的不是「勝利」。不是「權力」。"],["p","是「愛」。她知道，自己屬於誰。"],["p","她知道，誰在保護她。你頭上，有沒有一面旗？"],["p","很多人頭上的旗，是別的東西。是成績。是頭銜。"],["p","是別人怎麼看。是我的過去。"],["p","可是她說，我頭上的旗，是愛。"],["p","接著，她說了一句，很誠實的話。"],["q","「因我思愛成病。」"],["p","她病了。不是發燒。是思念。"],["p","她請旁邊的人，拿葡萄乾，拿蘋果。她需要，被照顧。"],["p","弟兄姊妹，愛，不一定都是輕盈的。"],["p","愛有時候，是一種重量。"],["p","聖經沒有責備她，說你怎麼這麼軟弱。"],["p","它把這句話，記下來。然後，是一句很溫柔的話："],["q","「他的左手在我頭下；他的右手將我抱住。」"],["p","思念的病，找到了安靜。被抱住，就安靜了。"],["p","接著，是一句副歌。"],["q","「耶路撒冷的眾女子啊，我指著羚羊或田野的母鹿囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願。」"],["p","這句話，在整卷雅歌裡，出現三次。這是第一次。"],["p","羚羊，母鹿，是很容易受驚的動物。"],["p","一受驚，就跑掉了。她用牠們起誓，說：不要驚動。"],["p","和合本在旁邊，還有另一個譯法：「不要激動愛情，等它自發」。"],["p","不論是哪一個譯法，意思是一樣的：愛，不能被催。"],["p","愛，不能被逼。愛，不能被別人，代替決定。"],["p","這句話，對今天的人，特別要緊。"],["p","有的家長，急著要孩子，快點交往。"],["p","有的教會，急著要弟兄姊妹，快點結婚。"],["p","有的人，在壓力下，說了「好」。"],["p","有的人，被逼著，叫醒一份，還沒有醒的感情。"],["p","雅歌說：不要。等他，自己情願。"],["p","這是一句，保護人的話。也是一句，關於同意的話。"],["p","你可以等。你也可以，說不。"],["p","愛，是在自由裡，才是愛。好，我們進入第二個畫面。"],["p","聽！"],["q","「聽啊！是我良人的聲音；看哪！他躥山越嶺而來。」"],["p","她還沒有看見他。她先聽見他。"],["p","愛的人，聽得出愛的人的腳步聲。他來了。像羚羊。"],["p","像小鹿。翻過山，越過嶺。輕快，有力。然後呢？"],["q","「他站在我們牆壁後，從窗戶往裡觀看，從窗欞往裡窺探。」"],["p","他到了。可是，他在牆外。他站在牆壁後。從窗戶看。"],["p","從窗欞窺探。弟兄姊妹，你有沒有注意到？"],["p","他沒有闖進去。他可以很有力。他躥山越嶺。"],["p","可是，在她的牆外，他停住了。他在窗外，呼喚。"],["q","「我的佳偶，我的美人，起來，與我同去！」"],["p","他說：起來。不是：我進來抓你。"],["p","是：起來，與我同去。邀請的人，站在牆外。"],["p","決定的人，在牆內。這就是愛的規矩。"],["p","我們再看，他怎麼邀請。"],["q","「因為冬天已往，雨水止住過去了。」"],["p","他說的，是季節。他不說，我很愛你，你一定要出來。"],["p","他說：冬天過去了。他給她看，窗外的世界。"],["q","「地上百花開放，百鳥鳴叫的時候已經來到；斑鳩的聲音在我們境內也聽見了。」"],["q","「無花果樹的果子漸漸成熟；葡萄樹開花放香。」"],["p","春天，到處都是。花開了。鳥叫了。果子，要熟了。"],["p","他的邀請，不是催促。是讓她，看見：時候到了。"],["p","他說了兩次「起來，與我同去」。"],["p","第一次，是在第十節。第二次，是在第十三節。"],["p","他不是說一次，就放棄。他也不是，說十次，就強迫。"],["p","他說兩次。然後，繼續等。"],["p","我們跟主的關係，也是這樣的。"],["p","聖經裡，有一幅很像的畫面。"],["p","啟示錄三章二十節，耶穌說：看哪，我站在門外叩門。"],["p","祂也站在門外。祂也沒有闖進來。"],["p","這使我們想起，不是說雅歌是預表。"],["p","只是這兩幅畫，很像。愛的邀請，站在外面。"],["p","你不開，祂不拆門。但你若聽見，開門，祂就進來。"],["p","今天，你的牆裡，是不是也有一個冬天？"],["p","一個很長的、很灰的冬天。也許是一次失敗。"],["p","也許是一個失去。也許，是很長的一段，乾涸。"],["p","你縮在裡面，甚至忘了，外面有春天。"],["p","可是，有一個聲音，在窗外。說：起來。冬天已往。"],["p","我不是說，你的難過，沒有道理。"],["p","我是說，那個聲音，是真的。"],["p","然後，他說了一句，特別溫柔的話："],["q","「我的鴿子啊，你在磐石穴中，在陡岩的隱密處。求你容我得見你的面貌，得聽你的聲音；因為你的聲音柔和，你的面貌秀美。」"],["p","鴿子，躲在磐石的穴裡。"],["p","陡岩的隱密處，是很難找到的地方。她躲起來了。"],["p","也許，是怕。也許，是羞。也許，是累。他沒有罵她。"],["p","他沒有說：你怎麼躲起來？"],["p","他說：求你，容我得見你的面貌。"],["p","他用的詞，是「求你」。愛的人，有時候，是在請求。"],["p","他說：你的聲音柔和。你的面貌秀美。"],["p","他喜歡，聽她的聲音。弟兄姊妹，神喜歡聽你的聲音。"],["p","不是你背得很漂亮的禱詞。是你的聲音。"],["p","你，躲在石穴裡的聲音。顫抖也好。沒有詞也好。"],["p","祂說：我想聽。"],["p","你有沒有發現，我們最怕的，常常是被看見的那一刻？"],["p","所以我們躲。躲在工作裡。躲在忙碌裡。"],["p","躲在很屬靈的話語裡。躲在「我很好」三個字後面。"],["p","石穴很安全。卻也很冷。他不是來拆穴的。"],["p","他只是在穴口，輕輕地說：我想見你。"],["p","你可以先露出一個眼睛。你可以先說一個字。"],["p","祂等得起。最後一個畫面，是一個提醒。"],["q","「要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸，因為我們的葡萄正在開花。」"],["p","春天有花。也有狐狸。注意，不是獅子。不是熊。"],["p","是小狐狸。小，卻會毀壞葡萄園。"],["p","因為葡萄，正在開花。花，是最嬌嫩的時候。"],["p","一碰就落。"],["p","愛情，剛剛開花的時候，毀壞它的，往往不是大風暴。"],["p","是小事。一句沒說出口的話。一次冷淡。"],["p","一個沒有處理的誤會。一個小小的謊。一點點的驕傲。"],["p","這節經文，沒有說，是誰在說。有人讀，是他。"],["p","有人讀，是她。也有人讀，是旁邊的人。我們不必爭。"],["p","重點是兩個字：「我們」。要給「我們」擒拿。"],["p","是「我們的」葡萄園。保護愛，是兩個人的責任。"],["p","我們來想一想，你家裡的小狐狸，是甚麼？"],["p","是一直沒有說的「對不起」？"],["p","是每天晚上，各自看手機？"],["p","是一句，開玩笑的諷刺？"],["p","是答應了，卻沒有做到的小事？"],["p","每一隻，都很小。每一隻，都不會馬上把葡萄園吃光。"],["p","可是，花一朵一朵地落。"],["p","有一天，你發現，園子裡沒有果子了。"],["p","這一節，沒有叫我們，大驚小怪。"],["p","它也沒有說，要責備誰。它只是說：要擒拿。要一起。"],["p","要在花開的時候。不是等果子沒了，才來哭。"],["p","對神的關係，也是一樣。"],["p","毀壞我們與神親近的，常常也不是大罪。"],["p","是一天少禱告五分鐘。"],["p","是一次，心裡有點不服，卻沒有說出來。"],["p","是一點，小小的比較。是，不再回頭，聽祂說話。"],["p","小狐狸，要早點抓。用誠實抓。用說出來抓。"],["p","用兩個人，一起抓。"],["p","最後，她說了一句，整章最重要的話。"],["q","「良人屬我，我也屬他；他在百合花中牧放群羊。」"],["p","他屬我。我屬他。你看這個次序。她先說：他是我的。"],["p","然後說：我是他的。這是愛，最初的樣子。"],["p","「他是我的」，說得很放心。說得很有安全感。"],["p","這句話，在後面還會出現。"],["p","我們到第六章，第七章，會看見。"],["p","這句話的次序，會改變。今天，我們先記住這個起點。"],["p","你屬於一個人。也有一個人，屬於你。這不是，擁有。"],["p","是歸屬。擁有，是我抓住你。"],["p","歸屬，是我們彼此，在對方的懷裡，安心。"],["p","最後一節，是這一章，最安靜的結尾。"],["q","「我的良人哪，求你等到天起涼風、日影飛去的時候，你要轉回，好像羚羊，或像小鹿在比特山上。」"],["p","這一章，從春天開始。卻以黃昏收尾。"],["p","你看，愛的日子，不是只有春天。有早晨，有傍晚。"],["p","有相聚，有等待。她沒有說，你不要走。"],["p","她說，你要轉回。這是一種成熟的愛。知道他會走。"],["p","也相信，他會回來。"],["p","我們與主的關係，也有這樣的時候。"],["p","有的日子，祂很近。有的日子，祂好像離開了。"],["p","可是，我們可以像她，說：你要轉回。"],["p","把這份等待，變成信心。不是因為我們感覺到祂在。"],["p","是因為我們知道，祂是誰。天起涼風，日影飛去。"],["p","是傍晚。她說：你要轉回。"],["p","這是一個，帶著一點不捨的結尾。他又要走了。"],["p","可是，她說：你要轉回。愛，有相聚。也有分別。"],["p","我們再回頭，把這一章，收起來。"],["p","今天，我們從三個畫面，看見三樣東西。"],["p","第一，被看見。"],["p","你不必是最美的，你只要，被一雙眼睛專注地看見。"],["p","第二，被邀請。愛的邀請，站在牆外，不闖進來。"],["p","第三，被守護。愛，要一起，擒拿小狐狸。"],["p","現在，我想把這一章，放在我們的信仰裡。"],["p","我們說，耶穌是我們的榜樣。你看祂，怎樣對待人。"],["p","祂站在門外。祂問一個瞎子：你要我為你做甚麼？"],["p","祂不替人，決定。祂尊重人的「自己情願」。"],["p","這是祂的榜樣。我們說，聖經是我們的準則。"],["p","今天，聖經給我們的準則是：愛，不能催。"],["p","你在帶領人的時候，尤其要記得。"],["p","不要用壓力，叫人回應。不要替人，說「好」。"],["p","我們說，聖靈是我們的引導。聖靈，也是這樣。"],["p","祂是溫柔的。祂是窗外的聲音。"],["p","祂在說：起來，與我同去。我們說，要讓耶穌作王。"],["p","作王的耶穌，不是闖進來的王。"],["p","是等你，自己開門的王。有一天，你把門打開。"],["p","你把一切的主權，交給祂。"],["p","然後，你發現，祂坐的地方，不是寶座上的威嚴。"],["p","是你心裡的，那一張，蘋果樹下的椅子。"],["p","焦點，在祂身上。不在你的冬天。不在你的小狐狸。"],["p","在那位，站在窗外，說你的聲音柔和的人。"],["p","今天，請你做一件事。"],["p","想一想，你的生命裡，有沒有一道牆？"],["p","牆後面，有一個冬天？"],["p","今天，不必拆牆。只要，把窗，開一條縫。"],["p","對祂說：主啊，我聽見了。我們一起禱告。"],["p","親愛的主，謝謝祢專注地看見我們。"],["p","在眾多的荊棘中，祢說我們是百合。"],["p","謝謝祢，不闖進我們的牆，只是站在窗外，用柔和的聲音呼喚我們。"],["p","我們有的人，還在冬天裡，求祢用春天的聲音，安慰我們。"],["p","求祢幫助我們，一起擒拿那些毀壞愛的小狐狸。"],["p","求祢，讓我們學會，尊重人的自由，不催逼、不替別人決定。"],["p","一切榮耀，都歸給耶穌。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"3":{"min":13,"blocks":[["h","《夜裡的尋找》"],["p","凌晨三點。你突然醒了。屋子很安靜。"],["p","外面，一點聲音也沒有。你躺著，看天花板。"],["p","腦子裡，只有一個人的名字。翻來覆去，睡不著。"],["p","如果你有過這樣的夜晚，今天這一章，是為你寫的。"],["p","雅歌第三章。弟兄姊妹平安。"],["p","這一章，從一個夜晚開始。"],["q","「我夜間躺臥在床上，尋找我心所愛的；我尋找他，卻尋不見。」"],["p","你看，全章的第一句話，就是「夜間」。她躺在床上。"],["p","睡不著。她尋找的，不是一個東西。"],["p","是「我心所愛的」。這個說法，很特別。"],["p","她不說「我的丈夫」。也不只說「他」。"],["p","她說：我心所愛的那一位。她的整顆心，都在他身上。"],["p","然後，是第一個壞消息：我尋找他，卻尋不見。注意。"],["p","聖經沒有，趕快安慰她。"],["p","沒有說：不要怕，他馬上就來。"],["p","沒有加一句：你要有信心。它只是說：尋不見。"],["p","如實記下。弟兄姊妹，這是一件，很重要的事。"],["p","有一些夜晚，是找不到的。你禱告，沒有回應。"],["p","你翻開聖經，字在眼前，卻沒有進到心裡。"],["p","你問：祢在哪裡？"],["p","四周，一片安靜。"],["p","有的人，在這樣的夜裡，開始責備自己："],["p","我的信心不夠。我是不是犯了甚麼罪？"],["p","我是不是，不配？"],["p","可是雅歌，沒有這樣說。"],["p","它把這個夜晚，放進了神的話。"],["p","還放在，這首最高的歌，的中間。"],["p","找不到的夜，是被神的話承認的。"],["p","它不是你失敗的證據。它是愛的一部分。"],["p","詩篇裡，也有很多這樣的夜。有人在夜裡，淚濕床鋪。"],["p","有人在夜裡，問：祢為甚麼離我這樣遠？"],["p","神的話，從不假裝，信徒沒有夜晚。這是一種誠實。"],["p","我們的講台，也要有這種誠實。"],["p","不要叫會眾，覺得，只有自己的夜，特別黑。"],["p","你不是唯一的一個。"],["p","很多愛神的人，都在這個夜裡走過。"],["p","他們沒有，因此，被神丟棄。然後，第二節："],["q","「我說：我要起來，遊行城中，在街市上，在寬闊處，尋找我心所愛的。」"],["p","她說，我要起來。這句話，是一個決定。"],["p","躺在床上想念，是一回事。起來找，是另一回事。"],["p","想念，可以在床上。尋找，要起來。"],["p","而且你看，她去的地方。不是，隱密的地方。是街市。"],["p","是寬闊處。是全城最公開、人最多的地方。"],["p","夜裡的街道，不是很安全。"],["p","可是，她不怕被人看見，自己在找。愛，要動身。"],["p","也要承擔，找的時候，可能遇見的人和事。"],["p","這個「我要起來」，今天，也許是你需要的。"],["p","也許你，已經在床上，想念神很久了。"],["p","想著：我好久沒有親近祂了。想著：我該回去了。"],["p","可是，一直沒有起來。今天，請你，起來。"],["p","不必等到，有感覺。不必等到，一切整理好。就起來。"],["p","走一步。打開一次聖經。跪下來，說一句話。"],["p","去一次，聚會。尋找，要起來。"],["p","也許你會說：我起來了，還是找不到。"],["p","那就再走一條街。她不是，只走一條街。"],["p","經文說，遊行城中。街市，寬闊處，都走了。"],["p","有的尋找，不是一次，就有結果。"],["p","是一次一次，走過去。可是，每一次走，都不是白走。"],["p","你的腳步，也是一種禱告。你的不放棄，神都看見。"],["p","希伯來書說，神是賞賜那尋求祂的人。"],["p","注意，是「尋求祂的人」。不是，找到了的人。"],["p","是在尋求的路上的人。"],["p","所以，連你在街上，喊著「你們看見他沒有」的那一刻，祂已經，在看你。"],["p","祂沒有說，你找得太慢。祂只看，你有沒有起來。"],["p","我們進入第二個畫面。"],["q","「城中巡邏看守的人遇見我；我問他們：你們看見我心所愛的沒有？」"],["p","她在街上，遇見看守的人。他們是，夜裡巡邏的。"],["p","她問他們：你們看見他沒有？"],["p","你有沒有注意到？"],["p","經文，沒有記載他們的回答。她問完，就繼續走。"],["p","也許，他們什麼也沒說。也許，他們也不知道。"],["p","然後，這是全卷，我最喜歡的一句話："],["q","「我剛離開他們就遇見我心所愛的。」"],["p","剛離開。她剛剛，轉過身。"],["p","剛離開，那些沒有答案的人。就遇見了。"],["p","找到的時刻，常常出人意料。"],["p","常常，是在你不再問路的時候。"],["p","常常，是在你以為，又要失望的時候。"],["p","是在，你剛剛轉身的那一刻。"],["p","你若是在，一個漫長的等待裡。也許在等，一份工作。"],["p","也許在等，一個孩子回頭。也許在等，一個病的結果。"],["p","這一節，不是給你一個，保證，說下一分鐘就會到。"],["p","它是在說：轉身的那一刻，也許就是。"],["p","所以，不要在，快要遇見的前一步，坐下來。"],["p","這不是說，你要放棄。她沒有放棄，她一直在走。"],["p","這是說：不要因為，沒有人給你答案，就停下來。"],["p","有時候，你要先經過那些，沒有答案的人。"],["p","然後，才遇見。"],["p","接下來，是這一章，最動人的兩個動詞。"],["q","「我拉住他，不容他走。」"],["p","她拉住他。她抓住他。不放手。這個畫面，很有力。"],["p","找了一整夜。走遍了街市。問遍了看守的人。"],["p","終於找到。她的手，緊緊抓住。這不是控制。"],["p","是找了很久，終於找到之後，那一種不肯再失去。"],["p","你有沒有，這樣抓住過誰？"],["p","有一個孩子，走失了很久，找回來之後。"],["p","父母抱住他，抱得緊緊的。孩子都喘不過氣來。"],["p","這不是控制。是愛。可是，我們必須在這裡，停一下。"],["p","因為「不容他走」，可以是愛，也可以變成控制。"],["p","兩者的差別在哪裡？"],["p","你看她，抓住他之後，做了甚麼。"],["q","「領他入我母家，到懷我者的內室。」"],["p","她帶他，回家。回到，母親的家。"],["p","回到，生養她的人的內室。她沒有，把他藏起來。"],["p","她沒有，把他關在，只有兩個人的地方。"],["p","她把他，領到一個，認識她的地方。"],["p","一個，會祝福她的地方。"],["p","這是愛的抓緊，與控制，最大的不同。"],["p","控制，是把人藏起來。愛，是把人帶到光中。"],["p","控制，是因為不信任。"],["p","愛，是因為怕失去了，才發現多愛。"],["p","控制，要切斷別人的關係。"],["p","愛，要帶他進入，自己的家。"],["p","弟兄姊妹，你可以用這節經文，檢查自己。"],["p","我抓住的人，是誰？"],["p","我是因為愛，還是因為怕？"],["p","我抓得緊，是為了把他帶進光裡，還是為了把他鎖在我身邊？"],["p","這個問題，要誠實地問。"],["p","然後，第二次出現，那句副歌："],["q","「耶路撒冷的眾女子啊，我指著羚羊或田野的母鹿囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願。」"],["p","這句話，我們在第二章，聽過一次。"],["p","可是，這一次的位置，不一樣。"],["p","第一次，是在甜蜜之後。這一次，是在「找到」之後。"],["p","找到的人，最想做的事，是甚麼？"],["p","是緊緊抓住。是要他，馬上給承諾。"],["p","是要他，保證，不再離開。可是，她在這個時候，說："],["p","不要驚動。等他自己情願。你看，這是多麼成熟的愛。"],["p","找到了，也要把時間，交給愛。"],["p","越是重要的關係，越不能靠催逼。"],["p","越是怕失去，越要學習，放手。這不容易。"],["p","但這是愛，真正的樣子。我們學習放手，不是不愛。"],["p","是在愛裡，尊重另一個人，是一個，自由的人。"],["p","父母，要學。夫妻，要學。帶領人的牧者，也要學。"],["p","放手，不是撒手不管。"],["p","是把手，從「控制」，換成「陪伴」。"],["p","我們來看第三個畫面。場景，一下子，變了。"],["p","從夜裡的街道，到了曠野。"],["q","「那從曠野上來、形狀如煙柱、以沒藥和乳香並商人各樣香粉薰的是誰呢？」"],["p","遠遠地，有一道煙升起。是香氣的煙。"],["p","沒藥，乳香，各樣香粉。是一個行列，來了。"],["p","香氣，先到。眾人問：那是誰呢？"],["p","這是全卷的第一個「那是誰呢」。後面，還有兩次。"],["p","我們到時候，會再看。然後，答案揭曉了。"],["q","「看哪，是所羅門的轎；四圍有六十個勇士，都是以色列中的勇士；手都持刀，善於爭戰，腰間佩刀，防備夜間有驚慌。」"],["p","這是一個婚禮的行列。有轎。有六十個勇士。"],["p","都持著刀。他們為甚麼，要有刀？"],["q","「防備夜間有驚慌。」"],["p","又是夜。第一節，是她，夜裡在找。"],["p","這裡，是勇士，夜裡在守。夜裡的危險，是真的。"],["p","連所羅門的婚禮，也要六十個勇士，守夜。"],["p","這給我們一個，安慰。愛，不是天真地，忽略黑夜。"],["p","愛，是在黑夜中，有人守護。你呢？"],["p","你所愛的人，在夜裡，有沒有人守護？"],["p","你自己，在夜裡，有沒有人守護？"],["p","更進一步問：你有沒有，成為一個，守夜的人？"],["p","替別人守夜。替一個，睡不著的人，守夜。"],["p","可以是，一通電話。可以是，一個，陪伴的晚上。"],["p","這個，在今天，值錢。"],["p","你想一想，你的身邊，有沒有一個，夜裡睡不著的人？"],["p","也許是一位剛剛失去親人的朋友。"],["p","也許是一個，正在面對手術的長輩。"],["p","也許是一個，被工作壓得喘不過氣的同事。"],["p","你不必給他，很多道理。有時候，只是坐在旁邊。"],["p","說：我陪你。這就是守夜。"],["p","勇士們，手裡有刀，是為了保護。我們手裡，沒有刀。"],["p","但我們有耳朵。有時間。有一個，願意留下來的心。"],["p","接著，是一頓，很華麗的描寫。"],["q","「所羅門王用黎巴嫩木，為自己製造一乘華轎。轎柱是用銀做的，轎底是用金做的；坐墊是紫色的，其中所鋪的乃耶路撒冷眾女子的愛情。」"],["p","黎巴嫩的香柏木。銀的柱子。金的底。紫色的坐墊。"],["p","這是，最貴的材料。可是，你看，最後一句。"],["p","「其中所鋪的，乃耶路撒冷眾女子的愛情。」"],["p","所有的銀，所有的金，所有的紫色，都是外面。"],["p","最裡面，鋪的，是愛。"],["p","有人讀這一句，說，是女子們，以愛心，鋪成的。"],["p","有人讀，說，是裡面，嵌著愛。"],["p","不論怎樣，重點在「裡面」。"],["p","弟兄姊妹，今天的人，也很會造華轎。"],["p","有人用，婚禮的規模。有人用，房子的大小。"],["p","有人用，車子的牌子。有人用，孩子的成績。"],["p","有人用，教會的人數。我們要問自己："],["p","我的華轎，裡面鋪的，是甚麼？"],["p","是愛，還是比較？"],["p","是愛，還是面子？"],["p","是愛，還是，給別人看的？"],["p","最後一節，是這一章的結尾。"],["q","「錫安的眾女子啊，你們出去觀看所羅門王！頭戴冠冕，就是在他婚筵的日子、心中喜樂的時候，他母親給他戴上的。」"],["p","冠冕，是母親給他戴上的。"],["p","你看，婚禮，不是兩個人的私事。是兩個家的事。"],["p","第四節，她把他領進，她母親的家。"],["p","第十一節，他的母親，為他戴上冠冕。"],["p","兩個母親，都在。愛，不是躲起來。"],["p","是被祝福，被見證。"],["p","愛的終點，是一個，大家一起歡喜的日子。"],["p","我們在教會裡，常常也會看見這樣的畫面。"],["p","一對新人，在眾人面前，說出誓言。"],["p","兩邊的父母，坐在前排。有人在哭。有人在笑。"],["p","這個畫面，很像第十一節。愛，被許多人，托住。"],["p","不是，偷偷摸摸。不是，孤零零。"],["p","我們也要，用這個眼光，看待教會。"],["p","教會，是一個大家庭。我們為彼此，戴上冠冕。"],["p","我們，為一個弟兄的成長，歡喜。"],["p","我們，為一個姊妹的得勝，鼓掌。"],["p","這是被祝福的愛，在人群裡的樣子。"],["p","不過，我要在這裡，特別說一句。"],["p","不是每一個人，都有這樣的婚禮。有的人，單身。"],["p","有的人，婚姻破碎。有的人，沒有被祝福。"],["p","這一節，不是要說，你缺了甚麼。單身，不是不完整。"],["p","這一節，只是在說，愛被祝福的時候，是喜樂的。"],["p","如果你，沒有這樣的日子，不要把自己，放在，這一節的反面。"],["p","神，也是，祝福你的那一位。我們來收一下。"],["p","這一章，從夜晚，到婚禮。從尋不見，到冠冕。"],["p","夜與日，在同一章裡。今天，我想送給你三句話。"],["p","第一句：找不到的夜，不是失敗，是愛的一部分。"],["p","第二句：找到之後，要把人帶進光裡，不是藏起來。"],["p","第三句：最華麗的轎，最要緊的，是裡面鋪的是愛。"],["p","現在，我們把它，放到信仰裡。耶穌，是我們的榜樣。"],["p","你知道嗎？祂也是一位，尋找的人。"],["p","祂說：人子來，是要尋找、拯救失喪的人。"],["p","祂為了一隻失去的羊，把九十九隻留在曠野。"],["p","祂也在夜裡，尋找。"],["p","這使我們想起，不是說，雅歌是在講這件事。"],["p","但是，我們可以學祂的榜樣：不放棄，一個走失的人。"],["p","我們說，聖經是準則。"],["p","今天的準則是：誠實地，面對找不到的夜。"],["p","不假裝，我已經找到了。不假裝，我很屬靈。"],["p","不假裝，我已經沒有問題。"],["p","這是，有己最難放下的一件事："],["p","我們很怕，被人看見，自己還在找。"],["p","可是，無己的人，可以光明正大地說：我還在尋找。"],["p","因為，他的價值，不在於，已經找到多少。"],["p","在於，那位，他所愛的人。"],["p","他的名字，被愛的那一位知道。這就夠了。"],["p","夜再長，天亮的時候，他還是被愛的人。"],["p","這份確定，是夜裡最好的燈。"],["p","你不必看見路，只要知道，誰在愛你。"],["p","我們說，聖靈是引導。聖靈，會在夜裡，同在。"],["p","祂是那位，守夜的。我們說，要讓耶穌作王。"],["p","作王的人，不是控制。祂不把人，藏起來。"],["p","祂把我們，帶進光中。"],["p","我們說，一切的榮耀，歸給耶穌。"],["p","找到的人，不誇口自己，找得多努力。"],["p","我們說，我是被祂找到的。這是無己。"],["p","承認，我找不到祂的時候，祂先找到了我。"],["p","今天，如果你正在夜裡。請你，不要責備自己。"],["p","請你，起來，走一步。"],["p","也請你，記得，有人，也在為你，守夜。"],["p","也許，就是那位，在旁邊，坐著的人。我們一起禱告。"],["p","親愛的主，謝謝祢，讓我們可以誠實地，說：我找不到。"],["p","謝謝祢，在夜裡，沒有責備我們。"],["p","求祢，給我們力量，起來，走一步。"],["p","求祢，讓我們的愛，是把人帶進光裡，不是把人藏起來。"],["p","求祢，讓我們學習，把時間交給愛，不催逼。"],["p","求祢，讓我們的華轎，裡面鋪的是愛。"],["p","一切榮耀，都歸給耶穌。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"4":{"min":13,"blocks":[["h","《新娘的讚美與園的封閉》"],["p","如果有人問你：你最想被別人，怎麼看？"],["p","你會怎麼回答？"],["p","有人說：我希望，被當作一個有用的人。"],["p","有人說：我希望，被當作一個，不添麻煩的人。"],["p","有人說：我只希望，有一個人，不管我做得好不好，都願意看我一眼。"],["p","今天這一章，就是一個人，被細細地看。雅歌第四章。"],["p","弟兄姊妹平安。這是整卷雅歌，最容易被誤會的一章。"],["p","因為，它用了許多，我們今天聽起來很奇怪的比喻。"],["p","山羊群。剛剪毛的母羊。石榴。塔。"],["p","我們讀了，可能會笑。也可能，覺得尷尬。"],["p","所以，在讀之前，我想先說三句話。"],["p","第一，這是丈夫對妻子，私下說的情話。"],["p","不是，給別人評分的清單。"],["p","第二，這些比喻，都來自古時候的田園和城牆。"],["p","我們不需要，一個一個去解剖。"],["p","我們只要，聽出它的語氣。"],["p","第三，這一章的重點，不是，身體。"],["p","是，一個人，被愛得，很安全。我們來看第一個畫面。"],["q","「我的佳偶，你甚美麗！你甚美麗！」"],["p","他一開口，就說：你甚美麗。還說兩次。"],["p","在第一章，他也這樣說過。"],["p","這個重複，不是沒有話可說。是忍不住。"],["p","然後，他開始，說細節。"],["q","「你的眼在帕子內好像鴿子眼。」"],["q","「你的頭髮如同山羊群臥在基列山旁。」"],["q","「你的牙齒如新剪毛的一群母羊，洗淨上來，個個都有雙生，沒有一隻喪掉子的。」"],["p","你可以想像，一個牧羊人，說這些話。"],["p","他看見的，是他最熟悉、最珍愛的東西。"],["p","基列山旁，山羊群順著山坡，一道一道地流下來。"],["p","遠遠看去，黑色的，閃著光。"],["p","剛剪毛，洗淨的羊，一隻一隻整齊地上來。"],["p","沒有一隻，缺少。"],["p","他的比喻，是他世界裡，最美的東西。"],["p","他用最好的畫面，來說她。"],["p","重點是，這些比喻，說的是：完整，潔淨，沒有缺少。"],["p","「個個都有雙生，沒有一隻喪掉子的。」"],["p","這句話的意思是，一整排牙齒，都在，都齊。"],["p","一個，都沒有少。他看見的，是一個完整的人。"],["p","接著，還有這一句："],["q","「你的頸項好像大衛建造收藏軍器的高臺，其上懸掛一千盾牌，都是勇士的籐牌。」"],["p","她的頸項，像一座塔。上面，掛滿了盾牌。"],["p","這不是，在說她，脖子很長。"],["p","這是在說：她站立的樣子。有尊嚴。有力量。"],["p","像一座，被護衛的城。"],["p","你看，他看她，不是看，一個需要被拯救的人。"],["p","是看一個，有尊嚴的人。這是愛的眼光，最美的地方。"],["p","它看見，你的尊嚴。"],["p","今天，有很多人，對自己的身體，很不滿意。太胖。"],["p","太瘦。太矮。皮膚不好。年紀大了。"],["p","有的人，開刀的疤，不敢給人看。"],["p","有的人，照鏡子，只看見，缺點。"],["p","社群媒體上，每一張臉，都修過。"],["p","我們，很難，相信，自己可以被愛。"],["p","雅歌第四章，不是在說，每個人，都要長得一樣。"],["p","它說的是，一種眼光。那種眼光，不拿你，跟別人比。"],["p","也不拿你，跟廣告比。它拿你，跟「你自己」比。"],["p","它看你，就像，牧羊人看他的山羊群。"],["p","每一處，都是他的寶貝。"],["p","如果，你曾經被，批評過外貌。我想請你，今天聽見："],["p","神造你的時候，不是隨便造的。"],["p","你，被細細地，看過了。祂說：甚好。"],["p","然後，他說了，這一章的第一個高潮。"],["q","「我的佳偶，你全然美麗，毫無瑕疵！」"],["p","毫無瑕疵。"],["p","這四個字，原文，在舊約裡，常常用在，獻給神的牲畜。"],["p","要「沒有殘疾」，才能獻上。"],["p","他把這個詞，用在她身上。"],["p","意思是：在我眼中，你沒有缺點。"],["p","弟兄姊妹，我們被愛的時候，最大的恩典，不是，被人說你很完美。"],["p","是，被愛我的人，看見所有的我，還是說：你很好。"],["p","有的人，一生都在，隱藏。隱藏他的過去。"],["p","隱藏他的身體。隱藏他的失敗。"],["p","他以為，只有隱藏，才會被愛。可是，雅歌第四章說："],["p","有一種愛，可以讓你，被細看，也不用羞愧。"],["p","這使我們想起，新約，關於基督與教會的話。"],["p","以弗所書五章，說基督愛教會，為教會捨己。"],["p","要使她，聖潔，沒有瑕疵。"],["p","這是新約，自己所作的連結，在談論婚姻的時候。"],["p","我們不必說，雅歌是在預表甚麼。"],["p","可是，我們可以，從這裡，看見："],["p","神看我們，也是用，這樣的眼光。"],["p","不是，用放大鏡，找我們的缺點。"],["p","是用，愛的眼睛，看我們，在祂裡面，所成為的樣子。"],["p","好，進入第二個畫面。"],["q","「我的新婦，求你與我一同離開黎巴嫩，與我一同離開黎巴嫩。從亞瑪拿頂，從示尼珥與黑門頂，從有獅子的洞，從有豹子的山往下觀看。」"],["p","他稱呼她，「我的新婦」。稱呼，變了。"],["p","前面是「佳偶」。現在是「新婦」。"],["p","他說，與我一同，離開黎巴嫩。重複兩次。"],["p","那是很高很遠的山。有獅子的洞。有豹子的山。"],["p","這是一個，很遙遠、很孤立的地方。他請她，下來。"],["p","這幾句話，有人讀成，她真的處境危險。"],["p","有人讀成，這只是形容山，高遠，險峻，難以接近。"],["p","經文沒有說，她被困在那裡。"],["p","所以，我們不要硬說，這是拯救。"],["p","但是，我們可以聽見這個語氣："],["p","愛的人，在山的另一邊，伸出手。"],["p","說：下來，與我同去。你可以想想。"],["p","你有沒有，一個，離人很遠的山頂？"],["p","一個，你自己躲起來，覺得安全，卻也很孤單的地方？"],["p","有的人，躲在，很高的地方。高的學歷。高的職位。"],["p","高的牆。也有人，躲在，很深的洞裡。"],["p","沒有人，可以靠近。愛的人說：下來。"],["p","不是責備你，躲得太高。是請你，近一點。"],["p","近一點，需要勇氣。因為，近了，就會被看見。"],["p","近了，就可能，被拒絕。所以，我們寧可站在遠處。"],["p","遠處，比較安全。可是，遠處，也比較冷。"],["p","他在山的這一邊，說：下來。"],["p","他沒有說：你要先變得更好，再下來。"],["p","他說：與我一同。我陪你，一起下。"],["p","我們一起，離開那座山。你不必，自己，找下山的路。"],["p","然後，是這一章，最直接的告白。"],["q","「我妹子，我新婦，你奪了我的心。你用眼一看，用你項上的一條金鏈，奪了我的心！」"],["p","「你奪了我的心」，連說兩次。一個眼神。一條項鏈。"],["p","就夠了。愛，常常，是從很小的細節開始。"],["p","不是，大場面。是一個眼神。"],["p","是一個，小小的、他注意到的東西。"],["p","還有一件事，我們要留意。他稱呼她，「我妹子」。"],["p","這裡的「妹子」，不是，真的妹妹。"],["p","在古代近東的情詩裡，這是一種，愛稱。"],["p","是親近，是疼惜。他說，你的嘴唇，滴蜜。"],["p","舌下有蜜，有奶。這不只是在說，親吻。"],["p","他在說，話語。她的話，是甘甜的。是滋養人的。"],["p","弟兄姊妹，話語，是愛最大的力量。"],["p","也是，最大的傷害。有人，用話語，滋養人。"],["p","有人，用話語，拆毀人。"],["p","雅歌說：這個女子，她的口，滴蜜。你的口，滴甚麼？"],["p","在家裡，你的話，是蜜，還是刺？"],["p","在教會，你對別人說的，是蜜，還是刀？"],["p","今天，你可以選。說一句，滴蜜的話。給你的孩子。"],["p","給你的另一半。給一個，很久沒有被稱讚的人。"],["p","一句話，就夠了。"],["p","箴言說，美好的言語，如同蜂房，使心覺甘甜，使骨得醫治。"],["p","你的一句話，可能是，別人一整個星期的力量。"],["p","也可能，是別人，一整個星期的陰影。"],["p","我們不必，說很多。我們只要，說真的。"],["p","說，你看見了甚麼好。「謝謝你今天，替我等門。」"],["p","「我看見，你很努力。」"],["p","「你在，我身邊，我很安心。」這種話，不花錢。"],["p","卻是，滴蜜。"],["p","現在，我們來到，這一章，最重要的畫面。"],["q","「我妹子，我新婦，乃是關鎖的園，禁閉的井，封閉的泉源。」"],["p","關鎖的園。禁閉的井。封閉的泉源。"],["p","三個，都是，保護的意思。園子，要有牆。"],["p","井，要有蓋。泉源，要有封。為甚麼？"],["p","因為，裡面，有珍貴的東西。這是一個，很美的畫面。"],["p","它不是，在說，女子，是一個被囚禁的人。"],["p","它是在說：她，是一個，珍貴的地方。"],["p","不是，誰都可以隨便進入。"],["p","聖經，對性的看法，在這裡，非常清楚。"],["p","性，不是，不好。也不是，骯髒。它是，園。"],["p","是一個，有果子、有香氣、有泉水的園。"],["p","正因為珍貴，所以要有門。"],["p","正因為是園，所以不是公共的路。"],["p","今天的世界，常常跟我們說，兩個極端的話。"],["p","一種說：性，是羞恥的，不要談。"],["p","另一種說：性，沒甚麼，隨便。雅歌兩個都不是。"],["p","它說：這是一個美好的園。"],["p","有牆，有鎖，是為了守護它的美。"],["p","我要特別，對年輕的朋友說："],["p","你被教導要守住，不是因為你不好。是因為你，珍貴。"],["p","也要對，已經有過傷害的人說："],["p","也許，有人，闖進過你的園。"],["p","也許，你的牆，被推倒過。那不是你的錯。"],["p","你的園，還是你的園。神，還是，看你，是珍貴的。"],["p","這個「毫無瑕疵」，神沒有收回。也許，你是單身。"],["p","也許，你的婚姻，已經走到盡頭。"],["p","也許，你根本，不想談這個。這一章，對你，也有話。"],["p","不是說，你的園，要趕快找到一個人。"],["p","是說，你的園，本來，就是珍貴的。"],["p","單身的人，不是，園子，空著的人。"],["p","園，是你的，你可以，把它交給神。"],["p","你可以，在祂的手中，結出，很多果子。"],["p","婚姻，不是，唯一的，結果子的方式。"],["p","保羅在新約，說得很清楚：各人領受神的恩賜，是不同的。"],["p","你，不缺少甚麼。然後，這一章，最後，是她說話。"],["q","「北風啊，興起！南風啊，吹來！吹在我的園內，使其中的香氣發出來。願我的良人進入自己園裡，吃他佳美的果子。」"],["p","你看。前面，他說，園是關鎖的。"],["p","這裡，她說：願我的良人，進入。門，是誰打開的？"],["p","是她。她自己，開口，說：進來。這很重要。"],["p","他沒有，破門而入。"],["p","他沒有，因為說了甜言蜜語，就拿走。"],["p","她，自己，選擇。你看，下面幾節，那些香料。"],["p","石榴，鳳仙花，哪噠，番紅花，菖蒲，桂樹，沒藥，沉香。"],["p","一連串，名字。全是，珍貴的香料，和果品。"],["p","這個園子，不是，一塊荒地。是一個，豐盛的園。"],["p","有，很多種香氣。"],["p","而且，她說：「你是園中的泉，活水的井，從黎巴嫩流下來的溪水。」"],["p","泉，是流動的。井，是有活水的。"],["p","她不是，一個封死的、不流動的地方。"],["p","是，有生命，有水流的。"],["p","被守護的，不等於，被封閉的。"],["p","她，可以，成為，滋潤別人的泉。"],["p","這給我們一個，很重要的提醒。"],["p","界線，不是為了，把人隔絕。"],["p","界線，是為了，讓水，流得更清。"],["p","好的界線，讓我們，更自由地，愛人。"],["p","這與第二章的那句副歌，是互相呼應的："],["p","「不要叫醒，等他自己情願。」"],["p","等，是為了，等到這一句。等，到她自己說：進來。"],["p","她也說得很特別：「進入自己園裡」。「自己的」園。"],["p","園子，是她的。但，她說：他的。"],["p","她把「我的園」，說成「他的園」。"],["p","這是，她自己，說出來的奉獻。不是被拿走。"],["p","是，她，獻上。愛的順序，是這樣的：先有，關鎖。"],["p","再有，等待。然後，由她，開門。最後，是他，進入。"],["p","這個次序，不能顛倒。"],["p","尤其，今天，我們要，更清楚地教導這個。"],["p","同意，是愛的一部分。沒有同意，就不是愛。"],["p","沒有，自由地，說：進來，就不是雅歌說的，園。"],["p","我們來把這一章，收起來。這一章，說了三件事。"],["p","第一，愛的眼睛，可以細看你，而你，不用羞愧。"],["p","第二，愛的召喚，從遙遠，到靠近。"],["p","第三，珍貴的園，有牆有鎖，而鑰匙，在園主人的手中。"],["p","這三件事，我想放到，我們的信仰裡。"],["p","耶穌，是我們的榜樣。你看，祂怎樣，對待人。"],["p","祂的眼光，沒有放大鏡。"],["p","祂對一個，被社會，看不起的女人，說：我也不定你的罪。"],["p","祂，看見她，全部的過去。但是，祂說話，不是羞辱。"],["p","是，叫她，站起來。這是愛的眼光。"],["p","聖經，是我們的準則。"],["p","聖經對身體，對性，說得很美，也說得很有界限。"],["p","我們不要，說得，比聖經更羞恥。"],["p","也不要，說得，比聖經更隨便。聖靈，是我們的引導。"],["p","聖靈，從來，不闖進。祂，也是，等你，開門。"],["p","祂說：請讓我進來。我們說，要讓耶穌作王。"],["p","讓耶穌作王，是你，自己開門。"],["p","你，把整個園，交給祂。不是被逼的。不是，因為怕。"],["p","我們有的人，不敢把園交給神，因為怕，祂拿走。"],["p","怕祂，要求太多。怕祂，要把我們，變成另一個人。"],["p","可是，你看雅歌的良人，他怎樣，對待這座園？"],["p","他稱讚它。他欣賞它。他等，它的主人，開口。"],["p","我們的主，是這樣的主。"],["p","祂說：我來了，是要叫羊，得生命，並且得的更豐盛。"],["p","豐盛，不是，被拿走。是，被豐富。"],["p","你把鑰匙，交給祂以後，你的園，不會變小。會變大。"],["p","香氣，會發出來。"],["p","連你自己，都會驚訝，原來，我的園裡，有這麼多的香料。"],["p","今天，不必一次，把整座園交出去。"],["p","你可以先交出，一個角落。一個，你最怕的角落。"],["p","對祂說：主啊，這一塊，請進來。"],["p","然後，看看，祂怎樣，對待它。"],["p","你會發現，祂是溫柔的。祂的手，不會粗暴。"],["p","祂的聲音，仍然是，柔和的。祂來，不是，掠奪。"],["p","祂來，是要，使園子，結出，更豐盛的果子。"],["p","是，因為，你認識祂。"],["p","也因為，你信，祂不會，傷害你的園。這是無己。"],["p","無己，不是，沒有自己。"],["p","無己，是，你自己，把鑰匙，交出去。因為你信任。"],["p","焦點，在耶穌。不在，你的不夠格。不在，你的羞愧。"],["p","在那一位，看你，毫無瑕疵的人。我們來禱告。"],["p","親愛的主，謝謝祢，用愛的眼睛，看我們。"],["p","我們有很多，不想被人看見的地方。"],["p","求祢，用安全的愛，叫我們，不再躲藏。"],["p","我們有的人，躲在，很高很遠的山上。"],["p","求祢，叫我們，下來，靠近。"],["p","求祢，幫助我們，的話語，是蜜，不是刀。"],["p","求祢，保守我們的園，有牆，有鎖。"],["p","也求祢，醫治，那些，曾經被闖進、被傷害的人。"],["p","讓我們，都學會，自己，打開門。"],["p","一切榮耀，都歸給耶穌。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"5":{"min":13,"blocks":[["h","《夜裡的失落》"],["p","今天這一章，我要講得慢一點。"],["p","因為，它有一個很甜的開頭。也有一個，很痛的中間。"],["p","雅歌第五章。弟兄姊妹平安。先說開頭。"],["q","「我妹子，我新婦，我進了我的園中，採了我的沒藥和香料，吃了我的蜜房和蜂蜜，喝了我的酒和奶。」"],["p","你記得，上一章的結尾嗎？"],["p","她說：願我的良人，進入自己園裡。這一節，是回答。"],["p","他進來了。他說：我進了。我採了。我吃了。我喝了。"],["p","連續四個「我」，後面都是「了」。"],["p","這是一種，已經完成的滿足。"],["p","是一個，終於被接納的人，說出的話。"],["p","接著，他轉向旁邊的人。"],["q","「我的朋友們，請吃！我所親愛的，請喝，且多多地喝！」"],["p","他說：請吃，請喝，多多地喝。"],["p","愛的滿足，不只是兩個人的。"],["p","旁邊的人，也被邀請歡慶。"],["p","這是整卷雅歌，最甜的一節。可是，接下來，第二節。"],["p","故事，轉了。"],["q","「我身睡臥，我心卻醒。」"],["p","你有沒有，這種經驗？"],["p","身體，躺下了。可是，心，還醒著。"],["p","也許，你信主很多年了。很累。服事累。工作累。"],["p","家裡也累。可是，在最深的地方，你的心，還醒著。"],["p","它，還在聽。你以為，你已經，沒有力氣，愛神了。"],["p","可是，「我心卻醒」。這是一個，安慰："],["p","身體會累，這不是罪。"],["p","累的時候，仍然，轉向祂，哪怕只是一個，微弱的方向，祂都看見。"],["p","你的心，還在向著祂。"],["p","你不必，因為累，就懷疑，自己的愛。她睡著了。"],["p","可是，她的心，在等。然後，她聽見了。"],["q","「這是我良人的聲音；他敲門說：我的妹子，我的佳偶，我的鴿子，我的完全人，求你給我開門；因我的頭滿了露水，我的頭髮被夜露滴濕。」"],["p","他在敲門。你看，他叫她，四個名字。妹子。佳偶。"],["p","鴿子。完全人。一口氣，四個愛稱。"],["p","他不是，在急著進來。他是在，用盡一切溫柔，叫她。"],["p","他說：我的頭，滿了露水。夜很深了。"],["p","他站在外面，很久了。這幅畫面，讓人心疼。"],["p","愛她的人，站在門外。濕了。冷了。求她：開門。"],["p","可是，她怎麼回答？"],["q","「我回答說：我脫了衣裳，怎能再穿上呢？我洗了腳，怎能再玷污呢？」"],["p","她說：我已經，睡下了。我的腳，洗乾淨了。"],["p","怎麼，再弄髒？"],["p","今天聽，這像是，推託。像是，一個人，不想起床。"],["p","有人讀這一段，就說：這個女子，不夠愛他。"],["p","她，錯過了。"],["p","可是，我想請你，先不要，那麼快下結論。"],["p","你有沒有，在很累的晚上，被叫醒過？"],["p","明明，心裡是愛的。明明，也想起來。"],["p","可是，身體，就是不想動。她的藉口，很小。很真實。"],["p","她不是，壞。她是，累了。"],["p","這是，愛裡，最真實的一刻。我們說，我們愛主。"],["p","可是，有時候，祂敲門，我們說：等一下。"],["p","我今天，太累了。我已經，洗好腳了。"],["p","我剛剛，安頓下來。這不是，不愛。這是，我們有限。"],["p","神知道，我們是塵土。詩篇一百零三篇，是這樣說的。"],["p","祂，記念，我們的體質。"],["p","所以，祂不是，那個，站在門外，看我們哪裡做錯的人。"],["p","祂是，站在門外，等我們，想起來的人。"],["p","我們每一次，起得慢，祂都知道。"],["p","經文，如實，記下一個，真實的人。"],["p","沒有說：她是一個壞新娘。也沒有說：她不該累。"],["p","它只是，記著。然後，第四節。"],["q","「我的良人從門孔裡伸進手來，我便因他動了心。」"],["p","他沒有走。他從門孔，伸進手來。他的手，在那裡。"],["p","她看見了。「我便因他動了心。」她的心，被觸動了。"],["p","注意，被觸動以後，她，做了甚麼？"],["p","她，起來。愛，不是，只有感動。"],["p","感動，要變成，起來。"],["p","很多時候，我們被感動，眼淚也流了。"],["p","然後，翻個身，又睡了。她，不是這樣。"],["p","她，起來，去開門。"],["p","這個動詞，原文，有「心腸翻騰」的意思。"],["p","是整個人的內裡，被牽動。"],["p","愛，不一定，總是，大聲地說服。"],["p","有時候，只是一隻手。在門孔裡，伸進來。"],["p","弟兄姊妹，你有沒有，被神的手，這樣觸動過？"],["p","不是，一場很大的聚會。不是，一個很強的講員。"],["p","就是，一個小小的，伸進來的東西。一句話。一首詩。"],["p","一個，不期而遇的，人。你的心，動了。她起來了。"],["q","「我起來，要給我良人開門。我的兩手滴下沒藥；我的指頭有沒藥汁滴在門閂上。」"],["p","她起來。她的手，滴著沒藥。滴在門閂上。"],["p","沒藥，是他留下的香氣。是他的記號。"],["p","他的記號，已經先到了門上。她開了門。"],["p","可是，第六節。"],["q","「我給我的良人開了門；我的良人卻已轉身走了。」"],["p","這一句，很短。很痛。她開了門。他，已經走了。"],["p","遲了。我們每個人，都有，一些「遲了」的經驗。"],["p","有的，是一通，沒有接起的電話。"],["p","有的，是一句，沒有說的話。"],["p","有的，是一個，沒有及時，陪伴的人。你起來了。"],["p","你開了門。可是，已經，晚了一步。這種痛，最難說。"],["p","因為，它不是，別人的錯。是我，慢了一點。"],["p","如果，你現在，正是這樣。你，晚了一步。"],["p","你，後悔，沒有，早一點開門。我想，請你聽一句話："],["p","愛你的人，不只是，一次，敲門。"],["p","她的良人，在第六節，走了。"],["p","可是，在第六章，我們會看見，他，沒有，離開。"],["p","他，在自己的園中。他，仍然，是她的。"],["p","遲了的門，不是，最後的門。"],["p","接下來的幾節，是這一章，最沉重的。"],["q","「他說話的時候，我神不守舍；我尋找他，竟尋不見；我呼叫他，他卻不回答。」"],["p","他說話的時候，她的魂，就出去了。她找他。找不到。"],["p","她呼叫他。他，不回答。她呼叫，他沒有回答。"],["p","這句話，一定要誠實地說。"],["p","有的時候，我們呼叫神，祂，也沒有立刻回答。"],["p","聖經，沒有，隱藏這件事。我們不需要，假裝。"],["p","詩篇裡，有人，一再地問：耶和華啊，祢忘記我，要到幾時呢？"],["p","祢掩面不顧我，要到幾時呢？"],["p","這樣的禱告，被放進聖經裡。神，沒有，因此，惱怒。"],["p","祂，把它，當作，信心的一種語言。"],["p","沒有立刻得到回答的呼叫，也是，禱告。"],["p","你，不要因為，聽不見，就以為，沒有人聽。"],["p","然後，是第七節。"],["q","「城中巡邏看守的人遇見我，打了我，傷了我；看守城牆的人奪去我的披肩。」"],["p","我要在這裡，停下來。這一節，要慢慢地說。"],["p","她，在夜裡，一個人，去找。遇見了，巡邏的看守人。"],["p","他們，打了她。傷了她。奪去，她的披肩。"],["p","這是，暴力。這是，真的。我要先說，三件事。"],["p","第一，這個女子，沒有做錯任何事。"],["p","她，是在找她所愛的人。她，沒有惹事。"],["p","她，沒有犯罪。被打的人，沒有錯。"],["p","第二，這些看守人，本來，是保護城的人。"],["p","他們的責任，是守護。可是，他們，成了傷害人的人。"],["p","這是，責任的顛倒。今天，也有這樣的事。"],["p","本來，應該保護你的人，傷害了你。可能是，家人。"],["p","可能是，師長。可能是，教會裡，有權柄的人。"],["p","這是，真的，發生過的。聖經，沒有避開。"],["p","第三，這一節，沒有，一個字，把它說成，是神的管教。"],["p","沒有說，這是她該受的。沒有說，這是為了，磨練她。"],["p","我們也，不可以，這樣說。如果，有人，正在，被打。"],["p","被威脅。被控制。我要，很清楚地，對你說："],["p","這不是，神要你，承受的。請你，尋求，保護。"],["p","請你，告訴一個，你信任的人。可以是，牧者。"],["p","可以是，輔導員。可以是，醫生，或者，社工。"],["p","如果，有立即的危險，請，撥打，當地的緊急電話。"],["p","不要，一個人，扛。"],["p","今天聚會結束後，如果你，需要單獨，說一說，請你，來找我，或者，找你信任的同工。"],["p","我們不會問，每一個細節。我們，只會，先陪你。好。"],["p","我們繼續，看她，怎麼說。被打了。被傷了。"],["p","被奪了披肩。她對眾女子，說的，是甚麼？"],["q","「耶路撒冷的眾女子啊，我囑咐你們：若遇見我的良人，要告訴他，我因思愛成病。」"],["p","你看。她沒有說：去替我討公道。"],["p","也沒有說：告訴他，我被打了。"],["p","她說：告訴他，我因思愛成病。"],["p","這句話，我們不能，說她是，不在乎自己的傷。"],["p","也不能，要求每一個，被傷的人，都這樣說。"],["p","每一個人，受傷的時候，說的話，是不同的。"],["p","有的人，會憤怒。有的人，會沉默。有的人，會哭。"],["p","這些，都是，正常的。"],["p","如果，你的身邊，有一個，受過傷的人。"],["p","請你，不要說：你為甚麼，不早點離開？"],["p","請你，不要說：你是不是，也有不對的地方？"],["p","請你，不要說：神一定，有祂的美意。"],["p","這些話，太快了。太輕了。"],["p","他需要的，是，有人說：我信你。我，在這裡。"],["p","你，沒有錯。先，這樣。"],["p","教會，是一個，應該安全的地方。"],["p","我們要學習，不要追問，細節。"],["p","不要，叫人，在眾人面前，再說一次。"],["p","我們要學習，相信。學習，陪伴。"],["p","學習，在必要的時候，把人，帶到，有專業的人那裡。"],["p","這，也是愛。"],["p","這一節，只是，記下，她在那一刻，說的一句話。"],["p","她最想他知道的，是她的愛。"],["p","我們不用，把它，變成，一條規定。"],["p","另外，我也要提醒，帶領的人。"],["p","不要，在講台上，把這一節，講成："],["p","被打的時候，你要，一句怨言都不說。"],["p","這樣的講法，會傷人。"],["p","經文沒有說，她，不可以，憤怒。"],["p","經文只說，她，說了這一句。"],["p","更不可以，用這句話，去要求，受傷的人，趕快，原諒，或者趕快，沒事。"],["p","我們，只是，看見，她的心。"],["p","然後，第九節，換成，眾女子，說話。"],["q","「你這女子中極美麗的，你的良人比別人的良人有何強處？你的良人比別人的良人有何強處，你就這樣囑咐我們？」"],["p","她們問：你的良人，有甚麼強處？"],["p","為甚麼，你，要為他，這樣？"],["p","這個問題，不是，挑釁。是，真的，想知道。"],["p","因為，後來，她們願意，與她同去。"],["p","她們看見，她的傷。她們想知道，值不值得。"],["p","我們的信仰，也常常，被這樣問。"],["p","你的神，到底，有甚麼，比別的神，強？"],["p","你為甚麼，為祂，受這麼多苦？"],["p","你的信仰，到底，值不值得？"],["p","她怎麼回答？"],["p","她，沒有講道理。她，沒有辯論。她，開始描繪。"],["q","「我的良人白而且紅，超乎萬人之上。」"],["p","她說：他，超乎萬人之上。然後，一處一處，說。"],["q","「他的頭像至精的金子。」"],["q","「他的眼如溪水旁的鴿子眼，用奶洗淨，安得合式。」"],["q","「他的兩手好像金管，鑲嵌水蒼玉；他的身體如同雕刻的象牙，周圍鑲嵌藍寶石。」"],["p","金子。象牙。白玉。寶石。黎巴嫩的香柏。"],["p","她用，最貴重的東西，來說他。"],["p","這些，都是，王宮與聖殿，才有的材料。"],["p","她，沒有說，他是王。"],["p","可是，她用，最好的字，來形容他。"],["p","在她眼中，他，配得最好的。你有沒有發現？"],["p","她在傷痕累累的時候，說的，不是，自己的痛。"],["p","是，他的美。這不是，要我們，壓抑痛。"],["p","是，要我們，看見："],["p","當一個人，真的認識，他所愛的那一位，他的描繪，可以，穿過傷口。"],["p","她被打了，可是，她的認識，沒有被打掉。"],["p","她知道，他是誰。"],["p","很多人，在苦難裡，失去了，對神的認識。"],["p","不是，因為苦難，太大。"],["p","是因為，我們以前，只認識，祂的恩賜，卻不認識，祂這個人。"],["p","雅歌，邀請我們，去認識「這個人」。"],["p","最後，她用，兩個詞，收尾。"],["q","「他的口極其甘甜；他全然可愛。」"],["q","「這是我的良人；這是我的朋友。」"],["p","我的良人。我的朋友。愛人，同時是，朋友。"],["p","這是，整段描述，最動人的地方。"],["p","弟兄姊妹，有人問你，你信的耶穌，有甚麼好？"],["p","你不需要，先講，很深的神學。"],["p","你可以，先說：讓我，告訴你，我認識的祂。"],["p","祂，在我最累的時候，沒有責備我。"],["p","祂，在我最痛的時候，沒有走開。祂，是我的朋友。"],["p","這，就夠了。"],["p","見證，常常，是從，「他是怎樣的人」開始。"],["p","你，認識祂的哪一面？"],["p","是祂的溫柔？"],["p","是祂的赦免？"],["p","還是，祂在你最黑的夜裡，沒有離開？"],["p","今天，把它，說給一個人聽。只要一句話。"],["p","你不必，把所有的問題，答完。"],["p","有人問，為甚麼，好人，也受苦？"],["p","你可以說：我不知道。"],["p","可是，我知道，我認識的耶穌，在我受苦的時候，沒有走開。"],["p","這句話，比一百個答案，更有力。"],["p","不是，從「你應該信」開始。我們來收一收。"],["p","這一章，有三個畫面。第一個，是敲門。"],["p","愛的人，站在門外，而回應，有時，是遲的。"],["p","第二個，是尋不見，和被傷。這些，都是真的。"],["p","第三個，是描繪。在傷痛中，她仍然，認得，他是誰。"],["p","最後，我要，把它，放到信仰裡。"],["p","我們說，耶穌，是我們的榜樣。"],["p","祂也經歷，被叫「看守」的人，打。"],["p","祂，被差役，打，被兵丁，打，被剝了衣服。"],["p","祂，懂得，被傷害的滋味。"],["p","所以，你不必，在祂面前，假裝。"],["p","你可以，把你的傷，一處，一處，給祂看。"],["p","祂說：我，知道。我們說，聖經，是我們的準則。"],["p","聖經，沒有說，尋不見的人，是罪人。"],["p","聖經，沒有說，被打的人，是活該。我們也，不要說。"],["p","我們說，聖靈，是我們的引導。"],["p","聖靈，是保惠師，是，與你同在的那一位。"],["p","耶穌說：我不撇下你們為孤兒，我必到你們這裡來。"],["p","有的時候，我們呼叫，祂好像沒有回答。"],["p","可是，祂的應許是：我不撇下你。"],["p","我們說，要讓耶穌作王。這個，不是在說，你不許痛。"],["p","是在說：在你最痛的時候，你仍然，讓祂，在你的中心。"],["p","我們說，焦點，在耶穌。不在，我，遲了一步。"],["p","不在，我，被誰傷害。"],["p","在，那位，站在門外，頭上滿了露水，仍然，從門孔，伸手進來的人。"],["p","祂，沒有，離開。我們，一起禱告。"],["p","親愛的主，謝謝祢，在我們累的時候，仍然敲門。"],["p","謝謝祢，沒有責備我們的遲疑。"],["p","我們，有的人，開了門，卻覺得，已經，太晚了，求祢，醫治，我們的遺憾。"],["p","我們，有的人，曾經被打、被傷，求祢，親自，擦乾他們的眼淚，也求祢，興起，保護他們的人。"],["p","讓每一個，受傷的人，不再，一個人扛。"],["p","讓我們，都能，像這個女子，在最痛的時候，仍然，認得，祢是誰。"],["p","一切榮耀，都歸給耶穌。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"6":{"min":13,"blocks":[["h","《彼此屬於》"],["p","上一章的最後，是一個人的呼喊。"],["p","這一章的開頭，是一群人的回答。雅歌第六章。"],["p","弟兄姊妹平安。"],["p","你還記得，第五章，那個，在夜裡，一個人，找不到良人，還被打傷的女子嗎？"],["p","她，把一個託付，交給旁邊的人："],["p","「若遇見我的良人，要告訴他，我因思愛成病。」"],["p","她，一個人，在黑夜裡。"],["p","這一章，一開頭，旁邊的人，站出來了。"],["q","「你這女子中極美麗的，你的良人往何處去了？你的良人轉向何處去了，我們好與你同去尋找他。」"],["p","她們說：我們好與你同去。"],["p","一個人，在夜裡，找了很久。"],["p","現在，有人說：我們陪你找。你注意了嗎？"],["p","她們的問題裡，有一份，善意。"],["p","她們，沒有說：你別找了。沒有說：他不值得。"],["p","沒有說：你是不是，想太多？"],["p","她們說：我們，和你，一起。"],["p","這個轉折，很小，卻很深。"],["p","當一個人，敢說出，自己的需要。"],["p","旁邊的人，就可能，走近。"],["p","弟兄姊妹，我們都有，這樣的時候。"],["p","也許，你一個人，扛了很久。你，不想，麻煩別人。"],["p","你，覺得，說出來，很丟臉。可是，第五章，她說了。"],["p","她說：告訴他，我因思愛成病。她說出來了。"],["p","然後，第六章，就有人，說：我們同去。"],["p","說出需要，不是軟弱。"],["p","是，給別人，一個，走近的機會。你可以，想一想。"],["p","你的身邊，有沒有一個，你一直，沒有，開口求助的人？"],["p","這個星期，請你，對一個人，說一句："],["p","我最近，有點累。你，可以，陪我，禱告嗎？"],["p","一句話，就夠了。然後，我們看，她的回答。"],["q","「我的良人下入自己園中，到香花畦，在園內牧放群羊，採百合花。」"],["p","你有沒有注意到？"],["p","前一章，她，找不到他。"],["p","這一章，她，忽然知道，他在哪裡。"],["p","他，在自己的園中。在香花畦。在百合花叢中。"],["p","經文，沒有說，她，是怎麼知道的。"],["p","也許，是這一夜，走過了，所有的街道，才發現，他一直，沒有走遠。"],["p","也許，是那些，同行的人，讓她，安靜下來，想起來。"],["p","我們不知道。但是，我們可以，這樣說："],["p","有時候，我們以為，神，不見了。"],["p","其實，祂，在祂自己的園中。"],["p","祂，在，祂所愛的人，中間。"],["p","我們，只是，太急，太慌，看不見。"],["p","然後，她說出，整卷雅歌，最重要的一句話之一。"],["q","「我屬我的良人，我的良人也屬我；他在百合花中牧放群羊。」"],["p","你還記得，第二章，她怎麼說嗎？"],["p","她說：良人屬我，我也屬他。她先說：他是我的。"],["p","然後，說：我是他的。可是，這一次，次序，換了。"],["p","她先說：我屬我的良人。然後才說：我的良人也屬我。"],["p","先後，換了。這不是，隨便的。"],["p","經過了，一個，找不到的夜。"],["p","經過了，一次，遲了一步的痛。經過了，被打傷的路。"],["p","她，說話的次序，變了。"],["p","她，不再，先說「他是我的」。她，先說：我是他的。"],["p","這是一種，成熟。愛，從「擁有」，走向「歸屬」。"],["p","擁有，是我抓住你。歸屬，是我，把自己，交給你。"],["p","而且，是在，不確定，你在哪裡的時候，仍然這樣說。"],["p","我們跟神的關係，也是這樣的。"],["p","年輕的時候，我們說：神，是我的。祂，是我的幫助。"],["p","祂，是我的力量。祂，是我的盾牌。這些，都沒有錯。"],["p","但是，經過了，一些夜晚。"],["p","我們，開始學習，說：我，是祂的。"],["p","不管，我感覺到甚麼。不管，祂，有沒有，馬上回答。"],["p","我，是祂的。這，是一個，很深的安息。"],["p","你，是屬於，一個人的。你，不是，被丟棄的。"],["p","你想一想，一個孩子，走丟了，在人群裡哭。"],["p","他不知道，爸爸在哪裡。"],["p","可是，他心裡，有一件事，是確定的："],["p","我是，爸爸的孩子。"],["p","這個確定，讓他，在哭的時候，仍然，記得，自己叫甚麼名字。"],["p","他仍然，記得，自己，屬於誰。"],["p","「我屬我的良人」，就是這樣的確定。"],["p","它，不取決於，我今天，過得好不好。"],["p","也不取決於，我今天，感覺到沒有。"],["p","它，取決於，那一位，已經，把我，當作，祂的。"],["p","這句話，在你，不知道，祂在哪裡的時候，仍然成立。"],["p","我們進入第二個畫面。"],["q","「我的佳偶啊，你美麗如得撒，秀美如耶路撒冷，威武如展開旌旗的軍隊。」"],["p","他回應了。他說：你美麗如得撒。"],["p","得撒，是一個城市的名字。"],["p","它的意思，有「喜悅」「令人愉快」的意思。"],["p","是北國，早期的京城。耶路撒冷，是南國的京城。"],["p","他把她，比作，兩座京城。一個，令人喜悅。"],["p","一個，莊嚴秀美。然後，「威武如展開旌旗的軍隊」。"],["p","還記得，旗，是甚麼嗎？"],["p","第二章，她說：他的旗在我以上。"],["p","現在，輪到，他，說：你像，展開旌旗的軍隊。"],["p","她，自己，成了，旗。"],["p","旗，本來，是別人，插在她頭上的。"],["p","現在，她，是，那面旗。愛，使人，不只是被保護。"],["p","愛，使人，有力量。被愛的人，會，站起來。"],["p","她，不是，一直，躲在，別人的旗下。她，成了，旗。"],["p","我們，也是這樣。"],["p","被主愛的人，不是，永遠，躲在，教會的後面。"],["p","他，會，起來。"],["p","他，會，在他的家，他的職場，他的鄰舍中，成為，一面，旗。"],["p","不是，為了，炫耀。"],["p","是，為了，讓人，知道，這裡，有愛。"],["q","「求你掉轉眼目不看我，因你的眼目使我驚亂。」"],["p","他說：你的眼目，使我驚亂。"],["p","你的眼睛，讓我，招架不住。"],["p","這是，一種，很可愛的，坦白。"],["p","一個，男人，說：我，招架不住你。"],["p","後面的，讚美，大部分，與第四章，一樣。山羊群。"],["p","母羊。石榴。重複。重複，在愛裡，不是貧乏。"],["p","是確認。他，看見的，仍然，是，同一個她。"],["p","我們都，怕，一件事：有一天，對方，看夠了。"],["p","熟悉了。不再，驚訝了。然後，愛，就淡了。"],["p","可是，這裡，良人，用，同樣的話，又說了一次。"],["p","同樣的山羊群。同樣的母羊。同樣的石榴。"],["p","他，沒有，換新詞。因為，他，不需要。"],["p","真正的愛，不是，一直，找新鮮。是，一直，認得。"],["p","你，與你的另一半，與你的孩子，與你的主，都可以，這樣："],["p","用，同樣的話，再說一次。「我愛你。」"],["p","「我看見你。」「你，還是，我的寶貝。」"],["p","重複，不是，枯燥。是，忠心。經過了，一個夜晚。"],["p","他的眼光，沒有變。"],["p","你，有沒有，被人，這樣，重複地，愛過？"],["p","不是，因為新鮮。是，因為，你，還是你。"],["p","然後，是，這一章，很特別的一段。"],["q","「有六十王后八十妃嬪，並有無數的童女。我的鴿子，我的完全人，只有這一個是她母親獨生的，是生養她者所寶愛的。」"],["p","六十。八十。無數的。這是，王宮的排場。"],["p","這是，古代近東，王的世界。"],["p","可是，他說：我的鴿子，只有這一個。"],["p","「只有這一個」，是，無法比較的，獨一。"],["p","這句話，不是，要我們，去羨慕，王宮的制度。"],["p","也不是，說，這樣的制度，是好的。"],["p","聖經，從創造的起初，看見的，
