是一個男人，和一個女人，成為一體。"],["p","這裡，是，一個，比較。"],["p","用王宮裡的，許多，來襯出，他心中的，只有一個。"],["p","你看，這節經文，最後，怎麼說？"],["q","「眾女子見了就稱她有福；王后妃嬪見了也讚美她。」"],["p","連，那些，王后，妃嬪，也稱讚她。你有沒有發現？"],["p","這首歌，沒有，用，貶低別人，來抬高她。"],["p","他沒有說：別人，都不如你。他說：你，是獨一。"],["p","而且，連被比較的人，也在稱讚。"],["p","愛，不需要，靠，貶低別人。"],["p","愛，只需要，一句話：就是你。"],["p","我們，有時候，為了，覺得，自己，有價值，會，不自覺地，貶低別人。"],["p","說一點，別人的壞話。比較，一下，誰，更用心。"],["p","這是，因為，我們，心裡，沒有，確定，自己，被愛。"],["p","被愛的人，不需要，踩著別人，站高。"],["p","他，可以，真心地，為別人，歡喜。"],["p","你看，連王后，妃嬪，也在稱讚。"],["p","這是，一個，沒有，嫉妒的，畫面。"],["p","是，一個，愛，充滿的，畫面。"],["p","這句話，在我們，這個，每天被比較的世界，特別需要。"],["p","我們，在比較裡，長大。"],["p","小時候，被拿來，跟鄰居的孩子比。"],["p","長大了，被拿來，跟同事比。"],["p","結了婚，被拿來，跟別人的家庭比。"],["p","連信仰，我們，也會比。他的禱告，比我長。"],["p","她的服事，比我多。他們教會，比我們大。"],["p","久了，我們，就開始，覺得，自己，不夠。"],["p","然後，用力，去補。可是，這節經文，說："],["p","「只有這一個」。"],["p","她，不是，一堆，裡面，最好的那一個。"],["p","她，是，那一個。你，也是。"],["p","在神的眼中，你，不是，一個，排名。"],["p","你，是，一個，名字。我們，被比較，被打分數。"],["p","成績，被比較。收入，被比較。孩子，被比較。"],["p","教會，也被比較。可是，在愛裡，沒有比較。"],["p","你，不是，第一名。你，是，獨一。"],["p","現在，我們，進入，最後一個畫面。"],["q","「那向外觀看、如晨光發現、美麗如月亮、皎潔如日頭、威武如展開旌旗軍隊的是誰呢？」"],["p","這是，全卷，第二個，「那是誰呢」。"],["p","第一個，在第三章，問的是，一個，行列，香氣的煙柱。"],["p","這一個，問的是，她。她，像晨光。像月亮。像太陽。"],["p","像，展開旌旗的軍隊。"],["p","從，黎明，到，月夜，到，白晝。"],["p","她，被比作，天上，所有的光。"],["p","你記得，第一章，她說自己，被日頭曬黑了嗎？"],["p","她，被日頭，曬黑，被人輕看。"],["p","這裡，她，被比作，日頭。你看，經文的，翻轉。"],["p","被日頭曬黑的人，後來，被稱為，皎潔如日頭。"],["p","這就是，愛的，作為。它，不改變，你的過去。"],["p","但，它，改變，你，被看的方式。"],["p","然後，最後三節，有點，謎。"],["q","「我下入核桃園，要看谷中青綠的植物，要看葡萄發芽沒有，石榴開花沒有。」"],["p","這一節，是一個，安靜的畫面。她下到園子裡。"],["p","看，綠色的植物。看，葡萄，發芽了沒有。"],["p","石榴，開花了沒有。"],["p","在經歷了，夜晚，與尋找，與一切之後，她，做的，不是，大事。"],["p","她，只是，去看，園子。看看，有沒有，新的生命。"],["p","這是一種，很美的習慣。"],["p","經過風暴之後，不急著，下結論。"],["p","先去，看看，有沒有，發芽。"],["p","你的園子，有沒有，一個，剛剛，冒出來的，小芽？"],["p","一個，新的，禱告？"],["p","一個，新的，願意？"],["p","別小看它。神，常常，在小小的芽裡，開始。"],["p","不要等到，它，變成大樹，才相信，它是真的。"],["p","耶穌，也用，芥菜種，比喻，神的國。"],["p","最小的種子，長大了，成為，飛鳥棲息的樹。"],["p","你今天，有一顆，小種子嗎？"],["p","把它，好好地，放在，祂的園中。祂，會，看顧它。"],["p","你只要，不放棄，它。"],["q","「不知不覺，我的心將我安置在我尊長的車中。」"],["p","第十二節，是整卷，最難翻譯的一節。"],["p","和合本的意思是：不知不覺，我的心，把我，安置在，我尊長的車中。"],["p"," s":[["h","《讚美與回應》"],["p","有一個字，在整本舊約聖經裡，只出現三次。"],["p","第一次，在創世記三章。第二次，在創世記四章。"],["p","第三次，在雅歌七章。"],["p","這個字，和合本，翻成「戀慕」。"],["p","我們今天，要從這個字，走進，雅歌第七章。"],["p","弟兄姊妹平安。"],["p","不過，在這之前，我要先，為這一章，立三個，規矩。"],["p","因為，這是整卷雅歌，最直接的一章。"],["p","有很多，身體的描寫。我們，要讀得，有智慧。"],["p","第一個規矩：這是，丈夫對妻子，私下說的話。"],["p","它，不是，公開的評論。"],["p","我們，聽見，是因為，神，把這一首歌，放進聖經。"],["p","可是，我們，不是，要去，逐項，評論。"],["p","第二個規矩：這一章，不供，任何人，拿來，對別人的身體，品頭論足。"],["p","也不供，任何人，用來，比較，自己，與別人。"],["p","第三個規矩：我們，要從，這些，熱烈的話裡，學的是，語言的方式。"],["p","愛，可以，用語言，去滋養。"],["p","而不是，用語言，去羞辱。"],["p","有這三個規矩，我們才開始。第一個畫面。"],["q","「王女啊，你的腳在鞋中何其美好！」"],["p","你看，這一次，他，從腳，開始。"],["p","第四章，他是，從頭，往下，說。"],["p","這一次，他，從腳，開始。為甚麼？"],["p","因為，她，正在，走過來。他看見，她走近。"],["p","他，第一眼，看見的，是腳步。她，在鞋中。"],["p","一個，行走的，人。"],["p","這一章，開頭，就是，一個，行走的人。"],["p","不是，被擺放的。是，在走。"],["p","然後，他稱她，「王女」。和合本，譯作，「王女」。"],["p","原文的意思，是「貴族的女兒」。"],["p","你還記得，第一章，她是誰嗎？"],["p","她，被弟兄，使喚去，看守葡萄園。她說，自己，黑。"],["p","被人，輕看。現在，他叫她：貴族的女兒。"],["p","這個稱呼，不是，因為，她的血統，改變了。"],["p","是，因為，他的眼光，抬高了她。"],["p","被愛的人，在愛她的人眼中，是，貴族。"],["p","弟兄姊妹，這，就是，福音。"],["p","你不必，爭取，這個身分。"],["p","你，不是，努力，努力，才變成，貴族。"],["p","你是，被稱呼的。"],["p","今天早晨，你起來，面對鏡子的時候，你，是，怎麼稱呼，自己的？"],["p","失敗的人？"],["p","多餘的人？"],["p","沒用的人？"],["p","有一個，更大的聲音，在說：我的孩子。"],["p","這個稱呼，比，你對自己的稱呼，更真實。"],["p","我們本來，是被使喚，看守別人葡萄園的人。"],["p","我們，是被罪，曬黑的人。"],["p","可是，有一位，說：你，是，我的。"],["p","你，是，王的兒女。"],["p","約翰福音說，凡接待祂的，就賜他們權柄，作神的兒女。"],["p","這不是，因為，我們的血統。"],["p","是，因為，祂，稱我們，這樣。"],["p","然後，他，一連串地，讚美。"],["p","這些，比喻，與，工匠，有關。"],["p","「是巧匠的手做成的。」"],["p","他，把她，看作，一件，精工之作。"],["p","不是，一件，可以，被佔有的，物品。"],["p","是，一件，被，用心，造出來的，作品。"],["p","這，是，一個，很重要的區別。"],["p","在這個世界上，有兩種，看人的方式。"],["p","一種，是，欣賞，一個，被造的人。"],["p","一種，是，消費，一個，可以拿來用的人。"],["p","這一章，用的，是，前一種。讚美，可以，很熱烈。"],["p","但，它的目的，是，讓對方，感到，被珍愛。"],["p","不是，感到，被打分數。"],["p","你，可以，用一個，簡單的標準，來檢驗，任何，關於，身體的，話語："],["p","聽的人，聽完以後，是更自由，更確信，自己被愛？"],["p","還是，更羞愧，更焦慮，更覺得，自己不夠？"],["p","前者，是雅歌。後者，不是。"],["p","在家裡，我們說的話，常常，不自覺地，就，掉進，後者。"],["p","「你怎麼又胖了。」「你看人家，多會打扮。」"],["p","「你就是，這樣，我才，沒有辦法。」"],["p","說的人，也許，是，開玩笑。"],["p","可是，聽的人，把它，記一輩子。"],["p","有的人，三十年以後，還記得，母親，說過的一句，關於，他外貌的話。"],["p","所以，我們，要，下一個，決心："],["p","我的話，不要，成為，別人，一輩子，的陰影。"],["p","我的話，要，像，蜜。要，像，香膏。"],["p","要，像，一個，被造的人，被欣賞的時候，得到的，那種，安靜。"],["p","我們再看一句："],["q","「你的頭在你身上好像迦密山；你頭上的髮是紫黑色；王的心因這下垂的髮綹繫住了。」"],["p","這一節，最後一句，非常有意思。"],["p","「王的心，因這下垂的髮綹，繫住了。」"],["p","和合本，多加了一個，「心」字。"],["p","原文，直譯，是：王，被繫在，髮綹中。一位王。"],["p","一位，有權力的人。被，一縷頭髮，繫住了。"],["p","這是，整卷雅歌，最反轉的畫面之一。"],["p","我們，通常，以為，權力，是，征服。"],["p","可是，在愛裡，權力，是，被俘。"],["p","一個，強者，自願，被，一個人，繫住。"],["p","有人說，你看，這個王，不是，在握著她。"],["p","是她，握著，他。權力，在愛面前，倒過來了。"],["p","這給我們一個，很重要的提醒。"],["p","愛，不是，權力的遊戲。在愛裡，沒有，誰，管誰。"],["p","只有，誰，被誰，繫住。"],["p","今天，有一些，關係，是，用，權力，運作的。"],["p","有人，用，金錢。有人，用，年齡。有人，用，地位。"],["p","控制，另一個人。"],["p","可是，雅歌說：真的愛，是，一個王，被繫住。"],["p","是，強者，彎下腰。是，有權的人，放下，權柄。"],["p","這，使我們想起，耶穌。"],["p","祂，本有，神的形像，卻不以，與神同等，為，強奪的。"],["p","反倒，虛己。腓立比書二章，這樣說。"],["p","這是，新約，自己，說的話。"],["p","我們，不說，雅歌，是在預表。"],["p","只是，在這一節，我們，看見，一幅，愛的畫面，它的方向，是：向下。"],["p","我們進入，第二個畫面。"],["q","「我所愛的，你何其美好！何其可悅，使人歡暢喜樂！」"],["p","這裡，是，一聲，讚嘆。前面，是，一連串，比喻。"],["p","這一節，只是，一句，直接的話：你，何其美好。"],["p","何其可悅。我們很多人，把愛，說得，很複雜。"],["p","其實，愛，常常，就是，這樣簡單。一句，直接的話。"],["p","你，真好。和你在一起，我，很歡喜。"],["p","今天，你，有沒有，對，你愛的人，說過？"],["p","不是，修飾過的。是，直接的。"],["p","他接下來，說了，一個，更直接的願望。"],["p","這一段，我們，不展開。經文，自己，也，沒有展開。"],["p","它，用，一個，比喻，停住了。愛，有，熱情。"],["p","也有，節制。有，說出來的，也有，沒有說出來的。"],["p","然後，這一章，最特別的，是，第九節的，後半。"],["q","「女子說：為我的良人下咽舒暢，流入睡覺人的嘴中。」"],["p","她，接過，話來。你看，他，說到一半。"],["p","她，忽然，插話。她，沒有，等他，說完。"],["p","這是，一個，很可愛的，細節。"],["p","他們的對話，是，接力的。他說一半，她接下去。"],["p","愛的對話，不是，一個人，說到底。"],["p","是，你說一半，我說另一半。"],["p","聽對方，說到一半，就，知道，他要說甚麼，是，知心。"],["p","這也是，一個，很重要的，提醒。"],["p","這首歌，不是，只有，男人，在說。她，也在說。"],["p","她，有，自己的，聲音。"],["p","在很多，文化裡，女人，被要求，安靜。"],["p","被要求，不要，打斷。被要求，只聽，不說。"],["p","可是，在這一首，被神，放進聖經的歌裡，她，打斷了。"],["p","而且，沒有，人，責備她。她，有，聲音。"],["p","她的聲音，被，記錄下來。"],["p","而且，是在，這個，最親密的時刻。"],["p","這是，一個，很重要的，宣告："],["p","在愛裡，兩個人，都有，說話的，權利。"],["p","在教會裡，在家裡，我們，要，為，每一個人，保留，一個，說話的位子。"],["p","然後，她說了，一句話。"],["p","這一句話，是，整章，最重要的。"],["q","「我屬我的良人，他也戀慕我。」"],["p","她，在，他，一連串，讚美之後。"],["p","沒有，用，同樣長度，回應。她，只說，一句。"],["p","「我屬我的良人，他也戀慕我。」"],["p","你還記得，這句話的，前身嗎？"],["p","第二章，十六節：「良人屬我，我也屬他。」"],["p","第六章，三節：「我屬我的良人，我的良人也屬我。」"],["p","這是，第三次。這一次，她說：我屬我的良人。"],["p","他也戀慕我。你看，次序，又變了。"],["p","第一次，是「他是我的，我是他的」。"],["p","第二次，是「我是他的，他也是我的」。"],["p","第三次，是「我是他的，他戀慕我」。"],["p","最後，「他也屬我」，變成了「他戀慕我」。"],["p","不是，「他屬於我」。是，「他戀慕我」。"],["p","這是，從歸屬，進到，一個，更溫柔的字：戀慕。"],["p","好，現在，回到，我們一開始，說的，那個字。"],["p","「戀慕」。這個字，在舊約，只出現三次。"],["p","第一次，在創世記三章十六節。"],["p","神，對女人，說：你必戀慕你丈夫，你丈夫必管轄你。"],["p","那是，人，犯罪以後。關係，破裂以後。"],["p","戀慕，與管轄，並列。第二次，在創世記四章七節。"],["p","神對該隱說，罪伏在門前，它必戀慕你，你卻要制伏它。"],["p","這裡的戀慕，是，一種，想要佔有、想要控制的，渴求。"],["p","你看，在創世記，這個字，帶著，破碎。"],["p","帶著，想要，控制，與被控制。可是，到了雅歌七章。"],["p","同一個字。她說：他戀慕我。不是，「他管轄我」。"],["p","不是，「他要控制我」。是，他戀慕我，而，我屬他。"],["p","這個字，在雅歌裡，被，醫治了。"],["p","弟兄姊妹，這是，非常，動人的。"],["p","在創世記，愛，被罪，弄得，歪曲。"],["p","在雅歌，愛，回到，起初的，樣子。"],["p","一個人，戀慕另一個人。"],["p","而，被戀慕的人，不是，被管轄，是，被珍愛。"],["p","我不是，說，雅歌，就，解決，了，所有的，關係問題。"],["p","我，只是，說，我們，可以，聽見，這個字的，回聲。"],["p","在聖經的，這三處，我們，看見，愛，從，破碎，走向，被恢復。"],["p","今天，你，在，你的關係裡，是，哪一個「戀慕」？"],["p","是，創世記三章的？"],["p","是，帶著，管轄與被管轄的？"],["p","是，創世記四章的？"],["p","帶著，佔有與控制的？"],["p","還是，雅歌七章的？"],["p","一個，被珍愛，也珍愛別人的？"],["p","這，是，一個，要，誠實問的，問題。"],["p","然後，我們，進入，第三個畫面。這一次，她，說話。"],["q","「我的良人，來吧！你我可以往田間去；你我可以在村莊住宿。」"],["p","你記得，第二章，是誰，在邀請？"],["p","是他。他說：起來，與我同去。這一次，是，她。"],["p","她說：我的良人，來吧！她，提出，邀請。"],["p","她，決定，去哪裡。她，選擇了，田間。村莊。"],["p","葡萄園。"],["q","「我們早晨起來往葡萄園去，看看葡萄發芽開花沒有，石榴放蕊沒有；我在那裡要將我的愛情給你。」"],["p","你有沒有，注意，她，選的，地方？"],["p","不是，房間。是，田野，村莊，葡萄園。"],["p","是，日常的，地方。是，有，收成的，地方。"],["p","愛，不只在，屋內。愛，也走進，田野。"],["p","也許，你，是，單身。"],["p","也許，你，沒有，丈夫，或妻子，與你，一起，去看，葡萄園。"],["p","這一段，對你，也有話。"],["p","你，也有，你的，田間，與，村莊。"],["p","你的，工作，你的，鄰居，你的，教會，你的，朋友。"],["p","在那裡，你，也可以，說：來吧，我們，一起，去看，有沒有，發芽。"],["p","愛，不是，只有，婚姻，才有，田野。"],["p","愛，是，一種，願意，走進，別人，日常的，心。"],["p","你，可以，與，一個，朋友，一起，早起，禱告。"],["p","你，可以，陪，一個，老人，去，市場。"],["p","你，可以，帶，一個，孩子，去，認識，神。"],["p","這些，都是，葡萄園。早晨，是一個，很好的，詞。"],["p","「我們早晨起來」。"],["p","愛，是，一個，每天，早晨，再一次，起來的，決定。"],["p","不是，一次，轟轟烈烈，就夠了。"],["p","是，今天早晨，我，再起來，一次。"],["p","去看，我們的，葡萄園，今天，有沒有，一點點，新的，開花。"],["p","連最小的，開花，也值得，被，一起，看見。"],["p","你今天，有沒有，一件，小事，值得，向，一個人，說：你看？"],["p","一個孩子，學會了，一個字。"],["p","一個，鄰居，打了，招呼。"],["p","一個，禱告，有了，一點，回應。說出來。"],["p","歡喜，被分享，才更完整。"],["p","耶穌也說過：天上，為一個悔改的罪人，歡喜。"],["p","天上的歡喜，是，分享的歡喜。"],["p","我們，在地上，學習，同樣的事。"],["p","把，小小的，歡喜，說給，身邊的人聽。"],["p","這，是，一種，很簡單，卻很深的，敬拜。"],["p","走進，每天，早晨，起來，去工作的，地方。"],["p","我們很多人，把，愛，想成，只有，浪漫。"],["p","可是，這裡，是，一個，很踏實的，畫面："],["p","早晨，一起，起來，去看，葡萄，發芽了沒有。"],["p","這，是，婚姻，最好的，樣子之一。一起，看，園子。"],["p","一起，看，有沒有，新芽。然後，她說："],["q","「風茄放香，在我們的門內有各樣新陳佳美的果子；我的良人，這都是我為你存留的。」"],["p","新的，舊的，果子。都，為你，存留。她，預備了。"],["p","她，不是，臨時，起意。是，預備，了，很久。"],["p","愛的邀請，不是，一時衝動。是，一直，預備著。"],["p","今天，我們，也可以，問："],["p","我，為，我所愛的人，存留了，甚麼？"],["p","是，時間？"],["p","是，耐心？"],["p","是，一個，新的，原諒？"],["p","還是，一個，舊的，感謝，一直，沒有說出口？"],["p","我們來，收一收。這一章，有三個畫面。"],["p","第一個，是，一個，被，珍愛的人，被稱為，貴族的女兒。"],["p","被讚美的，是，一個，完整的人。"],["p","第二個，是，一個，字。"],["p","戀慕，在創世記，是，破碎的；在雅歌，被醫治。"],["p","第三個，是，田野。愛，走進，日常。"],["p","現在，我們把這一章，放在，信仰裡。"],["p","耶穌，是我們的榜樣。"],["p","祂，不是，用，權力，來，管轄人。"],["p","祂，彎下腰，洗，門徒的腳。"],["p","祂，是，那位，被，愛，繫住的王。"],["p","聖經，是我們的準則。"],["p","聖經說，丈夫，要，愛，妻子，如同，基督，愛教會。"],["p","這個「愛」，不是，管轄，是，捨己。"],["p","我們，要，用，這個，準則，檢查，我們，所有的關係。"],["p","聖靈，是我們的引導。祂，使我們，被，愛，充滿。"],["p","祂，也，使我們，有，節制。讓耶穌，作王。"],["p","作王的耶穌，不是，管轄你，使你，縮小。"],["p","祂，是，戀慕你，使你，成為，你自己。"],["p","無己，不是，被取消。是，被，愛，充滿。"],["p","我們，有時候，誤會了，無己。"],["p","以為，無己，就是，沒有感覺。沒有想法。沒有聲音。"],["p","不是的。雅歌裡的女子，有聲音，有願望，有選擇。"],["p","她，也是，一個，無己的人，嗎？"],["p","她的，焦點，不在，她自己，而在，她所愛的人。"],["p","她，說：我屬我的良人。她，不是，沒有自己。"],["p","她，是，把自己，交出去。"],["p","交出去的，才是，真的有，自己的人。"],["p","一個，沒有，自己的，人，沒有東西，可以，交。"],["p","焦點，在耶穌。不在，我的身體，被不被，稱讚。"],["p","不在，我，有沒有，被看見。"],["p","在，那一位，稱我，「貴族的女兒」的人。"],["p","今天，請你，做一件事。找一個，你，愛的人。"],["p","對他，說，一句，不是，評價，而是，滋養的話。"],["p","「你在，我很歡喜。」然後，問自己："],["p","我的關係，是，哪一種，戀慕？"],["p","我們，一起，禱告。"],["p","親愛的主，謝謝祢，稱我們，為，王的兒女。"],["p","我們，曾經，被，使喚，被，曬黑，被，輕看。"],["p","謝謝祢，用，愛，抬高我們。"],["p","求祢，醫治，我們的關係，使，我們的戀慕，不再是，控制，與，佔有，而是，珍愛。"],["p","求祢，叫，我們的話語，滋養，人，不是，羞辱人。"],["p","求祢，叫，我們的愛，走進，日常，走進，田野，走進，每天的，早晨。"],["p","一切榮耀，都歸給耶穌。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"8":{"min":13,"blocks":[["h","《印記》"],["p","古時候，一個人，要在一份，重要的文件上，表明，這是我的。"],["p","他，不是，簽名。他，是，蓋印。"],["p","一枚，小小的印章，戴在，頸上，或者，指上。"],["p","印，一蓋，就是，我的。"],["p","今天，這一章，是，雅歌的最後一章。"],["p","也是，整首歌，最高的，地方。弟兄姊妹平安。"],["p","我們，分，三個，部分，來讀。"],["p","第一個部分，是，一個，很樸素的，願望。"],["q","「巴不得你像我的兄弟，像吃我母親奶的兄弟；我在外頭遇見你就與你親嘴，誰也不輕看我。」"],["p","她說：巴不得，你像我的兄弟。為甚麼？"],["p","因為，兄弟之間，在街上，親吻，沒有人，閒話。"],["p","可是，愛人之間，就不一樣。"],["p","她說：我在外頭，遇見你，就與你，親嘴。"],["p","誰也，不輕看我。注意，最後一句：誰也，不輕看我。"],["p","你還記得，第一章，她說了甚麼嗎？"],["p","「不要因日頭，把我曬黑了，就輕看我。」"],["p","整卷，開頭，與，結尾，都有，同一個，擔心："],["p","不要，輕看我。她，一直，想要，一件事："],["p","愛，能夠，在光中，被承認。不是，躲躲藏藏。"],["p","不是，被人，看輕。"],["p","這個願望，也許，透露了，一個，處境。"],["p","她們的愛，在，公開的，場合，也許，還不被，接納。"],["p","我們，不太，知道，原因。經文，沒有說清楚。"],["p","我們，不需要，用今天的，眼光，去，評斷。"],["p","我們，只要，聽出，她心裡，那份，渴望："],["p","我的愛，能夠，在光中。今天，也有很多，這樣的人。"],["p","他們的愛，在，某些，場合，不被，看見。"],["p","也許，是，單身的，朋友，被，一再地，追問。"],["p","也許，是，一對，在教會裡，不被祝福的，人。"],["p","也許，是，一段，不得不，隱藏的，關係。"],["p","聖經，在這裡，沒有，給我們，一個，答案。"],["p","可是，它給了，一個，同理的，耳朵。"],["p","愛，渴望，在，光中。"],["p","接著，她，說了，兩件，很溫柔的事。"],["q","「我必引導你，領你進我母親的家；我可以領受教訓，也就使你喝石榴汁釀的香酒。」"],["p","她，要把他，領進，母親的家。"],["p","這，又，回到了，第三章。她的母親，在。"],["p","她，願意，領受，教訓。這是，一個，成熟的，愛："],["p","願意，被教導。願意，在，家中，被，祝福。"],["p","然後，第四節，那句，副歌，第三次，出現。"],["q","「耶路撒冷的眾女子啊，我囑咐你們：不要驚動、不要叫醒我所親愛的，等他自己情願。」"],["p","你有沒有，發現？"],["p","這一次，副歌，變短了。"],["p","第二章，與，第三章，都有，「我指著羚羊，或田野的母鹿，囑咐你們」。"],["p","這一次，沒有。沒有，羚羊，沒有，母鹿。"],["p","只有，「我囑咐你們」。"],["p","愛，越走到後面，越不需要，加重語氣。"],["p","因為，她，已經，知道，愛，是，等的。"],["p","然後，第五節。"],["q","「那靠著良人從曠野上來的是誰呢？我在蘋果樹下叫醒你。」"],["p","這是，全卷，第三個，「那是誰呢」。"],["p","第一次，在第三章，問的，是，一個，香氣的，行列。"],["p","第二次，在第六章，問的，是，她，像晨光。"],["p","這一次，問的是："],["p","那「靠著良人」，從曠野上來的，是誰？"],["p","你看，這一次，她，不是，一個人。"],["p","她，是，靠著，他。上來。從曠野。"],["p","你還記得，第一章，她，是，一個，人，在問：你在哪裡？"],["p","現在，她，靠著他，走出曠野。"],["p","整卷雅歌，是，一個，從，「你在哪裡」，到「靠著你」的，旅程。"],["p","這個畫面，很安靜。也很，有力。"],["p","不再，是，一個人，在夜裡，尋找。"],["p","是，兩個人，靠著，走出，曠野。"],["p","這，也是，很多，信徒，一生的，旅程。"],["p","從，一個人，在曠野裡，問「主啊，祢在哪裡」。"],["p","到，靠著祂，走出來。你，也許，還在，曠野裡。"],["p","你，也許，還在，問：你在哪裡？"],["p","我要告訴你：這個問題，雅歌，放在，第一章。"],["p","而，靠著他，上來的畫面，放在，第八章。"],["p","旅程，是，很長的。"],["p","可是，有一天，你會，是，靠著祂，上來的那一位。"],["p","現在，我們，進入，這一章，最重要的，兩節。"],["q","「求你將我放在你心上如 說：我想，聽你的聲音。"],["p","愛，就是，想，聽，對方的聲音。"],["p","而最後一節，是，她。"],["q","「我的良人哪，求你快來！如羚羊或小鹿在香草山上。」"],["p","快來。這是，整首歌，最後，一句話。"],["p","不是，「完結」。不是，「我們，永遠，在一起了」。"],["p","是，「求你快來」。愛，在這首歌裡，沒有，被說完。"],["p","它，還在，趕路。"],["p","你還記得，第二章，最後，她說：「求你等到天起涼風、日影飛去的時候，你要轉回。」"],["p","那時，是，等他，轉回。現在，是，求，他，快來。"],["p","一個，等，一個，求。愛，從，等待，走向，呼求。"],["p","弟兄姊妹，這，也是，整本，聖經的，結尾。"],["p","啟示錄，最後，一章，最後，一句，是，教會，說：主耶穌啊，我願你來。"],["p","一首，愛，的，歌，從，「願他親我」，到，「求你快來」。"],["p","一個，渴慕的，開始，與，渴慕的，結尾。"],["p","這使我們想起，新約，說到，夫妻，的奧秘時，說：這是極大的奧秘，我是指著基督與教會說的。"],["p","以弗所書，五章，三十二節。"],["p","這是，新約，自己，作的，連結。"],["p","所以，歷代，許多，教會，也，從，雅歌，聽見，神，與，祂的，百姓，的愛。"],["p","我們，不勉強，把，每一句話，翻成，屬靈的，代號。"],["p","可是，我們，可以，在，這首歌的，最後，說："],["p","是的，主啊，求祢，快來。我們來，收一收。"],["p","這一章，有三個，部分。"],["p","第一，愛，想要，在光中，被承認；而，旅程的，終點，是，靠著他，從曠野上來。"],["p","第二，愛，如死，堅強，眾水，不能，熄滅，財寶，買不到；而，它，絕不是，控制的，理由。"],["p","第三，被保護的人，可以，自己，說：我是牆；整首歌，以，一句，呼求，結束：快來。"],["p","現在，我們，把，整卷，雅歌，放進，321。"],["p","耶穌，是我們的榜樣。"],["p","祂，把，我們，放在，祂的，心上，如印記。"],["p","祂的，手上，有，釘痕。"],["p","先知以賽亞，說：我將你，銘刻在，我掌上。"],["p","這，是祂，愛，我們的，記號。"],["p","你，不需要，擔心，你，會被，祂，忘記。"],["p","聖經，是我們的準則。"],["p","整本，聖經，說：愛，是，神的，本性。"],["p","愛，不是，控制。愛，不是，買賣。愛，不是，傷害。"],["p","愛，是，自由裡，的，委身。聖靈，是我們的引導。"],["p","聖靈，是，把，神的愛，澆灌，在我們，心裡的，那位。"],["p","祂，也，是，把，我們，封印的，那位。"],["p","讓耶穌，作王。讓祂，作，你，心上的，印記。"],["p","不是，你，掌控，祂。是，祂，在，你，心上，作王。"],["p","讓耶穌，得著，一切的，榮耀。"],["p","因為，愛，的，烈焰，是，耶和華的，烈焰。"],["p","愛，從祂，來。所以，榮耀，歸給祂。"],["p","建立，屬神的，體系。"],["p","一個，屬神的，體系，是，一個，愛，被，保護，被，尊重，被，自由地，給出的，地方。"],["p","有，牆，有，門，有，銀塔，也有，香柏木板。"],["p","有，哥哥們，肯，問：我們，怎麼，保護？"],["p","有，小妹妹，可以，說：我是牆。"],["p","今天，請你，做，三件事。"],["p","第一，對，你愛的人，說：你，在，我心上。"],["p","第二，檢查，你的關係，有沒有，把，控制，當作，愛。"],["p","第三，對，主，說：我願祢，來。求祢，快來。"],["p","我們，一起，禱告。"],["p","親愛的主，謝謝祢，把，我們，放在，祢的，心上，如印記，帶在，祢的，臂上，如戳記。"],["p","謝謝祢，的愛，如死，堅強，大水，不能，淹沒。"],["p","求祢，保守，我們，不用，愛的名義，控制，別人，不用，財寶，買，關係。"],["p","求祢，叫，我們的，教會，成為，保護，孩子，與，弱者的，牆，與，門。"],["p","求祢，使，我們，每一個人，都能，自己，說：我，是，祢的。"],["p","主耶穌啊，我們，願祢，快來。"],["p","一切榮耀，都歸給耶穌。"],["p","奉主耶穌基督的名禱告，阿們。"]]}},"issues":[{"id":"ISS00_1","t":"全卷立場一：字面讀與寓言讀","r":"全卷","ch":[1,2,4,5,7,8],"why":"雅歌要怎麼讀，是整本書最大的分水嶺：把它當成一對男女的愛情詩，還是神與祂百姓、基督與教會的寓言？不同的讀法，會讓每一章講出不同的東西。","pos":[["【一】經文問的是甚麼","","<p>全卷第一句是：「所羅門的歌，是歌中的雅歌」（1:1）。全卷沒有一處明說「這是比喻」，也沒有一處明說「這只是字面」。</p><p>問題是：<strong>我們該先聽字面的情詩，還是先聽屬靈的寓意？兩者能同時成立嗎？</strong></p>"],["字面讀","","<p>這一派把它讀為婚戀情詩，認為經文本身沒有要求讀者另找意思。這個讀法尊重人的愛情、身體與婚姻是被造的美好。</p><p><strong>難處：</strong>容易讓人忽略歷代教會在其中讀出的屬靈亮光。</p>"],["寓言讀","","<p>這一派把全卷讀為神與以色列、基督與教會，或基督與個別信徒的愛，這是歷代教會長期的讀法。</p><p><strong>難處：</strong>每句話都要找對應，容易離開經文，也容易繞過真人的聲音。</p>"],["兩者並用","","<p>這一派說：字面是真實的愛，也是神所設立的婚姻的美；而新約曾用婚姻的圖畫說基督與教會，所以可以讓人問：這樣的愛也在說神的愛嗎？</p><p><strong>難處：</strong>界線要由講的人自己拿捏，並向會眾說明。</p>"],["【三】本講義站在哪裡","","<p><strong>先聽字面，再問屬靈；新約自己作過的連結才引用，其餘只說「這使我們想起」。</strong>本講義不用寓言取代字面，也不用字面否認基督與教會的愛。這樣讀，單身者、已婚者、受過傷的人，都能在其中聽見被愛；也不把經文當成 321 的插圖，而是讓經文自己說完，321 才在末端接上去。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。讀法不同，不影響福音；重要的是我們有沒有好好聽。</p>"]],"con":[],"say":"本講義的立場：先字面，後屬靈；新約作過的連結才引用；不以寓言取代字面。","care":"不要嘲笑任何一種讀法，也不要逼會眾選邊。先字面，是為了讓人先聽見真人的聲音。"},{"id":"ISS00_2","t":"全卷立場二：愛情與性的描寫","r":"全卷","ch":[1,4,5,7,8],"why":"雅歌有直接的愛情與身體描寫。教會要怎麼面對？不講，等於讓會眾自己在暗處摸索；講得露骨，又可能傷人。這一題訂下全卷的分寸。","pos":[["【一】經文問的是甚麼","","<p>全卷從開頭就有渴慕的話：「願他用口與我親嘴；因你的愛情比酒更美」（1:2）。中段有身體的讚美（4:1–7；7:1–9），結尾說：「愛情如死之堅強」（8:6）。</p><p>問題是：<strong>這些描寫要怎樣在教會中讀、講、教？</strong></p>"],["坦然面對","","<p>這一派主張：神把愛與性放在婚姻裡是美好的，教會應該坦然講，不要讓人在羞恥中獨自摸索。</p><p><strong>難處：</strong>要有分寸，不要渲染，也不要讓受傷的人更受傷。</p>"],["保守處理","","<p>這一派主張：公開場合只講屬靈的意義，細節留給個別輔導。</p><p><strong>難處：</strong>容易讓人以為這是不能說的話。</p>"],["分場合","","<p>這一派主張：依場合調整——大會堂、小組、夫妻營，各有不同的分寸。</p><p><strong>難處：</strong>分寸要由帶領者自己判斷。</p>"],["【三】本講義站在哪裡","","<p><strong>分場合、有分寸；不渲染、不羞辱，也不迴避。</strong>本講義全卷的原則：不逐句解釋身體，不拿它評論外貌，不羞辱渴望。對性的傷害、羞愧、失落，永遠先陪伴、不追問。這也是 321 的次序：先生命，再關係，後事工。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經能把愛寫出來，你不必為渴望感到羞恥。</p>"]],"con":[],"say":"本講義的立場：分場合、有分寸；不渲染、不羞辱；傷害優先陪伴。","care":"凡涉及性傷害、受虐、失去的人，一律：不追問細節、不要求原諒、不對流淚的人說「你要有信心」、會後單獨關心、必要時協助尋求專業協助。"},{"id":"ISS00_3","t":"全卷立場三：女子是誰？作者是誰？","r":"全卷","ch":[1,3,6,8],"why":"雅歌裡有女子、良人與所羅門三個名字。他們是同一個人，還是不同的人？全卷是一個故事，還是一本詩集？讀法不同，讀出來的味道也不同。","pos":[["【一】經文問的是甚麼","","<p>開頭的標題是：「所羅門的歌，是歌中的雅歌」（1:1）。原文的「屬」可以有「所羅門所作」「獻給所羅門」「關於所羅門」等讀法。</p><p>問題是：<strong>三個人是一個還是兩個？全卷是一個連續的故事，還是一組情詩？</strong></p>"],["所羅門與女子","","<p>這一派讀為：良人就是所羅門，女子是他的新婦，全卷是一對王與新婦的愛。</p><p><strong>難處：</strong>有些段落（如 1:6、8:11–12）把所羅門與良人區分開來。</p>"],["三角讀法","","<p>這一派讀為：女子、所羅門、牧人是三個人；女子愛的是牧人，不為王的豪華所動。</p><p><strong>難處：</strong>經文沒有明說有三個人，這是推測。</p>"],["詩集說","","<p>這一派說：雅歌是一組愛情詩的合集，不必是一個單一的故事。</p><p><strong>難處：</strong>全卷有相當的結構與呼應，不完全像隨機的合集。</p>"],["【三】本講義站在哪裡","","<p><strong>不替它定論；讀為一首愛的歌，不依賴任何一種身分的推測。</strong>本講義不用單一的人物關係去詮釋全卷。我們把重心放在愛本身，不放在「誰是誰」。這樣，無論讀法如何，信息都站得住：愛是被造的美好，是神所賜。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不知道每個角色是誰，不影響你聽見愛。</p>"]],"con":[],"say":"本講義的立場：三說並陳，不替它定論；重心在愛，不在身分。","care":"不要因讀法不同而論斷他人；也不要把人物關係講成「標準答案」。"},{"id":"ISS00_4","t":"全卷立場四：單身與婚姻的處境","r":"全卷","ch":[2,3,4,8],"why":"雅歌是一首關於愛與婚姻的歌，但會眾裡有單身的、離婚的、喪偶的、不孕的、在關係裡受傷的人。這卷書要怎麼對他們說話？","pos":[["【一】經文問的是甚麼","","<p>全卷有一句話出現了三次：「不要驚動、不要叫醒我所親愛的，等他自己情願」（2:7）。她也說：「我妹子，我新婦，乃是關鎖的園，禁閉的井，封閉的泉源」（4:12）。</p><p>問題是：<strong>對沒有伴侶的人，這卷書說什麼？對受過傷的人又說什麼？</strong></p>"],["婚姻的詩","","<p>這一派主張：雅歌就是婚姻的詩，單身者可以讀，但主要是為夫妻預備。</p><p><strong>難處：</strong>這個讀法容易讓單身者覺得被排除。</p>"],["愛的整體","","<p>這一派主張：雅歌談的是人對愛的渴望與等待；單身者也在其中，因為渴望與等待是人人的。</p><p><strong>難處：</strong>要小心不要把單身講成「過渡階段」。</p>"],["對神的愛","","<p>這一派主張：全卷也可以作為人對神的渴慕來讀，單身與已婚者同樣適用。</p><p><strong>難處：</strong>這是引伸，要先聽字面。</p>"],["【三】本講義站在哪裡","","<p><strong>對單身者，聽見的是被愛與等待的尊嚴；對受傷者，聽見的是不被羞辱。</strong>本講義不把單身講成缺乏，不把婚姻講成目標，也不用它催促任何人結婚。無論處境如何，被愛不靠身分，而是神先愛我們。這是 321 的看見：焦點在耶穌，不在自己的狀態。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的處境不改變你被愛。</p>"]],"con":[],"say":"本講義的立場：單身與婚姻同樣被看重；不催促、不羞辱；焦點在耶穌。","care":"單身、離婚、喪偶、不孕、受過傷的人聽這卷書，可能感受不同。不追問細節；不說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"「我雖然黑，卻是秀美」是在評價膚色嗎？","r":"1:5--6","ch":[1],"why":"一、1:5–6「我雖然黑，卻是秀美」與「日頭把我曬黑了」——「我雖然黑，卻是秀美」是在評價膚色嗎？。讀到 1:5–6，常有人問：這個「黑」是膚色、是族群，還是日曬？這句話曾被人拿去稱讚某種膚色，也曾被拿去貶低另一種。這一題要回到經文自己給的原因，不拿它評價任何人的皮膚。","pos":[["【一】經文問的是甚麼","","<p>經文自己交代了三件事。她說自己「黑」，同一句裡緊接著說「秀美」：「我雖然黑，卻是秀美」（1:5）。原因她也講了：「不要因日頭把我曬黑了就輕看我」（1:6）。背景是家裡的事：「我同母的弟兄向我發怒，他們使我看守葡萄園」（1:6）。</p><p>問題是：<strong>這個「黑」要讀成她天生的膚色，還是日曬與勞動的結果？這句話有沒有高低膚色的意思？</strong></p>"],["處境讀法","","<p>這一派照她自己給的原因讀：弟兄叫她出去看守葡萄園，在日頭下勞動，皮膚被曬黑，所以有人輕看她。她說「不要輕看我」，是替自己的價值開口。「基達的帳棚」是黑色羊毛織成，「所羅門的幔子」是王宮的華美，兩個比喻一暗一亮，並排在一個人身上。</p><p><strong>難處：</strong>經文只說日頭曬黑，沒有說她原本膚色如何，也沒有交代她被曬了多久；讀者不必也不能從這裡推出她的族裔。</p>"],["膚色或族群讀法","","<p>有人認為她是膚色較深的女子，或有外族背景。這種讀法常從 7:1 的「王女」、6:13 的「書拉密女」去推她是誰。</p><p><strong>難處：</strong>這兩個稱呼本身就有爭議（見議題「書拉密女是誰」）；經文自己說的原因是日曬，把重點移到天生膚色，需要經文以外的推測。</p>"],["寓意讀法","","<p>歷代有解經家把「黑」讀成罪或卑微，「秀美」讀成蒙恩得潔淨之後的樣子，並用它說教會或信徒的光景。</p><p><strong>難處：</strong>這樣讀要先替經文加上「黑＝罪」的對照，經文沒有這樣寫；而且「雖然……卻是」是同時成立，不是先黑後白。</p>"],["【三】本講義站在哪裡","","<p><strong>照經文自己給的原因讀：日頭曬黑、弟兄發怒、被使喚去看守別人的葡萄園。</strong>本講義不用這句話評價任何膚色或族群，也不把「黑」解成罪。這句話的重心是：我的外表被人輕看，我的價值並沒有因此少一分。這與 321 的看見相通：人的眼光不是最後的眼光，被耶穌看見的人，不必靠別人的評價活。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一題不是在動搖經文，而是在防止經文被拿去傷人。你可以安心地說：這一句，聖經是替被輕看的人說的。</p>"]],"con":[],"say":"本講義的立場：照經文自己給的原因讀——日頭曬黑、弟兄發怒；不用這句話評價任何膚色或族群。","care":"被人輕看外貌、被家人使喚的人，可以先說「這是真的」，不必先把傷說得漂亮；她說「不要輕看我」，是聖經替被輕看的人說的話。被人輕看外貌、被家人使喚的人，可以先說「這是真的」，不必先把傷說得漂亮；她說「不要輕看我」，是聖經替被輕看的人說的話。帶領的人不要點名誰「像她」，也不要要求受傷的人立刻說「我已經釋懷」。"},{"id":"ISS01_2","t":"「願他親我」的渴慕，是正當的嗎？","r":"1:2--4","ch":[1],"why":"二、1:2–4「願他用口與我親嘴」與「願你吸引我」——「願他親我」的渴慕，是正當的嗎？。全卷第一句話就是渴望：「願他用口與我親嘴」。信徒聽見會不自在：這種話可以進到聖經嗎？可以拿來講道嗎？這一題要分辨的是：渴慕本身，與渴慕被誤用，是兩件事。","pos":[["【一】經文問的是甚麼","","<p>開卷的人聲是女子的，沒有鋪墊，直接說出渴望：「願他用口與我親嘴；因你的愛情比酒更美」（1:2）。接著說出香氣、名字，以及眾童女的愛慕（「你的名如同倒出來的香膏」（1:3））。</p><p>問題是：<strong>這樣的渴慕在聖經裡站得住嗎？它是在鼓勵情慾，還是在說被造的人有正當的渴望？</strong></p>"],["正當渴慕讀法","","<p>這一派認為，雅歌把愛情的渴望放進聖經，正是在說：神造人有這樣的渴望，這渴望本身是好的。女子先開口，也沒有被責備。全卷也沒有任何一句話說她的渴慕是羞恥。</p><p><strong>難處：</strong>這一派要小心的是：「正當」不等於「任何對象、任何時間都可以」；全卷自己有界線（見 2:7、4:12、8:4）。</p>"],["情慾警戒讀法","","<p>有人擔心，在教會裡讀這樣的經文，容易挑動情慾，所以主張只講屬靈意義，或不在公開場合細講。</p><p><strong>難處：</strong>這個擔心是真實的，尤其在有未婚、受過傷的會眾的場合；但整段略過，會讓人以為渴望是不能說出口的，反而讓人在暗處獨自處理。</p>"],["先聽字面再讀屬靈","","<p>這一派主張先讓字面的情詩發聲，聽見一個真人的渴慕；再讓人問：我們對神的渴慕，也能這樣直接嗎？詩篇也有渴想神的話，不必借用雅歌。</p><p><strong>難處：</strong>難處在於次序：若先翻成屬靈，會繞過真人的聲音；若永遠只停在字面，又看不見全卷在新約裡被用來說基督與教會的線索。</p>"],["【三】本講義站在哪裡","","<p><strong>渴慕是正當的，但要看渴慕指向誰、在哪裡得到滿足。</strong>本講義先讓字面發聲，不渲染身體，也不羞辱渴望。對信徒而言，承認「我渴」不是不夠屬靈；耶穌自己也說過人會渴。321 說的「無己」不是沒有渴望，而是把渴望交給耶穌，讓祂作王。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。渴望被寫進聖經，說明神不怕人的渴望；要小心的，是把渴望交給誰、在什麼界線裡。</p>"]],"con":[],"say":"本講義的立場：渴慕是正當的，重點是「願」——被吸引，然後才快跑；不急著把它翻成別的東西，也不挑動情慾。","care":"承認「我渴」不是不夠屬靈；信徒不必假裝已經被填滿。講的時候，不渲染身體，也不羞辱渴望。承認「我渴」不是不夠屬靈；信徒不必假裝已經被填滿。講的時候不渲染身體，也不羞辱渴望；單身的、受過傷的、剛失去伴侶的人，聽完應該是更被理解，而不是更羞愧。"},{"id":"ISS01_3","t":"要不要急著把每句話翻成屬靈的代號？","r":"1:4、1:15","ch":[1],"why":"三、1:4、1:15 的稱呼與讚美，字面讀與寓言讀——要不要急著把每句話翻成屬靈的代號？。「王帶我進了內室」「你的眼好像鴿子眼」——這些話要不要立刻翻成「基督與教會」？歷代教會有很深的寓言讀法傳統，也有不少人只讀字面。一邊講得太快，會繞過真人；一邊講得太死，會看不見全卷在教會裡的位置。","pos":[["【一】經文問的是甚麼","","<p>1:4 說：「王帶我進了內室，我們必因你歡喜快樂」（1:4）；1:15 說：「我的佳偶，你甚美麗！你甚美麗！你的眼好像鴿子眼」（1:15）。這些語言屬於一對愛人。</p><p>問題是：<strong>讀者要先把它們當成「一對人的話」，還是先把它們翻成屬靈的意思？</strong></p>"],["字面讀","","<p>這一派先讀一對男女的婚戀情詩，認為經文本身沒有任何一句話說「這是比喻」；要把它當成別的意思，需要經文以外的鑰匙。</p><p><strong>難處：</strong>全卷放在聖經裡，歷代敬虔的人也在其中讀出神與祂百姓的愛；完全不理這條線，也會失去一些東西。</p>"],["寓言讀","","<p>這一派把整卷讀為神與以色列、基督與教會，或基督與個別信徒的愛，認為雅歌被收入正典，就是為了這個。歷代教會有不少人這樣讀。</p><p><strong>難處：</strong>寓言一旦主導，每句話都要找對應物，常常是解經者的想像，而且容易讓人忽略真人的聲音與處境。</p>"],["兩者並用","","<p>這一派說：先聽字面，字面是真的；然後在新約自己作過的連結裡（例如弗 5:32 用婚姻說基督與教會），讓人問：這樣的愛也在說神的愛嗎？</p><p><strong>難處：</strong>兩者的界線要自己負責拿捏；講的人若不說明，會眾會以為字面就是屬靈代號。</p>"],["【三】本講義站在哪裡","","<p><strong>先聽字面，再讀屬靈；不急著翻譯。</strong>本講義不以寓言取代字面，也不以字面否認基督與教會的愛；新約自己作過的連結才引用，其餘只說「這使我們想起」，不說「這是預表」。這樣讀，單身者、受傷者、還沒準備好的人，都不會覺得被繞過。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。讀法不同，不影響福音；影響的是我們有沒有好好聽見經文。</p>"]],"con":[],"say":"本講義的立場：先聽字面的情詩；新約自己作過的連結才引用，其餘說「使我們想起」，不說「這是預表」。","care":"不急著翻譯，是為了讓人先聽見真人的聲音；翻太快，會讓單身者、受傷者、還沒準備好的人覺得被繞過。不急著翻譯，是為了讓人先聽見真人的聲音；翻太快，會讓單身者、受傷者、還沒準備好的人覺得被繞過。帶領的人不要嘲笑任何一種讀法，也不要逼會眾選邊。"},{"id":"ISS02_1","t":"「等他自己情願」在說什麼？","r":"2:7","ch":[2],"why":"一、2:7「不要驚動、不要叫醒我所親愛的，等他自己情願」——「等他自己情願」在說什麼？。2:7 把一句警告重複了三次（2:7；3:5；8:4）：「不要驚動、不要叫醒我所親愛的，等他自己情願」（2:7）。和合本旁註還有另一種譯法。這句話在今天常被引用，也常被誤用。","pos":[["【一】經文問的是甚麼","","<p>經文寫的是女子對耶路撒冷眾女子的囑咐，用的是田野的羚羊與母鹿起誓（「我指著羚羊或田野的母鹿囑咐你們」（2:7））。和合本旁註說另一種譯法是「不要激動愛情，等它自發」。</p><p>問題是：<strong>要等的是「他」自己情願，還是愛情「自己」發動？這句話在今天可以怎麼用？</strong></p>"],["等他情願","","<p>這一派照和合本主文讀：不要驚動所愛的人，要等他自己情願。重點是對人的尊重，不強迫、不催促。</p><p><strong>難處：</strong>這個讀法要小心，不要變成「等」的壓力，或要求被愛的一方一定要回應。</p>"],["等它自發","","<p>和合本旁註的讀法：不要激動愛情，等它自己發動。照這個讀法，愛情是一件不能被催出來的事。</p><p><strong>難處：</strong>兩種讀法在原文裡都說得通，不能以一方去反對另一方。</p>"],["兩種讀法相通","","<p>這一派認為兩種讀法其實殊途同歸：愛不是被逼出來的，也不是被騙出來的。</p><p><strong>難處：</strong>相通是一個整合的讀法，細節上仍要承認原文的歧義。</p>"],["【三】本講義站在哪裡","","<p><strong>這句話保護的是「說不」的權利，不是「等了就必得」的保證。</strong>本講義不用它要求任何人在壓力下回應，也不用它叫被傷害的人沉默或等待，更不用它保證「等的人最後一定會有」。愛要在自由中才算愛——這是整卷的底線。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩種譯法都在說同一個底線：愛不可以被逼。</p>"]],"con":[],"say":"本講義的立場：這句副歌是關於同意與等候的話：愛只在自由裡才是愛。","care":"不要用它要求任何人在壓力下回應，也不可用它要求被傷害的人沉默或等待；它保護的是「說不」的權利。不要用它要求任何人在壓力下回應，也不可用它要求被傷害的人沉默或等待；它保護的是「說不」的權利。也不要對單身的人說「等就會有」。"},{"id":"ISS02_2","t":"「以愛為旗」的旗是什麼？","r":"2:4","ch":[2],"why":"二、2:4「他帶我入筵宴所，以愛為旗在我以上」——「以愛為旗」的旗是什麼？。「他帶我入筵宴所，以愛為旗在我以上」是全卷最常被掛在牆上的一句。「旗」是什麼？是軍旗，是宴席的標示，還是別的意思？","pos":[["【一】經文問的是甚麼","","<p>經文是：「他帶我入筵宴所，以愛為旗在我以上」（2:4）。「旗」（דֶּגֶל）在聖經裡常指軍隊的旗幟（如民數記裡各支派的營旗）；「筵宴所」直譯是「酒的房屋」。</p><p>問題是：<strong>這面旗在說什麼——是宣告、是保護，還是邀請？</strong></p>"],["軍旗讀法","","<p>這一派照「旗」的一般用法讀：旗是軍隊在營中的標誌，宣告「這裡是誰的」。「以愛為旗在我以上」就是：他在眾人面前宣告，我是被愛的。</p><p><strong>難處：</strong>「旗」在這裡沒有任何戰爭的上下文，把它讀成軍旗，是從別處借來的意思。</p>"],["筵宴標示讀法","","<p>這一派認為，旗是宴席的標示——筵宴所裡升起的旗，說明這場宴席的主人與主題是愛。</p><p><strong>難處：</strong>這個讀法比較貼近上下文，但「旗」是否有這個用法，要承認證據不多。</p>"],["寓意讀法","","<p>有人把這句讀為基督在祂的教會之上的覆庇與宣告，並常用在崇拜與詩歌裡。</p><p><strong>難處：</strong>寓意可以安慰人，但要先讓字面的意思站穩，再說「這使我們想起」，不宜說「這就是」。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為被愛的人頭上有一面愛的標示：愛在先，愛在上。</strong>本講義先讀字面，也承認「旗」的確切意思並沒有定論。可以安心說的是：愛是先到的，不是賺來的——這與 321 的「耶穌是我的榜樣」「讓耶穌作王」並不衝突，因為王的旗是愛。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。旗的細節不影響你被愛這件事。</p>"]],"con":[],"say":"本講義的立場：取「歸屬與保護」之意，字面詩意優先；它也與 6:4、6:10 的旌旗同字根，可對照。","care":"被愛的人頭上有一面旗；沒有被這樣覆庇過的人，聽見這句話時可能是痛的，帶領者要留空間。被愛的人頭上有一面旗；沒有被這樣覆庇過的人，聽見這句話時可能是痛的，帶領者要留空間，不要追問「你有沒有被愛過」。"},{"id":"ISS02_3","t":"「小狐狸」是誰說的？指什麼？","r":"2:15","ch":[2],"why":"三、2:15「要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸」——「小狐狸」是誰說的？指什麼？。2:15 突然插進一句：「要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸」。誰在說？要擒拿什麼？今天常被用來講「小罪毀壞婚姻」，但經文有這樣說嗎？","pos":[["【一】經文問的是甚麼","","<p>經文是：「要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸，因為我們的葡萄正在開花」（2:15）。前後是良人邀請她出來（2:10–14），後面是她的回應（2:16）。</p><p>問題是：<strong>這句話是誰說的？「小狐狸」指什麼？</strong></p>"],["說話者","","<p>有人讀為良人說，有人讀為女子說，也有人讀為眾人的歌或一首古老的歌謠；原文沒有標明說話者。</p><p><strong>難處：</strong>說話者不同，意思略有不同；經文沒有給足夠的線索去決定。</p>"],["日常小事","","<p>這一派認為這是田園生活的實事：小狐狸會咬壞開花的葡萄，所以要趁早處理。它說的是兩個人在春天的關係，要保護正在開花的愛。</p><p><strong>難處：</strong>字面的意思很清楚，但為什麼放在這個地方，仍然只能推測。</p>"],["外來干擾與小罪","","<p>這一派認為「小狐狸」是愛情之外的小干擾，也有人把它讀為信徒生活中的小罪，並由此教導要及早處理。</p><p><strong>難處：</strong>這是引伸，不是經文自己說的；要小心不要把它講成「抓人小辮子」。</p>"],["【三】本講義站在哪裡","","<p><strong>先讀為保護正在開花的愛；引申到小事，要溫柔。</strong>本講義不把「小狐狸」講成點名會眾犯什麼罪，目的是一起及早處理，不是指責。若要應用，問的是：什麼小事正在咬壞我正在開花的關係？先問自己，不問別人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。小狐狸的細節不影響經文要說的：趁早保護。</p>"]],"con":[],"say":"本講義的立場：不爭論說話者；重點是「我們的」葡萄園、花開的時候就一起處理小事。","care":"不要把「小狐狸」講成點名會眾犯什麼罪；目的是一起早處理，不是指責。不要把「小狐狸」講成點名會眾犯什麼罪；目的是一起及早處理，不是指責。特別不要在公開場合指認某個人的「小狐狸」。"},{"id":"ISS03_1","t":"夜裡的尋找是真實事件，還是夢境？","r":"3:1--4","ch":[3],"why":"一、3:1–4 夜裡尋找、遇見看守人、找到所愛的——夜裡的尋找是真實事件，還是夢境？。3:1–4 寫女子夜裡尋找所愛的，在城中遇見看守的人。這是一次真實的夜行，是夢，還是詩人的筆法？答案不同，講法就不同。","pos":[["【一】經文問的是甚麼","","<p>經文寫得很具體：「我夜間躺臥在床上，尋找我心所愛的；我尋找他，卻尋不見」（3:1）。她起來遊行城中，遇見巡邏的人，問了一句，然後「我剛離開他們就遇見我心所愛的」（3:4）。</p><p>問題是：<strong>這段是真實發生的事，還是夢境、想像？這個差別影響應用嗎？</strong></p>"],["真實事件","","<p>這一派把它讀為一件真的事：一個女子在婚前夜裡出門找人。</p><p><strong>難處：</strong>經文沒有說這是醒著發生的；讀成「年輕女子半夜獨自上街」，容易被拿去鼓勵冒險，或指責她不守規矩。</p>"],["夢境或幻想","","<p>這一派認為「在床上」開頭，像是夢或幻想，詩的場景不必是日常事件。</p><p><strong>難處：</strong>經文沒有「我夢見」這類字眼；說它是夢，是讀者的判斷。</p>"],["詩的修辭","","<p>這一派認為不必分真假，這是用夜、尋找、遇見，寫愛裡「想見而見不著」的經驗。</p><p><strong>難處：</strong>這個讀法最安全，但可能略過經文要的具體畫面。</p>"],["【三】本講義站在哪裡","","<p><strong>不替它定真假，照詩的功能讀：渴慕、尋找、遇見。</strong>本講義不把它講成教導人夜裡獨自出門，也不用它指責任何人。要帶走的是：尋找的人，遇見的時候會把握。321 的應用是：先尋找耶穌，再談其他關係。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。是夢是真，不改變經文要說的：渴慕會促使人去尋找。</p>"]],"con":[],"say":"本講義的立場：不為爭論真假而離開經文；無論哪一種讀法，「找不到」都被如實記下。","care":"找不到的人被鼓勵，不被責備；不要把「找不到」講成信心不夠，詩篇裡也有人在夜裡呼求。不要把它講成鼓勵或指責任何人的行為；也不要用「夜裡出門」去評論女子。若有人曾在夜裡遭遇危險，聽到這段可能被觸動，帶領者不要追問經歷，會後單獨關心。"},{"id":"ISS03_2","t":"3:6–11 是誰的婚禮？","r":"3:6--11","ch":[3],"why":"二、3:6–11 曠野上來的行列與所羅門的轎——3:6–11 是誰的婚禮？。3:6–11 的所羅門轎隊是全卷最華麗的一幕。這是良人的婚禮，還是借所羅門來作對比？讀法不同，與 6:8、8:11 的所羅門形象也要連起來讀。","pos":[["【一】經文問的是甚麼","","<p>經文先問：「那從曠野上來、形狀如煙柱、以沒藥和乳香並商人各樣香粉薰的是誰呢」（3:6）。答案是「是所羅門的轎；四圍有六十個勇士」（3:7），結尾叫錫安的女子去看「頭戴冠冕，就是在他婚筵的日子」（3:11）。</p><p>問題是：<strong>這一幕裡的所羅門，是良人本人，還是用來對比良人的人？</strong></p>"],["所羅門的婚禮","","<p>這一派讀為良人就是所羅門，這是他迎娶女子的盛大場面。</p><p><strong>難處：</strong>全卷其他地方，女子的所愛常是牧人、田間的人，把兩者疊在一起要有解釋。</p>"],["所羅門為對比","","<p>這一派認為這是對比：所羅門有轎有兵，卻不如良人的愛；作者借王的排場，說真正的珍貴不在這裡。</p><p><strong>難處：</strong>經文並沒有說「不如」，這是從 8:11–12 反推的。</p>"],["象徵性的王","","<p>這一派讀為「王」是愛人的尊稱，婚禮是典型的華美場景，不必落在歷史的所羅門身上。</p><p><strong>難處：</strong>經文明說「所羅門」三次，要處理這個名字。</p>"],["【三】本講義站在哪裡","","<p><strong>三說並陳；不把所羅門的排場當成愛的標準。</strong>本講義承認讀法有分歧。可以確定的是：這一幕寫的是被迎娶的榮耀，不是財富的教導。與 321 相通的是：真正的王是耶穌，祂的榮耀不靠排場。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。是誰的婚禮，不影響經文頌讚婚姻的喜樂。</p>"]],"con":[],"say":"本講義的立場：只陳列，不爭論；讀這段時重點放在「裡面鋪的是愛」與「母親給他戴上」。","care":"婚禮的公開與祝福不可講成唯一的圓滿；單身、婚姻破裂、沒有被祝福的人，也在神的愛中。不要用這一幕比較誰的婚禮「配得上」；經濟拮据、沒有婚禮的人聽見華麗的描寫，可能感到被比較。"},{"id":"ISS03_3","t":"「我拉住他，不容他走」是愛還是控制？","r":"3:4","ch":[3],"why":"三、3:4「我拉住他，不容他走，領他入我母家」——「我拉住他，不容他走」是愛還是控制？。3:4 說：「我拉住他，不容他走」。這句話在婚姻輔導裡常被引用，也容易被誤用成「抓緊對方」。","pos":[["【一】經文問的是甚麼","","<p>經文是：「我拉住他，不容他走，領他入我母家，到懷我者的內室」（3:4）。這是在尋找很久之後，終於遇見的那一刻。</p><p>問題是：<strong>這是失而復得的喜悅，還是在鼓勵緊抓不放？</strong></p>"],["失而復得的愛","","<p>這一派讀為尋找之後的喜悅：找不到時的焦急，找到後不想再失去。</p><p><strong>難處：</strong>這個讀法要小心，不要變成對任何關係都「抓緊」的藉口。</p>"],["警惕控制","","<p>這一派提醒：「不容他走」若脫離上下文，可能被用來合理化占有與控制，尤其在關係不平等時。</p><p><strong>難處：</strong>這個警惕合理，但不能因此抹去經文中喜悅的語氣。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為失而復得的喜悅，並同時說明它不是控制的許可。</strong>本講義不用這句話要求任何人留在不健康的關係裡，也不用它對離開傷害的人加上罪名。愛要在自由中；這與 2:7「等他自己情願」並讀。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這句話描寫的是喜悅，不是對別人的要求。</p>"]],"con":[],"say":"本講義的立場：看抓住之後做了什麼——她把他領進光中、領回母家；愛是把人帶進光中，不是藏起來。","care":"愛與界線要分辨：控制是切斷對方的關係、監視、用怕；愛是帶進祝福，仍尊重自由。正在經歷控制或暴力的人，聽見「不容他走」可能被觸動。不要用這句話要求任何人留在傷害他的關係裡；必要時協助尋求專業協助，有危險時請聯絡當地的保護專線。"},{"id":"ISS04_1","t":"該怎麼讀身體的讚美？","r":"4:1--7","ch":[4],"why":"一、4:1–7 從頭到身體的比喻——該怎麼讀身體的讚美？。4:1–7 用眼、髮、齒、唇、頸、乳來讚美她。比喻都來自牧羊、農事與建築，今天讀來有些陌生，也容易被讀得露骨或被略過。","pos":[["【一】經文問的是甚麼","","<p>經文開頭說：「我的佳偶，你甚美麗！你甚美麗！你的眼在帕子內好像鴿子眼」（4:1）。結尾說：「我的佳偶，你全然美麗，毫無瑕疵」（4:7）。</p><p>問題是：<strong>這些比喻要逐項解釋，還是整體讀？它是在鼓勵怎樣看待身體？</strong></p>"],["逐項解釋","","<p>這一派解釋每個比喻：山羊群、母羊、石榴、象牙塔，都在說一個意象。</p><p><strong>難處：</strong>逐項加上屬靈對應，容易離開經文；逐項講身體，又容易變成露骨。</p>"],["整體語氣讀法","","<p>這一派說：重點不在每個比喻的精確對應，而在整體的語氣——讚美、尊重、完整的接納。</p><p><strong>難處：</strong>略過細節，也會失去一些古代世界的畫面。</p>"],["寓意讀法","","<p>有人把它讀為基督眼中的教會之美。</p><p><strong>難處：</strong>必須先處理字面，並說明新約是否有這樣的連結。</p>"],["【三】本講義站在哪裡","","<p><strong>整體語氣為主：這是讚美，不是挑逗，也不是羞辱。</strong>本講義不逐項評論身體，也不拿它比較外貌。讀完應該更接納被造的身體，而不是更焦慮外貌。這與 321 的看見相通：我們被神看為「全然美麗」，不是靠自己的好看。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。比喻的細節不影響整體的讚美。</p>"]],"con":[],"say":"本講義的立場：看整體語氣，不逐項解剖；這是私密的情話，不供評分、不供比較。","care":"講的人不要評論別人的身體，也不要叫會眾拿自己與誰比；聽完應該是更被珍愛，而不是更焦慮。對身體有傷、有羞愧的人，這段話可能刺痛。不要追問細節，不要拿它評論任何人的外貌；也不要對難過的人說「你要有信心」。"},{"id":"ISS04_2","t":"「關鎖的園」說的是什麼界限？","r":"4:12","ch":[4],"why":"二、4:12「關鎖的園，禁閉的井，封閉的泉源」——「關鎖的園」說的是什麼界限？。4:12「關鎖的園，禁閉的井，封住的泉源」常被用來教導婚前守貞，但經文本身說的是什麼？","pos":[["【一】經文問的是甚麼","","<p>經文是：「我妹子，我新婦，乃是關鎖的園，禁閉的井，封閉的泉源」（4:12）。這是良人對她說的話，語氣是讚美，不是命令。</p><p>問題是：<strong>這句話是在說婚前的守護，還是夫妻之間的專屬？</strong></p>"],["婚前的守護","","<p>這一派讀為：未婚時，她的園是關鎖的，直到良人進入。</p><p><strong>難處：</strong>「新婦」一詞指她已在婚約之中，不能單純讀成未婚。</p>"],["夫妻之間的專屬","","<p>這一派讀為：她把自己的園留給丈夫，不對別人開放。這是婚姻中的專一。</p><p><strong>難處：</strong>這個讀法比較貼近上下文，但仍需承認經文沒說「婚前」或「婚後」。</p>"],["寓意讀法","","<p>有人把園讀為信徒的生命，只向基督敞開。</p><p><strong>難處：</strong>寓意可以啟發，但不能取代字面的意思。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為專屬與守護：這個園是屬於彼此的，不是任何人都可以進入。</strong>本講義不把這句話用來羞辱曾有過傷害的人，也不把「守貞」講成「失去就沒價值」。這裡的重心是愛的專屬；對曾被傷害的人，先是接納，不是審判。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這句話是邀請人看重自己，不是定罪。</p>"]],"con":[],"say":"本講義的立場：講成福分而非壓抑；園有牆有鎖，因為珍貴；鑰匙在園主人手中，門由她自己打開。","care":"曾被闖入、被傷害的人，聽到「守住」可能二次受傷；要說：那不是你的錯，你的園仍然珍貴。曾被侵犯、曾失去的人聽到「關鎖的園」，可能想到自己。不要追問經歷，不要把「純潔」講成人的價值；會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS04_3","t":"從獅子與豹子的山上往下觀看，是指什麼？","r":"4:8","ch":[4],"why":"三、4:8「與我一同離開黎巴嫩……從有獅子的洞、有豹子的山往下觀看」——從獅子與豹子的山上往下觀看，是指什麼？。4:8 良人叫她「離開黎巴嫩」，從獅子的洞、豹子的山下來。這是真實的危險，還是詩的意象？","pos":[["【一】經文問的是甚麼","","<p>經文說：「我的新婦，求你與我一同離開黎巴嫩…從有獅子的洞，從有豹子的山往下觀看」（4:8）。</p><p>和合本在最後一句寫「往下觀看」。問題是：<strong>這是地理，是危險，還是在說她與他之間的距離？</strong></p>"],["地理意象","","<p>這一派讀為：這些都是北方高山的名字，詩人用遠方的高山，說她遙不可及。</p><p><strong>難處：</strong>為何要她「下來」，經文沒有說明。</p>"],["危險處境讀法","","<p>這一派認為獅子與豹子是危險的象徵，叫她離開是保護。</p><p><strong>難處：</strong>這個讀法把良人放在保護者的位置，是推測；經文結尾是「往下觀看」，並沒有說危險。</p>"],["寓意讀法","","<p>有人將它讀為從世界的危險中被召出來，歸向基督。</p><p><strong>難處：</strong>這是引伸，經文沒有明說。</p>"],["【三】本講義站在哪裡","","<p><strong>不定論；先讀為「請你與我一同從遠方的高處離開」，是邀請，不是警告。</strong>本講義不把它講成對外界的恐懼，也不把良人講成要人逃離世界。若要應用，問的是：我心中有哪些高處，讓人靠不近？先問自己，不指責別人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。細節無法確定，不影響經文的重心：請你靠近。</p>"]],"con":[],"say":"本講義的立場：經文沒有說她被困，不硬附會成拯救；只聽愛的召喚：從遙遠孤立走向親近。","care":"不要藉此把任何人的處境說成「被困」或「該被救」；對躲在高處或洞裡的人，是邀請，不是責備。不要把「獅子豹子」講成某些人或某些處境；也不要用它製造對外界的恐懼。"},{"id":"ISS05_1","t":"夜裡的失落是試驗，還是對她遲疑的懲罰？","r":"5:2--6","ch":[5],"why":"一、5:2–6 敲門、遲疑、開門、他已轉身走了——夜裡的失落是試驗，還是對她遲疑的懲罰？。良人夜裡來敲門，她遲疑了，等她起來開門，他已經走了。這一幕常被講成「慢了一步就失去」的教訓，也可能被用來責備一個人。這一題要問：經文是在責備她，還是在寫愛裡真實的錯過？","pos":[["【一】經文問的是甚麼","","<p>經文寫她「睡」與「醒」並存：「我身睡臥，我心卻醒」（5:2）。良人敲門，她用一個舒適的理由遲疑：「我脫了衣裳，怎能再穿上呢」（5:3）。等她開了門：「我的良人卻已轉身走了」（5:6）。</p><p>問題是：<strong>這一段是在警告「不要拖延」，還是在寫兩個相愛的人也會錯過？</strong></p>"],["教訓讀法","","<p>這一派把它讀為警告：回應遲了，機會就過了；並常用在對神的回應上。</p><p><strong>難處：</strong>經文沒有責備她，也沒有說良人生氣；把它變成「你太慢了」，是講者加的。</p>"],["真實的錯過","","<p>這一派讀為：愛裡常有錯過，彼此都不是惡意。她後來去尋找，他沒有消失，只是暫時不在。</p><p><strong>難處：</strong>經文沒給原因，良人為何走開，仍是空白。</p>"],["寓意讀法","","<p>有人把這段讀為信徒與主之間的疏離與尋回。</p><p><strong>難處：</strong>要小心不要把人在關係中的失落全當作屬靈失敗。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為愛裡真實的錯過：沒有責備，只有失落與尋找。</strong>本講義不把這段用來責備任何人「回應太慢」。若要應用，問的是：我曾因為舒適或疲倦，錯過了誰？先問自己，然後可以回頭去尋。321 的應用是：回到耶穌面前永遠不遲，祂不是擊打遲到的主。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。失落是真實的，但經文並沒有說你被拒絕。</p>"]],"con":[],"say":"本講義的立場：不把它講成懲罰，也不定她的罪；經文如實記下，並在 6:2–3 讓我們看見他沒有離開。","care":"遲了一步的人需要的是安慰，不是責備；尋不見的人，神並沒有離開。曾在關係中錯過、被離開的人，可能因這段想起舊傷。不要說「是你自己慢了」；不追問細節，會後單獨關心。"},{"id":"ISS05_2","t":"「城中看守打傷女子」該如何面對？","r":"5:7","ch":[5],"why":"二、5:7「巡邏看守的人遇見我，打了我，傷了我；看守城牆的人奪去我的披肩」——「城中看守打傷女子」該如何面對？。這是雅歌最需要小心的一節。5:7 寫巡邏的人「打了我，傷了我」，還奪去她的披肩。會眾裡可能有受過暴力、被當眾羞辱的人。這一節不能略過，也不能輕描淡寫地講完。","pos":[["【一】經文問的是甚麼","","<p>經文只有一句：「城中巡邏看守的人遇見我，打了我，傷了我；看守城牆的人奪去我的披肩」（5:7）。前面是她出門尋找（5:6），後面是她向耶路撒冷的眾女子託話（「若遇見我的良人，要告訴他，我因思愛成病」（5:8））。</p><p>問題是：<strong>這句話要照字面當成真實的暴力，還是當成象徵？我們該怎麼在會眾中讀它？</strong></p>"],["字面暴力讀法","","<p>這一派照字面讀：她真的被看守的人打傷、被奪去披肩。經文把這個傷害寫進聖經，沒有美化，也沒有說她該受。</p><p><strong>難處：</strong>必須同時說清楚——這不是她的錯，也不是神的教導。</p>"],["象徵讀法","","<p>這一派認為這是詩的筆法，用來寫尋找所愛的人要付出的代價與受到的阻攔。</p><p><strong>難處：</strong>把它當象徵，容易略過真實受暴者的感受。</p>"],["寓意讀法","","<p>有人把它讀為信徒尋找基督時受到的逼迫或阻擋。</p><p><strong>難處：</strong>寓意不能取代字面；對真實受暴者，這樣講太快。</p>"],["【三】本講義站在哪裡","","<p><strong>先承認這是一節寫到傷害的經文，不美化、不責備受傷的人。</strong>本講義不把這節用來解釋「為什麼會被打」，不把受傷說成「尋找的代價」，也不要求任何人原諒。若有人在這節流淚，我們先陪伴。聖經把傷害寫出來，是讓被傷害的人知道：這件事被看見了。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這節寫的是傷害，不是在教導傷害。你可以安心地說：聖經看見了。</p>"]],"con":[],"say":"本講義的立場：必須正視字面的暴力；被打的人沒有錯，這不是神的管教，也不是磨練。","care":"受暴警覺：不追問細節、不要求原諒、不叫人公開再說一次；會後單獨關心，協助尋求保護與專業協助；有立即危險請聯絡當地緊急電話。這一節要特別小心：不追問細節、不要求原諒、不對流淚的人說「你要有信心」；不在公開場合問「誰有過這樣的經歷」。會後單獨關心，必要時協助尋求專業協助。若有人正處在危險中，請聯絡當地的保護專線或緊急電話；如果涉及未成年人，優先保護他的安全。"},{"id":"ISS05_3","t":"「你的良人比別人有何強處」該如何回答？","r":"5:9","ch":[5],"why":"三、5:9–16 眾女子的問與新娘的描述——「你的良人比別人有何強處」該如何回答？。5:9 眾女子問：「你的良人比別人的良人有何強處？」是真的質疑，還是邀請她說出愛的理由？這節常被引用在為信仰辯護，也可能被誤用成「比較」。","pos":[["【一】經文問的是甚麼","","<p>經文是：「你這女子中極美麗的，你的良人比別人的良人有何強處」（5:9）。問話重複一次，並帶一點挑戰。她的回答接著出現（「我的良人白而且紅，超乎萬人之上」（5:10））。</p><p>問題是：<strong>這個問題是在逼她辯護，還是給她機會表達？</strong></p>"],["辯護式","","<p>這一派讀為：眾人質疑，她要為所愛的人辯護；常被用來教人為信仰作見證。</p><p><strong>難處：</strong>經文沒有說眾女子敵意，不能把它讀成對立。</p>"],["描述式","","<p>這一派讀為：這是一個邀請，讓她說出她的愛；全段（5:10–16）是一首愛的頌詞。</p><p><strong>難處：</strong>頌詞的內容仍是女子對良人的描述，不是邏輯辯論。</p>"],["比較的陷阱","","<p>這一派提醒：「比別人強」的問法，容易讓愛變成比較。</p><p><strong>難處：</strong>這個提醒在經文之外，要小心別強加給她。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為邀請：被問起所愛的人，是說出愛的機會。</strong>本講義不把它變成「我的比你的強」，也不拿來比較教會、家庭或伴侶。若要應用：有人問你耶穌有什麼好，你可以像她一樣，說你所認識的祂。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。被問起，是可以好好說的機會，不必緊張。</p>"]],"con":[],"say":"本講義的立場：見證從「他是怎樣的人」開始；不用比較來衡量人的價值。","care":"不要因為被問「值得嗎」就覺得自己要辯贏；說一句「我認識的祂是這樣」就夠了。不要用這節要求信徒向質疑者「辯贏」；也不要拿它比較誰的伴侶或誰的教會比較好。"},{"id":"ISS06_1","t":"六十王后八十妃嬪的比較，是要我們羨慕王宮嗎？","r":"6:8--9","ch":[6],"why":"一、6:8–9 后妃、童女與「只有這一個」——六十王后八十妃嬪的比較，是要我們羨慕王宮嗎？。6:8 提到六十王后、八十妃嬪、無數的童女，6:9 說只有一個是「獨一」的。這段容易被讀成一夫多妻的支持，或與所羅門的後宮混在一起。","pos":[["【一】經文問的是甚麼","","<p>經文是：「有六十王后八十妃嬪，並有無數的童女」（6:8）。接著：「我的鴿子，我的完全人，只有這一個是她母親獨生的」（6:9）。</p><p>問題是：<strong>這段是在描寫王的後宮制度，還是在說「在眾多之中，你是獨一」的專一？</strong></p>"],["愛的專一","","<p>這一派讀為：不管有多少人，他眼中只有她；這是專一的愛的宣告。</p><p><strong>難處：</strong>這個讀法要小心，不要被讀成「別人不重要」。</p>"],["制度背景","","<p>這一派指出：這是古代王室的背景，詩人借它襯托；不是在認可一夫多妻。</p><p><strong>難處：</strong>經文沒有評論這個制度，不能說它在反對。</p>"],["比較與價值","","<p>這一派提醒：「眾女子中獨一」的說法，不能變成對其他女子的貶低。</p><p><strong>難處：</strong>這個提醒是出於應用的謹慎，而非經文說的。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為專一的愛，不把後宮當作婚姻的標準。</strong>本講義不用這段支持或反對任何婚姻制度；它的重心是「專一」。這與 321 相通：耶穌對每一個人說「你是我的」，這不靠比較。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。制度的背景不影響專一的愛。</p>"]],"con":[],"say":"本講義的立場：重點是「只有這一個」的專一，不是支持多妻制度，也不是比較誰更美。","care":"被比較的人聽見「你是獨一」，不是第一名；這句話對經常被拿來比較的人是安慰。不要用「獨一」去比較誰比較得寵、誰比較被愛；單身的、沒有被選上的人聽到「獨一」，可能感到被排除。"},{"id":"ISS06_2","t":"「書拉密女」是誰？","r":"6:13","ch":[6],"why":"二、6:13「回來，回來，書拉密女」——「書拉密女」是誰？。6:13 的「書拉密女」只出現一次，是全卷最難解的稱呼之一。有人說是所羅門的陰性形，有人說是地名書念，有人說是專名。","pos":[["【一】經文問的是甚麼","","<p>經文是：「回來，回來，書拉密女；你回來，你回來，使我們得觀看你」（6:13）。接著：「你們為何要觀看書拉密女，像觀看瑪哈念跳舞的呢」（6:13）。</p><p>問題是：<strong>書拉密是誰？這個名字影響我們讀全卷的方式嗎？</strong></p>"],["所羅門的陰性形","","<p>這一派認為「書拉密」是「所羅門」的陰性形式，意思是「所羅門的女子」。</p><p><strong>難處：</strong>這是語言上的推測，沒有直接證據。</p>"],["地名書念","","<p>這一派認為她來自書念，與王上 1 章的書念女子有關。</p><p><strong>難處：</strong>書念與書拉密在拼寫上不同，連結是推測。</p>"],["專名或他稱","","<p>這一派認為這是一個專名或暱稱，沒有更多可考的意義。</p><p><strong>難處：</strong>這個讀法最保守，但也最少說明。</p>"],["【三】本講義站在哪裡","","<p><strong>不下定論；不用這個稱呼推論她是誰。</strong>本講義不使用任何一個讀法去推論全卷的結構。名字的歧義提醒我們：這首詩對讀者的要求，是聽，不是考證。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不知道她是誰，不影響你被愛這個訊息。</p>"]],"con":[],"say":"本講義的立場：只陳列，不爭論；重點在她被看時有權反問「你們為何要觀看」。","care":"被注視的壓力是真實的；愛的目光讓人更像自己，消費的目光讓人變成別人。不要用這個名字去猜測別人的身分或族裔；也不要把爭議講成「誰才懂」。"},{"id":"ISS06_3","t":"「屬」是擁有還是歸屬？","r":"6:3","ch":[6],"why":"三、6:3「我屬我的良人，我的良人也屬我」——「屬」是擁有還是歸屬？。「我屬我的良人，我的良人也屬我」是全卷最常被引用的一句。「屬」是擁有、歸屬，還是相互？今天用在婚禮與信仰裡，要分得清楚。","pos":[["【一】經文問的是甚麼","","<p>經文是：「我屬我的良人，我的良人也屬我」（6:3）。同樣的話在 2:16 與 7:10 也出現，次序與語氣略有變化（「良人屬我，我也屬他」（2:16）；「我屬我的良人，他也戀慕我」（7:10））。</p><p>問題是：<strong>「屬」是擁有，是歸屬，還是彼此的給予？</strong></p>"],["擁有","","<p>這一派讀為：兩人彼此擁有。</p><p><strong>難處：</strong>「擁有」容易變成占有與控制，這不是全卷的方向。</p>"],["歸屬","","<p>這一派讀為：她把自己交給他，他也把自己交給她；是歸屬，不是占有。</p><p><strong>難處：</strong>這個讀法要看全卷的最後一句（8:6、8:10）才站得穩。</p>"],["相互","","<p>這一派說三處的次序變化，顯示愛是相互的，甚至在 7:10 變為「他戀慕我」，把重心從擁有移到被愛。</p><p><strong>難處：</strong>這是對三處異文的一種解釋，不是經文自己說明的。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為彼此歸屬與相互的給予，不是占有。</strong>本講義不把「屬」講成「我是你的所有物」，也不用它要求任何人犧牲自己。這與 321 相通：「我屬耶穌」是從愛來的，不是被拿走的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。屬是愛的語言，不是控制的語言。</p>"]],"con":[],"say":"本講義的立場：「屬」是相互的歸屬，不是擁有；次序從 2:16 到 6:3 的轉換，記下成熟的過程。","care":"相屬不是控制；任何人不可用「你是我的」限制對方的自由。處在控制關係的人，可能聽見「屬」就想到被占有。不要用這節要求任何人留在一個傷害他的關係裡。"},{"id":"ISS07_1","t":"身體的描寫與物化的界線在哪裡？","r":"7:1--9","ch":[7],"why":"一、7:1–9 從腳到頭的讚美與她的接話——身體的描寫與物化的界線在哪裡？。7:1–9 是全卷描寫身體最直接的一段。信徒的疑問是：這是在讚美夫妻之間的欣賞，還是在鼓勵把人當成東西看？這一題要分清兩件事。","pos":[["【一】經文問的是甚麼","","<p>經文從腳寫到頭：「王女啊，你的腳在鞋中何其美好」（7:1），結尾是：「我所愛的，你何其美好！何其可悅，使人歡暢喜樂」（7:6）。</p><p>問題是：<strong>這樣的描寫是被造的人可以被欣賞，還是在示範一種消費的眼光？</strong></p>"],["欣賞被造的人","","<p>這一派讀為：夫妻之間有權也有喜樂去欣賞彼此；聖經沒有把這件事藏起來。</p><p><strong>難處：</strong>必須說明這是在「對方的邀請與自由」之內，不是任何人都可以這樣看任何人。</p>"],["消費的眼光","","<p>這一派提醒：這樣的描寫，離開上下文會被用來為色情或評論身體辯護。</p><p><strong>難處：</strong>警惕合理，但不能因此把整段略過。</p>"],["私密語言","","<p>這一派指出：這是兩個人之間的私密語言，不是為了公開朗讀的規格；在會眾中朗讀要有分寸。</p><p><strong>難處：</strong>分寸的標準，需要帶領者自己拿捏。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為夫妻之間的欣賞；在會眾中朗讀時，有分寸，不渲染。</strong>本講義不逐句解釋身體，也不用它評論任何人的外貌。欣賞要有一個前提：對方的自由與尊重。這與 321 相通：以愛為先，人比事重要。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經能把這樣的欣賞寫出來，不是在鼓勵你用這樣的眼光看每一個人。</p>"]],"con":[],"say":"本講義的立場：讀語氣與看人的方式，不逐項解釋身體；聽完是更被珍愛，而不是更焦慮。","care":"公開場合不逐項解釋，不拿來評論別人的外貌；未婚的會眾要聽得懂、不被挑動。有受過性方面傷害的人，聽見這類描寫可能想到過去。不追問細節、不要求原諒；不在公開場合問誰有過這樣的經歷；會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS07_2","t":"田間與村莊的約，如何不被曲解？","r":"7:11--13","ch":[7],"why":"二、7:11–13「我們往田間去……在村莊住宿」——田間與村莊的約，如何不被曲解？。7:11–13 女子邀請良人往田間、村莊去。這是兩人婚姻的日常，還是別的意思？這段也常被誤用成對婚外關係的合理化。","pos":[["【一】經文問的是甚麼","","<p>經文是：「我的良人，來吧！你我可以往田間去；你我可以在村莊住宿」（7:11）。接著說：「我在那裡要將我的愛情給你」（7:12），並且說：「我的良人，這都是我為你存留的」（7:13）。</p><p>問題是：<strong>這是夫妻日常的邀請，還是任何一種關係都可以用的話？</strong></p>"],["婚姻的日常","","<p>這一派讀為：夫妻離開城市，在田間村莊相處；把愛情的表達放在日常生活裡。</p><p><strong>難處：</strong>經文沒有說他們是否已婚，只說他們彼此相屬（7:10）。</p>"],["婚外親密的合理化","","<p>這一派提醒：這段話離開上下文，可能被用來合理化婚外的關係。</p><p><strong>難處：</strong>這個提醒是對誤用的警告，不是經文本身的意思。</p>"],["單身者的田間","","<p>這一派問：單身的人聽這段，要怎麼讀？他們可以在這段話裡看見：愛可以被存留，不必急著給出去。</p><p><strong>難處：</strong>這是應用，不是原意；要謹慎。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為彼此相屬的邀請，愛情是存留的，不是濫給的。</strong>本講義不把這段用來合理化婚前或婚外的親密。「存留」是關鍵詞：好東西要留給對的人、對的時候。單身的人，這段也可以讀成：你的愛不必急著給出去。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這段說的是存留，不是放縱。</p>"]],"con":[],"say":"本講義的立場：這是婚姻裡的愛走進日常，重點在「早晨起來」「葡萄園」「存留」；不鼓勵婚前或婚外的親密。","care":"單身者也有自己的田間與村莊；不要把這一段講成只有已婚者的專利。不要用這段羞辱單身的人或曾有過錯的人；愛仍可以被存留，從現在開始。"},{"id":"ISS07_3","t":"「王被繫在髮綹中」指什麼？","r":"7:5","ch":[7],"why":"三、7:5「王的心因這下垂的髮綹繫住了」——「王被繫在髮綹中」指什麼？。7:5 說「王的心因這下垂的髮綹繫住了」。這句話的語氣是浪漫，但「繫住」是被捆綁的意思。這是愛，還是權力遊戲？","pos":[["【一】經文問的是甚麼","","<p>經文說：「你頭上的髮是紫黑色；王的心因這下垂的髮綹繫住了」（7:5）。「王」在這裡可能指良人，也可能是比喻。</p><p>問題是：<strong>這句話在說權力被愛俘虜，還是在說愛裡有權力的遊戲？</strong></p>"],["權力在愛中被俘","","<p>這一派讀為：王本來握有權力，卻被愛繫住；愛是比權力更強的。</p><p><strong>難處：</strong>這是浪漫的讀法，需要說明「被俘」是自願的。</p>"],["和合本補譯","","<p>這一派指出：和合本在這裡有補譯與詮釋，原文語氣更接近「王被髮絡捆住」。</p><p><strong>難處：</strong>原文的細節我們尚未逐字核對，不要太快下結論。</p>"],["權力遊戲","","<p>這一派警惕：若把這句話讀成「用外表控制對方」，就偏離經文了。</p><p><strong>難處：</strong>經文沒有這個意思，是從現代關係套回去的。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為愛使權力低頭；不把它讀成用外貌控制人。</strong>本講義不用這句話教導「用美麗去綁住對方」。愛的力量在於自願。這與 321 相通：王願意為愛放下權力，正是耶穌的樣式。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這句話的意思，不改變愛是自願的。</p>"]],"con":[],"say":"本講義的立場：愛的方向是向下，不是征服；強者在愛中自願被繫住。","care":"不可用它教人操縱或掌控；它說的是彎腰，不是控制。不要用這句話教導人利用外貌去影響或控制別人。"},{"id":"ISS08_1","t":"「巴不得你像我的兄弟」是什麼處境？","r":"8:1--4","ch":[8],"why":"一、8:1–4 兄弟式的親吻與公開的愛——「巴不得你像我的兄弟」是什麼處境？。8:1 女子說「巴不得你像我的兄弟」。為什麼是兄弟？這句話透露了當時的文化背景，也可能觸動不被社會接納的愛。","pos":[["【一】經文問的是甚麼","","<p>經文是：「巴不得你像我的兄弟，像吃我母親奶的兄弟；我在外頭遇見你就與你親嘴，誰也不輕看我」（8:1）。</p><p>問題是：<strong>她為什麼想要他像兄弟？這是在表達什麼處境？</strong></p>"],["文化脈絡","","<p>這一派解釋：在古代，兄妹可以公開表達親近，戀人卻不能；所以她巴不得他像兄弟，可以在公眾場合沒有顧忌。</p><p><strong>難處：</strong>這是歷史推測，經文沒有直接說明。</p>"],["愛不被接納","","<p>這一派說：這句話寫出了愛不被社會接納的痛，她希望可以光明正大地去愛。</p><p><strong>難處：</strong>這個讀法要小心，不要把它延伸成對所有情況的辯護。</p>"],["寓意讀法","","<p>有人把這句話讀為信徒希望與基督的關係，能像家人一樣公開自然。</p><p><strong>難處：</strong>這是引伸，不是經文自己說的。</p>"],["【三】本講義站在哪裡","","<p><strong>讀為渴望被人看見、被社會接納的愛；先承認這份痛。</strong>本講義不把這句話用來為任何特定的關係辯護，但承認：有些人愛得不被接受，他們的痛是真的。321 的應用是：在耶穌面前，沒有人需要躲藏。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這句話是人情的真實，不是神學的難題。</p>"]],"con":[],"say":"本講義的立場：不以今日觀念直接評斷；聽出她的渴望——愛能在光中被承認，不被輕看。","care":"有些人的愛不被看見或接納；聖經給的是同理的耳朵，而不是立刻給答案。愛得不被家人或社會接受的人，可能在這段流淚。不追問細節，不說「你要有信心」，不急著評判；會後單獨關心。"},{"id":"ISS08_2","t":"「耶和華的烈焰」與「嫉恨如陰間之殘忍」怎麼讀？","r":"8:6--7","ch":[8],"why":"二、8:6–7 印記、愛如死之堅強、眾水不能熄滅——「耶和華的烈焰」與「嫉恨如陰間之殘忍」怎麼讀？。8:6 是全卷的高潮：愛情如死之堅強，所發的電光是「耶和華的烈焰」。這是全卷唯一提到神名的地方（有些學者爭議）。這句話的意義是什麼？","pos":[["【一】經文問的是甚麼","","<p>經文說：「求你將我放在你心上如印記，帶在你臂上如戳記。因為愛情如死之堅強，嫉恨如陰間之殘忍」（8:6），接著「是耶和華的烈焰」（8:6）。</p><p>問題是：<strong>「耶和華的烈焰」是在說神的名，還是只是「極猛的火焰」的說法？「嫉恨」要怎麼聽？</strong></p>"],["耶和華的烈焰","","<p>這一派讀為：愛的火焰來自神；這是全卷唯一與神名連結的地方，說明愛的源頭是神。</p><p><strong>難處：</strong>原文可以讀成「耶和華」，也可以讀為「極猛的火焰」，這是爭議。</p>"],["極猛的火焰","","<p>這一派認為，詞尾（-yah，與神名的縮寫同形）在這裡可能只是加強語氣，意思是「極猛烈的火焰」，不必有神名。</p><p><strong>難處：</strong>和合本主文取了神名的讀法；兩種讀法都有可能。</p>"],["忌邪與控制","","<p>這一派提醒：「嫉恨」如陰間之殘忍，不能被讀為讚美占有；愛的堅強不是控制的藉口。</p><p><strong>難處：</strong>這個提醒是對誤用的警惕，仍需回到經文的語氣。</p>"],["【三】本講義站在哪裡","","<p><strong>兩種讀法並陳；愛的強烈是真的，但不是控制的許可。</strong>本講義承認原文的歧義，不強迫選邊。要帶走的是：愛是強大的，值得被認真對待；而它的來源，我們願意相信是神。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。讀法不同，不影響愛的來源是神這個信靠。</p>"]],"con":[],"say":"本講義的立場：愛如死之堅強，但愛不是控制、監視、暴力的理由；愛是自由裡的委身。","care":"凡用「我愛你」來管手機、限制交友、威脅、傷害的，都不是雅歌的愛；受控制的人，請尋求協助。經歷過占有或控制的關係的人，聽見「嫉恨」可能想起傷害。不要用這節要求任何人以愛為名承受控制。"},{"id":"ISS08_3","t":"小妹的問題：這是保護的經文嗎？","r":"8:8--10","ch":[8],"why":"三、8:8–10「我們有一小妹……我是牆」——小妹的問題：這是保護的經文嗎？。8:8–10 是全卷最容易被誤用的一段。哥哥們討論「我們有一小妹，她的兩乳尚未長成」，並談到提親的日子。這可能被拿去合理化早婚、或對未成年少女的關注。這一節要特別小心。","pos":[["【一】經文問的是甚麼","","<p>經文是：「我們有一小妹；她的兩乳尚未長成，人來提親的日子，我們當為她怎樣辦理」（8:8）。他們說要守護她：「她若是牆，我們要在其上建造銀塔；她若是門，我們要用香柏木板圍護她」（8:9）。女子的回答是：「我是牆；我兩乳像其上的樓」（8:10）。</p><p>問題是：<strong>這是誰在說話？經文是在認可兄長決定妹妹的婚事，還是在寫女子自己的聲音？</strong></p>"],["哥哥們的問話","","<p>這一派讀為：這是兄長討論妹妹的婚事；是古代家族的視角，經文只是記錄，並不是認可。</p><p><strong>難處：</strong>必須說明，這是古代背景的描述，不是今天的準則。</p>"],["新娘的回答","","<p>這一派說，重點在 8:10：她自己說「我是牆」，是自己做了決定；全段的重心從兄長轉到她的聲音。</p><p><strong>難處：</strong>「我是牆」可以有不同讀法，需要承認經文的歧義。</p>"],["早婚的誤用","","<p>這一派提醒：這段話絕不能被用來合理化早婚或對未成年人的任何接觸。</p><p><strong>難處：</strong>這是明確的底線，不是讀法之爭。</p>"],["【三】本講義站在哪裡","","<p><strong>先站在女子自己的聲音那一邊；明確劃線：這段不可用來合理化對未成年人的任何親密。</strong>本講義把重心放在 8:10：她說出自己，是自主的聲音。任何情況，保護未成年人是最優先；這一節不是任何年齡早婚的根據。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一節的重點是：她有自己的聲音，而保護是第一位。</p>"]],"con":[],"say":"本講義的立場：這是保護的經文，不支持早婚，不評價任何人的身體；對未成年或處於弱勢的人，以保護為先。","care":"曾在年幼時未被好好保護的人，那不是他的錯；教會要成為牆與門，有制度、有眼睛、有行動。這一節要特別小心：不追問細節、不要求原諒、不對流淚的人說「你要有信心」。若有人曾在年幼時被傷害，會後單獨關心，必要時協助尋求專業協助。若涉及未成年人處於危險，優先保護他的安全，並聯絡當地的保護專線或緊急電話。"},{"id":"ISS08_4","t":"愛能用金錢買賣或衡量嗎？","r":"8:7、8:11--12","ch":[8],"why":"四、8:7「若有人拿家中所有的財寶要換愛情，就全被藐視」；8:11–12 兩個葡萄園——愛能用金錢買賣或衡量嗎？。8:7 說「若有人拿家中所有的財寶要換愛情，就全被藐視」；8:11–12 對比所羅門的葡萄園與「我自己的葡萄園」。這是否在說錢不重要？","pos":[["【一】經文問的是甚麼","","<p>經文說：「若有人拿家中所有的財寶要換愛情，就全被藐視」（8:7）。後面是兩個葡萄園：「所羅門在巴力‧哈們有一葡萄園」（8:11），而女子說：「我自己的葡萄園在我面前」（8:12）。</p><p>問題是：<strong>這是在教導「愛不能用錢買」，還是在說「錢不重要」？</strong></p>"],["愛不能買賣","","<p>這一派讀為：真正的愛無法被交易，也不該被標價。</p><p><strong>難處：</strong>這個讀法要小心，不要變成對經濟壓力的輕忽。</p>"],["兩個葡萄園","","<p>這一派說：所羅門的葡萄園，交給看守的人，要收租；女子的葡萄園是她自己的，她決定給誰。這是自主的象徵。</p><p><strong>難處：</strong>「葡萄園」在雅歌常是女子自己的比喻，這個讀法需要連結 1:6。</p>"],["錢不重要？","","<p>這一派提醒：這段不是在說金錢不重要；經濟的壓力、婚禮的花費、生活的負擔，在現實中依然真實。</p><p><strong>難處：</strong>這個提醒在經文之外，是應用的謹慎。</p>"],["【三】本講義站在哪裡","","<p><strong>愛不能被買賣；她的葡萄園由她自己決定給誰。</strong>本講義不用這段輕忽經濟上的難處，也不用它責備因經濟困難而延後婚姻的人。重心是：愛是自願的給予，不是交易。這與 321 相通：恩典是白白賜的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。愛不能買賣，是祝福，不是對你經濟狀況的責備。</p>"]],"con":[],"say":"本講義的立場：愛不能被買賣，也不能用金錢衡量；不是否定生活需要，也不是批評貧窮的人。","care":"窮的與富的聽完，都要能被愛，而不是被衡量；給再多禮物，也不能代替陪伴與在場。因經濟困難而延後婚姻、或因金錢陷入關係壓力的人，聽到這段不要覺得被責備。不追問細節；會後單獨關心，必要時轉介協助。"}],"terrain":{"points":[[1.088,45,0,"渴慕的開口",null],[1.324,28,0,"「不要因日頭把我曬黑了就輕看我」","bot"],[2.206,78,0,"以愛為旗","top"],[2.912,82,0,"「良人屬我，我也屬他」",null],[3.318,70,0,"找到了，不容他走",null],[3.955,88,0,"婚禮的冠冕","top"],[4.719,72,0,"關鎖的園",null],[5.094,40,0,"夜裡的敲門",null],[5.344,14,0,"尋不見","bot"],[6.192,80,0,"彼此屬於",null],[7.731,90,0,"「他也戀慕我」","top"],[8.321,86,0,"「靠著良人從曠野上來」",null],[8.393,98,0,"印記","top"],[8.464,94,0,"眾水不能熄滅","top"]]},"tracks":[{"gk":"דּוֹד","tr":"dod","gl":"良人、愛人（複數：愛情）","code":"H1730","root":"√דוד（愛、所愛的人）","stops":[["1:2","「你的愛情（דֹּדִים）比酒更美」——複數，是愛的表達",""],["1:13","「我以我的良人為一袋沒藥，常在我懷中」",""],["2:3","「我的良人在男子中，如同蘋果樹在樹林中」",""],["2:8","「聽啊！是我良人的聲音」——他來了","top"],["2:16","「良人屬我，我也屬他」——先說他屬我",""],["4:16","「願我的良人進入自己園裡」——她自己開門","top"],["5:2","「這是我良人的聲音；他敲門」",""],["5:9","「你的良人比別人的良人有何強處？」——被問四次的字","bot"],["6:3","「我屬我的良人，我的良人也屬我」——次序換了","top"],["7:10","「我屬我的良人，他也戀慕我」",""],["8:14","「我的良人哪，求你快來！」——最後一個字","top"]],"ins":"全卷用同一個字說「他」：從「我的良人是一袋沒藥」的貼身，到被問四次的「何有強處」，再到最後的「快來」。次序的改變（2:16→6:3→7:10）記下愛從擁有走向歸屬。"},{"gk":"אַהֲבָה","tr":"ahavah","gl":"愛、愛情","code":"H160","root":"√אהב（愛）","stops":[["2:4","「以愛為旗在我以上」——愛是庇護",""],["2:5","「因我思愛成病」——愛有重量",""],["2:7","「不要驚動、不要叫醒……愛情」——第一次副歌","top"],["3:5","副歌第二次——找到之後，也不催",""],["3:10","「其中所鋪的乃耶路撒冷眾女子的愛情」——華轎的最裡面",""],["5:8","「告訴他，我因思愛成病」——被打傷之後她說的話","bot"],["7:6","「愛情，在歡愉中，何其美好」——私密的讚嘆",""],["8:4","副歌第三次——變短，不再加重語氣",""],["8:6","「愛情如死之堅強」——整卷高峰","top"],["8:7","「愛情，眾水不能熄滅……財寶要換愛情，就全被藐視」","top"]],"ins":"「愛」這個字走完全卷，從庇護的旗，到病，到不可催的副歌，到不可買賣的最高峰；它先被保護、被等待，最後被宣告為比死更堅強。"},{"gk":"כֶּרֶם","tr":"kerem","gl":"葡萄園","code":"H3754","root":"—","stops":[["1:6","「我同母的弟兄……使我看守葡萄園」——被使喚去看守別人的園",""],["1:6","「我自己的葡萄園卻沒有看守」","bot"],["1:14","「我以我的良人為一棵鳳仙花，在隱‧基底葡萄園中」",""],["2:15","「毀壞葡萄園的小狐狸」——一起擒拿","bot"],["2:15","「我們的葡萄正在開花」——「我們的」葡萄園",""],["7:12","「我們早晨起來往葡萄園去」——她邀請",""],["8:11","「所羅門在巴力‧哈們有一葡萄園」——交給看守的人",""],["8:12","「我自己的葡萄園在我面前」——1:6 的翻轉","top"]],"ins":"葡萄園從「被使喚去看守別人的，自己的卻沒有看守」，到「我自己的葡萄園在我面前」——全卷開頭與結尾的呼應，記下一個人從被使喚走向自己作主，並自由地交出去。"},{"gk":"עוּר","tr":"ur","gl":"醒來、喚醒、驚動","code":"H5782","root":"√עור（醒、興起）","stops":[["2:7","「不要驚動（תָּעִירוּ）」——第一次副歌","top"],["2:7","「不要叫醒（תְּעוֹרְרוּ）」",""],["3:5","「不要驚動」——找到之後，也不催",""],["3:5","「不要叫醒」",""],["4:16","「北風啊，興起（עוּרִי）」——被叫醒的是風，吹開她的園","top"],["5:2","「我身睡臥，我心卻醒（עֵר）」——心醒著",""],["8:4","「為何驚動」——副歌變短",""],["8:4","「為何叫醒」",""],["8:5","「我在蘋果樹下叫醒你」——喚醒，在愛的時候","top"]],"ins":"這個字先被禁止（2:7、3:5：不要在愛未情願時喚醒），然後被邀請（4:16：北風興起），最後被實現（8:5：我喚醒你）——愛的醒，不是催出來的，是時候到了，自己說「願」。"}],"lesson":{"1":{"no":1,"vol":"《321雅歌講義》第1課·雅歌第1章","title":"渴慕的開始——渴、傷、尋","chars":4873,"min":60,"deep":8,"dchars":1451,"tchars":23,"blocks":[["h","一、歌中之歌：先聽一首情詩"],["p","弟兄姊妹平安。先問一個很小的問題：你的手機裡，有沒有一則訊息，打了又刪，刪了又打，最後沒有送出去？內容也許只有一句：「你什麼時候回來？」或者「我有點想你。」為什麼不送出去？因為怕。怕對方覺得我太黏，怕自己顯得缺乏，怕一開口，就把心裡的渴暴露了。"],["p","今天我們進入整本聖經最容易被翻過去的一卷。雅歌第一章第一節，只有一句話：「所羅門的歌，是歌中的雅歌」（歌1:1）。「歌中的雅歌」，在希伯來文是最高級的寫法，意思是「歌中之歌」，就像「聖中之聖」是最聖的那一處。神的話把這一首情詩，放在歌的最高處。"],["p","它不是戰歌，不是律法的頌讚，也不是聖殿裡升起的敬拜詩。它是一個女子開口，說她想念一個人。神沒有嫌棄人的渴；祂把人的渴慕，收進祂自己的話裡。這件事本身，就值得我們停下來。"],["p","先交代這一卷的讀法。雅歌是情詩，字面上是一位女子和她所愛的人彼此說話。歷代教會有人從中聽見神與祂百姓的愛，這個讀法有它的歷史，我們尊重，但不搶先。我們的次序是：先讓她自己說話，先把字面聽懂；新約沒有明說的連結，我們不說「這就是預表」，只說「這使我們想起」。"],["p","還有一個提醒要先說。這一章裡的「我」，不是一個站在高處的聖人，而是一個有缺、有渴、有傷的女子。她的語氣有時羞怯，有時急切，有時帶著一點倔強。聖經不怕把這樣的人放在最高的歌裡；我們也不必把自己修飾成聖人，才敢翻開這一卷。"],["p","現在來聽她的第一句。不是「我愛你」，是這樣：「願他用口與我親嘴」（歌1:2）。注意第一個字：「願」。原文的動詞在這裡用的是願式，是盼望、是渴求的語氣。她沒有說「他要來親我」，也沒有說「他已經來了」。她站在等待的位置上，承認：我還沒有被填滿。"],["p","她接著說理由：「因你的愛情比酒更美」（歌1:2）。酒是宴席上最能叫人歡喜的東西，她說，你的愛比最好的酒還好。第三節，她說他的名如同倒出來的香膏。香膏封在瓶裡的時候，只有瓶子；一倒出來，滿屋都是。他的名，是倒出來的，不是藏起來的。"],["p","第四節裡，她還說：「王帶我進了內室」（歌1:4）。內室，是最私密的地方，是不對外人開放的地方。她被帶進去了；不是她自己闖進去。你看，她的渴慕一開始，就沒有走向偷偷摸摸，是走向被邀請：王帶她，她就進。"],["p","她還說了一句有趣的話：「所以眾童女都愛你」（歌1:3）。愛他的人不只她一個。這一首情詩從頭到尾沒有一絲「獨占」的小器，倒有一種坦然：他值得被愛，所以被愛。她不用貶低別人，才能顯出她愛得真；她也不用假裝自己是唯一被他看見的，才能確信他看見了她。"],["p","然後是第四節，整章最關鍵的一句：「願你吸引我，我們就快跑跟隨你」（歌1:4）。請看這個次序：先是「吸引」，然後才是「快跑」。她不是先決定要跑，是先被拉；被拉了，腳才快起來。我們今天許多人的屬靈生活，剛好是反過來的：先跑，再問自己為什麼這麼累。"],["p","「快跑」這個字，在原文是複數：「我們」要跑。她一開口是「我」，說到跑的時候，卻變成「我們」。被吸引的人不是單獨衝出去，是帶著一群人，一起跟上去。渴慕有一個奇妙的果子：它使一個人孤單的「願」，變成一群人同行的「我們」。"],["p","有一種屬靈，是靠意志力：我要更愛主，我要多讀經，我要更火熱。結果跑到一半沒力氣，然後責備自己。雅歌第一章把次序放回正位：愛，是被吸引出來的，不是逼出來的。耶穌在井邊，對一個口渴的女人說，請你給我水喝；在十字架上，祂說祂渴了。神的兒子，不假裝不需要。祂敢說渴，我們為什麼不敢？"],["d",["「歌中的雅歌」只是文學上的最高級嗎？還是真的比其他的歌更重要？","希伯來文用「X 的 X」表示最高級，像「聖中之聖」指至聖所，「王中之王」指最高的王。所以「歌中之歌」的意思是：這是最好的一首歌，或這一首歌是歌的極致。至於它「更重要」是什麼意思，要小心：它不是說其他的詩篇不重要，而是說，這首情詩被放在高處，值得認真聽。我們不需要把它誇大成「全聖經最重要的一卷」，只需要承認：神的話裡有一首情詩，而且神說它是歌中之歌，這就夠我們停下來好好聽。"]],["d",["我可以直接把雅歌讀成神與我的關係嗎？為什麼講義說要先聽字面？","可以，歷代教會有人這樣讀，這個讀法有它的歷史與果子。但這份講義的次序是：先聽字面，再談屬靈。理由有三個：第一，聖經把它寫成情詩，我們就先尊重這個文體；第二，新約沒有直接引用雅歌來說基督與教會，我們不能替經文加上它自己沒有說的肯定語氣；第三，先聽懂她的聲音，再聽見神與祂百姓的愛，這個聽見才是真的，不是硬套的。所以我們說「這使我們想起」，而不說「這就是」。"]],["h","二、被日頭曬黑，被弟兄使喚"],["p","她開口之後，立刻轉向一群人：耶路撒冷的眾女子。她說：「我雖然黑，卻是秀美」（歌1:5）。想像一個女子，站在一群衣著整潔的城裡女子中間，先把最難啟齒的那句話，自己說出來：我黑。"],["p","為什麼黑？她自己給了原因：「不要因日頭把我曬黑了就輕看我」（歌1:6）。是日頭曬的。經文給的原因是曝曬與勞動，我們就照這個原因讀，不借這一句話去評論任何人的膚色，也不替任何族群下結論。"],["p","日頭為什麼曬她？她接著說：「我同母的弟兄向我發怒，他們使我看守葡萄園」（歌1:6）。弟兄生她的氣，把她派去守別人的園子，日復一日，站在太陽底下。然後是最心酸的一句：「我自己的葡萄園卻沒有看守」（歌1:6）。她替別人守了園，卻守不住自己的。"],["p","讀到這裡，有人會停住，因為我們認得這個處境。在家裡，在教會，在職場，那些孝順的、負責的、會做事的人，常常就是被曬黑的人。別人的需要顧好了，自己的心卻荒了；每一個人都說他可靠，沒有一個人問他累不累。"],["p","她說的「不要輕看我」，是整卷聖經裡，替所有被輕看的人說的一句話。你若曾經因為出身、外貌、工作、家境而被人看低，你可以知道：神的話裡，有一個人，在你之前，說過這一句話，而神把它保留了下來，沒有刪掉。"],["p","這裡有一個很大的真理：她先承認，不等別人替她遮。「我黑」不是自卑，是說真話。無己，不是假裝沒有傷，是敢說「這是真的」。說出來，才有地方讓愛進來。有己的人反而花盡力氣，把黑遮成白，把渴遮成滿。"],["p","還有一件事：她說我黑，馬上又說我秀美，如同基達的帳棚，好像所羅門的幔子。一般認為基達的帳棚是深色的，所羅門的幔子則是華美的宮廷織品。粗樸與華美，曬傷與秀麗，兩個比喻並排，她不要別人在兩者之間替她選一個。"],["d",["「被吸引」是不是意思就是我可以不用努力、不用操練？","不是。第四節的後半句是：「我們就快跑跟隨你。」被吸引之後，是跑，不是躺。被吸引講的是源頭，不是取消行動。操練、讀經、禱告、服事，仍然是跑；只是這些行動的力氣，不是從怕被責備來的，是從被愛來的。判斷的方法很簡單：你做完一件屬靈的事之後，是更靠近主，還是更需要證明自己？如果是後者，也許要回來問一問：我是被吸引，還是被逼迫？這個問題不是為了定罪自己，而是為了回到源頭，讓力氣重新從愛裡來。"]],["h","三、原文亮光：吸引、黑、秀美"],["p","讓我們放大看三個字。第一個是 מָשַׁךְ，念作 mashak，意思是「拉」、「拖」、「吸引」。第四節的「願你吸引我」，原文用的就是這個字根。耶利米書三十一章三節講到神用慈愛吸引祂的百姓，用的也是這個字根。"],["p","這個字的畫面是「拉」，不是「推」。推，是從後面逼你；拉，是前面有一個人在吸引你。她求的是被拉：主動權在良人手上，她把自己交出去，說：你拉我。這就是無己的第一個姿勢，不是我努力靠近祢，是求祢吸引我。"],["p","第二個字是 שְׁחוֹרָה，念 shekhorah，「黑」，是形容詞的陰性形。第六節她說的「曬黑」，用的是相近字根的另一個形式 שְׁחַרְחֹרֶת，這個重疊的形式，常被解作「有點黑」。那口氣不是形容自己黑得可怕，帶著一點無奈、一點自嘲，也帶著一點請求：請不要這樣看我。"],["p","第三個字是 נָאוָה，念 navah，「秀美」，也可以譯作「合宜的、悅目的」。現在要看的是這兩個字之間。原文是 שְׁחוֹרָה אֲנִי וְנָאוָה，字面是「黑，我，並且秀美」，中間只有一個最小的連接詞 וְ，就是「和」。和合本譯作「雖然……卻是」，是為了中文通順；原文本身沒有「雖然」。"],["p","這個細節很重要。「雖然……卻是」的口氣，像是在說：黑是缺點，美是補償。可原文說的是：黑，並且秀美。兩件事在她身上同時為真，誰也不取消誰。她不需要先把黑洗掉，才有資格被稱為美。"],["p","三個字連起來，就是整章的一條線：被吸引（מָשַׁךְ），承認黑（שְׁחוֹרָה），仍然是秀美（נָאוָה）。她先說出自己黑，不是為了貶低自己，而是不再假裝。"],["p","回頭看第四節的「快跑」，原文 נָרוּצָה 是一個「讓我們……」的語氣，加上前面的「願你吸引我」，整句話像是在說：你拉，我們就跑。主動與回應，在一個句子裡接起來。愛，不是單向的下命令，也不是單向的追求，而是一個拉、一個跟；而被吸引的人，從來沒有失去自己的腳。"],["d",["原文說「黑，並且秀美」，和合本譯成「雖然……卻是」，我該相信哪一個？","兩個都可以信，但要知道它們各自在做什麼。和合本是翻譯，是為了中文讀起來順口，把兩個形容詞之間的張力表達出來；原文只用了一個「和」字，沒有「雖然」。這並不是和合本譯錯了，中文的「雖然……卻是」，很自然地表達了「黑與美同時存在」的意思。需要小心的是，不要因為中文裡有「雖然」，就把黑當成缺點，把美當成補償。原文的重點是：兩個都是真的。她不必先把黑洗掉，才有資格被稱為美。"]],["h","四、跟著腳蹤去，青草為床榻"],["p","第七節，她轉向良人，問了一個急切的問題：「我心所愛的啊，求你告訴我，你在何處牧羊」（歌1:7）。她不知道他在哪裡，而且有點慌：晌午，太陽最毒的時候，我何必在你同伴的羊群旁邊，像蒙著臉的人？她不想走錯，不想被誤認。"],["p","一個愛人，不知道愛人在哪裡。她沒有假裝，直接問。這是整卷雅歌「尋找」的第一聲，第三章、第五章，她還會再找。尋找，不是不夠愛；尋找，正是愛。"],["p","得到的回答很特別。第八節，他沒有責備她連他在哪裡都不知道；他先稱呼：「你這女子中極美麗的」（歌1:8），然後才指路：「只管跟隨羊群的腳蹤去」（歌1:8）。先稱呼，再指路；先接納，再同行。"],["p","這裡有福音的次序。很多人以為神要等我們變好才開口，這一節說的是：祂先叫你「極美麗的」，然後告訴你腳蹤在哪裡。腳蹤是別人走過的路，是羊群的足跡，是同行，不是表演。"],["p","九到十一節，良人開口讚美，用了一個今天聽來很怪的比喻：「我將你比法老車上套的駿馬」（歌1:9）。別急著生氣。在那個年代，駿馬代表力量、華麗、叫人驚歎。他說的是你有美，也有力量。接著他說：「我們要為你編上金辮，鑲上銀釘」（歌1:11）。先稱美，再裝飾；不是戴上金銀才算美。"],["p","她也回答：「我以我的良人為一袋沒藥，常在我懷中」（歌1:13）。一袋沒藥，不是放在櫃子裡的，是貼身帶在懷中的。他的香氣，她貼身帶著。香氣先於相見：就算他不在眼前，她已經被他的香氣包住。"],["p","她還說：「我以我的良人為一棵鳳仙花，在隱．基底葡萄園中」（歌1:14）。隱．基底是死海旁的一片綠洲，在曠野的乾旱裡，一個有水、有花、有果樹的地方。她把她的良人，比作乾地裡的一片園。有他的地方，乾旱就有了綠意。"],["p","十五到十七節，兩人彼此讚美：他說「你甚美麗」（歌1:15），她說「你甚美麗可愛」（歌1:16）。讚美是往返的。最後，沒有宮殿，也沒有銀行，他們說：「我們以青草為床榻」（歌1:16），「以香柏樹為房屋的棟樑」（歌1:17）。青草是床，香柏是樑；這個家不是用錢買的，是用愛搭起來的。她從一個「願」，走到「青草為床榻」。這就是第一章的整條路。"],["d",["良人把她比作法老車上的駿馬，這不是在貶低女性嗎？","要先回到那個年代。法老的戰車所套的馬，是當時最華麗、最有力、最叫人驚歎的動物之一，不是貶低的比喻。良人用的是他那個世界裡最高的讚美：你有美，也有力量。今天的讀者聽起來覺得怪，是因為我們的文化想像不同。我們不必替古代的比喻辯護到底，也不必叫現代人必須喜歡它；我們只需要看清楚：這一句話的方向，是讚美，是看見，是為她編上金辮、鑲上銀釘。而且她也同樣回他：你甚美麗可愛。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：把「我渴」當成不屬靈。有人聽見「願他親我」，就急著糾正：信徒應該已經滿足。可雅歌的第一個字就是「願」。檢驗標準：你的講法，是讓人敢說「我渴」，還是讓人把渴藏得更深？"],["p","第二個偏差：把「我雖然黑，卻是秀美」拿去評論膚色，或談種族高低。經文自己給的原因是日頭曬黑、弟兄使喚，不是天生的等級。檢驗標準：這句話在你口中，是在保護一個被輕看的人，還是在替某種外貌下結論？"],["p","第三個偏差：把雅歌第一章當成談戀愛的技巧課。雅歌是情詩，不是追求手冊；第一章的重點是渴慕與被接納，不是怎麼說甜言蜜語。檢驗標準：講完之後，會眾是更認識「被愛的安全」，還是只學到了幾句話術？"],["p","第四個偏差：第一章就急著說「這就是預表」，把她的聲音蓋掉。新約沒有明說的連結，我們不說「這是預言」，只說「這使我們想起」。檢驗標準：你有沒有先讓會眾聽見她的聲音，再談屬靈的意義？"],["p","第五個偏差：把「被吸引」聽成「不必努力」。她說的是：願你吸引我，我們就快跑。被拉，然後是跑；順服與操練都在，只是源頭不同。檢驗標準：你的操練，是從被吸引出來的，還是從怕被責備逼出來的？"],["d",["我真的覺得很渴，但一禱告就覺得「沒感覺」，這樣算不算不屬靈？","不算。第一章的新娘，一開口就是「願」，她還沒被填滿，她正在渴。「沒感覺」有時候就是渴的另一種說法。你可以把這句話直接帶到主面前：主，我今天沒感覺，我渴。不需要先把感覺找回來，才能禱告。操練上，可以用最小的方式開始：每天一句、一分鐘、不求好聽。如果這種沒感覺持續很久，伴隨著睡不好、對一切都失去興趣，請不要自己硬撐，找一位可信的牧者或專業的輔導，陪你走一段。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：長子、長女、長媳，常常就是那個被派去看守別人葡萄園的人。華人家庭講孝順、講責任，這是好的；可是，好孩子的黑，沒有人看見。「不要輕看我」這句話，在華人口中，常被當成頂嘴；於是我們學會了不說，只靠忍。雅歌第一章給這樣的人一個空間：說出來，不是不孝，是說真話。你可以一邊盡責，一邊承認：我累了，我的園子荒了。"],["p","第二個問題：華人不習慣說「我想你」、「我需要」，習慣用「還好啦」、「沒事」去蓋住渴。在教會裡更是這樣：長輩、同工、牧者，彼此都擺出屬靈的樣子，沒有人先開口說「主，我渴」。一個團契如果沒有一個可以說渴的地方，只會有人愈來愈會表演，愈來愈孤單。雅歌第一章提醒我們：先說真話，再談服事。"],["d",["我是長女，一直在顧家，現在很累，說「不要輕看我」會不會是不孝？","不會。「不要輕看我」不是說「我不要照顧家人」，而是說「請看見我也是一個人」。孝順和誠實並不衝突。你可以繼續盡責，同時說：我累了，我需要有人分擔。這不是頂嘴，是求助。如果家人無法聽見，也可以先找一位教會中可信的弟兄姊妹，聽你說出來。真正的孝順，不是無聲地被耗盡，而是在愛裡說真話，也讓家人有機會學習怎麼愛你。如果家庭關係中有人傷害你，請務必尋求專業協助，不要只靠忍耐。"]],["h","七、活出321——渴慕、承認、同行"],["p","耶穌是我的榜樣：祂在井邊向一位婦人討水喝，在十字架上說祂渴了。神的兒子不假裝不需要，所以我也可以先說真話，再談服事。這一章，我學的是祂的坦白。"],["p","聖經是我的準則：這一章，我不急著翻譯她，我先照字面聽她說什麼：願、黑、尋找、被稱呼。聖經沒有說的，我不添加；聖經說了的，我不跳過。"],["p","聖靈是我的引導：這一章沒有出現「聖靈」兩個字，但我們看見一個被引導的人的姿勢：她不說「我要跑」，她說「願你吸引我」。學習被引導，就是學習先說「願」，再抬腳。"],["p","讓耶穌作王：這一章要我交出的，是「我要看起來很好」的權力。王不是先要我完美，王是先稱我「極美麗的」。我放下的是修飾，不是尊嚴。"],["p","讓耶穌得著一切的榮耀：香膏是他的名，不是我的功勞；我被吸引、被稱呼、被指路，都是恩典。我若能快跑，那是因為先被拉；榮耀歸給拉我的那一位。"],["p","建立屬神的體系：一個屬神的團體，是可以說「我渴」的地方。不是每個人都擺出屬靈的樣子，而是每個人都可以被稱呼、被指路。羊群的腳蹤，是同行，不是表演。"],["h","八、四種心，渴慕面前的四種反應"],["p","驕傲型的心，聽見「我渴」會皺眉。他覺得渴是軟弱，軟弱是失敗，所以他寧可說「我很好」，也不說「我需要」。驕傲，就是離開人的本位，想靠自己撐住一個不缺乏的形象。他需要的，是承認自己不是神，然後學會把「我需要」說出口，不當它是失敗，而當它是回到本位的第一步。"],["p","恐懼型的心，不是不渴，是不敢說。他怕說出來被拒絕，怕被看成太黏、太麻煩。他把「願」藏在心底，只留下「還好」。他需要聽見的，是第八節那個先稱呼的聲音：你這女子中極美麗的；說出來，不會被趕走。他不必一次說完，只要先說一個字：願。"],["p","羞恥型的心，看見的是「黑」。他覺得自己不配被愛，因為他有一個不想被看見的地方。她說「我黑」，也說「我秀美」；兩件事同時為真。羞恥型的人需要學的，是不再用黑來否定美，也不再用美去遮蓋黑；兩件事，都可以放在主的面前。"],["p","受傷型的心，是那個被弟兄使喚、守了別人園子的人。他的渴裡有怒，他的怒裡有傷。他不是不想被愛，是怕再被使喚。這樣的人，我們不催他快跑，不說「你要原諒」；先陪他坐下來，聽他說：我的園子荒了。等他知道有人聽見了，再慢慢談下一步。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天用一句沒有修飾的話對主說：「主，我渴。」不用禱告稿，不用好聽。"],["p","第二，寫下一個你一直想遮住的「曬黑」之處，不改它，只對自己說：這是真的。"],["p","第三，找一位你信任的人，說一句真話：「我最近有點累，你可以陪我禱告嗎？」"],["p","第四，選一件你平常靠意志力撐的事，在動手之前，先問：我是被吸引，還是被逼迫？"],["p","第五，找一個你想跟隨的腳蹤，寫下他的名字，這週請他喝一杯茶，問他：你怎麼靠近主？"],["p","我宣告：我可以說「我渴」，因為主先稱我為極美麗的。"],["p","我宣告：我的黑與我的秀美同時為真，我不再用黑來否定我自己。"],["p","我宣告：我要被主吸引，然後快跑；我不再用逼自己的方式來愛主。"],["p","我宣告：我的團契是可以說渴的地方，我要先開口，讓別人也敢開口。"],["d",["這一週我說不出「主，我渴」這句話，怎麼辦？","那很正常，不必逼自己。先從更小的開始：只說「主」，然後停一下。或者說「主，我不知道我渴什麼」。這也是一個真話。你也可以先寫下來，寫在紙上，不必給任何人看。有時候說不出口，是因為我們習慣了把渴壓下去，要慢慢才鬆開。你還可以找一位你信任的人，請他陪你坐五分鐘，不要求他說什麼，只是在場。神不是等我們講得漂亮才聽，祂聽得見你說不出口的話。如果你有一個一直想說又說不出來的傷，請先找人陪伴，不要一個人扛。"]],["h","十、結語"],["p","雅歌第一章，沒有一個大場面。沒有火，沒有雲，沒有紅海分開。有的只是一個女子，說出她心裡最小的一句話：願。"],["p","神把這一句話，放在整本聖經最高的一首歌的開頭。祂在告訴我們：祂要的，不是一群完美的人，而是一群肯說「我渴」的人。祂先稱呼，再指路；先接納，再同行。"],["p","我們常以為，愛神就是要更用力：更多的事奉，更多的付出，更完整的屬靈樣子。雅歌第一章說：不是。愛神，是從一個承認開始：我渴，我缺，我需要你。這不是屬靈的終點，而是起點；沒有這個起點，後面的快跑，只是疲憊。"],["p","今天，如果你一直是那個守別人葡萄園的人，我要對你說：你可以先停一停，說出來。如果你一直在努力跑，卻愈跑愈累，我要對你說：先求被吸引。我們一起把焦點放回耶穌：不在自己的累，不在別人的眼光，不在環境的壓力，只在那一位倒出來的香膏。"],["p","讓我們禱告：親愛的主，我們說：願你吸引我們，我們就快跑跟隨你。我們承認我們有渴，有曬黑的地方，也有守不住的園子。求祢先稱呼我們，再指給我們腳蹤。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：愛，從承認「我渴」開始；先被稱呼，再被指路。"],["n","1. ★ 用自己的話說一遍：雅歌第一章的次序是什麼？（提示：先被吸引，然後快跑；先稱呼，再指路）"],["n","2. ★★ 第四節說「願你吸引我，我們就快跑跟隨你」。你的屬靈生活，比較像「先跑」還是「先被吸引」？請舉一個這週的例子。"],["n","3. ★★★ 原文是「黑，並且秀美」，不是「雖然……卻是」。這對你怎麼看待自己的軟弱，有什麼不同？"],["n","4. ★ 良人先說「你這女子中極美麗的」，再指出腳蹤。如果你帶人、教孩子或服事，這個次序會怎樣改變你開口的第一句話？"],["m","帶領提醒：不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命，不只是知識。"],["t","【看】看見自己"],["n","5. ★★ 你最近一直想遮掩的一個「曬黑」之處是什麼？（不必說細節，只說它屬於哪一類：累、羨慕、生氣、孤單……）"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，把第八節的「你這女子中極美麗的」讀給自己聽。你心裡第一個反應是什麼？"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你不敢說「我渴」？是怕被看輕、怕被利用，還是怕沒有人回應？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，用一句沒有修飾的話說：「主，我渴，我想要……」；對方回答：「你在祂眼中極美麗。」"],["t","【行】走一步"],["n","9. ★★ 這一週，你在哪一件事上，要先停下用力，改成先去親近主？請寫下時間與地點。"],["m","帶領提醒：這一化可能碰到被家人使喚、被輕看的經驗。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把渴慕帶進本週的生活：說真話、跟腳蹤、操練 920、把這一課傳出去。"],["n","10. ★★ 你正在替誰看守他的葡萄園？哪一件事，需要你開口說「我需要幫忙」？"],["n","11. ★★★ 920 操練：找出那一位與你有關係的「2」，現場說出他的名字，並說這週你要為他結出哪一種聖靈的果子。"],["n","12. ★★ 如果你帶小組，你要怎麼讓別人在這裡可以說「我渴」，而不被糾正，也不被勸「要有信心」？"],["n","13. ★ 這週的腳蹤：你可以跟隨誰走過的路靠近主？寫下他的名字，與你要問他的一個問題。"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說她的渴，第二句說「黑，並且秀美」，第三句說被吸引。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的部分，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，你的名如同倒出來的香膏，求你吸引我的弟兄（姊妹）。」然後彼此說：「你在祂眼中極美麗。」最後，由一位帶領者簡短禱告結束。"]]},"2":{"no":2,"vol":"《321雅歌講義》第2課·雅歌第2章","title":"站在牆外的邀請——看見、邀請、守護","chars":4832,"min":60,"deep":8,"dchars":1482,"tchars":23,"blocks":[["h","一、從眾人中被看見"],["p","弟兄姊妹平安。想像一個晚上十點的畫面：孩子的房門關著，你站在門外，手舉起來，又放下。你是他的爸爸或媽媽，你有鑰匙，你大可以直接推門進去。可是你沒有。你輕輕敲了兩下，隔著門說：我在客廳，你想說的時候，來找我。然後你轉身走了。這一個轉身，是整個雅歌第二章的味道。"],["p","第一章結束的時候，兩個人在青草的床榻上，彼此讚美。第二章一開口，是她的聲音：「我是沙崙的玫瑰花…是谷中的百合花」（歌2:1）。這句話可以有兩種聽法。一種是自信：我也是一朵花。另一種是謙遜：我不過是一朵平常的野花，長在山谷裡，沒有人特別留意。聖經沒有替她決定，我們就兩邊都留著。"],["p","但是，良人聽見了，他接著說：「我的佳偶在女子中，好像百合花在荊棘內」（歌2:2）。注意這個畫面。荊棘，是扎人的、雜亂的、讓人走過去要小心的東西；而百合花長在其中。同樣是一片野地，在別人眼裡是荊棘叢，在他眼裡，只有一朵花。愛，是一雙專注的眼睛：從眾人當中，把你認出來。"],["p","有人讀到這裡會問：這是不是在貶低其他女子？荊棘是別人嗎？詩歌的語言不是這樣讀的。這是情人的眼睛：在他眼中，她之所以突出，不是因為別人不好，而是因為他的注意力全都放在她身上。我們也有過這樣的經驗。有一個人的眼睛，從一大群人當中，找到了你，你就知道，什麼叫做被看見。"],["p","接著她回應了：「我的良人在男子中，如同蘋果樹在樹林中」（歌2:3）。他是樹林裡那一棵結果子的樹。樹林裡的樹，大多是遮蔭的，不一定都有果子；而他是結果子的那一棵。然後她說：「我歡歡喜喜坐在他的蔭下，嘗他果子的滋味，覺得甘甜」（歌2:3）。蔭下，是歇息；果子，是滋養。她不是站在他面前表演，她是坐下來。"],["p","這一個「坐」很重要。在第一章，她是渴，是尋找，是問「你在何處牧羊」；在第二章，她是坐在樹蔭下，吃果子。我們不會一輩子都在尋找，神也預備了坐下來的地方。你有沒有一個地方，你可以放下所有的表演，只是坐著、被餵養？如果沒有，也許今天就是開始求的時候。"],["p","你看，愛的次序又出現了：她被看見，她的回答不是辯論，不是推讓，而是歇息。不少人被讚美的時候，習慣說「沒有啦，我哪有那麼好」，馬上把讚美擋回去。她沒有。她接受，然後坐下，吃他的果子。能夠接受愛，也是一種謙卑；謙卑不是否認自己有美，是承認這份美，是被給的。"],["p","還有一個細節：她回應的方式，是把他放在眾人之中來看。她說他是「男子中」的蘋果樹，也就是說，她也有一雙專注的眼睛。愛，是雙向的看見：他看見她，她也看見他；彼此在眾人中，把對方認了出來。一個被好好愛過的人，也會學會好好去看人。"],["d",["「百合在荊棘內」是在貶低其他女子嗎？還是只是一種詩意的讚美？","詩歌裡的比喻，不能當成社會學報告來讀。這是情人的語言：在他眼中，她突出，是因為他的注意力全在她身上。他說荊棘，是烘托她的美，不是定其他人的罪。如果拿這節經文去比較女子、論斷誰是荊棘，那就是讀錯了。更好的讀法是：被愛，是被一雙專注的眼睛從眾人中看見。你也可以這樣讀自己：在神的眼中，你不是眾人中的一個號碼，你是一朵被認出來的花。對別人，也同樣要練習這雙眼睛。"]],["d",["她接受良人的讚美，坐在他的蔭下，這算是驕傲還是謙卑？","這是謙卑。謙卑不是否認自己有好處，而是承認那份好處是被給的。她沒有說「我哪有那麼好」，也沒有因此誇耀；她接受讚美，然後坐下來，吃他的果子。很多人把「推讓讚美」當成謙卑，其實那常常是怕麻煩、怕欠人情，或者心裡根本不相信自己配得。真正的謙卑，是讓愛進來。可以輕輕地說一聲「謝謝」，然後把榮耀交回給那位賜美的神。這樣的人，才能放鬆地坐在蔭下，也才能在別人被讚美的時候，由衷地為他歡喜。"]],["h","二、以愛為旗，也不要叫醒"],["p","第四節，她說：「他帶我入筵宴所，以愛為旗在我以上」（歌2:4）。筵宴所，字面是「酒的房子」，是宴席的地方。旗，是軍隊聚集時舉起的標記；也有人理解為宴席上的標示。不管哪一種讀法，核心都是同一個意思：他把我帶到這裡，而我頭上有一面旗，旗上寫的是「愛」。"],["p","旗，是歸屬的記號。在一大群人中間，一面旗告訴所有的人：這一個，是誰的。「以愛為旗在我以上」，意思是，我被愛所覆庇；任何人看我，先看見的是這面旗。對一個被輕看過、被使喚過的人，這是很深的安慰。若是你從小沒有被這樣護庇過，讀到這一句話可能會痛，那也沒有關係，我們可以把這個痛，帶到主面前。慢慢地，一個人可以學會：不是只有大人物才被護庇，每一個人，在神面前，都有一面旗。"],["p","第五節，她說：「因我思愛成病」（歌2:5）。愛得太深，竟然像生了病。這不是教人談戀愛談到失眠；這是說，渴慕可以如此濃烈，濃烈到身體都感覺到了。接著她說：「他的左手在我頭下；他的右手將我抱住」（歌2:6）。這是一幅安靜的畫面：他在，她安心。"],["p","然後，第七節，出現了整卷雅歌裡最重要的一句叮嚀之一：「不要驚動、不要叫醒我所親愛的，等他自己情願」（歌2:7）。她對耶路撒冷的眾女子，用羚羊和田野母鹿起誓，鄭重地囑咐。這句話後面還會出現兩次，一次在第三章，一次在第八章；它像一個副歌，每次出現，都在提醒我們：愛，有它自己的時辰。"],["p","這句副歌，和合本的小字註解提供了另一種譯法：「不要激動愛情，等它自發」。兩種讀法，一個是「不要叫醒我所愛的人」，一個是「不要激起愛這件事」。不論哪一種，都指向同一個真理：愛，不能被逼出來；愛，要在自由裡自己醒來。逼出來的叫做壓力，叫做操縱；自己醒來的，才叫愛。"],["p","我們今天，太需要聽這句話。有人用「愛」的名義催促：你應該要回應我；有人用「為你好」的名義控制：你一定要這樣做；甚至有人用「屬靈」的名義施壓：你若真愛主，就要答應。雅歌的這一句話，站在每一個被催促的人身邊，說：你有說「不」的權利，你有等待的權利，你有自己醒來的權利。"],["d",["「以愛為旗」的旗到底是什麼？軍旗，還是筵席的標示？","學者之間有不同的讀法。有人認為「旗」是軍隊的標記，意思是良人的愛如同保護的旗幟；有人認為是宴席上的標示，宣告這是他的席位。本講義取「歸屬與保護」的意思，字面詩意優先，不急著下定論。這個字和後面第六章「威武如展開旌旗的軍隊」是同一個字根，可以對照著讀。不論哪一種讀法，核心都一樣：我頭上有一面旗，旗上是愛，我是被愛所標記的人。如果你從小沒有被這樣護庇過，可以放慢，把這個傷帶到主面前。"]],["d",["「思愛成病」是不是在鼓勵人談戀愛談到失眠、生病？","不是鼓勵，是描述。這句話說的是渴慕的深度，不是教人為了愛把自己弄病。雅歌自己也在提醒：愛有它的時辰，不要驚動，不要催促。若是一個人因為感情而失眠、吃不下、無法工作，這是需要被照顧的狀態，不是屬靈的標準。你可以把這句話讀成：我渴慕得這樣深，連身體都感覺到了。同時也要記得：被愛的人，應該得到安息，不是折磨。如果你正陷在這樣的狀態裡，請找可信的人陪伴，必要時也尋求專業的協助。"]],["d",["「不要叫醒」有兩種讀法，我該跟哪一個？會影響我的應用嗎？","兩種讀法是：「不要叫醒我所愛的人，等他自己情願」，與和合本小字所註的「不要激動愛情，等它自發」。前者的對象是那個人，後者的對象是愛這件事。希伯來原文的措辭有這樣的曖昧，翻譯無法同時保留。好消息是，兩種讀法的應用幾乎相同：愛不能被逼出來，要在自由裡自己醒來。所以你不必糾結選哪一個。你只要記得，無論讀哪一種，這句話保護的是「說不」的權利，也提醒我們不要用壓力去推動另一個人的心。"]],["h","三、原文亮光：旗、愛、情願"],["p","放大看三個字。第一個是 דֶּגֶל，念 degel，「旗」。這個字在民數記裡，是以色列各支派安營、行軍時，各自豎立的旗號。每一個支派有自己的旗，圍著會幕，各歸各位。所以「以愛為旗」，不是一個抽象的比喻，它帶著「歸位」的意思：我被安置在這個位置上，而我頭上的記號，是愛。"],["p","第二個字是 אַהֲבָה，念 ahavah，「愛」。這個字在雅歌出現得很頻繁，它和雅歌全卷的主題一路相連。在第二章裡，這個字出現了好幾次：旗是愛，病是愛，還有叮嚀的對象也是愛。雅歌用同一個字，把安歇、渴慕、尊重，全部串成一條線。愛，不只是一種情感，它也是一種姿勢：舉旗、思慕、等待。這也提醒我們，不要只用「感覺」去量度愛；愛要有行動的姿勢，在需要的時候，為所愛的人舉起一面旗。"],["p","第三個字是 חָפֵץ，念 khafets，「喜悅」、「情願」、「樂意」。第七節的「等他自己情願」，用的就是這個字根。它不是「應該」，不是「責任」，而是從心裡生出來的樂意。你可以想想看：神對我們的期待，是「你應該愛我」，還是「願你情願愛我」？聖經的神，從來不要被勉強的愛。"],["p","三個字連起來：愛是旗，給人歸屬；愛是病，讓人思慕；愛也是自由，等待情願。旗是祂給的，思慕是我們的，而情願，是雙方都不能替對方做的。這就是為什麼，好的教導從不替人決定，好的父母從不替孩子愛神，好的牧者也不替會友開門；我們只能舉旗，只能邀請，只能等。這三者缺了任何一個，愛就變形：沒有旗，愛成為漂泊；沒有思慕，愛成為責任；沒有情願，愛成為控制。"],["h","四、起來，與我同去，也要擒拿小狐狸"],["p","第八節，畫面一轉。她說：「聽啊！是我良人的聲音；看哪！他躥山越嶺而來」（歌2:8）。他來得很快，翻山越嶺，像羚羊，像小鹿。可是，他到了哪裡？「他站在我們牆壁後，從窗戶往裡觀看，從窗欞往裡窺探」（歌2:9）。他停在牆外。他沒有闖進來。"],["p","這是整章最動人的地方。他有力量翻山越嶺，卻在牆外停下腳步。他站在窗外，往裡看。他可以大聲叫、可以拍門、可以破牆而入，但是他沒有。他選擇站在窗外，輕輕地說話。愛有力量，可是愛的力量，不拿來闖進去；它拿來等待。"],["p","然後他說話了：「我的佳偶，我的美人，起來，與我同去」（歌2:10）。這句話，他說了兩次，第十節和第十三節。邀請的內容很具體：「冬天已往，雨水止住過去了」（歌2:11）；「地上百花開放」（歌2:12）。冬天過去了，春天來了。他不是在催她離開，他是在告訴她：該起來看看了，外面已經不是冬天。"],["p","這裡我們要停一下。有一些人，是長期住在冬天裡的。經歷過傷害，經歷過失敗，經歷過漫長的黑暗，所以習慣了把窗戶關起來，把心鎖在牆裡。他們聽見春天的邀請，不是歡喜，是害怕：出去，會不會又受傷？這一節經文，不是說「你應該馬上走出去」，它說的是：有一個聲音，在牆外等你，沒有催促，只有邀請。"],["p","第十四節，他說：「我的鴿子啊，你在磐石穴中，在陡岩的隱密處」（歌2:14）。她躲在石縫裡，像受驚的鴿子。他沒有說：你怎麼還在那裡？他說：「求你容我得見你的面貌，得聽你的聲音」（歌2:14）。他求。王的口中，竟然說出「求你」。他尊重她的躲藏，只求她願意讓他看見。"],["p","然後，第十五節，一句看似突然的話：「要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸，因為我們的葡萄正在開花」（歌2:15）。這是誰說的？經文沒有指明。我們不爭論說話者，我們看重點：葡萄園是「我們的」；葡萄正在開花；毀壞的是「小狐狸」。大狐狸容易看見，小狐狸，不容易防。"],["p","很多關係，不是被一場大風暴摧毀的，是被一些小狐狸慢慢咬壞的：一句沒有說出口的抱歉，一個沒有回的訊息，一次小小的冷淡，一個被拖延的誠實。花開的時候，就是處理小事的時候。要早早處理，要一起處理，不是指責誰是狐狸。"],["p","最後，第十六節，她說：「良人屬我，我也屬他」（歌2:16）。這是雅歌裡第一次出現的互屬：他屬我，我屬他。這不是占有，是歸屬。占有是「你是我的，所以你要聽我的」；歸屬是「我們彼此屬於，所以我們一起守護」。我們彼此歸屬，所以我們一起守護葡萄園。然後她說：「求你等到天起涼風、日影飛去的時候」（歌2:17）。她還在等黃昏，還有一段時間，她請他等。而他也真的會等。"],["p","請注意這裡的節奏：邀請之後，是請求等候；等候之後，是互屬。愛不是一步到位的，它有一個來回的節奏：他說起來，她說再等一等；她說我屬你，他說我也屬你。有節奏的愛，才是安全的愛；沒有節奏、只有衝刺的，是壓力。"],["d",["「小狐狸」是誰說的？是在說誰？可以拿它來指正別人嗎？","經文沒有標示說話者。有人認為是良人說的，有人認為是女子說的，也有人認為是眾女子的歌，本講義不爭論這一點。至於「小狐狸」，也有人讀作日常小事，有人讀作外來的干擾，也有人讀作小罪。這些讀法都可以放在一起：毀壞葡萄園的，常常是小事。重點是「我們的」葡萄園，與「花開的時候」。這是一句邀請彼此一起處理的話，不是一句點名的話。千萬不要拿它去指正某個人是狐狸，那樣就把一句愛的邀請，變成了指責。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：把「等他自己情願」，當成要被傷害的人繼續忍耐。這句話保護的是「說不」的權利，不是要求任何人沉默地等。檢驗標準：這句經文在你口中，是在保護一個被逼迫的人，還是在叫他不要出聲？"],["p","第二個偏差：把良人站在牆外，解讀成「神只是袖手旁觀」。經文說的是，他尊重，不是缺席。他的聲音一直在，他的邀請一直在。檢驗標準：你的講法，是讓人聽見邀請，還是讓人以為神不管事？"],["p","第三個偏差：用「起來，與我同去」去催促別人立刻做決定。這句話是邀請，不是命令。把邀請講成命令，就違反了這一章的重點。檢驗標準：你有沒有留給對方一個可以說「我還沒有準備好」的空間？"],["p","第四個偏差：把「小狐狸」講成點名會眾犯了什麼罪。這句話的重點是一起早處理小事，不是指責。檢驗標準：講完之後，會眾是更願意說出小事，還是更怕被點名？"],["p","第五個偏差：只看春天，不看冬天。有人把第二章講成一首輕鬆的春日歌，忘了她還躲在磐石穴中。檢驗標準：你的講法，有沒有給還住在冬天裡的人一個位置？"],["d",["良人站在牆外等，是不是說神只會等、不會管我？我需要祂介入的時候怎麼辦？","這一章描寫的是愛的方式，不是神所有作為的全部。聖經裡的神，有時候安靜等候，有時候直接介入，有時候透過人來幫助。雅歌第二章顯示的是：神的愛尊重人的自由，不用強迫，不用闖入。這並不表示祂不管你。你若正處在危險、受傷或被傷害的處境中，請直接向神呼求，同時也尋求你周圍可信的人和專業的協助。神的等候，不是袖手旁觀；祂的邀請，也從來不是要你獨自承受。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們習慣用「為你好」的名義催促。父母催孩子結婚，長輩催晚輩信主，教會催弟兄姊妹服事，每一個催促的背後，往往都有真心的愛。可是，愛如果不等「情願」，就容易變成壓力。雅歌第二章讓我們看見：王翻山越嶺而來，卻站在牆外；真正有力量的愛，不需要闖進來。你可以愛一個人，同時給他自己醒來的時間。"],["p","第二個問題：華人的傳統裡，女子常被教導要順從、要忍耐，連「不」都不敢說。你若曾經在關係裡被逼、被催，甚至被不當地對待，這一章不是要你繼續忍，它要告訴你：愛是在自由裡。說「不」，不是不愛；說「我還沒準備好」，也不是不信。如果你正處在一個不安全的關係中，請找可信的牧者或專業協助，不要獨自承擔。"],["h","七、活出321——看見、邀請、守護"],["p","耶穌是我的榜樣：祂在人群中看見一個人，叫她的名字；祂也站在門外叩門，等人自己來開。祂有一切的權柄，卻不闖進人的心。所以我也學著，在愛人的時候，先敲門，再等候。"],["p","聖經是我的準則：第七節的副歌，是我的準則。我不以愛的名義催促人，也不以屬靈的名義逼迫人。聖經沒有說「逼出來」，聖經說「等他情願」。"],["p","聖靈是我的引導：祂不是闖進來的靈，祂是輕聲邀請的靈。我學習分辨：這個感動，是溫柔的邀請，還是焦急的催促？被聖靈引導的人，腳步不急躁，也不拖延。"],["p","讓耶穌作王：王是牆外那位；他不是破牆而入，他是站在窗外，求我讓他看見我的面貌。我放下的，是把門關死的權力；我學習的，是把門開一條縫。"],["p","讓耶穌得著一切的榮耀：我被看見、被稱為百合、被邀請走出冬天，都不是因為我好，是因為他的眼睛。我若能起來，那是因為他先站在牆外；榮耀歸給那位等我的王。"],["p","建立屬神的體系：一個屬神的團體，是可以說「我還沒準備好」的地方。有人站在牆外邀請，有人在牆裡慢慢開門，大家一起守護葡萄園，早早擒拿小狐狸。"],["h","八、四種心，一道關著的門"],["p","驕傲型的心，習慣闖進去。他認為自己是為對方好，所以不需要等；他看見別人的門關著，就覺得是別人不對，應該被推開。驕傲，就是離開本位，抓住不屬於我的權力：替別人的心做決定。他需要學的，是站在牆外，把手放下。"],["p","恐懼型的心，是那個住在牆裡的人。他怕出去會受傷，所以把窗戶關得緊緊的。他聽見春天的邀請，想的卻是：萬一又是一場空呢？他需要聽見的，是那句「求你容我得見你的面貌」，那個站在牆外的人，不趕他，只求他願意。"],["p","羞恥型的心，躲在磐石穴中。他覺得自己不配被看見，所以寧可躲在隱密處。他聽見「我的美人」，反應是：你說的不是我。他需要的，不是被推出來，而是被一個一直不離開的聲音慢慢說服：你的面貌秀美，你的聲音柔和。"],["p","受傷型的心，曾經被人用愛的名義催促過、控制過。他聽見「起來，與我同去」，心裡只有警鐘。我們不要催他，也不要說「你要信任」；我們先讓他知道：這個邀請，可以拒絕，也可以等。慢慢的，當他知道自己可以說不，他才有力氣說好。這樣的人，需要一位肯陪的人，勝過一位肯講的人。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天花一分鐘，坐在「蔭下」：關掉手機，只是坐著，對主說：我在這裡，我願意被餵養。"],["p","第二，想一個你最近催促過的人，這週不要再催他；寫下他的名字，對主說：我把他的時間，交給你。"],["p","第三，找一位你可以說「我還沒準備好」的人，把一件你一直拖延的事，誠實告訴他。"],["p","第四，檢查你的「小狐狸」：一句沒說出口的抱歉、一個拖著沒回的訊息，這週選一件，處理掉。"],["p","第五，如果你正住在冬天裡，找一位可信的弟兄姊妹，請他陪你坐五分鐘，不需要他說什麼，只是在場。"],["p","我宣告：我是被看見的，我在主眼中不是荊棘，是百合。"],["p","我宣告：我不用愛的名義催促任何人，我要學會站在牆外，等人情願。"],["p","我宣告：我可以說「我還沒準備好」，說不不是背叛，也不是不愛。"],["p","我宣告：我要與主、與我的家人，一起早早擒拿那些毀壞葡萄園的小狐狸。"],["d",["我很想邀請朋友來信主，又怕太催促，怎麼拿捏才不會變成壓力？","可以用這一章的三個動作：先看見，再邀請，然後等候。先看見，是先花時間認識他，聽他的故事，不急著說道理；再邀請，是一個具體而輕的邀請，例如：我們團契週五有聚餐，你有空的話一起來；然後等候，是接受他說好，也接受他說「這次不方便」。不要追問，不要用愧疚去推動，也不要把他的拒絕看成你的失敗。你的責任是敲門，不是替他開門。你可以繼續做朋友，繼續為他禱告，也讓他知道，這個邀請隨時有效。"]],["h","十、結語"],["p","雅歌第二章，有一個很安靜的畫面：一個人翻山越嶺，卻站在牆外；一個人躲在牆裡，被輕聲邀請。沒有一個人闖進去，沒有一個人被逼出來。"],["p","這是神對我們的方式。祂有一切的權柄，卻在窗外等候；祂有全能的力量，卻尊重我們的自由。我們常把神想成催促的神、發怒的神，可是這一章裡，祂站在窗外，說的是：求你容我得見你的面貌。"],["p","所以，如果你正住在冬天裡，我要對你說：春天已經到了，但你不必一個人起身。如果你是那個站在牆外的人，我要對你說：不要闖，要等。我們一起把焦點放回耶穌：不在對方的反應，不在自己的急躁，不在環境的壓力，只在那位站在窗外、輕輕說話的王。"],["p","讓我們禱告：親愛的主，謝謝祢從眾人中看見我們。求祢幫助我們，不要用愛的名義逼迫人，也不要因為怕受傷，一直躲在牆裡。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：愛是在自由裡的邀請；愛有力量，卻不闖入。"],["n","1. ★ 用自己的話說一遍：良人站在牆外、第七節的副歌、小狐狸，這三件事各在說什麼？"],["n","2. ★★ 第七節說「等他自己情願」。為什麼愛不能被逼出來？你有沒有一次是被「為你好」推著做決定的？"],["n","3. ★★★ 他有力量闖進來，卻站在牆外。這對你怎麼看神、怎麼看自己的權力，有什麼不同？"],["n","4. ★ 第十五節說「我們的葡萄園」，而不是「你的」或「我的」。這個「我們」，對你的家庭或小組有什麼提醒？"],["m","帶領提醒：這一課碰到被催促、被控制的經驗。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命。"],["t","【看】看見自己"],["n","5. ★★ 你比較像闖進去的人、躲在牆裡的人，還是站在牆外等的人？舉一個最近的例子。"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，聽那句「求你容我得見你的面貌，得聽你的聲音」。你心裡有什麼反應？"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你不敢開門？是舊傷、是怕被控制，還是怕自己不夠好？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，其中一人說：「我還沒準備好，因為……」；另一人只回答：「謝謝你告訴我，我等你。」"],["t","【行】走一步"],["n","9. ★★ 這週你要停止催促誰？或者，你要把哪扇關著的門，打開一條縫？寫下名字或事情。"],["m","帶領提醒：這一化可能碰到被逼迫、被控制或被傷害的經驗。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課帶進本週的生活：不催促、早處理小事、操練 920、把這一課傳出去。"],["n","10. ★★ 你家裡或團契裡，有哪一隻「小狐狸」，正在慢慢咬壞關係？這週你可以先處理哪一件？"],["n","11. ★★★ 920 操練：找出那一位你一直想催促的「2」，現場說出他的名字，並說這週你要用哪一種聖靈的果子，代替催促。"],["n","12. ★★ 如果你帶小組，你要怎麼設計一個「可以說我還沒準備好」的氣氛？你的第一句話會是什麼？"],["n","13. ★ 想一個還在「冬天」的人，你可以用什麼具體的方式，站在他的牆外陪伴，而不催促？"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說「愛不闖入」，第二句說「等他情願」，第三句說「起來，與我同去」。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，謝謝你從眾人中看見我的弟兄（姊妹）；求你讓他在你的蔭下安息，等到他情願起身。」然後彼此說：「我在牆外，我等你。」最後，由一位帶領者簡短禱告結束。"]]},"3":{"no":3,"vol":"《321雅歌講義》第3課·雅歌第3章","title":"找不到的夜——尋、拉、冠","chars":4801,"min":60,"deep":8,"dchars":1475,"tchars":23,"blocks":[["h","一、找不到的夜"],["p","弟兄姊妹平安。凌晨三點十七分，你醒了。不是做噩夢，也不是身體不舒服，只是醒了，而且心裡有一個說不出的空。你想翻身，卻睡不著；你想禱告，卻覺得天花板很高、很遠。你拿起手機，又放下。你不知道自己在找什麼，只知道，心裡有一個人，不在。今天我們讀的，就是這樣的一個夜晚。"],["p","雅歌第三章，一開口就是夜：「我夜間躺臥在床上，尋找我心所愛的；我尋找他，卻尋不見」（歌3:1）。請注意這句話裡的兩個動作：「尋找」，與「尋不見」。她沒有說「我找到了」。聖經很誠實，它把一個找不到的夜，原原本本地寫了下來，沒有加上一句「但是她很快就找到了」來安慰我們。"],["p","我們常以為，有信心的人不會找不到神。若是找不到，一定是哪裡出了問題：禱告不夠、讀經不夠、罪沒有認清。雅歌第三章給了我們一個不同的畫面：一個深深愛著他的人，也有找不到的夜。找不到，不是愛的失敗，它是愛的一部分。因為，只有真正在乎的人，才會在半夜起來，一遍一遍地找。"],["p","她接著做了什麼？她沒有繼續躺著。第二節：「我要起來，遊行城中，在街市上，在寬闊處，尋找我心所愛的」（歌3:2）。她從床上起來，走進夜裡的城市，走進街市，走進寬闊處。找不到的時候，她選擇動起來。她可能並不知道他在哪裡，但是她知道，躺著，是找不到的。"],["p","這裡有一個很實際的提醒。在靈性的黑夜裡，我們常常只有兩種反應：一種是死撐，假裝一切都好；一種是放棄，躺平，什麼都不做。雅歌第三章提供第三種：承認我找不到，然後起來，一小步一小步地走。不是衝刺，不是賭氣，只是起來，在夜裡走，在街上問。"],["p","重複的句子，值得注意。第一節說「我尋找他，卻尋不見」，第二節又說了一遍，一字不改。詩歌的重複，不是偷懶；它是在說：這個找不到的感覺，不是一次，是一遍又一遍。她不是試了一次就放棄，她試了又試，每一次都沒有找到，而她每一次都誠實地說：我尋不見。"],["p","你有沒有過這樣的夜？也許是失業之後，也許是親人離世之後，也許是禱告了很久，神卻好像沒有回答。如果有，我想對你說：你不是唯一的。詩篇裡有人在夜裡呼求，雅歌裡也有人在夜裡尋找。聖經沒有責備他們，沒有說「你要有信心」，它只是把他們的夜，收在神的話裡。"],["p","還有一件事。這一段的地點是「我的床榻」，夜間，在床上。她的尋找，是從最私密的地方開始的：她自己的床。我們也一樣。真正的尋找，不是在聚會裡舉手，而是在沒有人看見的夜裡，一個人，睜著眼睛，把心裡的空說出來。那一刻，沒有觀眾，只有那位聽得見的主。你不必把這個夜說得很屬靈；說「我睡不著，我想祢」，就已經是一個禱告。"],["d",["夜裡的尋找是真的發生過，還是一場夢？我們需要弄清楚嗎？","學者之間有不同的讀法：有人認為是真實發生的事件，有人認為是夢境或幻想，也有人認為這是詩的修辭。本講義不為爭論真假而離開經文。因為不論哪一種讀法，經文最誠實的部分都沒有改變：一個深愛的人，在夜裡找不到。這個經驗，是許多信徒都認得的。你可以不必先弄清楚「是真是夢」，就能從這段經文裡得到安慰：找不到的夜，被如實地記錄在神的話裡，沒有人因此被責備。"]],["d",["我在靈性最黑的夜裡，一直「尋不見」神，這算不算信心不夠？","不算。聖經從來沒有說，找不到神就是信心不夠。詩篇裡有人在夜裡呼求，大衛、以賽亞、耶利米也都有過幽暗的時刻；雅歌第三章，則把一個深愛的人的「尋不見」，毫不修飾地記下來。把「找不到」等同於「信心不夠」，是一種很傷人的簡化。你可以誠實地說：我找不到，但我在找。同時，如果這種感覺持續很久，伴隨失眠、無望、對一切失去興趣，請不要自己硬撐，找可信的牧者或專業的輔導，陪你走一段。"]],["h","二、遇見看守的人，與「拉住不放」"],["p","她在城裡遇見了誰？第三節：「城中巡邏看守的人遇見我；我問他們：你們看見我心所愛的沒有」（歌3:3）。夜裡在城中巡邏的人，是守護城市的人。她向他們開口問。她不是自己悶著找，她是向人問。你看，她不只起來，也開口：你們看見他沒有？"],["p","經文沒有記載他們的回答。這個沉默，很值得留意。有時候，你向教會、向弟兄姊妹、向牧者開口問，得到的回答，是沉默，或者是一些你覺得沒有幫助的話。聖經沒有因此責備她問錯了人。她問了，這已經是勇敢；回答，並不在她的掌握裡。"],["p","然後，第四節出現了轉折：「我剛離開他們就遇見我心所愛的」（歌3:4）。注意「剛離開他們」，才剛走過那些看守的人，一轉身，就遇見了。找到的時刻，往往不在我們預期的地方。不是在看守人的身上，不是在最熱鬧的街市，而是在一個你已經走了一段、幾乎要灰心的轉角。"],["p","接著，她做了一件讓很多讀者停下來的事：「我拉住他，不容他走，領他入我母家，到懷我者的內室」（歌3:4）。「我拉住他，不容他走」，聽起來很用力。這是愛，還是控制？這個問題，我們要認真看。因為在今天的關係裡，確實有人用「愛」的名字，控制另一個人。"],["p","分辨的方法，是看她抓住之後做了什麼。她把他領進了哪裡？領入「我母家」，到「懷我者的內室」。她沒有把他藏起來，沒有切斷他與別人的關係，沒有監視他，更沒有用害怕威脅他。她把他帶進光中，帶回家，帶到母親面前。愛，是把人帶進祝福；控制，是把人藏起來、切斷他的路。"],["p","所以，「拉住他」，是失而復得的人，心裡的那一個不捨。她不是強抓，她是不放。這中間的差別，在你抓住之後，你做什麼。若是抓住之後，是讓他自由地進出、是帶他進入更多人的祝福，那是愛；若是抓住之後，是不許他和任何人往來、需要你時時回報，那就是控制。"],["p","第五節，副歌又出現了：「不要驚動、不要叫醒我所親愛的，等他自己情願」（歌3:5）。第二章已經出現過，這裡再來一次。你看，剛剛找到、剛剛抓住，她就立刻提醒：不要叫醒，要等情願。她知道自己剛剛那一拉，用力了，所以她馬上補一句：愛，要在自由裡。"],["p","這是很誠實的一個畫面。愛會有急切，會有不捨，也會有失控的邊緣。雅歌沒有假裝她是完美的；它讓她急切，然後讓她自己踩煞車。成熟的愛，不是從來不急，而是急了之後，知道回到「情願」這個原則。你也可以這樣：不捨的時候，抓緊；抓緊之後，記得鬆手，把自由還給對方。"],["d",["「我拉住他，不容他走」是愛，還是控制？要怎麼分辨？","看她抓住之後做了什麼。她把他領入「我母家」，到「懷我者的內室」，也就是帶進家，帶到母親面前，帶進被祝福的地方。愛，是把人帶進光中，仍然尊重他的自由；控制，是切斷對方的關係、監視他的行蹤、用害怕去威脅他。你也可以問自己三個問題：我抓住的這個人，是更自由了，還是更被限制了？他有沒有別的關係和空間？他可以說不嗎？如果答案偏向後者，就要停下來調整。若你是被控制的一方，請尋求可信的牧者或專業協助。"]],["d",["看守的人沒有回答她，是不是意味著教會和牧者常常幫不上忙？","經文只說她「問他們」，沒有記載他們的回答。我們不要從這個沉默裡讀出太多東西。它可以是一個誠實的提醒：有時候，我們開口問人，得到的是沉默，或不太有用的回答。聖經沒有因此責備她問錯了人；她接著往前走，轉個身就遇見了。這也提醒帶領的人：當有人向你開口，不要急著給答案，先陪伴；沒有答案的時候，陪伴本身就是一種回答。也提醒尋找的人：不要因為一次沒有被好好接住，就放棄開口。"]],["h","三、原文亮光：尋找、抓住、鬆手"],["p","放大看三個字。第一個是 בִּקֵּשׁ，念 biqqesh，「尋找」。這個字是強調形，帶著「用心地、積極地找」的意味。她不是隨便看看，是專心去找。你可以注意，這個字在舊約裡，常常用來描寫尋求神，也用來描寫尋找失落的東西。她尋找的方式，是整個人都投入的。"],["p","這個字提醒我們：尋找，是一個有力氣的動作。在黑夜裡，我們不一定有力氣；但是這個動詞告訴我們，尋找，不是等待感覺來，而是人自己起來。你可以把這個字，當成一個很小的操練：今天晚上，用一句話，向主開口尋找：「主，我找不到你，但是我在找。」"],["p","第二個字是 אָחַז，念 akhaz，「抓住」、「拉住」。這是一個「握住」的動詞，不是一般的碰到，是一把握緊。它在舊約裡，也用來描寫「抓住」一件重要的東西，不讓它掉落。她拉住他，是因為她很珍惜。"],["p","第三個字是 רָפָה，念 rafah，字根的意思是「鬆開」、「放下」、「放鬆」。「不容他走」，字面是「我不鬆手，直到我把他領進……」。你看這兩個字放在一起：抓住，與鬆手。她的決定是：不鬆手，直到把他帶進母家。重點在「直到」：她的抓住，有終點，終點是被祝福的家。"],["p","三個字連起來：尋找，是行動；抓住，是珍惜；鬆手，是自由。三者缺了任何一個，都不完整。只有尋找，沒有抓住，愛會漂泊；只有抓住，沒有鬆手，愛會變成控制；只有鬆手，沒有尋找，愛就冷了。我們要學習，在每一個階段，用對的動作。"],["d",["「不容他走」的原文有「鬆開」的意思，這是什麼意思？","原文這裡用的動詞，字根有「鬆開、放下、放鬆」的意思，在句子裡被用在否定的形式：「我不鬆手」。所以「不容他走」，字面上是「我不放他」。這個細節可以幫助我們看見：她說的不是「永遠抓住他」，而是「我不鬆手，直到我把他領進母家」。這個「直到」，讓抓住有了終點，也讓抓住有了方向：終點是被祝福的家。這就是愛與控制的分別：愛的抓住，是為了把人帶進光中；控制的抓住，是為了不讓人離開。"]],["h","四、曠野上來的行列，與裡面鋪的愛"],["p","第六節，畫面忽然一轉：「那從曠野上來、形狀如煙柱」（歌3:6）。從曠野上來的，是一道升起的煙柱；用沒藥、乳香和各樣香粉薰著。這是一個香氣瀰漫的行列，從遠遠的曠野，慢慢走近。這一段，經文用「是誰呢」發問，帶著驚歎。"],["p","第七節揭曉：「看哪，是所羅門的轎；四圍有六十個勇士」（歌3:7）。轎子是華麗的，周圍有六十個勇士保護。第八節說明原因：「腰間佩刀，防備夜間有驚慌」（歌3:8）。夜間有驚慌。勇士，是為了夜裡的驚慌而來的。你看，這一章從夜裡開始，也在夜裡結束，而夜裡，是有驚慌的。"],["p","這一段是誰的婚禮？學者有不同的看法：有人說是所羅門自己的婚禮，有人說所羅門在這裡是一個對比，也有人把這位王看成一個象徵。本講義不爭論，只陳列。我們把注意力，放在經文自己給的重點上。這個重點，在第九、第十節。"],["p","第九節：「所羅門王用黎巴嫩木為自己製造一乘華轎」（歌3:9）。「華轎」這個字，在整本舊約，只出現這一次。第十節描寫轎柱是銀的，轎底是金的，坐墊是紫色的。這是一個極盡華麗的描寫。然後，最後一句，才是重點：「其中所鋪的乃耶路撒冷眾女子的愛情」（歌3:10）。"],["p","轎子可以是銀的、金的、紫色的，但是真正重要的，是裡面鋪的是什麼。是愛。外面的華麗，是別人看得見的；裡面鋪的，是坐在其中的人感受得到的。你可以有一個很華麗的婚禮、一個很體面的家、一個很風光的事奉，但是，裡面鋪的是什麼？是愛，還是壓力？是溫柔，還是表演？"],["p","第十一節，是這一章最溫暖的結尾：他頭戴冠冕，是在他婚筵的日子、心中喜樂的時候，「他母親給他戴上的」（歌3:11）。冠冕，是母親給的。這一場婚禮，不是兩個人偷偷摸摸地進行，而是被母親祝福的。你看，第四節她把他領回「母家」，第十一節母親給他戴冠冕：愛，進入了被祝福的家。"],["p","這裡也要小心。婚禮的祝福，不可以講成唯一的圓滿。單身的人、婚姻破裂的人、沒有被家人祝福的人，也在神的愛中。雅歌這一段，並不是在說：只有被祝福的婚姻，才是被愛的人。它是在說：愛，最好是在光中、在眾人的祝福中成長，而不是藏著。"],["p","整章的結構很美：從夜裡的尋找，到找到後帶回家，再到被眾人祝福的行列。從一個人在黑暗中的獨行，到眾人面前的冠冕。這就是愛的路徑：先是私密的渴，再是真實的找，然後是被帶進光中、被祝福。而最重要的，始終是「裡面鋪的是愛」。這一句，是整章的鑰匙：夜裡的尋找，與華轎的鋪陳，最後都落在愛上。"],["d",["所羅門的華轎、六十個勇士，是不是在炫耀財富，我們可以追求這樣的排場嗎？","這一段的描寫，確實極盡華麗，但經文自己給的重點，在第十節的最後一句：「其中所鋪的乃耶路撒冷眾女子的愛情」。也就是說，外面再華麗，要緊的是裡面鋪的是什麼。這不是在鼓勵排場，也不是在責備排場，而是在把眼光從外面轉到裡面。你可以辦一場簡單的婚禮，也可以辦一場隆重的婚禮；重要的是，裡面鋪的是愛，而不是壓力、虛榮或債務。讀到這裡，也許可以問自己：我最近花了最多心力的，是外面的轎，還是裡面鋪的東西？"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差：把「找不到」講成信心不夠。這是最傷人的講法。聖經把找不到的夜如實記下，沒有責備。檢驗標準：你的講法，是讓找不到的人覺得被接納，還是覺得被定罪？"],["p","第二個偏差：把「拉住他，不容他走」，當成可以控制別人的理由。這一節要看的是抓住之後做了什麼：她把他帶進光中。檢驗標準：這句話在你口中，是在鼓勵人把關係帶進祝福，還是為控制找藉口？"],["p","第三個偏差：忽略第五節的副歌。有人講到「找到了」就停，忘了緊接著的提醒：不要叫醒，要等情願。檢驗標準：你的講法，有沒有留下「自由」的位置？"],["p","第四個偏差：把華轎講成炫耀財富的合理理由。這一段的重點，不是金銀，是裡面鋪的是愛。檢驗標準：講完之後，會眾是更重視愛，還是更羨慕排場？"],["p","第五個偏差：把婚禮的祝福，講成愛的唯一圓滿。單身、離婚、沒有被家人祝福的人，也在神的愛中。檢驗標準：你的講法，有沒有同時讓單身的人和婚姻破裂的人，也覺得這一章有他的位置？"],["d",["這一章結尾是被祝福的婚禮，單身或婚姻破裂的人，要怎麼讀這一章？","婚禮的祝福，是這一章的一個畫面，不是愛的唯一圓滿。單身的人、離婚的人、喪偶的人、沒有被家人祝福的人，也同樣在神的愛中。你可以把重點放在這一章的三個動作上：尋找，把愛帶進光中，在被祝福的地方歇息。這些動作，不需要婚姻也能做到：你可以在教會的家裡、在一群彼此愛護的朋友裡，經歷被帶進光中、被祝福。如果你曾經在婚姻裡受傷，讀到這一章覺得痛，那也沒有關係，慢慢讀，不必勉強自己。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們習慣在靈性的黑夜裡，裝作沒事。華人教會文化重視「見證」，重視「得勝」，卻很少給人一個可以說「我找不到神」的空間。於是許多人在凌晨三點，一個人醒著，白天卻照常去聚會、照常說「感謝主」。雅歌第三章給這樣的人一個位置：你可以說我尋不見，可以起來走，可以問人，可以再找。"],["p","第二個問題：華人家庭常把「愛」和「控制」混在一起。「我是為你好，所以你要聽我的」，「我捨不得你，所以你不許去」。這樣的愛，抓住了，卻不鬆手。雅歌第三章裡的「拉住他」，有終點：領他入母家。若你是父母、是配偶、是教會的帶領者，請問自己：我抓住之後，是在把人帶進光中，還是把人藏起來？若你是被控制的人，請找可信的牧者或專業協助。"],["h","七、活出321——尋、拉、冠"],["p","耶穌是我的榜樣：祂在客西馬尼園的夜裡，也有「找不到」的時刻，祂向父呼求，沒有假裝堅強。祂也像牧人去找失落的羊，找到了，就帶回家。我學祂：夜裡誠實，找到之後，把人帶回光中。"],["p","聖經是我的準則：這一章的準則是誠實。聖經寫下「我尋找他，卻尋不見」，不替她修飾；我也不替自己或別人修飾，不用一句「要有信心」把找不到的人推走。"],["p","聖靈是我的引導：在找不到的夜裡，我不是靠自己的感覺，我學習被帶領：該起來的時候起來，該問人的時候問人，該等的時候等。引導，不一定是看見答案，常常是知道下一步。"],["p","讓耶穌作王：我放下的，是「我一定要找到、一定要抓住」的權力。王在，我就不必靠抓緊來確保；我抓住，是因為珍惜，我鬆手，是因為信靠。"],["p","讓耶穌得著一切的榮耀：找到，不是因為我找得夠努力，是因為他願意被找到。我若在夜裡仍然站得住，那是恩典；一切的榮耀，歸給那位在轉角等我的主。"],["p","建立屬神的體系：一個屬神的團體，是可以說「我找不到」的地方，也是把人帶進母家、帶進祝福的地方。我們不藏人，不控制人，我們同行，也一起戴冠冕。"],["h","八、四種心，一個夜晚"],["p","驕傲型的心，不肯承認「我尋不見」。他寧可說「我很好」，也不要被看見在夜裡徘徊。驕傲，就是離開人的本位，想靠自己撐住一個永遠找得到的形象。他需要學習的，是第一句誠實的話：我找不到，我需要幫助。"],["p","恐懼型的心，在夜裡不敢起來。他怕出去會遇見看守的人、遇見更多的難堪，所以乾脆躺在床上，什麼都不做。他需要的，是那一個很小的起身：不是衝刺，只是站起來，走一步，問一個人。"],["p","羞恥型的心，覺得找不到，是因為自己有問題。他把「尋不見」翻成「我不夠好」。他需要聽見的，是經文沒有責備她：找不到的夜，被如實收在神的話裡，不是對一個人的審判。"],["p","受傷型的心，曾經被人用「愛」抓得太緊，所以他對「拉住他，不容他走」很敏感。我們要陪他看清楚：抓住之後，是把人帶進光中，還是藏起來。他可以說：我怕被抓住。這也是一句真話；我們不催他原諒，也不說「你要信任」。"],["h","九、這一週，你可以做的幾件事"],["p","第一，今天晚上，在床上對主說一句話：「主，我找不到你，但我在找。」不用好聽，只要誠實。"],["p","第二，找一位你可以開口問的人，說：「我最近好像找不到神，你可以陪我禱告嗎？」"],["p","第三，如果你正在找不到的夜裡，這週選一件小事，起來去做：散步十分鐘，或者走進一個聚會，坐在最後一排。"],["p","第四，檢查你「抓住」的關係：問自己，我抓住這個人之後，他是更自由、更被祝福，還是更被我控制？選一個，把手鬆開一點。"],["p","第五，為一個正在夜裡的人，寫一張短短的卡片：「我在，不用你先好起來。」這週送出去。"],["p","我宣告：我可以說「我尋不見」，我的夜，不是被定罪的夜。"],["p","我宣告：我要起來，開口問，一步一步地找，因為尋找本身就是愛。"],["p","我宣告：我抓住，是為了把人帶進光中；我鬆手，是為了把自由還給他。"],["p","我宣告：我所建立的家與團契，裡面鋪的是愛，而不是壓力。"],["d",["我正在「找不到」的時期，這一週具體可以做什麼？","從很小的事開始，不用求感覺。第一，每天晚上用一句誠實的話對主說：「主，我找不到你，但我在找。」第二，這週選一件小事，起來去做，例如散步十分鐘，或坐在聚會的最後一排；找不到的時候，身體動起來，常常有幫助。第三，找一位你信任的人，說出你的狀況，不需要他給答案，只請他陪你坐一會兒。第四，不要責備自己，也不要拿別人的經歷來比較。若這種狀態已經影響睡眠與生活，請尋求牧者或專業的協助，不要獨自承受。"]],["h","十、結語"],["p","雅歌第三章，是一個女子在夜裡的故事。她醒了，她找，她找不到，她起來，她問，她在轉角遇見了。這一路沒有一句責備，沒有一句「你要有信心」。神的話，把一個人找不到的夜，如實地收在其中。"],["p","這是神對找不到的人的態度。祂不嫌棄你的夜，祂不要你假裝；祂只是靜靜地，在你轉角的地方等。你不必先把一切整理好，才去找祂；你只要起來，走一步。祂比你想的，更靠近。這一章沒有告訴我們，她找了多久；它只告訴我們，她在轉角遇見了。也許你的轉角，比你以為的更近。"],["p","所以，如果你正在夜裡，我要對你說：繼續找，誠實地找，你不是一個人。如果你是別人夜裡的看守，請你不要急著給答案，先陪伴。我們一起把焦點放回耶穌：不在自己找得夠不夠努力，不在別人的反應，不在環境的黑暗，只在那位願意被找到、也願意帶我們回家的主。"],["p","讓我們禱告：親愛的主，我們有的人正在找不到的夜裡，求祢憐憫。謝謝祢不責備我們的夜，謝謝祢在轉角等我們。求祢幫助我們，在每一個關係裡，抓住的時候是為了帶人進光中，鬆手的時候是為了把自由還給人。把一切的榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","接下來，我們用三個化，把這一課從耳朵帶到心裡，再帶到生活裡。"],["m","帶領說明：本課主軸見各化目的。不把眼淚、情慾或單身當成屬靈程度的分數；任何身體與情感的話語，聽完應該是更被珍愛，而不是被評價；5:7 與 8:8--10 照經文實際寫的讀，不美化傷害、不把控制說成保護。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：把這一課釘成清楚的觀念：找不到的夜不是失敗，是愛的一部分；抓住，要有終點，終點是光。"],["n","1. ★ 用自己的話說一遍：這一章的三個畫面（夜裡找不到、拉住不放、華轎與冠冕），各在說什麼？"],["n","2. ★★★ 經文如實記下「我尋找他，卻尋不見」，沒有責備她。這對你怎麼看自己的「找不到」，有什麼不同？"],["n","3. ★★ 「拉住他，不容他走」是愛還是控制？用「抓住之後做了什麼」這個標準，說說你的看法。"],["n","4. ★ 轎子的外面是金銀，裡面鋪的是愛。你最近花最多心力的，是外面還是裡面？"],["m","帶領提醒：這一課會碰到靈性乾旱、失落與被控制的經驗。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：從看見、聽見、想通，到說出口、走一步，讓這一課成為生命。"],["t","【看】看見自己"],["n","5. ★★ 你最近一次「找不到」是什麼時候？是找不到神、找不到方向，還是找不到一個人？"],["t","【聽】聽神說話"],["n","6. ★★★ 安靜一分鐘，聽那句「我剛離開他們就遇見我心所愛的」。你心裡有什麼感受？"],["t","【想】想通關卡"],["n","7. ★★ 是什麼讓你不敢起來、不敢問人？是怕被看輕，還是怕沒有回答？"],["t","【講】說出口"],["n","8. ★★★ 兩人一組，其中一人說：「我最近找不到……」；另一人只回答：「謝謝你告訴我，我在這裡。」"],["t","【行】走一步"],["n","9. ★★ 這一週，你要起來做哪一件小事？寫下時間、地點，與你要問的一個人。"],["m","帶領提醒：這一化可能有人正在黑夜裡。不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課帶進本週的生活：誠實地找、把人帶進光中、操練 920、把這一課傳出去。"],["n","10. ★★ 你正在「抓住」哪一段關係？抓住之後，對方是更自由，還是更受限？這週你可以鬆開哪一點？"],["n","11. ★★★ 920 操練：找出那一位正在夜裡的「2」，現場說出他的名字，並說這週你要用哪一種聖靈的果子陪伴他。"],["n","12. ★★ 如果你帶小組，你要怎麼讓一個「找不到神」的人，在這裡覺得被接納，而不是被糾正？你的第一句話會是什麼？"],["n","13. ★ 你家裡或團契裡，有沒有一個「裡面鋪的不是愛」的地方？你可以先改變哪一件小事？"],["n","14. ★★★ 【必做】用三句話，把這一課講給一位教會外的朋友聽：第一句說「找不到的夜不是失敗」，第二句說「抓住的終點是光」，第三句說「裡面鋪的是愛」。這週內說給一個人聽，下週回來報告。"],["m","帶領提醒：請讓每個人只說自己願意說的，不追問細節、不要求原諒，不對流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","兩人一組，各用一句話為對方禱告：「主，求你在他找不到的夜裡，讓他在轉角遇見你；也求你讓我學會，抓住的時候帶人進光中。」然後彼此說：「我在這裡，你不是一個人。」最後，由一位帶領者簡短禱告結束。"]]},"4":{"no":4,"vol":"《321雅歌講義》第4課·雅歌第4章","title":"關鎖的園，自己開門——看、下、開","chars":4932,"min":60,"deep":8,"dchars":1454,"tchars":23,"blocks":[["h","一、被細看，也不羞愧"],["p","弟兄姊妹平安。有一種讚美，聽的人不但沒有高興，反而渾身不自在。同事說你今天很漂亮，你心裡一緊：他想要什麼？親戚當著大家的面說你瘦了、胖了、長高了，你只想找一個洞鑽進去。我們很多人，對被「看」這件事，帶著一點警覺，甚至一點傷。因為不是每一雙眼睛，都是安全的眼睛。"],["p","今天讀的雅歌第四章，一開頭就是一場很長的凝視。「我的佳偶，你甚美麗！你甚美麗！你的眼在帕子內好像鴿子眼」（歌4:1）。他先重複了一次：你甚美麗，你甚美麗。然後從眼睛開始，一路看下去：頭髮、牙齒、嘴唇、兩太陽、頸項。他看得很慢，很細，一樣一樣地看。"],["p","現代人聽這些比喻，會覺得奇怪。頭髮像山羊群臥在基列山旁，牙齒像洗淨的母羊，頸項像大衛的高臺。我們若逐項去解剖、去對照，反而會讀偏。這是一個古代牧人與農夫的語言：他用他所熟悉的山、羊群、石榴、城牆，來說他眼前這個人。比喻的意思，不是「你長得像一隻羊」，而是「在我眼裡，你像我最珍視的那些美好的東西」。"],["p","所以，本講義的讀法，是看整體的語氣，不逐項解剖。這是私密的情話，不供評分，不供比較。請特別留意：講的人不要借這一段去評論別人的身體，也不要叫會眾拿自己和誰比較。聽完這一段，會眾應該是更被珍愛，而不是更焦慮。如果聽完是焦慮，那就是我們讀錯了。"],["p","這一段最動人的，不是那些比喻，而是那個「看」的態度。他看她，不是挑剔，不是估價，而是欣賞。他看了這麼久，一直看到最後，說出那句總結：「我的佳偶，你全然美麗，毫無瑕疵」（歌4:7）。「毫無瑕疵」，他不是說她沒有缺點，而是說，在他的眼中，她是完整的，沒有一處需要被藏起來。"],["p","這就是安全的愛。安全的愛，讓人可以被完整地看見，卻不覺得羞恥。我們很多人，一輩子都在遮：遮身材、遮年齡、遮出身、遮過去。我們以為，被愛的條件是先把這些遮好。可是雅歌第四章說：有一種看，可以看見全部，而仍然說「全然美麗」。這種看，是被愛的人最需要的。"],["p","神看我們，也是這樣的看嗎？我們要小心，不要馬上把這一段寫成「神對我們說的話」。本講義的次序是：先聽字面。但是，當我們聽見一個被完整看見、仍被稱為全然美麗的人時，我們可以說：這使我們想起，神是那位無論我們是怎樣的人，都不嫌棄我們的主。這是「使我們想起」，不是「這就是」。"],["p","第六節，他說：「我要往沒藥山和乳香岡去，直等到天起涼風、日影飛去的時候回來」（歌4:6）。這句話，我們在第二章聽過類似的詞：天起涼風，日影飛去。他說他要上山去，等到黃昏來臨再回來。他沒有說「我現在就要」，他說「我先去，等時候到了」。再一次，這個愛，有時辰，有節奏。而一個懂得節奏的人，不會把對方的準備，當成自己的拖延；他願意先上山，等時候到了，再回來。"],["p","這樣的凝視，我們每一個人都需要。不是被當成物品來看，也不是被當成問題來看，而是被當成一個人來看：有歷史，有尊嚴，有一個不需要被評分的名字。如果你一直沒有被這樣看過，不要急著覺得這一段離你很遠；也許神正藉著這一章，慢慢教你，什麼叫做被安全地看。"],["d",["良人逐項讚美眼睛、頭髮、牙齒，這些奇怪的比喻到底是什麼意思？","這些比喻，來自古代牧人與農夫的生活：山羊群、剪毛的母羊、石榴、城牆上的盾牌。它們不是在說「你長得像一隻羊」，而是用他最熟悉、最珍貴的東西，去說他眼前這個人。如果我們一樣一樣地去對照，反而會讀偏，也容易讓人拿自己的身體去比較。本講義的讀法是看整體的語氣：這是私下的、欣賞的、不帶評分的情話。整段的重點是「全然美麗，毫無瑕疵」：在愛的眼中，她是完整的，沒有一處需要被藏起來。"]],["d",["我一聽到身體被讚美就渾身不自在，是不是我的信仰有問題？","不一定是信仰的問題。有時候是成長環境中，身體與愛一直被當作不能談的事；有時候，是曾經被不安全的目光對待過。不自在，常常是一種保護。你不必勉強自己立刻覺得舒服。你可以慢慢來：先承認「這對我很難」，再問自己，難在哪裡。如果這種不安跟過去的傷害有關，請找可信的牧者或專業的輔導，陪你慢慢整理。聖經沒有要求你立刻喜歡每一段經文，它給你一個空間，讓你被好好地、安全地愛。"]],["h","二、從遙遠的山上，被召喚下來"],["p","第八節，他的語氣一轉：「我的新婦，求你與我一同離開黎巴嫩」（歌4:8）。他說了兩次：與我一同離開黎巴嫩。黎巴嫩是遠遠的北方高山，是雪線與香柏樹的所在。他請她從那裡下來。注意那個詞：「求你」。他不是命令，他是請求。"],["p","接著，他描寫她所在的地方：「從有獅子的洞，從有豹子的山往下觀看」（歌4:8）。有獅子的洞，有豹子的山，聽起來是危險的地方。這是不是說她被困住了、需要被拯救？經文沒有這樣說。我們不硬附會成「拯救」。我們只聽見愛的召喚：從遙遠、孤立的高處，走向親近。"],["p","你可以想一想，每個人心裡，有沒有一座自己的「黎巴嫩」？那是一個高高的、遠遠的、安全卻孤單的地方。有的人躲在工作裡，有的人躲在書本裡，有的人躲在「我沒事」裡，有的人躲在屬靈的忙碌裡。從那裡看下去，世界很小，也很危險；可是，在那裡也沒有人能夠靠近你。"],["p","這裡要特別提醒：不要借這一節，把任何人的處境說成「被困」，或者「該被救」。對於那些躲在高處、躲在洞裡的人，這是邀請，不是責備。邀請的聲音說：我看見你在那裡，你若願意，請下來，與我同行。願不願意下來，仍然是她自己的事。"],["p"
